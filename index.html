mbay, Mumbai, 22-25 January, 2024.4) Souvik Dasgupta, Swapnil Raut, Vinoy Vadukut, Manaswita Bose (2023) Design and Development of Atomiser for Particle Image Velocimetry FMFP-2023, IIT Jodhpur, 20-23 December 20235) Girish Naik, Nabeel Ahmad, Swapnil Raut, Manaswita Bose, Krishnendu Sinha (2024) Scaled-down studies for indoor ventilation: A PIV and CFD integrated approach. FMFP-2024, AMU, 21-23 December, 2024.  6)  Prachi Shah, Girish Naik, Sarika Mehra, Manaswita Bose, Krishnendu Sinha (2024) Spatial distribution of bacterial pathogens under different ventilation conditions. FMFP-2024, AMU, 21-23 December, 2024. Patent1) Swapnil Raut, Souvik Dasgupta, Vinoy Vadukut, Manaswita Bose, An Impactor Atomizer Assembly With Tube-In-Tube Nozzle Design Arrangement For Liquid Atomization Method. Indian Patent Application No.: 202321079550 Date of Grant December 16, 2024"}, {"Sr_no": "62", "Facility": "High Temperature Confocal Laser Scanning Microscope", "Make": "Yonekura (Japan)", "Model": "VL2000DX", "Date_of_Installation": "3 April, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "Continuous Imaging during heating, isothermal hold and coolingMelting and solidificationCustomizable Image quality and rate", "Facility_In_Charge": "Prof. Deepoo Kumar Email: deepook@iitb.ac.in Contact no. 022-2159-7647", "Facility_Manager": "Yaminee Gupta", "Facility_Operator": "Dr. Santhosh Banoth, Yaminee Gupta  Email: 30006081@iitb.ac.in  Contact no. 022-2159-3302", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "In confocal microscopy, laser light is focused by an objective lens on to the object, and the reflected beam is focused onto a photo detector via a beam splitter. An image is built up by scanning the focused spot relative to the object, which is then stored in an imaging system for subsequent display. Through the use of a confocal pinhole, only light incident from the focal plane is permitted to pass through to the photo detector. Light not returning from the specific optical plane is blocked by the pinhole. Hence, an extremely thin optical section is created, providing a high-resolution image. Because thermal radiation is also blocked by the confocal pinhole, only the polarized reflection of the high intensity laser beam reaches the imaging sensor and a sharp image is produced. The use of pinhole optics increases the resolution such that with a 0.5 mm diameter beam,Magnifications up to 500× at a resolution of 500 nm can be obtained, using a He–Ne laser with a wavelength of 632.8nm. In the system used a laser beam, 0.5mm diameter is reflected and scanned by an acoustic optical deflector in the horizontal direction at a rate of 15.7 kHz and a galvano mirror in the vertical direction at 60Hz. Specimens are placed at the focal point of a gold plated ellipsoidal cavity in an infrared furnace beneath a quartz view port.", "Body": "Experimental SetupLaser source: He-Ne (Visible laser W.L. (λ)=632.8 nm)Heating source: IR heating by halogen lamp (1.5kW)Max temperature: 1650°C Inert Atmosphere: Argon gasObjective lens resolution: 50× TO 500×Controlled heating & cooling rate (3000°C /min) and Rapid cooling done by using controlled He gas flow rate", "Facility_Description": "The high-temperature confocal laser scanning microscope enables material characterization under controlled thermal conditions. It features a He-Ne laser (λ = 632.8 nm, 1.5 kW) and IR heating via a 1.5 kW halogen lamp, reaching 1650°C. Operating in an argon atmosphere, it offers 0.5 μm resolution for real-time, in-situ microstructural observations.", "Instruction_for_Sample_Preparation": "Sample SpecificationsThe sample should be flat and mirror finish without any scratches.Cylindrical Sample (Large alumina crucible):Diameter: 5.0 mmHeight: 3.5 mmCylindrical Sample (Small alumina crucible):Diameter: 4 mmHeight: 3 mmRectangular Sample (Big crucible):Length: 5 mmWidth: 4 mmThickness: 3 mm", "Applications": "In-Situ Real-Time StudiesSamples: metallic, semiconductor and non-metalsIn-situ real-time studies of phase transformations during heat treatment.Grain growth, sintering, precipitate formation at elevated temperatures.Inclusion behavior in molten liquid metals and phase transformations in solid-state metals.Solidification of metals and fluxes.Interaction between liquid metal, slag & refractory.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "63", "Facility": "High throughput E-beam Lithography system", "Make": "Raith GmbH", "Model": "VOYAGER, Model no. 18011", "Date_of_Installation": "20 March, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication, Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Ashwin Tulapurkar", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Ms. Anjum, Mr. Kanchan", "Department": "Electrical Engineering", "Features_Working_Principle": "The system is capable of patterning features down to the sub-nm scale with high precision using  focused electron beam to directly write patterns on a resist-coated substrate with  acceleration voltages (typically between 1 and 50 kV).", "Body": "NA", "Facility_Description": "The VOYAGER system by Raith is an advanced electron beam lithography (EBL) tool designed for high-resolution patterning and precise nanofabrication. It is typically used in  semiconductor device fabrication requiring nanoscale patterning.", "Instruction_for_Sample_Preparation": "NA", "Applications": "Lithography", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "356_SOP_voyager.pdf\n  (1020.21 KB)", "Training and Other Policy Documents": "VOYAGER_Usage Policy _V1_09-04-2025.docx_.pdf\n  (234.52 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "64", "Facility": "High-Pressure Volumetric Gas Sorption Analyzer", "Make": "Anton Paar", "Model": "iSorbHP-100", "Date_of_Installation": "1 March, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "•\tCO2 at 298K and 273K  •\tH2 at 298K and 273K", "Facility_In_Charge": "Prof.Sanjog Nagarkar., Email ID: - hpvgsa.chem@csif.iitb.ac.in", "Facility_Manager": "Mr.Darshan Mhatre., Email ID: - darshansmhatre@iitb.ac.in, Contact No: - 022-2576 4157/59", "Facility_Operator": "Miss.Ruchi Vishwakarma , Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4194 / 4159", "Department": "Chemistry", "Features_Working_Principle": "High-Pressure Capability:Supports pressure analysis up to 100 bar, suitable for advanced material characterization and high-pressure adsorption studies.Accurate Pressure Measurement:High-precision pressure transducers provide measurements with an accuracy of 0.05% of full scale, ensuring reliable results.Enhanced Sensitivity:Separate pressure transducers on the sample cell allow isolation from the dosing volume during equilibration, reducing void volume and improving sensitivity.Efficient Outgassing:Equipped with a turbo-molecular pump, enabling outgassing at pressures as low as 10⁻⁹ mbar, ideal for microporous samples with complex pore structures.Precise Adsorptive Dosing:The dosing manifold is calibrated at multiple points, providing accurate dosing control even at high pressures.Safety Features:Integrated interlocks and safety mechanisms in both software and hardware ensure operator safety during high-pressure operations.Leak-Tight System:The system features metal seals and low-leak pneumatic valves throughout, ensuring minimal leak rates and reliable surface excess measurements.", "Body": "", "Facility_Description": "The iSorbHP is a high-pressure gas sorption analyzer designed for the characterization of sorbent materials. It is especially useful in the fields of carbon dioxide and methane sequestration, hydrogen storage (through physisorption or hydride formation), and microporous material studies for gas separation. This instrument provides fully automated volumetric measurements of full adsorption and desorption isotherms across a wide range of pressures and temperatures, commonly referred to as a Sieverts apparatus.", "Instruction_for_Sample_Preparation": "Sample should be in powder form.", "Applications": "Gas Storage and Separation", "Chemical_allowed": "", "Gases_allowed": "CO2,H2", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "65", "Facility": "High-throughput Robotic Colony Picker", "Make": "Tecan Sales Austria GmbH", "Model": "Tecan Freedom EVO 100", "Date_of_Installation": "27 April, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sarika Mehra", "Facility_Manager": "", "Facility_Operator": "Ms. Sheetal Tapkire, rcp_chemical@che.iitb.ac.in", "Department": "Chemical Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "The Tecan Freedom EVO 100 is a state-of-the-art robotic colony picker, designed to enhance high-throughput microbiological research and screening applications. Engineered for accurate and reproducible microbial colony selection, the Freedom EVO 100 employs a high-resolution CCD imaging system and advanced image analysis algorithms to identify, classify, and isolate colonies based on morphological parameters such as size, shape, and optical density. This ensures a standardized selection process, minimizing variability and enhancing experimental reproducibility. The robotic arm, equipped with sterile, disposable, or reusable picking tools, ensures contamination-free transfer of colonies from solid media to liquid culture or microplate formats. The system supports multiple agar plate configurations and is compatible with a broad spectrum of microorganisms, including bacterial, yeast, and fungal species, making it highly adaptable to diverse microbiological workflows.Controlled via Freedom EVOware®, a sophisticated yet user-friendly software interface, the system enables real-time monitoring, data logging, and traceability, ensuring compliance with rigorous laboratory standards", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "66", "Facility": "Highspeed Particle Image Velocimetry", "Make": "litron and dantec dynamics", "Model": "LD30-527 PIV,9081N0201,9080X0911,SPEED SENSE VEO", "Date_of_Installation": "20 March, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof Vineeth Nair", "Facility_Manager": "Prof Vineeth Nair", "Facility_Operator": "Ashutosh", "Department": "Aerospace Engineering", "Features_Working_Principle": "Particle Image Velocimetry (PIV) is a whole-flow-field technique providing instantaneous velocity vector measurements in a cross-section of a flow.This technique being non-intrusive technique allows the application of PIV in high speed flows, boundary layer studies of fluids.", "Body": "Type:  Nd:YLF (527 nm)Energy:  40 mJ/Pulse @1kHzRep Rate:  1kHz (full energy/per pulse)                   10 kHz (lower energy/per pulse)Minimum time difference:  1 µsPulse width:  150ns @1kHzStable modes of operation (CW & QCW)", "Facility_Description": "The High-Speed PIV facility is a state-of-the-art setup designed for whole-flow-field measurements, providing instantaneous velocity vector data in fluid cross-sections. This non-intrusive technique enables the study of high-speed flows and boundary layer phenomena.Key Applications:Thermaocoustics instability and its controlAeroacoustic instabilities and controlSpray and combustion dynamicsjet dynamics, thin liquid sheet breakdown, and noise suppression in high-speed jets", "Instruction_for_Sample_Preparation": "Time for setting up the experiment - May be weeks Recording - few seconds Processing and Iteration - May be weeks", "Applications": "Thermaocoustics instability and its controlAeroacoustic instabilities and controlSpray and combustion dynamicsjet dynamics, thin liquid sheet breakdown, and noise suppression in high-speed jets", "Chemical_allowed": "Non-Toxic and Non-Hazardous.", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "67", "Facility": "HYBRID ADDITIVE SUBTRACTIVE MANUFACTURING", "Make": "HAAS UMC 1000SS-Meltio", "Model": "Hybrid System", "Date_of_Installation": "30 August, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Asim Tewari", "Facility_Manager": "sushil.mishra@iitb.ac.in", "Facility_Operator": "supriya_patil@iitb.ac.in", "Department": "Mechanical Engineering", "Features_Working_Principle": "Additive Hybrid MachiningRepair or modify parts adding material just where it’s neededManufacture complex parts not previously possibleQuickly make prototypes to prove out new designsApply different materials to the same part for best design, weight and strength3D print to near net shape and finish machine in a single part setupReact quickly and cost-effectively with faster lead timesProduce high-density parts with superior resolution in a clean working environment with wire Laser DEDSupports offline programming software suppliers such as Autodesk, GibbsCAM and Mastercam Universal Machines – 5-Axis Machining The Haas 5-Axis Universal Machining Centre has changed the landscape of the machine tool industry. Without doubt the larger travels and bigger platter of the Haas UMC-1000 makes it ideal for 5-axis machining of large parts. The UMC-1000SS is equipped with a faster spindle, high-speed tool changer, and high-speed trunnion table to reduce cycle times and boost productivity.5-axis simultaneous machiningPowerful inline direct-drive spindleLarge capacity side-mount tool changerIncludes Wireless Intuitive Probing System DWO/TCPC Changes Everything: Simplifies setup operationsPart and fixture can be placed anywhere on the table/platterNo need to regenerate programs from the CAM systemMakes setting up 5-axis jobs as easy as setting up a 3-axis machineIncludes the Rotary Axis Calibration Tool", "Body": "", "Facility_Description": "Advanced hybrid, additive-subtractive 5-axis manufacturing facility with capabilities of direct printing parts of steel, super alloys, and titanium alloys. The facility can manufacture precision parts for aerospace and other advanced sectors. In one of its kind capability, the facility has an artificial-intelligence-based digital twin running on a private 5G network to simulate Industry 4.0, the factory of the future.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "68", "Facility": "Image Based Spray Diagnostic Facility at Aerospace Engineering", "Make": "LAVISION 2013 PIV Flowmaster", "Model": "Evergreen Quantel 145mJ Laser", "Date_of_Installation": "8 July, 2013", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Flow Measurement", "Available_Equipment_Mode_of_use": "Particle Image velocimetry Shadowgraphy", "Facility_In_Charge": "Prof. Sudarshan Kumar  sudar@aero.iitb.ac.in    25767124", "Facility_Manager": "Aldo Ronald 30004984@iitb.ac.in +91-22-2576-7124", "Facility_Operator": "", "Department": "Aerospace Engineering", "Features_Working_Principle": "Working PrincipleImage based spray diagnostic system developed by LaVision. This technique is based on the following optical techniques:Particle Image Velocimetry (PIV) measures whole velocity fields by taking two images shortly after each other and calculating the distance individual particles travelled within this time. From the known time difference and the measured displacement the velocity is calculated. Since the flow can be quite fast one has to avoid blurred images and that's one reason to use laser pulses. They are only 6-10 ns long and freeze any motion. The other reason is that only laser light can be focused into a thin enough light sheet so that only particles in that plane are imaged. Otherwise the scattered light from particles in other planes would make this measurement impossible. A special camera is utilized so that it can store the first image (frame) fast enough to be ready for the second exposure. The \"dead\" time between the frames when the camera is \"blind\" is very short down to 100 ns.LaVision FlowMaster systems measure instantaneously two and three dimensional velocity vector fields from scattered light patterns of particles or droplets seeded into the flo w(liquid or gas). Techniques like Particle Image Velocimetry (PIV) and Particle Tracking Velocimetry (PTV) are supported.The shadowgraphy technique (backlighting) is used to visualize particles (e.g. droplets from a spray or bubbles in liquid). Shadowgraph employs an expanded collimated beam of light from a laser that traverses the field of disturbance. If the disturbance is one of varying refractive index, the individual light rays passing through the test section are refracted and bent out of their original path. This causes a spatial modulation of the light-intensity distribution with respect to the original intensity on the screen. The resulting pattern is a shadow of the refractive index field prevailing in the region of the disturbance. A He-Ne laser is expanded and collimated to a suitable diameter by a beam expander. The collimated beam passes through the test section being investigated. The beam emerging from the exit window falls on a screen resulting in the shadowgraph image. The images may be recorded as individual frames or a video sequence by a suitable camera..FeaturesHigh speed LIF systemsunable Nd:YAG laser module for OH-LIF imagingHigh speed spectral analysis of transient processesComplete hardware control using DaVis softwareFlexible beam delivery and sheet forming opticsCombination of techniques, multi-parameter laser imagingAccurate hardware and size calibrationComprehensive on-line image evaluation and data processingHardware compatible with LaVision's PIV systemsHigh efficient diffuser for speckle-free illuminationFlexible definition of image acquisition sequences including delays, trigger bursts and synchronizing to external events2D and 3D visualization of image data, combination of vector data and images, extraction of profiles, user defined color lookup tables, variable color resolution and zoom functionSmoothing and many other filter operations for image and vector data (Gauss, Laplace, Sobel, Erosion, customizable filters ...)Data import / export to TecPlot, ASCII, BMP, JPG, TIFF, VI, PS, FTS, ...Technical SpecificationsDaVis 8.1 Software Packages & Integrated Command Language :LaVision flow masterLaVision particle masterQuantel EverGreen Integrated Cooling and Electronics (Laser Power Supply) :Operational temperature range: 18oC - 28oCStorage temperature range: 5oC - 50oCLaser Head mass15.5 lb [7.0 kg]ICE weight: Empty: 35 lb [15.9 kg]Full: 40 lb [18.1 kg]Laser wavelength: 532 nmOutput energy: EVG00145 ≤145 mJ per pulseBeam near field profile: Flat-top, UniformPolarization: linearly polarizedMaximum repetition rate: up to 15 HzLaser pulse width: (FWHM) less than or equal to 10 nanoseconds at nominal energyCoolant: distilled waterPower requirements: 100-240 VAC, 50-60 HzLaser Head sealing: sealed to IP 67 specificationPower supply sealing sealed to IP 21 specificationLaser vibration compliance: MIL-STD-810F Procedure 1 Category 10Laser Source :Nd:YAG laser by the LaVision Programmable Timing Unit (PTU)Laser material is a crystal where Nd3+ ions are incorporated in a YAG (Yttrium, Aluminum, Garnet) crystal.Pump usually is a krypton flashlamp or a smaller semiconductor laser.Dual oscillator i.e double pulseCharged Couple Device Camera Unit (ImagerProSX 5M) with IRO (Intensified Relay Optics) :Double shutter two images with 600 ns min. interframing timeResolution (hXv): 2448 pixel X 2050 pixelSensor type: Sony ICX625Optical size: 2/3\"Pixel size: 3.45 µm X 3.45 µmSpectral range: 400 - 850 nmMax. frame rate: (at full resolution) 14.2 fpsPartial scan: yesData output type: Gigabit Ethernet (1000 Mbits/s)Power requirements: +12 to +24 VDC, ≤1% ripple ≤5 W @ 12 VOperating temperature: 5 - 40 °CSize (l x w x h): 100 mmX57 mmX45 mm (without lens adapter or connectors)Weight: 380 gHigh Efficiency Diffuser :Allows incoming beam diameters of max. 8mmCalibration target 5 mm/ 200 linesMin. recommended laser power: 15 mJ, 527-532 nmLight output diameter: 120 mmLight output wavelength: 574-580 nmLight output pulse duration (@ 5 ns laser): 20 nsLong Distance Microscope (LDM) :Model: QM100Type: Maksutov Cassegrain CatadioptricWorking Range: 150 mm (6 \") to 35 mm (14 \"), subject plane to front elementClear Aperture: 63 mm (2.5 \")Back focal length: 70 mm (2.75 \") minimum measured from back plateSheet Optics :Sheet thickness: 0.5 mm - 2.5 mm (adjustable, but dependant on M2 and size of Laser beam).Divergence lenses: f = -20 mm and -10 mm. 1108406 and 1108516 additionally with f=-50mm.Working distance: 300 mm - 2000 mm.Dimensions: approx. Ø43 mm X 90 mm.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Quantitative spray pattern analysis of flat, axial, and radial spray imagesInvestigation of droplet or particle size distributions in various applications such as spray atomization, bubbles, and particle flows, including:Visualizing particles and dropletsGathering the following properties:Droplets sizeDroplets positionDroplets shape & velocityDroplets number densityDroplets mass flux", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1.Experimental investigations into liquid breakup morphology and spray characteristics of a cross-flow injector-Atomization and Sprays -20212.Effect of CO2/N2 Dilution on Characteristics of Liquid Fuel Combustion in Flameless Combustion Mode - Combustion Science and Technology – 20223.Flameless Combustion with Liquid Fuels for Ultra-Low Emissions from Combustion Systems – Advances in Combustion Technology – 20224.Prototype development of a new self-aspirating liquid-fueled microcombustor – Combustion Science and Technology-20225.Atomization at ultralow flow rates: The effect of internal two-phase mixing on breakup regimes, spray stability, and droplet size - 20226.Development and characterization of self-aspirating liquid fuel spray ejector for microcombustion applications- 20227.Spray characteristics of a self-aspirating ethanol ejector for high-efficiency combustion-based thermoelectric micropower generators- Applied Thermal Engineering- 20248.A new aerosol delivery approach for enhanced long-term respiratory care in resource-poor settings- Powder Technology- 2025"}, {"Sr_no": "69", "Facility": "Immunohistochemistry Facility", "Make": "Fully Automated Computerized Archival System: Olympus;  Tissue Processor: Thermo Scientific; Embedding: Thermo Scientific; Microtome: Thermo Scientific; Cryostat: Thermo Scientific", "Model": "Fully Automated Computerized Archival System: BX63F;  Tissue Processor: STP 120; Embedding: Histostar ; Microtome:HM 340E ; Cryostat: HM 525NX", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Biochemistry, Confocal Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Prakriti Tayalia", "Facility_Manager": "Dr. Mamatha Pillai", "Facility_Operator": "Pooja Lokhande", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Immunohistochemistry (IHC) FacilityImmunohistochemistry (IHC) is a powerful technique used in pathology and molecular biology to identify and visualize specific proteins within tissue samples. This method utilizes antibodies that selectively bind to specific antigens within tissue sections, which are then visualized using either a fluorophore or a coloured substrate. By identifying stained proteins and their respective locations, IHC helps in understanding the types of cells present and their roles within the tissue.The IHC process can be divided into three main stages: sample preparation, staining, and imaging.Equipment involved in sample processing:The following equipment is used for processing tissues and preparing high-quality slides for imaging and analysis. The general workflow is as follows: after the grossing of samples, tissues are fixed and dried without damaging their ultrastructure in an automated tissue processor, then embedded in paraffin wax to form blocks. These blocks are sectioned using a microtome. Following sectioning, staining and imaging are performed. Additionally, a cryostat is available for cutting fresh, unfixed tissue at -20°C for further staining and imaging.Tissue Processor (STP 120): The STP 120 tissue processor is designed to process biological specimens from chemical fixation to wax infiltration. It features a unique design that uses programmable centrifugal force to enhance the agitation process typical of carousel processors. The processor offers both immediate and delayed-start processing modes for flexibility. Cassette baskets rotate clockwise and counterclockwise within reagent containers to improve processing efficiency. The system is customizable, with adjustable spin speeds and programmable immersion times to accommodate a variety of specimen types. The microprocessor can store up to ten processing programs, saving time in setup. The basket holds up to 120 cassettes for processing at a time.Embedding (Thermo Scientific HistoStar): The Embedding Module includes a base mold storage compartment, wax reservoir, tissue storage tank, wax dispenser, and Para Trimmer. The wax is maintained at 60°C to remain molten. After processing, tissue sections are placed in a cassette compatible with a microtome. In a steel mold, a small amount of molten wax is added, followed by the cassette containing the tissue section, then more wax is added to fully embed the tissue. The steel mold is placed on a cold pad to solidify the wax. Once solidified, the tissue block is demolded and ready for sectioning.Microtome HM 340E: The HM340E is an in vitro diagnostic device designed to take precision sections of tissue specimens, including paraffin-embedded samples. It is commonly used in medical and pharmaceutical laboratories for preparing tissue for examination. The microtome can cut sections ranging from 0.5 µm to 100 µm. To protect both the knife and the specimen, the instrument retracts the specimen after each cut. If desired, the retraction function can be disabled. A trimming function allows for fine adjustments in section thickness, ranging from 5 µm to 500 µm, facilitating optimal preparation for the first cuts.Cryostat (HM 525NX): The HM 525NX cryostat is a high-performance, ergonomically designed device with a modular stainless steel cooling chamber. A cryostat is used to prepare thin slices (sections) of frozen specimens, particularly biological tissues. It is an essential tool in histology, pathology, and related fields, enabling precise examination of tissue structure, enzymes, or proteins. The cryostat maintains the tissue at temperatures as low as -20°C to -30°C, preserving cellular integrity and preventing ice crystal formation that can damage the tissue.Equipment for imaging and analysis:Fully Automated Computerized Archival System: This high-performance microscopy-based or camera-based automatic slide scanner system is designed for imaging animal tissue and supports standard microscopy glass slides. It can accommodate both brightfield and fluorescence samples, equipped with dedicated cameras. The system is integrated with user-friendly software and a web-based database for image sharing, annotations, and analysis. It facilitates the imaging and analysis of both animal and human tissue samples, allowing multiple users to collaborate and interpret the results.", "Body": "", "Facility_Description": "The facility comprise of high end instrument like Fully Automated Computerized Archival System, Tissue Processor, Embedding, Microtome and Cryostat.", "Instruction_for_Sample_Preparation": "For Microtome:  Fix tissues in 4% PFA or 10% formalin to preserve structure. For Cyrostat: Fresh sample should be used.", "Applications": "Applications of histology and immunohistochemistry: Understanding tissue structure: Analysis at the cellular level to comprehend organ function.Disease diagnosis: Identifying pathological conditions such as cancer or infections.Research and development: Studying drug effects, disease mechanisms, and therapeutic interventions.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "IHC SOP.pdf\n  (169.8 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "70", "Facility": "Inductively Coupled Plasma  - Mass Spectrometer / LA ICP-MS", "Make": "M/S Thermo Fisher Scientific, USA", "Model": "iCAP-RQ Single Quadrupole", "Date_of_Installation": "6 October, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "Qualitative and Quantitative analysis", "Facility_In_Charge": "Prof. Prabhakar Naraga, Prof. Bivin George, Prof. Sameer Ranjan", "Facility_Manager": "Prof. Prabhakar Naraga", "Facility_Operator": "Dr. Trupti Chandrashekhar, Mr. Premkumar Verma", "Department": "Earth Science", "Features_Working_Principle": "1. Plasma is generated by a plasma torch. An RF (Radio-Frequency) generator creates oscillating magnetic field inside the torch, through which argon gas flows.2. A high voltage spark supplied through Tesla coil ionizes the argon gas. The argon ions travel in closed annular paths within the oscillating magnetic field and collide with other argon atoms. This causes Ohmic heating of the gas to 6,000–10,000 K in different parts of the plasma.3. Sample solution is introduced into the plasma as an aerosol by aspirating by a nebulizer. The solution gets desolvated in the plasma.4. Ablated particles of solid sample is introduced into the plasma by a carrier gas.5. The ions formed in the plasma are typically positive ions (M+, M+2). Negative ions, such as F–, Cl–, I–, etc. difficult to analyse by ICP-MS. 6. Detection and analysis capabilities will vary with the sample matrix, which may affect the degree of ionization in the plasma or allow the formation of species that may isobarically interfere with the analyte.7. Ions from the plasma are brought into the mass spectrometer as an ion beam via Ni or Pt interface cones. The ion extraction interface comprises sample cone, skimmer cone and electrostatic ion extraction lens. Sample cone has a hole of ~1 mm dia and skimmer cone has a hole of ~ 0.45 mm at the centre.8. The interface transfers the ions from atmospheric pressure (1–2 torr) into the vacuum region of the mass spectrometer (", "Body": "95 cm long, 80 cm wide, 110 cm high", "Facility_Description": "1. This an analytical instrument which combines an Inductively Coupled Plasma (ICP) with a single quadrupole mass spectrometer.2. It can detect and measure the concentration of trace elements including rare-earth elements (REE) in different materials.3. The plasma atomises and then ionises the elements present in the sample. These ions are then sequentially separated and detected by the mass spectrometer.4. The instrument covers the mass range of 2–290 amu.5. It has high sensitivity and can detect up to 10 ppt of many of the trace elements.6. Materials can be introduced into the plasma in either of the two ways: (a) Weakly acidic or neutral aqueous solution; and (b) Ablated particles produced by laser ablation.", "Instruction_for_Sample_Preparation": "1. Sample should be submitted in solution form.2. The concentration of analyte in sample solutions should be less than 100 ppb.3. HF must have been evaporated completely or neutralized by boric acid.4.The TDS in sample solutions should not be more than 200 ppm. Dilute accordingly.5. Sample solutions must have been filtered through 0.22 µ filter prior to the day of analysis.6. Final acid concentration in the sample solution must be less than 1%.7. Blank solution should be provided with sample solutions.", "Applications": "1. Detection and quantification of elements including REE, precious metals, and heavy metals at low levels.2. Materials for analysis can be:(a) Water; (b) Rock, soil, fly ash; (c) Environmental samples including particulate matter from air; (d) Polymers, drugs and drug bases; (e) Biological samples like urine, tooth, bone, etc.", "Chemical_allowed": "Less than 1% acid in the final concentration. No organic chemicals.", "Gases_allowed": "NO", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "71", "Facility": "Inductively Coupled Plasma Atomic Emission Spectroscopy System", "Make": "SPECTRO Analytical Instruments GmbH, Germany", "Model": "ARCOS, Simultaneous ICP Spectrometer", "Date_of_Installation": "31 December, 2009", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Atomic Emission Spectroscopy", "Available_Equipment_Mode_of_use": "Qualitative & Quantitative Analysis", "Facility_In_Charge": "Prof. Anil Kottantharayil, anilkg@iitb.ac.in", "Facility_Manager": "Dr. Gajender Saini, gsaini@iitb.ac.in,02221596481", "Facility_Operator": "Ms. Reshma Kadam, reshmas@iitb.ac.in,02221596897, Ms. Priyanka Jain, priyankaj@iitb.ac.in,02221596897", "Department": "", "Features_Working_Principle": "Working Principle:Inductively Coupled Plasma - Atomic Emission Spectrometry (ICP- AES) is an emission spectrophotometric technique, exploiting the fact that excited electrons emit energy at a given wavelength as they return to ground state after excitation by high temperature Argon Plasma. The fundamental characteristic of this process is that each element emits energy at specific wavelengths peculiar to its atomic character. The energy transfer for electrons when they fall back to ground state is unique to each element as it depends upon the electronic configuration of the orbital. The energy transfer is inversely proportional to the wavelength of electromagnetic radiation,         E = hc/ λ ... (where h is Planck's constant, c the velocity of light and λ is wavelength), and hence the wavelength of light emitted is also unique.         Although each element emits energy at multiple wavelengths, in the ICP-AES technique it is most common to select a single wavelength (or a very few) for a given element. The intensity of the energy emitted at the chosen wavelength is proportional to the amount (concentration) of that element in the sample being analyzed. Thus, by determining which wavelengths are emitted by a sample and by determining their intensities, the analyst can qualitatively and quantitatively find the elements from the given sample relative to a reference standard.         The wavelengths used in AES ranges from the upper part of the vacuum ultraviolet (160 nm) to the limit of visible light (800 nm). As borosilicate glass absorbs light below 310 nm and oxygen in air absorbs light below 200 nm, optical lenses and prisms are generally fabricated from quartz glass and optical paths are evacuated or filled by a non absorbing gas such as Argon.  Features : (a) R.F. Generator: Maximum of 1.6 KW, 27.12 MHz(b) Plasma: Radial plasma, having capability to analyse aqueous solutions with high dissolved solid content even up to 30 wt %. Aqueous solutions can be acidic, basic or neutral.(c) Spectrometer: Wavelength Range: 130 nm to 770 nm, Resolution: approx. 9 pico meter, having capability to scan full spectrum to have qualitative information about the content of the sample.(d). Detector: Charge Coupled Devices (CCD)(e) Vertical Torch assembly having fully demountable quartz torch with individual tubes as well as a Ceramic Fully demountable torch for HF based solutions.(f) Nebulizers: Concentric, cross flow, organic nebulizer (hydrocarbons, solvents) as well as cross flow nebulizer for HF containing solutions.(g) Spray Chambers: HF Resistant Cyclonic Chamber and hydrocarbon solution spray chamber. Spray chambers suitable for cross flow Nebulizers are available.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "1.Rocks, soils, ores and sediments can be processed using any one of the following procedures depending upon the requirements of the users and available facilities. a) Lithium Metaborate Fusion : 0.2 gm of sample and 0.6 gm lithium metaborate taken in a platinum crucible are heated on a burner till the mixture in the crucible turns into a glassy mass. The crucible is then placed in 30% nitric acid solution and stirred till all the glassy mass dissolves (usually two hours). The solution is then diluted to standard volume with distilled water. b) Hydrofluoric Acid Method : 0.5 gm of the sample is taken in a Teflon beaker and 10 ml nitric acid or perchloric acid and 5 ml Hydrofluoric acid are added to it. The solution is heated on a hot plate to dryness. 10 ml of aqua-regia is added to the dry mass and heated till everything dissolves. The solution is diluted to standard volume, 100 ml, with distilled water. Estimation of Silicon is not possible as silica is lost to the atmosphere as silicon tetrafluoride.2. Analysis of air samples can be done and the process of sample preparation is as follows: Air is drawn in at a constant rate through a filter (usually made of cellulose ester or glass fiber). The filter is then digested by following methods: a) For cellulose ester filter - A weighed filter paper is taken in a beaker, 10 ml nitric acid added and heated on a hot plate. While still hot, perchloric acid is added dropwise till the organic matter is destroyed. The sample is concentrated by further heating and solution diluted with distilled water. b) For glass fibre filters - A weighed filter is taken in a teflon beaker, 5 ml of HF and 10 ml nitric acid added and heated on a hot plate. A few drops of perchloric acid are added and the solution concentrated to dryness. The residue is dissolved in 10 ml of nitric acid and diluted with distilled water.3. Water samples can be analysed as such for elements like Ca, Mg, Mn, Fe, Zn, Na, K. But other minor elements need concentration. 500 ml of solution is concentrated to 50 ml with warming at 90o C. Volatile elements like mercury may get lost at higher temperature.4. Organic samples (Blood Urine, Polymer etc.) : 10 ml of sample in 10 ml of nitric acid is heated on a hot plate and hot perchloric acid is added dropwise till all the organic matter is destroyed and solution becomes clear. Dilution is done with distilled water to desired volume.5. Samples of metals and alloys can be digested using only nitric acid or hydrochloric acid or the combination of the two (aqua-regia). Crystalline samples that are water soluble can be submitted in their water dissolved form. Organic solvents cannot be accepted, because plasma cannot be sustained in presence of organic solvent. Hence the organic solvent has to be either volatilised or destroyed.6. A minimum of 25 ml of solution is required for estimation of all elements.", "Applications": "1)Precious metal estimation at low level2)Heavy metal estimation at sub ppm level3)Rock, Soil, Fly ash (Complete analysis)4)Environmental sample analysis (Air, Water, Soil, sediments, etc.)5)Biological samples (Urine, tooth, bone, etc.)6)Polymer industries7)Pharmaceutical industries", "Chemical_allowed": "HNO3HClHFH2SO4H2O2HClO4", "Gases_allowed": "N.A", "SOP": "SOP of Daily use of ICPAES.pdf\n  (522.3 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "--"}, {"Sr_no": "72", "Facility": "Inductively Coupled Plasma Optical Emission Spectroscopy System", "Make": "SPECTRO Analytical Instruments GmbH, Germany", "Model": "FHM 32 ARCOS III", "Date_of_Installation": "9 January, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Atomic Emission Spectroscopy", "Available_Equipment_Mode_of_use": "Qualitative & Quantitative Analysis", "Facility_In_Charge": "Prof. Harish Phuleria, phuleria@iitb.ac.in", "Facility_Manager": "Dr. Gajender Saini, gsaini@iitb.ac.in,02221596481", "Facility_Operator": "Mrs. Priyanka Jain, priyankaj@iitb.ac.in, 022-221593154, Mrs. Reshma Kadam, reshmas@iitb.ac.in, 022-221593154, Ms. Reshma Poojari, reshmap@iitb.ac.in, 022-221593154", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "Working Principle:Atomic emission Spectroscopy uses quantitative measurement of the optical emission from Excited atom to determine analyte concentration.Exploiting the fact that excited electrons emit energy at a given wavelength (based on their atomic character) as they return to ground state after excitation by high temperature argon plasma. This analytical technique is used for the detection of trace metalsFeatures : Plasma: Radial or axial observation of inductively coupled plasma Spectrometer:  Optical instrument in Paschen-Runge mounting enables simultaneous record of the spectrum in the wavelength range of 130 to 770 nm The spectrometer is equipped with a robust generator operating in the power range of 500 - 2000 W Detector: Line-array detectors, based on complementary metal-oxide-semiconductor (CMOS) technologyNebulizers: Concentric, cross flow, HF resistance cyclonic SOPDual side-on interface (DSOI: Provides twice the sensitivity of conventional radial systems", "Body": "", "Facility_Description": "Elemental analysis plays an important role in many aspects of life today. Industries producing or processing raw materials require reliable quality control of both their base materials and their finished products, and in many cases also use spectral analysis instruments for monitoring their processes. Research and development departments require flexible analytical techniques to handle their constantly changing requirements. Additionally, waste and waste water also need to be checked for compliance with national regulations before being deposited or released into the environment. Inductively coupled plasma--optical emission spectrometry (ICP--OES), an analytical technique used for the determination of trace elements. In optical emission spectrometry (OES), the sample is subjected to temperatures high enough to cause not only dissociation into atoms but to cause significant amounts of collisional excitation (and ionization) of the sample atoms to take place. Once the atoms or ions are in their excited states, they can decay to lower states through thermal or radiative (emission) energy transitions. In OES, the intensity of the light emitted at specific wavelengths is measured and used to determine the concentrations of the elements of interest. Inductively coupled plasma optical emission spectroscopy (ICP-OES), is the technique of choice for many applications that require analyzing a sample for its elemental content. Typical samples include those in the environmental, metallurgical, geological, petrochemical, pharmaceutical, materials, and food safety. It can be applied to varying sample types such as aqueous and organic liquids and solids.", "Instruction_for_Sample_Preparation": "1.Rocks, soils, ores and sediments can be processed using any one of the following procedures depending upon the requirements of the users and available facilities. a) Lithium Metaborate Fusion : 0.2 gm of sample and 0.6 gm lithium metaborate taken in a platinum crucible are heated on a burner till the mixture in the crucible turns into a glassy mass. The crucible is then placed in 30% nitric acid solution and stirred till all the glassy mass dissolves (usually two hours). The solution is then diluted to standard volume with distilled water. b) Hydrofluoric Acid Method : 0.5 gm of the sample is taken in a Teflon beaker and 10 ml nitric acid or perchloric acid and 5 ml Hydrofluoric acid are added to it. The solution is heated on a hot plate to dryness. 10 ml of aqua-regia is added to the dry mass and heated till everything dissolves. The solution is diluted to standard volume, 100 ml, with distilled water. Estimation of Silicon is not possible as silica is lost to the atmosphere as silicon tetrafluoride.2. Analysis of air samples can be done and the process of sample preparation is as follows: Air is drawn in at a constant rate through a filter (usually made of cellulose ester or glass fiber). The filter is then digested by following methods: a) For cellulose ester filter - A weighed filter paper is taken in a beaker, 10 ml nitric acid added and heated on a hot plate. While still hot, perchloric acid is added dropwise till the organic matter is destroyed. The sample is concentrated by further heating and solution diluted with distilled water. b) For glass fibre filters - A weighed filter is taken in a teflon beaker, 5 ml of HF and 10 ml nitric acid added and heated on a hot plate. A few drops of perchloric acid are added and the solution concentrated to dryness. The residue is dissolved in 10 ml of nitric acid and diluted with distilled water. 3. Water samples can be analysed as such for elements like Ca, Mg, Mn, Fe, Zn, Na, K. But other minor elements need concentration. 500 ml of solution is concentrated to 50 ml with warming at 90o C. Volatile elements like mercury may get lost at higher temperature. 4. Organic samples (Blood Urine, Polymer etc.) : 10 ml of sample in 10 ml of nitric acid is heated on a hot plate and hot perchloric acid is added dropwise till all the organic matter is destroyed and solution becomes clear. Dilution is done with distilled water to desired volume. 5. Samples of metals and alloys can be digested using only nitric acid or hydrochloric acid or the combination of the two (aqua-regia). Crystalline samples that are water soluble can be submitted in their water dissolved form. Organic solvents cannot be accepted, because plasma cannot be sustained in presence of organic solvent. Hence the organic solvent has to be either volatilised or destroyed. 6. A minimum of 25 ml of solution is required for estimation of all elements.", "Applications": "Precious metal estimation at low levelHeavy metal estimation at sub ppm levelRock, Soil, Fly ash (Complete analysis)Environmental sample analysis (Air, Water, Soil, sediments, etc.)Biological samples (Urine, tooth, bone, etc.)Polymer industriesPharmaceutical industries", "Chemical_allowed": "HNO3HClHFH2SO4H2O2HClO4", "Gases_allowed": "N.A", "SOP": "SOP of Daily use of ICPOES.pdf\n  (130.47 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "73", "Facility": "Industrial Robotic 3D Concrete Printer", "Make": "TVASTA", "Model": "Nirman R3D6", "Date_of_Installation": "6 February, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. M N Shariff", "Facility_Manager": "Pratap Shingade", "Facility_Operator": "Rangareddy, Mahendra Suthar", "Department": "Civil Engineering", "Features_Working_Principle": "Fresh concrete layers are printed one over the other using an automated robotic systemThe entire printing process is streamlined with the help of software integrating the machine and material parameters", "Body": "7-axis robotic arm concrete 3D printerNozzle sizes vary from 10 mm to 50 mm.Hopper system capacity - 20 kgRotation axis at the nozzle for tangential printing and to print with rectangular nozzlesAccelerator mixing at the nozzle systemVariable accelerator dosing with a dosing pumpHopper material level detection using laser sensor", "Facility_Description": "Robotic arm concrete 3D printerAccelerator pumpConcrete progressive cavity pump300 kg capacity pan mixer machine", "Instruction_for_Sample_Preparation": "", "Applications": "3D printing ofconcrete using Ordinary Portland Cement (OPC) and/or with supplementary cementitious materialsalternative cementitious materials", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "74", "Facility": "Ion Chromatography coupled with Inductively Coupled Plasma Mass Spectrometry", "Make": "Thermo Fisher", "Model": "ICS 6000 Ion Chromatography System, iCAP RQ ICP-MS", "Date_of_Installation": "3 October, 2025", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head SAIF, office.saif@iitb.ac.in, 022- 25767691/2", "Facility_Manager": "Dr. Gajender Saini", "Facility_Operator": "Ms. Vinita Anvekar, vinitas@iitb.ac.in, 022-21596871,  Ms. Reshma Kadam, reshmas@iitb.ac.in,02221596897", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "IC-ICP-MS stands for Ion Chromatography coupled with Inductively Coupled Plasma Mass Spectrometry. It's a powerful analytical technique used for speciation analysis—that is, identifying and quantifying different chemical forms of elements, especially metals and metalloids.Here’s how it works:Ion Chromatography (IC) separates different ionic species in a sample based on their charge and size.ICP-MS then detects and quantifies these species with extremely high sensitivity, often down to parts per trillion. Aerosol samples are transported into the core of the inductively coupled argon plasma which generates temperatures of 6000-10000 degrees C, where they are completely desolvated and ionized. The resultant ions are separated and collected by mass to charge ratios. The system can detect element from Lithium to Uranium except the noble gases and the elements which do not get converted to positive ions (F).[Sample] ──► [Ion Chromatograph] ──► [Interface] ──► [ICP Torch] ──► [Mass Spectrometer] ──► [Data Output]                                  (Separation)              (Transfer)              (Ionization)         (m/z detection)               This combo is especially useful in environmental, food, and pharmaceutical testing. For example, it can distinguish between toxic inorganic arsenic and less harmful organic arsenic in water or food samples.", "Body": "ICS 6000 Ion Chromatography SystemQuaternary Gradient Pump Pressure range 0-41 Mpa (0-6000 psi)Temp Range 18 -40 °CCD Conductive Detector with integrated flow cellResolution 0.00238 nS/cmDigital Signal Range: 0-18,000 µS/cmColumn for anion, cationColumns for Cr As, Hg etc. speciation analysisDionex AS-DV Autosampler iCAP RQ ICP-MSDigital, Solid-state RF- generator with Dynamic frequencyComputer controlled plasma positioning in all three dimensions, x, y and zPlasma Tv- for simplified plasma optimizationProprietary QCell with Flatapole technologyCollision/reaction cell technology (CRC)with TWO CCT gas MFCsMass Range 2-290amuQtegra Control software platformASX560 AutosamplerSpeciationChromium (Cr (III) vs Chromium (VI)Methylmercury vs Other mercury formsArsenic", "Facility_Description": "", "Instruction_for_Sample_Preparation": "1. Sample should be submitted in solution form specifying the elements to be estimated and their approximate concentrations expected, but the Total dissolved Solid (TDS) in the solution should not exceed preferably 200 ppm. Dilute accordingly2. Generally 10 ml of solution is sufficient for estimation of about 10 to 15 elements3. For special samples like rocks / ore samples, appropriate standards along with the samples should be submitted by user.4. Explosive, poisonous samples and samples giving rise to toxic gases/fumes cannot be undertaken for ICP-MS analysis.5. There is no upper limit for the number of samples acceptable for ICP-MS laboratory.6. The nebulizer of the instrument is made out of PFA material, but spray chambers are of Glass, quartz and PFA, hence user should specify if their samples have HF content.7. The concentration of analyte in samples should be less than 100 ppb for ICPMS.8. Kindly provide the standards for e.g. rocks so that Matrix interferences can be avoided.", "Applications": "IC-ICP-MS is a powerful tool with high sensitivity and element specificity, making it ideal for the analysis of trace elements in complex matrices. Common applications include: Food Safety: Analyzing foodstuffs like fish and fruit juices for toxic species of elements like mercury and arsenic.Environmental Monitoring: Assessing the distribution and risk of heavy metal species in water, soil, and sediments.Pharmaceuticals: Ensuring product safety and quality by controlling the levels of toxic species in ingredients.Clinical Analysis: Testing biological samples, such as urine, for levels of toxic and non-toxic species to manage patient exposure, such as to arsenic", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "75", "Facility": "Isothermal Titration Calorimeter", "Make": "Malvern Panalytical Limited", "Model": "Isothermal Titration Calorimeter SYS80004, SYS12906", "Date_of_Installation": "4 February, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Biochemistry", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Ashutosh Kumar, Email Id :ashutoshk@iitb.ac.in, Contact : 022-25767762", "Facility_Manager": "Mr. Nitin Bhoite Email Id : 30004943@iitb.ac.in Contact : 022-25764757", "Facility_Operator": "", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Isothermal titration calorimetry (ITC) works by measuring the heat change that occurs when two molecules interact. The principle behind ITC is that heat is released or absorbed when non-covalent bond from or break between two molecules. The heat change is measured by the instrument as heat required to maintain same temperature as that of reference cell.", "Body": "MicroCal Calorimeter Solution Package SYS80004 - PEAQ-ITC – Ultrasensitive PEAQ-ITC Microcalorimetery Cell with syringe tower and Control Unit for real-time operation and post-run data analysis.PEAQ-ITC Washing Module with detergent capability for cleaning cell and titration syringe.", "Facility_Description": "Used to study interaction between two molecules.", "Instruction_for_Sample_Preparation": "", "Applications": "Isothermal titration calorimetry has been used in a wide array of fields. In the old days, this technique was used to determine fundamental thermodynamic values for basic small molecular interactions. In recent years, ITC has been used in more industrially applicable areas, such as drug discovery and testing synthetic materials. Although it is still heavily used in fundamental chemistry, the trend has shifted over to the biological side, where label-free and buffer independent values are relatively harder to achieve.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "76", "Facility": "Laser Flash Analysis (Thermal Diffusivity/Thermal Conductivity Measurement)", "Make": "Netzsch", "Model": "LFA 467HT Hyperflash", "Date_of_Installation": "9 September, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Thermal Diffusivity/Thermal Conductivity", "Facility_In_Charge": "Prof. Titas Dasgupta", "Facility_Manager": "Mr.Sachin T.,Mrs. Pritee Navghare", "Facility_Operator": "", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "Measurement PrincipleThermal Conductivity is the measure of a materials ability to conduct heat. While different techniques (steadystate, transient) are available for this measurement, the difficulty lies is the estimation of heat flow through thesample. This is especially challenging at high temperatures where radiative heat losses can be significant. Thesolution to this problem lies is a rapid measurement where an intense heat pulse is applied to one end of thesample and accompanying temperature rise is sensed at the other end. In the above figure, the sample assemblyand the typical measurement profile is shown.The energy source is in this case a Xenon flash lamp hence this instrument is known as the Light FlashApparatus (LFA). An IR detector is used to detect the temperature rise at the rear face and the measured time,sample geometry and a correction factor utilized to calculate the thermal diffusivity (α). The instrument is alsocapable of measuring the specific heat capacity (CP) by a comparison of the heat flow of a standard referencematerial. The thermal conductivity (α) is calculated from the relation κ(T) = α(T). CP(T). ρ(T) where ρ is thedensity.", "Body": "Temperature range: Room Temperature to 1000 degree CThermal Diffusivity Range: 0.01 mm2/s – 2000 mm2/sThermal Conductivity Range: 0.1 W/mK – 4000 W/mKAccuracy: Thermal diffusivity: ± 3%, Specific heat: ± 5%", "Facility_Description": "The LFA 467 HT HyperFlash is a high‑temperature light flash apparatus (laser flash analyzer) used in advanced thermal property testing — specifically to measure thermal diffusivity, thermal conductivity, and specific heat of materials over a very wide temperature range.", "Instruction_for_Sample_Preparation": "Sample Requirements and Material Restrictions(LFA 467 HT HyperFlash)Sample DimensionsUsers must strictly follow the designated sample dimensions specified for different types of bulk materials (e.g., metals, ceramics, polymers, composites). Samples shall be flat, plane-parallel, and 10mm or 12.7 mm diameter and thickness range of 1.5mm-2.5mm precisely.Sample Density InformationUsers are required to provide the density of the sample material . Accurate density values are essential for the correct determination of specific heat capacity and thermal conductivity.Material Thermal StabilityTo safeguard the instrument from damage, it is mandatory that the sample material does not decompose, melt, soften, or undergo any uncontrolled phase change within the selected measurement temperature range. Materials showing degradation, excessive outgassing, or structural collapse are not permitted for measurement.", "Applications": "Materials Science/MetallurgyChemistryChemical ScienceCorrosion Polymer Science Energy Science/Engg. Biological and life sciences SemiconductorsCivil and Earth SciencesNanotechnologyCeramicsPharmaceuticals", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "77", "Facility": "LASER RAMAN CONFOCAL IMAGING SPECTROSCOPE at Earth Sciences", "Make": "Thermo Fisher Scientific", "Model": "DXR3xi", "Date_of_Installation": "31 March, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Raman Spectrometer", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sakthi S. Chinnasamy  chinnasamys@iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Dr. Shilpa Netrawali", "Department": "Earth Science", "Features_Working_Principle": "When a sample is irradiated with an intense monochromatic light source (usually a laser), most of the radiation is scattered by the sample at the same wavelength as that of the incoming laser radiation in a process known as Rayleigh scattering. However, a small proportion of the incoming light – approximately one photon out of a million – is scattered at a wavelength that is shifted from the original laser wavelength. This shift is called the Raman shift. The difference in energy between the incident laser excitation and the Raman scattered light is equal to a vibrational transition energy of the molecule. By analyzing the inelastically scattered Raman light one can build up a Raman spectrum. The Raman spectrum is plotted as a Raman shift relative to the excitation wavelength.", "Body": "Lasers: 532 nm and 780 nm, Spectral range: 50- 3200cm-1Spectral Resolution: 5 cm-1, Confocal depth resolution is down to 2 microns.", "Facility_Description": "Laser Raman Confocal Imaging Spectroscope is based on scattering of light and gives information on chemical and structural characteristics of the sample with minimal or no sample preparation.", "Instruction_for_Sample_Preparation": "The sample’s height should be smaller than 2 cm when placed on the motorized sample stage.The sample’s upper surface should be relatively smooth and flat to minimize the chance of ramming objective into sample.Geological Samples should be polished accordingly.Kindly mark the sample area to be observed.Base of the sample should be flat.", "Applications": "Earth sciences, pharmaceutical, polymer, battery, energy, semiconductor, microplastics, and many other materials science applications", "Chemical_allowed": "User should be aware of the properties of the sample.", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "78", "Facility": "Laser Raman Imaging System", "Make": "Renishaw, UK", "Model": "inVia Reflex", "Date_of_Installation": "25 July, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Raman Spectrometer", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Anil Kottantharayil, Email: anilkg@ee.iitb.ac.in, Contact: 022-2576-7438", "Facility_Manager": "Dr. Gajender Saini, Email: gsaini@iitb.ac.in", "Facility_Operator": "Omkar Phondke, Email: 30005318@iitb.ac.in", "Department": "Centre for Research in Nanotechnology and Science (CRNTS)", "Features_Working_Principle": "Working Principle:Light reflected of Raman-active samples irradiated with monochromatic radiation consists of a Raman component having slightly different wavelength as compared to that of the incident radiation. A spectrometer and detector are used to measure intensity of reflected light and it's corresponding wavelength to give us Raman spectrum for the sample. Features:Following measurements can be performed using Raman/PL signal-Spectral AnalysisMappingDepth ProfilingAforementioned measurements can also be performed-While varying temperature (Temperature-dependent Analysis)While varying degree of polarization / orientation of sample (Polarization-dependent Analysis)At specific intervals of time (Time-dependent Analysis)", "Body": "Specifications:Spectral Range of SystemRaman - 75 to 4000 cm-1PL - 330 to 1600 nmMotorized StageMaximum travel distance of 110 mm x 75 mm x 25 mm with minimum step size of 50 nm x 50 nm x 10 nm.Minimum step-size for mapping is 100 nm.Range for Temperature-dependent Analysis300K to 12K (using CCR)300K to 1200K (using furnace) Polarization-dependent AnalysisIncident light can be polarized as normal, orthogonal or circular.Reflected light can be polarized at any angle.Additional measurementsLow-wavenumber analysis from 15 cm-1 using LWN filter.Fiber-optic probe for analysis of samples which cannot be directly placed on the microscope stage.", "Facility_Description": "", "Instruction_for_Sample_Preparation": "• Maximum size of sample which can be placed on the microscope stage is 50 mm x 50 mm x 30 mm.• For temperature-dependent studies sample size should be less than 3 mm x 3 mm x 3 mm.• If possible, use of coolants/lubricants should be avoided when resizing the samples.", "Applications": "Pharmaceuticals and CosmeticsGeology and MineralogyCarbon MaterialsSemiconductorsLife SciencesPolymer science", "Chemical_allowed": "--", "Gases_allowed": "--", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "• Mireja S, Khakhar DV. High β-phase PVDF films formed by uniaxialcompression. Polymer. 2024 Feb 2;293:126665• Joshi DJ, Jha S, Malek NI, Park TJ, Kailasa SK. Rational design of niobiumcarbide MXene quantum dots decorated with arginine for the fluorescencesensing of superoxide anion in Saccharomyces cerevisiae cells. Sensors andActuators B: Chemical. 2024 Apr 1;404:135226• Patra U, Mujeeb F, Dhar S. Vapor–Liquid–Solid-Mediated Layer-by-LayerGrowth of Stepped-Wedge-Shaped WS2 Microribbons Using the Chemical VaporDeposition Technique. Crystal Growth & Design. 2024 Feb 5• Mandal KK, Singh AK, Kumar B, Shah AP, Vij R, Majumder A, Khunte JJ,Achanta VG, Kumar A. Emission engineering in monolithically integrated siliconnitride microring resonators. arXiv preprint arXiv:2401.04963. 2024 Jan 10"}, {"Sr_no": "79", "Facility": "Laser Scanning Confocal Microscope Facility", "Make": "Carl Zeiss, CZ microscopy, Germany", "Model": "LSM 780", "Date_of_Installation": "15 June, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "1. Single Color Imaging, 2. Multi-color Imaging, 3. Z-Stacking Imaging, 4. Time series Imaging, 5. DIC Imaging, 6. Lambda mode Imaging, 7. FRAP, 8. FRET", "Facility_In_Charge": "Prof. Santanu K Ghosh, santanughosh@iitb.ac.in, 022-2576-7766", "Facility_Manager": "", "Facility_Operator": "Mr. Santosh Panigrahi  , spanigrahi@iitb.ac.in, confocal001@gmail.com, 022-2159-6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Working PrincipleLight coming from multiple out-of-focus planes leads to blurred images or loss of information during conventional (widefield) fluorescence microscopy. Laser scanning confocal microscopy employs spatial filtering techniques to eliminate any out-of-focus light in specimens with finite thickness and leads to the formation of high-resolution images. A focused laser beam scans the sample in a line-by-line manner in the X-Y plane to generate a 2D image. The focus of the laser is then changed to a different Z-plane and the X-Y scanning operation is repeated. A confocal microscope is able to generate a high-resolution 3D image of a sample with a finite thickness in this manner. It should be noted that the confocal operation is only possible with a laser light source (i.e. coherent source) and not with the normal fluorescent light sources..", "Body": "1. Microscope:Fully motorized and computer-controlled Zeiss Axio-Observer Z1 microscope (inverted) with motorized stage and proprietary Definite Focus technology. Piezo-driven stage for scanning stages with a maximum travel range of 250 µm.Lateral Resolution(XY) – 250 to 300 nmAxial Reslotuion (Z) – 550 to 600 nm  2. Objectives:Plan-apochromat 10X/0.45 NA (air)Plan-apochromat 20X/0.8 NA (air)C-apochromat 40x/1.2 NA (water)Plan-Apochromat 40x/1.3 NA (oil)iPlan-apochromat 63x/1.4 NA (oil)iPlan-apochromat 100x/1.4 (oil) Note: DIC imaging is possible with the last three objectives.    3. Lasers:Multi-line Argon laser (458 nm, 488 nm and 514 nm) @ 25 mW405 nm Diode laser @ 50 mW561 nm DPSS laser @ 20 mW633 nm HeNe laser @ 5 mWTitanium Sapphire Multi-photon laser (720 nm – 920 nm with 3.2 W @ 800 nm)    4. Scanning Module : Up to 8 frames/sec scanning speed at 512 x 512 pixels. 32 channels in a proprietary GaAsP spectral detector (8nm per channel) and two PMT fluorescence channels available.One of the PMTs is low-noise for imaging in the red/far red. One transmission detector for DIC imaging is available.2-PMT detectors1 GaAsP detector (For low level signals)T-PMT detector for DIC imagingImaging till 6k * 6k resolution is possible.    5. Filters :DAPIAlexa Fluor 488Rhodamine.    6.Software :Zen 2012 acquisition software from Zeiss with 3D, ROI, FRAP and stitching modules.", "Facility_Description": "Laser scanning confocal microscopy employs spatial filtering techniques to eliminate any out-of-focus light in specimens with finite thickness and leads to the formation of high-resolution images.", "Instruction_for_Sample_Preparation": "Fixed Samples:Fixed samples must be sealed securely between a glass slide and a coverslip.Samples without proper sealing will not be accepted. Live Samples:Use 35 mm diameter glass-bottom petri dishes (commonly referred to as confocal dishes) for live sample imaging.If using oil immersion objectives, ensure you use specialized imaging petri dishes with coverslip bottoms. Imaging with Lower Magnification Objectives:Regular petri dishes are permitted for imaging with lower magnification objectives. Well-Plate Samples:For imaging with a 10x magnification objective, standard well-plates can be used.For higher magnification objectives, use glass-bottom well-plates to ensure optimal imaging quality.", "Applications": "Multi-colour imaging, Z-stacks, and 3D image reconstruction are advanced techniques used in microscopy to capture and analyze multiple fluorescent labels in a sample, reconstructing them into three-dimensional models.Time series imaging involves capturing images at intervals, optionally with Z-stack capabilities, to study dynamic processes over time.Tile scanning automates the imaging of different parts of a sample over extended periods, facilitating large-scale data acquisition and analysis.Fluorescence techniques like FRET (Fluorescence Resonance Energy Transfer), FRAP (Fluorescence Recovery After Photobleaching) are used to study molecular interactions, dynamics, and diffusion in live cells.Lambda mode of imaging.Multi-position imaging.All the different modules can be clubbed with each other to cater the need of the experiment.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "LSM 780 SOP.pdf\n  (757.77 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "LSM Training policy and FAQs.pdf\n  (816.02 KB)", "Publications": "2017-2018 Borse, V., Thakur, M., Sengupta, S., & Srivastava, R. (2017). N-doped multi-fluorescent carbon dots for ‘turn off-on’ silver-biothiol dual sensing and mammalian cell imaging application. Sensors and Actuators B: Chemical, 248, 481–492. https://doi.org/10.1016/j.snb.2017.03.158 Chaudhari, R., Dey, V., Narayan, A., Sharma, S., & Patankar, S. (2017). Membrane and luminal proteins reach the apicoplast by different trafficking pathways in the malaria parasite Plasmodium falciparum. PeerJ, 5, e3128. https://doi.org/10.7717/peerj.3128 Das, S., Kumar, R., Jha, N. N., & Maji, S. K. (2017).  photolithography tool which can be used for direct writing on the substrate or mask writing.", "Instruction_for_Sample_Preparation": "NA", "Applications": "Lithography", "Chemical_allowed": "Optical resists, S1813, LOR PPR", "Gases_allowed": "NA", "SOP": "Updated Sop of Ml3-25th March.docx_.pdf\n  (1.2 MB)", "Training and Other Policy Documents": "354_POLICY.pdf\n  (3.83 MB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "81", "Facility": "Laser-free Confocal Microscopy Facility", "Make": "Aurox Ltd UK / Olympus", "Model": "Clarity High Speed (100 fps)/ Inverted Motorized Research Microscope- IX83", "Date_of_Installation": "21 April, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "1. Confocal mode (Speed 100 fps) :, . Channels: DAPI, GFP, DsRed, CY5, . Z- stack imaging, . Real time live imaging, . Time-lapse imaging, . Modes Available: High Sectioning, Medium Sectioning and High Signal, 2. Florescence microscope mode(Olympus IX83):, . Z- stack imaging, . Time-lapse imaging, . Multi-Colour imaging", "Facility_In_Charge": "Prof. Anirban Banerjee, abanerjee@iitb.ac.in, 022-2576-7794", "Facility_Manager": "", "Facility_Operator": "Ms. Saranya Ajesh, saranya@iitb.ac.in, 022-2159-6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Low photo-bleachingAdvanced image analysis softwareFull 5D confocal imaging control.Imaging across the scales with Clarity - 1000 microns to 0.2 micronsHigh compact and easy to use.Working Principle:- The unique optical system inside the Clarity LFC allows capturing of the images both transmitted (T) and reflected (R) by the disc to easily differentiate between in-focus+ out of Focus and out-of-focus information. Computer subtraction of these images (T–R) creates a sectioned image whereby all out-of-focus blur is effectively suppressed and only the sharp in-focus image of the sample is retained.Using a spinning disk as the modulator/demodulator virtually eliminates residual imaging artifacts. This structured illumination pattern is used to both modulate the illumination field and demodulate the light emerging from the sample.", "Body": "Aurox Confocal mode:•Aurox patented structured illumination spinning disk•NanoSRRF (Super Resolution Radial Fluctuations) Deconvolution•Hamamtsu Fusion BT•High end Xeon W-2245 core workstation•sCMOS Hamamatsu Flash 4 V3 (95% QE) with Camera Link•Cool LED pE 800 Light SourceFluorescence microscope mode:•Olympus IX83 with motorized X-Y-Z and Magnification of    10X /0.3NA (air), 40X /0.60 NA (air), 60X /1.42NA (oil), 100X /1.45NA(oil)", "Facility_Description": "The Laser-free Confocal Microscopy Facility offers a high-speed, multi-channel imaging technique with significantly lower photobleaching compared to a conventional Point Scanning Laser Confocal Microscope.This is a compact and fast confocal system that uses Aurox’s patented structured spinning disc and illumination technology to achieve high-resolution and high-quality confocal images. The resolution is approximately 300nm x 300nm in the X-Y plane and 0.6μm in the Z direction. The laser-free confocal unit is coupled to an IX83 Olympus microscope.On-stage incubation system with temperature and CO2 control for long-time live cell imaging.Aurox spinning disk utilizes a grid pattern instead of pinholes for optical sectioning, achieving over 50% light efficiency with the speed of a spinning disk.", "Instruction_for_Sample_Preparation": "1. Seal the fixed samples between the glass slide and the cover slip.2. When applying for a slot, please specify the fluorophores used in your sample, including their excitation and emission spectra.3. Live samples should be in glass coverslip-bottom Petri dishes or 6, 12, 24, and 48 well plates.4. Please use imaging Petri dishes with coverslip bottoms if oil immersion objectives are to be used.Instructions for users: - Standard slot durations are for 2 hours for fixed samples.USB drives are strictly prohibited to minimize virus-related issues. The data can be shared in the cloud. All data must be transferred within 7 days of imaging. Without exception.", "Applications": "Live cell time lapse imagingFast dynamic imagingFixed cell imagingDevelopmental BiologyPlant BiologyStem cell researchBioluminescent proteins", "Chemical_allowed": "", "Gases_allowed": "CO2", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "82", "Facility": "Lattice Light Sheet Microscopy Facility", "Make": "3i", "Model": "3i Lattice Light Sheet Microscope", "Date_of_Installation": "1 February, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Microscopy", "Available_Equipment_Mode_of_use": "3D & 4D Imaging", "Facility_In_Charge": "Prof. Roop Mallik (Convenor BSBE)  Email: rmallik@iitb.ac.in  Contact: 022-2576 7769", "Facility_Manager": "", "Facility_Operator": "Dr. Jyotsana Gupta,  Email: jyotsana.gupta@dssimage.com,  Contact: +91-22-2576 6719", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "The Lattice Light Sheet Microscope (LLSM) is capable of imaging biological systems spanning four orders of magnitude in space and time. The system generates an optical lattice to create an ultra-thin light sheet to image biological samples over long periods of time and with very fine resolution. This allows for 4D living cell imaging, where experiments limited to seconds or minutes on other imaging platforms can be extended to hours. LLSM uses ultra-thin sheets of light to image 3D cellular dynamics for hundreds of volumes at dozens of frames per second at diffraction-limited resolution. An extremely sensitive primary objective coupled with a custom- designed illumination system allows optical sectioning using extremely low photon doses for imaging with unprecedented duration.", "Body": "Resolution (along X, Y & Z axis) ~ 350 nm x 350 nm x 650 nm (488 nm laser)", "Facility_Description": "The 3i LLSM is designed for imaging cells and small organisms (e.g. Zebrafish embryos and larvae) with very low photo-toxicity. The 3i LLSM provides high-speed, real-time 4D imaging of biological processes with comparable resolution and contrast of a confocal microscope.", "Instruction_for_Sample_Preparation": "All samples must be prepared on a 5 mm circular coverslip.", "Applications": "Live and fixed cell imaging.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "83", "Facility": "Liquid Helium Plant", "Make": "LINDE Cryogenics USA", "Model": "Model 1410", "Date_of_Installation": "1 May, 2009", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Name : Prof. Kantimay Dasgupta, Email : kdasgupta@phy.iitb.ac.in, Phone:  +91-22-25767598", "Facility_Manager": "Name : Satish R Kinikar, Email :  kinikarsr@iitb.ac.in, Phone:  +91-22-2159 6545", "Facility_Operator": "Name : Niteshkumar Singh,  Email : singhnitesh251@iitb.ac.in,   +91-22-2159 6545", "Department": "Physics", "Features_Working_Principle": "Features:Produces liquid helium from helium gas. Liquid helium can be used for cooling down to 2 K. Working Principle :J-T principle: A compressed gas when allowed to expand get cooled. If the same cycle is repeated, then the gas can be cooled down below its liquefaction temperature. In this plant, the helium gas is compressed to high pressure of ~230 psi and allowed to expand in the cold box. With proper heat exchangers and valves, the helium gas finally cools below 4.2 K and gets liquefied. This liquid is collected in a separate container (h

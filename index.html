50 W Xenon Lamp  Scanning Speed - 150 nm/sec  Wavelength Accuracy - 0.5 nm  Integration time -1ms to 160 s  Detectors: visible (200-800nm)-PMT and NIR (800-1500nm)-Liq.N2 cooled InGaAs Accessories      1. Single Cell liquid Holder      2. Solid Sample Holder      3. Two Lasers 800nm and 980 nm are available for upconversion measuments       Working Principle It is a rapid and sensitive method for the characterization of molecular components present in a sample. Fluorescence spectroscopy is a type of electromagnetic spectroscopy which analyzes fluorescent molecules. It exploits the phenomenon of electron excitation upon collision with high energy particles like photons and other excited electrons. In the process of transition of polyatomic fluorescent molecules (fluorophores) from their higher energy level (excited state) to a ground state by lowering their energy level, photons are emitted. Fluorophores play the most important role in fluorescence spectroscopy. Fluorophores are the components in molecules that impart fluorescence. Mostly, fluorophores are the molecules which contain aromatic rings such as tyrosine, tryptophan, fluorescein, etc.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Environmental Industrial Medical diagnostics DNA sequencing Forensics Genetic analysis Biotechnology Qualitative and quantitative analysis", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "48", "Facility": "Focused Ion Beam - Scanning Electron Microscope (FIB-SEM)", "Make": "ThermoFischer Scientific", "Model": "Helios 5 UC", "Date_of_Installation": "15 November, 2021", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "•\tTEM Lamella preparation, •\tSite specific cross sectional imaging, 3D Slice and View, •\tNano-fabrication and Nano-patterning, •\tHR imaging, Low kV HR imaging, SEM/STEM imaging, Ion beam imaging, •\tEDS- Area/Line/Mapping", "Facility_In_Charge": "Head CSIFoffice.saif@iitb.ac.in0091-22- 2576 7691/2", "Facility_Manager": "Mr. Naresh Ambatinaresh.ambati@iitb.ac.in022-21596273", "Facility_Operator": "Ms. Princy Denis Varghese, princy@iitb.ac.in, 022-21596861", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Scanning Electron Microscope (SEM): Uses a focused electron beam to scan the sample surface, producing high-resolution images. Various detectors collect secondary electrons (providing topographical information), backscattered electrons (providing material contrast based on atomic number).Focused Ion Beam (FIB): Typically uses a liquid metal (gallium, Ga+) ion source. The ion beam is used to ablate or \"mill\" material from the sample surface with nanometer precision. It can also be used for ion-induced imaging or for depositing materials using a gas injection system (GIS).", "Body": "Electron Beam Column Specification:Electron Source : Thermal Schottky Field-emitter.Accelerating Voltage : Up to 30kV continuously variable.Probe current : Continuously variable in the range of 0.8pA  100nAElectron Beam Resolution : 0.6 nm @ 30 kV (STEM Mode)                                                0.7 nm @ 1 kV                                                0.6 nm @ 15 kVFIB Column Specification:Accelerating Voltage : Up to 30 kV, continuously variableIon Gun : Gallium liquid metal ion source available.Probe current : It covers the range from 1 pA to 65 nA or larger.Imaging Resolution : 2.5 nm @ 30 kV", "Facility_Description": "The Focused Ion Beam Scanning Electron Microscope (FIB-SEM) , Helios 5 UC model combines the Scanning Electron Beam (SEM) and the Focused Ion Beam (FIB) in order to achieve analysis at nano-scale resolution. The instrument is equipped with different detectors, GIS systems and micromanipulator which make it ideal for to perform high-resolution imaging, nano-patterning, material deposition, milling, TEM lamella preparation etc.", "Instruction_for_Sample_Preparation": "Sample preparation instructions :·         Sample dimensions should be less than 10 mm x 10 mm x 4 mm (height) in case of bulk samples for obtaining high resolution images.·         Medium for Dispersion Ethanol /Methanol / Water /Iso-propyl alcohol are available. Any other medium should be provided by the user. Dispersion will be done by ultrasonication.·          Kindly mark the edge of the sample to be observed for Cross section.·           Base of the sample should be flat for mounting on sample holder.·         Biological samples will be accepted only after user has done primarily fixation with suitable fixative.·         Samples should be in dry form. Hydrated samples must be dried properly before sending.·         Sample preparation if any should be done at user end (cutting the sample for CS, freeze fracturing, sample fixation for biological samples, stain ing of samples, oven drying should be done by the user)·         The samples should withstand high vacuum (~ 10 -5 Pa). Wet samples cannot be done.·         Samples for FIB related preparations should be well-polished / Uniform·         For any further query, kindly contact on Email: fibsem@iitb.ac.in, Contact: 022-2159-6861", "Applications": "Materials Science/MetallurgyFractographyMicro drilling and cutting tools Dental and medical Corrosion  Polymer Science Energy Science/Engg. Biological and life sciences SemiconductorsCivil and Earth SciencesNanotechnologyCeramicsPharmaceuticals", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "Standard Operating Procedure (SOP) for FIB -SEM.pdf\n  (4.62 MB)", "Training and Other Policy Documents": "FIB-SEM TA policy.pdf\n  (192.54 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "49", "Facility": "Formtracer", "Make": "Mitutoyo Corporation", "Model": "", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Ramesh Singh", "Facility_Manager": "Arun Nair", "Facility_Operator": "Arun Nair", "Department": "Mechanical Engineering", "Features_Working_Principle": "A Formtracer is a surface measurement system that uses a stylus or probe to scan the surface of a sample and measure its topography. The stylus, typically diamond-tipped, moves across the surface, detecting vertical displacements caused by surface features like peaks and valleys. These height variations are recorded, creating a detailed 2D or 3D surface profile. Formtracers are widely used in precision engineering and quality control to measure surface roughness, texture, and form with high accuracy.", "Body": "Traverse:200 mmMeasuring range:Z1 = 12 mmMeasuring range:X = 200 mmZ1 = 12 mm [standard lenght stylus ]Z1 = 24 mm [double lenght stylus ] mmMeasuring speed:Roughness measurement:0.02 - 0.2 mm/sContour measurement:0.02 - 2 mm/sDrive speed:CNC mode: max. 40 mm/sJoystick mode 0 - 40 mm/sAccuracy:CS-5000CNC: X = (0,3+0.002L) μmZ1 = (0,3+[0,02H]) μmCS-H5000CNC:X = (0,16+0,001L) μmZ1 = (0,07+[0,02H]) μm[ L : Drive length (mm) ][ H : Measurement height from the horizontal position (mm) ]Traverse straightness:CS-5000CNC: X = (0,1+0,0015L) μm [ standard stylus ]X = (0,2+0,0015L) μm [ double length stylus ]CS-H5000CNC:X = (0,05+0,0003L) μm [ standard stylus ]X = (0,1+0,0015L) μm [ double length stylus ]Resolution:X = 0,005 μmZ1 = 0,0008 μm [ standard stylus ]Z1 = 0,0016 μm [ double length stylus ]Z2-axis range[mm]:300", "Facility_Description": "Accurate 2D and 3D form and roughness measurementCapable of detailed surface contour and profile analysisMeasures heights and depths ranging from microns to millimetersDelivers precise surface texture data for various materials", "Instruction_for_Sample_Preparation": "Samples not allowed - Fluid, Transparent and Highly reflective.Fixture - Need to get one's own fixture if you have an intricate sample.Step Height - Step height if any must be less than 2cm. Avoid 90-degree step height.Sample Size - Max (150mm x 150mm x 100mm)Sample Weight - less than 2kg", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "50", "Facility": "Four dimensional X-ray microscope facility", "Make": "Zeiss", "Model": "Xradia Versa 520", "Date_of_Installation": "15 August, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-ray Microscopy", "Available_Equipment_Mode_of_use": "X-ray Computed tomography, In-situ compression using Deben CT5000-TEC", "Facility_In_Charge": "Prof. Asim Tewari", "Facility_Manager": "Dr. Bharati Patro, bharati@iitb.ac.in", "Facility_Operator": "Ms Suhasini Pai, 30002616@iitb.ac.in, Mr. Amit Kumbhar, amitkumbhar@iitb.ac.in", "Department": "Mechanical Engineering", "Features_Working_Principle": "Working Principle X-rays are directed at an object from multiple orientations and the decrease in intensity along a series of linear paths is measured. This decrease is characterized by Beer's Law, which describes intensity reduction as a function of X-ray energy, path length, and material linear attenuation coefficient. A specialized algorithm is then used to reconstruct the distribution of X-ray attenuation in the volume being imaged.Key features:•Non-destructive interior tomography uniquely enabled by Scout-and-Zoom•True spatial resolution of 700 nm•Minimum achievable voxel of  70 nm•Two-stage magnification that provides resolution at a distance (RaaD), delivering large, flexible working distances while maintaining submicron resolution", "Body": "", "Facility_Description": "Four Dimensional X-ray Microscopy, also known as X-ray Computed Tomography (CT) is a nondestructive technique for visualizing interior features within solid objects, and for obtaining digital information on their 3-D geometries and properties.The sample is imaged from different directions, ideally across an angular range of at least 180°. A single image at one particular angle is called a projection. Computer algorithms can be used to reconstruct the internal, 3-dimensional (3D) structure of the sample from a series of projections. The reconstructed volume can be visualized in different ways; for example slice by slice (also referred to as virtual cross-sectioning), or by rendering a 3D view of individual internal features.", "Instruction_for_Sample_Preparation": "1. Sample should be in solid form. No liquid or powdered samples are allowed.2. Max sample size permitted is 3cm * 3cm * 3cm.3. For better results, sample should be much smaller than the maximum sample size.4. The sample should have one flat surface for the ease of mounting on the sample holder.5.The samples should not be hazardous, chemically or physically unstable or reactive when exposed to X-rays or during handle.", "Applications": "Materials ResearchCharacterize materials, observe fracture mechanics, investigate properties at multiple length scales, quantify and characterize microstructural evolution. Perform in situ and 4D (time dependent) studies to understand the impact of heating, cooling, oxidation, wetting, tension, tensile compression, imbibition, drainage and other simulated environmental studies.Life SciencesPerform virtual histology, visualize cellular and subcellular features, and characterize submicron structures in samples that are inches to centimeters in size. Natural ResourcesCharacterize and quantify pore structures, measure fluid flow, study carbon sequestration processes, analyze tailings to maximize mining efforts. Accurate 3D submicron support for digital rock simulations, in situ multiphase fluid flow studies, and 3D mineralogy.ElectronicsOptimize processes development, study package reliability, perform failure analysis, and analyze package construction. Non-destructive submicron imaging of intact packages for defect re-localization and characterization. PharmaceuticalsEnables to measure the thickness and uniformity of coatings applied to tablets and capsules. Visualize the distribution of ingredients in the final dosage, characterize foreign material based on density, shape or size, detection of anomalies in formulations. High contrast tomography helps in establishing correlations between coating density, drug product performance and product expiry.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "ZEISSXradia5xxVersa_Scout-and-Scan_QuickRefGuide.pdf\n  (255.6 KB)", "Other Related Details Regarding Instrument": "Brochure FDXM .pdf\n  (493.2 KB)", "Publications": "Dutta, S.; Kumar, S.; Singh, H.; Khan, M.A.; Barai, A.; Tewari, A.; Rana, R.S.; Bera, S.; Sen, S.; Sahni, A. Chemical evidence of preserved collagen in 54-million-year-old fish vertebrae. Palaeontology 2020, 63, 195–202Deepoo Kumar ;Ross Cunningham ; PC Pistorius. Use of X-Ray Microtomography to Determine Volume Fraction and 3D Morphology of Inclusion Clusters in Steel. AISTech 2018,1493-1500.Bankim Mahanta, Vikram Vishal, Nikhil Sirdesai, PG Ranjith, TN Singh,Progressive deformation and pore network attributes of sandstone at in-situ stress states using computed tomography. Engineering Fracture Mechanics,Volume 252, 2021, 107833,ISSN 0013-7944.Vikram Vishal, Debanjan Chandra. Mechanical response and strain localization in coal under uniaxial loading, using digital volume correlation on X-ray tomography images.International Journal of Rock Mechanics and Mining Sciences, Volume 154,2022, 105103,ISSN 1365-1609.Rathi, P.; Jha, M. K.; Hata, K.; Subramaniam, C. Real-Time, Wearable, Biomechanical Movement Capture of Both Humans and Robots with Metal-Free Electrodes. ACS Omega 2017, 2, 4132– 4142,  DOI: 10.1021/acsomega.7b00491"}, {"Sr_no": "51", "Facility": "FTIR-Imaging System", "Make": "Bruker, Germany", "Model": "3000 Hyperion Microscope with Vertex 80 FTIR System", "Date_of_Installation": "11 November, 2009", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Infrared/ Raman Imaging, Infrared Spectrometer", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691", "Facility_Manager": "Dr. Gajender Saini, gsaini@iitb.ac.in", "Facility_Operator": "Mr. Omkar Phondke, 30005318@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "FTIR Imaging is a complimentary Imaging tool and is a very versatile analytical technique for spectrochemical imaging. The advantage of chemical imaging compared to other sensor technologies is the ability to analyze the spatial distribution of the component materials in blends, granules or finished dosage forms. Many analysts need to obtain the molecular information from an area of a sample to see a picture of the distribution of molecules or functional groups. These chemical called IR images provide information, that is highly complementary to images obtained from techniques such as Scanning Electron Microscopy (SEM), Atomic Force Microscopy (AFM) and visible light microscopy. SEM and AFM have each a much higher spatial resolution than FTIR imaging, down to less than 1 nm. These techniques provide information about surface properties and in some cases, elements distribution, but they do not provide information about molecular composition. The chemical imaging approach has the potential to monitor processes to reveal the extent of ingredient blending, particle size distributions, agglomeration of component particles and the presence of polymorphs, hydrates and other trace contaminants.Fourier Transform Infra-Red (FTIR) Spectroscopy is well proven as a sensitive, rapid technique for material characterization of various samples for molecular species in a broad range of materials. By coupling the FTIR to a microscope accessory, measurements on small sample can be routinely carried out, down to few micron area. Applications include the identification of trace contaminants, the analysis of failure modes and characterization of production defects.Both FT-IR and FT-NIR take advantage of the fact that the functional groups of every module generate a characteristic absorption or transmission spectral fingerprint that definitely identifies that chemical compound. FTIR and FT-NIR are quickly becoming the preferred compound testing technologies because of their speed, accuracy and reliability. While infrared microscopy provides the highest sensitivity and widest spectral range for small area FTIR measurements, collecting microscopic chemical picture of your sample can be time consuming, depending on the data collection and sample size requirements. Unlike IR microscopes that employ a single detector measuring a single point at a time, FTIR imaging systems contain multi-element detectors, producing IR images almost as fast as an optical microscope presents a visible image.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "52", "Facility": "Fully Automated Robotic Station at Chemistry", "Make": "Chemspeed", "Model": "FLEX ISYNTH", "Date_of_Installation": "23 August, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Chemical Synthesis", "Available_Equipment_Mode_of_use": "Liquid and solid phase synthesis", "Facility_In_Charge": "Prof. Debabrata Maiti, Chemistry Department", "Facility_Manager": "Amol Hanumante", "Facility_Operator": "Md. Saimuddin Sk", "Department": "Chemistry", "Features_Working_Principle": "Specifications:Software: Autosuite flex interfaceFlex Robotic system with ShieldsIsynth array Reactor block for parallel library synthesis Liquid handling robotic toolMulti-gripper Robotic tool to operate Isynth drawers (4-channel robotic liquid handler) for parking and rinsingCombined electrical heating/oil-based cooling option to shakable racks from room temperature to 150 degreesVacuum pump and Condensor for inertisation, evaporation and degassingSample/ reagent rack for 8 mL septa-sealed vialsSample/reagent rack for a double level holder for 30/ 40/ 60 mL vialsGDU – gravimetric solid dispensing robotic tool with built-in balance (resolution 0.1 mg) for accurate and precise dispensing with a range from milligrams to multiple grams (weighing range 20g) Provision of 8X GDU-P fine dosing container of 20g", "Body": "", "Facility_Description": "It is easy programming, automated, and multi-instrument on one robotic workflow platform for liquid and solid phase synthesis.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "53", "Facility": "Gas Chromatography High-Resolution Mass Spectrometer", "Make": "Thermo Scientific, USA", "Model": "Orbitrap Exploris", "Date_of_Installation": "27 January, 2025", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Mass Spectrometry, Gas Chromatography", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022- 21596851", "Facility_Operator": "Pallavi Khapre, Email- pallaviag@iitb.ac.in, Mursaleen Shaikh, Email- mursaleen@iitb.ac.in, Manali Jadhav, Email- manaliv@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "The Orbitrap is an ion trap mass analyzer that consists of two outer electrodes and a central electrode, which enable it to act as both an analyzer and detector. Ions entering the Orbitrap are captured through \"electrodynamic squeezing,\" after which they oscillate around the central electrode and in between the two outer electrodes. Different ions oscillate at different frequencies, resulting in their separation. By measuring the oscillation frequencies induced by ions on the outer electrodes, the mass spectra of the ions are acquired using image current detection. GC-MS is a technique which combines separation capabilities of GC with detection and identification capabilities of MS. Two ionization modes commonly employed are electron ionization (EI) and chemical ionization (CI). In EI, a beam of high energy electrons emitting from a filament strikes the stream of sample molecules. As a result, ionization takes place. Whereas in CI, the sample molecules collide with a stream of pre-ionized reagent gas causing ionization. In tandem MS (MS/MS or MSn), precursor ions undergo further fragmentation.", "Body": "Electron IonizationCI Source with Positive Ion Chemical Ionization (PCI) and Negative Ion Chemical Ionization (NCI)Triplus RSH smart autosamplerOrbitrap mass AnalyserMass range: m/z 30-3000Mass resolution 60,000 at m/z 200Available library: NIST, GC Orbitrap contaminants library, GC orbitrap environmental library, GC orbitrap PCBs library, GC orbitrap pesticides, m/z cloud Thermo library.", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "EnvironmentalBiologicalChemical/chemistryGeochemistryMetabolomicsForensicFlavor and fragrancesPharmaceutical", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "54", "Facility": "GCMS at chemistry", "Make": "AGILENT", "Model": "Agilent Technologies 8890 GC 5977B MSD", "Date_of_Installation": "17 November, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Gas Chromatography", "Available_Equipment_Mode_of_use": "For volatile liquid.", "Facility_In_Charge": "Prof. Arnab Dutta , Chemistry", "Facility_Manager": "Charine Astrid Pawar", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Process more samples in less time with comprehensive automation features and faster separations maximum information from every run using advanced analysis capabilities Rapid identification and quantification enabled by automated spectral deconvolution software Accurate temperature control (oven, inlet, MS transferline) • Accurate, precise injection systems.Triple-Axis Detector.Capillary column: HP-5MS 30m X 0.250mm X 0.25 um. Temperature upto 300°C.", "Body": "", "Facility_Description": "Gas Chromatography-Mass Spectrometry provides maximum information from every run using advanced analysis capabilities. It provides better MS resolution and the lowest mass deviation with superior sensitivity and spectral integrity. This is particularly useful to identify the product formation and useful in organic synthesis and catalysis purpose.", "Instruction_for_Sample_Preparation": "Only organic solvents can be used (except DMSO, DMF or any halogenated solvents).No aqueous samples.Sample should be clear from any suspended particles.Details of Boiling Point, no. of peaks expected has to be provided by the user.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "55", "Facility": "Gel Permeation Chromatography", "Make": "Shimadzu", "Model": "Semi preparative LC-20AR HPLC systems with GPC Sedex 85 LT- ELSD", "Date_of_Installation": "1 January, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Liquid Chromatography", "Available_Equipment_Mode_of_use": "Analytical mode for polymer molecular weight determination., Semi-preparative mode for separation of macromolecules on a few hundred milligram scale, Recycling mode for polymers with similar hydrodynamic radii", "Facility_In_Charge": "Chidambar Kulkarni", "Facility_Manager": "", "Facility_Operator": "Sushant Sudhakar Chopdekar", "Department": "Chemistry", "Features_Working_Principle": "Some of the important specification and features of the facility are listed below.Pump for Analytical and Semi-Preparative Flow Rates: LC-20ARHigh pressure binary gradient systemFlow rate: 0.01 mL/min to 20 mL/minFlow rate accuracy: ±1%Maximum discharge pressure: 49 MPa (7200 psi) Photo Diode Array (PDA) Detector (SPD-M20A)Light source: Deuterium (D2) lamp, tungsten (W) lampsNumber of diode elements: 512Wavelength: 190 – 800 nmWavelength accuracy: 1 nm maxLinearity: 2.0 AU (ASTM standard) Evaporative Light Scattering (ELSD) DetectorSEDERE Sedex 85LT ELSD with preparative cc nebulizerDetection: photodiodeLight Source: Blue LEDSensitivity: 1 ngTemperature range: ambient to 100 °CEluent flow rate: 5 μL/min to 5 mL/min Available columns/accessories Calibration kt, (PS),S-M-10,1/pk (THF standard)PLgel 5um MIXED-C 300 x 7.5 mm (THF analytical column)PLgel 5um MIXED-D 300 x 7.5 mm (THF analytical column)PLgel 5um Guard 50 x 7.5 mm (THF analytical guard column)PLgel 3um MIXED-E 300 x 7.5 mm (THF analytical column)PLgel 3um Guard 50 x 7.5 mm (THF analytical guard column)PLgel 10um 500A MIXED-D 300 x 25 mm (THF preparative column)EasiVial PEG/PEO 2 ml (Aqueous standard) PL aquagel-OH MIXED-H 8 um 300 x 7.5mm (aqueous analytical column)PL aquagel-OH MIXED-M 8 um 300 x 7.5mm (aqueous analytical column)PL aquagel-OH Guard 8 um 50 x 7.5 mm (aqueous guard analytical column)PL aquagel-OH 8 um 300 x 25 mm (aqueous preparative column)", "Body": "", "Facility_Description": "Gel permeation chromatography (GPC) is a commonly used technique to measure the molecular weight distribution of synthetic polymers soluble in both organic as well as aqueous solution. The facility can be used on semi-preparative scale (few hundred mg) to separate (macro)molecules of interest. The facility can be used for a broad class of polymers (polyethylene, conjugated polymers, polypeptides, and others), provided the molecules have good solubility.", "Instruction_for_Sample_Preparation": "Prepare the sample by dissolving 0.5-1 mg of the compound in 1 mL of THF or Water (dependent on the mobile phase), sonicate and filter through a 0.45/0.25 micron syringe filter. Place the sample in the sample chamber. Please note the sample should be fully soluble at ambient temperature (25 C) for at least a few hours.", "Applications": "The facility can be used to – i) analyze the molecular weight distribution of synthetic polymers soluble in THF and water, and ii) separate molecules on a semi-preparative scale (1000 amu and beyond).", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "GPC_usage_protocol.pdf\n  (503.43 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "A Reusable Polystyrene Support for Sustainable yet Cost-effective Octreotide Synthesis, Priyanka Kushwaha, Nandita Madhavan, Chem. Eur. J. 2024, 30, e202402804."}, {"Sr_no": "56", "Facility": "Gel Scanner at Chemistry", "Make": "Cytiva", "Model": "Amersham Typhoon 5", "Date_of_Installation": "4 April, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Infrared/ Raman Imaging", "Available_Equipment_Mode_of_use": "Scanning", "Facility_In_Charge": "Prof Pradeepkumar P.I.", "Facility_Manager": "Mr Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Amersham Typhoon gel scanner is designed for versatile imaging and precise quantitation of nucleic acids and proteins. It is used to image multi-fluorescent, radioisotope-labeled, samples on gels, membranes, tissue sections. It supports Phosphorimaging, RGB and near IR fluorescence as well as sensitive and accurate quantitation of proteins by Chemiluminescence.Features: Detection mode: Fluorescence, Phosphorimaging, Chemiluminescence Lasers: LD488, SHG532, LD635, LD685, LD785 Pixel size: 10, 25, 50, 100 or 200μm and a 1000 μm pre-scan Standard Filters: IP Fltr 390BP, Cy2 Fltr 525BP20, Cy3 Fltr 570BP20, Cy5 Fltr 670BP30, IRshort Fltr 720BP20, IRlong Filtr 825BP30 Scanning Area: 40 x 46 cm", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "User must give prepared gel for scanning/ imagingUser must give all details related with scanning", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "57", "Facility": "High Resolution Liquid Chromatograph Mass Spectrometer-QTOF", "Make": "Agilent Technologies, USA", "Model": "1290 Infinity UHPLC System,1260 infinity Nano HPLC with Chipcube, 6550 iFunnel Q-TOFs", "Date_of_Installation": "8 January, 2013", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Liquid Chromatography, Mass Spectrometry", "Available_Equipment_Mode_of_use": "HRMS, HRMS + compound formula & library search, LCMS with library (Plant Extract, Impurity Profiling, Metabolite Identification, Degradation studies and Environmental samples), HPLC with PDA detector, HPLC with PDA detector for amino acid profiling and Amino acid sample preparation", "Facility_In_Charge": "Head, CSIF       , office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi,                  , nmagadi@iitb.ac.in,, 022- 21596851", "Facility_Operator": "Pradnya Nikam,                    ,  pradnyaj@iitb.ac.in, 022-2159 6873, Pallavi Khapre, pallaviag@iitb.ac.in, 022-2159 6875", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Working Principle Liquid chromatography / Mass Spectroscopy (LC / MS) is a technique which combines high performance liquid chromatography HPLC, a powerful analytical separation technique with mass spectroscopy ,a powerful analysis & detection technique. There are two common atmospheric pressure ionization (API) LC/MS process: Electrospray Ionization (ESI) & Atmospheric Pressure Chemical Ionization (APCI). Both are soft ionization technique. Agilent iFunnel technology combines highly efficient electrospray ion generation and focusing of Agilent Jet Stream technology with a hexabore capillary sampling array and dual-stage ion funnel for increased ion sampling and transmission. NanoHPLC combined with mass spectrometer can analysed small molecule as well large molecules like proteins UHPLC separations can be detected by PDA & Mass spectrometer as different detectors.MS/MS function Sample InjectionIonizationFragmentation (CID)Ions travel through Quadruple and Time flight tube and reach the detector on the basis of their m/z value.Specification: UHPLC & NanoHPLC for small molecules as well as for large moleculesDirect Infusion Mass with ESI & APCI (Positive & Negative mode ionization)UHPLC PDA Detector - Mass spectrometer    Mass Range : 50-3200 amu    Resolution : 40000 FWHM    High Mass Accuracy (Typically less than 1ppm)    High Sensitivity (1 pg. Reserpine S/N 100:1)    Ionization Method : API    1) ESI positive & negative 2) APCI positive & negative    Direct Infusion for Mass Analysis ( MS , MS /MS)    UHPLC PDA Mass Spectrometer.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "1. Expected structure or mass can be provided. 2. Solvent for mobile phase should be mentioned or solubility of compound in volatile solvent 3. As HP-LC is available in most departments, LC of submitted samples indicating the operation should be supplied along with the sample. 4. At present C8,C18 & others like cyano, amino, Si columns are available. You can submit the interest for separation or repeatability of HP-LC   run. 5. For HPLC PDA analysis, wavelength should be given. 6. MS-DS (Material Safety Data Sheet) should be given along with samples to ensure that there sample being given. Samples should not be toxic or hazardous.     Samples will not be accepted unless MS-DS.", "Applications": "Qualitative Analysis & Quantitative Analysis    Impurity Profiling     Metabolite Identification     Pharmacokinetics     Pharma & biomedical applications     Amino acid profiling of 22 amino acid     Degradation studies     Environmental samples", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "58", "Facility": "High Resolution Liquid chromatography Mass spectrometer(Agilent LCMS 6545)", "Make": "Agilent Technology", "Model": "G6545B", "Date_of_Installation": "14 July, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry, Liquid Chromatography", "Available_Equipment_Mode_of_use": "Positive /Negative ESI/APCI mode", "Facility_In_Charge": "Prof. Chidambar Kulkarni", "Facility_Manager": "Rajesh G.", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Mass spectrometry is an analytical technique that can provide both qualitative (structure) and quantitative (molecular mass or concentration) information on analyte molecules after their conversion to ions. The molecules of interest are first introduced into the ionisation source of the mass spectrometer, where they are first ionised to acquire positive or negative charges. The ions then travel through the mass analyser and arrive at different parts of the detector according to their mass/charge (m/z) ratio. After the ions make contact with the detector, useable signals are generated and recorded by a computer system. The computer displays the signals graphically as a mass spectrum showing the relative abundance of the signals according to their m/z ratio.", "Body": "SpecificationMass Range :50-3200 amu Mass resolving power: Greater than 45 ,000 FWHM at m/z 2,722Mass accuracy – MS mode: Less than 0.8 ppm RMSMass accuracy – MS/MS mode: Less than 2 ppm RMSMass accuracy temperature stability: Maintain 1 ppm mass accuracy (variations < 3 °C from calibration temperature)Sensitivity-MS mode (1 pg. Reserpine): 500: 1 RMSSensitivity, MS/MS mode (1 pg. Reserpine): 1,500:1 RMSDirect Infusion for Mass Analysis (MS, MS /MS)Spectral acquisition rate, MS mode: 50 spectra/secondSpectral acquisition rate, MS/MS mode: 30 MS/MS spectra/second", "Facility_Description": "Liquid chromatography / Mass Spectroscopy (LC / MS) is a technique which combines high performance liquid chromatography HPLC, a powerful analytical separation technique with mass spectroscopy ,a powerful analysis & detection technique.          There are two common atmospheric pressure ionization (API) LC/MS process: Electrospray Ionization (ESI) & Atmospheric Pressure Chemical Ionization (APCI). Both are soft ionization technique.          Agilent iFunnel technology combines highly efficient electrospray ion generation and focusing of Agilent Jet Stream technology with a hexabore capillary sampling array and dual-stage ion funnel for increased ion sampling and transmission.         HPLC combined with mass spectrometer can analysed small molecule as well large molecules like proteins.", "Instruction_for_Sample_Preparation": "Instructions for sample preparation / submissionSample should be pure and dry and submit in a vial along with the sample code, molecular formula or molecular weight.Mention the suitable solvent (preferably protonated solvent like MeOH, ACN or water)", "Applications": "Qualitative Analysis & Quantitative Analysis.Proteins/Peptides:              In-depth qualitative analysis of complex samples.               Intact mass measurement.Small Molecules:                Identification and Characterization.                Metabolite analysis: targeted and non-targeted approaches.", "Chemical_allowed": "MeoH, ACN, Water only", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "59", "Facility": "High Resolution Mass Spectrometer at Chemistry", "Make": "Bruker", "Model": "Maxis Impact", "Date_of_Installation": "12 December, 2012", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "LRMS HRMS, LCMS", "Facility_In_Charge": "Prof. Chidambar Kulkarni", "Facility_Manager": "Rajesh G.", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Features: Sub-ppm mass accuracy and 40,000 FSR full sensitivity resolution.Extreme sensitivity across the entire mass ranges from very small molecules to intact proteinsHigh speed MS/MS capabilities with full U-HPLC compatibility.Simultaneous analysis of major and trace sample components.Isotopic fidelity for definitive molecular formulae determination.Robust and easy to operate systemCertainty in identification in combination with Smart Formula 3DTM - unequivocal formula generation with superb mass accuracy.Better than 0.8 ppm Mass accuracyWorking Principle:Mass spectrometry is an analytical technique that can provide both qualitative (structure) and quantitative (molecular mass or concentration) information on analyte molecules after their conversion to ions. The molecules of interest are first introduced into the ionization source of the mass spectrometer, where they are first ionized to acquire positive or negative charges. The ions then travel through the mass analyzer and arrive at different parts of the detector according to their mass/charge (m/z) ratio. After the ions make contact with the detector, useable signals are generated and recorded by a computer system. The computer displays the signals graphically as a mass spectrum showing the relative abundance of the signals according to their m/z ratio.Electrospray ionization mass spectrometry is a desorption ionization method. Desorption ionization methods can be performed on solid or liquid samples and allows for the sample to be nonvolatile or thermally unstable. This means that ionization of samples such as proteins, peptides, oligopeptides, and some inorganic molecules can be performed.", "Body": "Some technical specifications: The Bruker maXis Impact is a Hybrid Quadrupole/ Atmospheric pressure ionization orthogonal accelerated Time-of-flight mass spectrometer. The maXis impact is bench-top instrument which includes,Apollo II Electrospray ion sourceAPCI II source.Quadrupole MS/MS FilterOrthogonal pulsed ion extraction and UHR Time of flight Mass analyzer.Vacuum system.", "Facility_Description": "The Bruker maXis Impact is excellent in molecular mass analysis of both known and unknown compound. Machine can provide one step qualitative and quantitative data in a single rapid analysis.", "Instruction_for_Sample_Preparation": "The sample should be pure and dry and submit in a vial along with the sample code, molecular formula or molecular weight.Mention the suitable solvent (preferably protonated solvent like MeOH, ACN or water.)", "Applications": "Proteins/Peptides:In-depth qualitative analysis of complex samplesIntact mass measurementSmall Molecules:Identification and characterizationMetabolite analysis: Targeted and non -targeted approaches", "Chemical_allowed": "", "Gases_allowed": "NO", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "--"}, {"Sr_no": "60", "Facility": "High Resolution X-ray Diffractometer at Physics", "Make": "Rigaku diffractometer", "Model": "Smartlab 9 kW", "Date_of_Installation": "16 January, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-ray Diffraction", "Available_Equipment_Mode_of_use": "High resolution microstructural characterization of thin films Reflectivity High Resolution powder measurements In-plane measurements", "Facility_In_Charge": "Prof. Subhabrata Dhar", "Facility_Manager": "", "Facility_Operator": "Mr. Aniruddha Patil", "Department": "Physics", "Features_Working_Principle": "High resolution microstructural characterization of thin filmsω-scan/Rocking curves [RC]High resolution ω-2θ using analysers (two bounce or four bound analyser in the diffraction beam optics) [HRω-2θ]Reciprocal space mapping [RSM]ϕ-scanReflectivityReflectivity measurement [Reflectivity]High Resolution powder measurementsθ-2θ using Johnson mirror [HR-powder]Glancing angle diffraction [GLD]In-plane measurementsϕ-scan/rocking curves [In-RC]2θx-ϕ scanHigh intensity x-ray source (9 kW rotating anode source)iParallel beam optics. (useful for microstructural characterization)High resolution goniometer with △θ ▯ 0.0001 Deg as compared to 0.001 Deg for the standard XRD systems.In-plane goniometer (useful for in-plane microstructural studies for the thinfilms)X-ray beam is allowed to fall on the sample and the angles (θ) associated with diffraction maxima [as well as intensity distribution about the maxima] occurring due to different lattice planes are recorded. (θ) is related to the lattice spacing d through Bragg condition 2d Sinθ=nλ where λ is the x-ray wavelength. Information about the lattice structure as well as crystalline quality of a material can be obtained by measuring the angular distribution of intensity about the maxima.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Following type of  operation (CW & QCW)", "Date_of_Installation": "10 August, 2018", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Manaswita Bose  manaswita.bose@iitb.ac.in", "Facility_Manager": "Mr. Girish Naik", "Facility_Operator": "Mr. Girish Naik", "Department": "Energy Science and Engineering", "Features_Working_Principle": "Particle Image Velocimetry (PIV) is a whole-flow-field technique providing instantaneous velocity vector measurements in a cross-section of a flow. This technique being non-intrusive technique allows the application of PIV in high speed flows, boundary layer studies of fluids.", "Body": "Model:  YLF50-1000-NGType:  Nd:YLF (527 nm)Energy:  40 mJ/Pulse @1kHzRep Rate:  1kHz (full energy/per pulse)                   10 kHz (lower energy/per pulse)Minimum time difference:  1 µsPulse width:  150ns @1kHzStable modes of operation (CW & QCW)", "Facility_Description": "Description of the facilityHigh-Speed Particle Image Velocimetry (PIV) FacilityThe High-Speed PIV facility is a state-of-the-art setup designed for whole-flow-field measurements, providing instantaneous velocity vector data in fluid cross-sections. This non-intrusive technique enables the study of high-speed flows and boundary layer phenomena.Key Applications:Multiphase flows and turbulent gas-particle suspensionsErosion, sedimentation, and crude oil transportMixing and segregation in granular media and micro-devicesVisualisation of tidal and tsunami propagationWave interactions with structures and sedimentJet dynamics, thin liquid sheet breakdown, and noise suppression in high-speed jetsOverview: High Speed PIV & ApplicationsThe facility supports advanced research in fluid mechanics and complex flow phenomena.", "Instruction_for_Sample_Preparation": "Time for setting up the experiment - May be weeks Recording - few seconds Processing and Iteration - May be weeks",

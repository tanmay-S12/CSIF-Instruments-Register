: Instrument can probe 1H, 13C and 15N only.Users are advised to bring 15-20 mg of sample depending upon its molecular weight for obtaining high resolution proton or carbon NMR spectra.The sample should be completely soluble in 600 µl of the given solvent.For water-soluble samples, 10% D_2O must be added.For Bio-molecular samples (Protein, peptide and nucleic acids): concentration should be >500 µM.For multi-nuclei bio-molecular experiments: Samples must be isotope labeled.For solid-state: For MAS-NMR experiments, sample should be in the form of very fine powder (20 microns) and at least 40-60 mg of powder is required.Bio-solid samples can be in jelly form.For multi-nuclei bio-molecular experiments: Samples must be isotope labeled.", "Applications": "Experiments can be performed with wide temperature range.A series on nD experiments can be performed in the liquid phase.Suitable for multi-nuclei, multi-dimensional MAS experiments.Static solids can be investigated at various temperature (up to 20K).", "Chemical_allowed": "Non Toxic, Non flammable and Non magnetic", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "2024-25Sam, Avik Kumar, Shreya Dubey, Ujjawal Arora, Sakpal Shweta Chandrashekhar Archana, Navinya Chimurkar, Ashutosh Kumar, and Harish C. Phuleria. Examining the structural properties of hydrophilic and hydrophobic organic aerosols using 1H NMR: diurnal variations and source apportionment.Atmospheric Pollution Research (2024). doi:10.1016/j.apr.2024.102363Naik, Arya R., Shreyada N. Save, Soumya S. Sahoo, Saurabh S. Yadav, Ashutosh Kumar, Jeetender Chugh, and Shilpy Sharma. Metabolic perturbations associated with hIAPP-induced insulin resistance in skeletal muscles: Implications to the development of type 2 diabetes. The International Journal of Biochemistry & Cell Biology (2024). doi:10.1016/j.biocel.2024.106665Singh, Harpreet, Harshad Paithankar, Chetan S. Poojar cleic Acid and Peptide Synthesis Facility-1 at Chemistry", "Make": "K & A lab GMBH", "Model": "H6 DNA/ RNA Synthesizer", "Date_of_Installation": "10 July, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Biochemical Synthesis", "Available_Equipment_Mode_of_use": "solid phase oligonucleotide synthesis of modified building blocks of DNA and RNA.", "Facility_In_Charge": "Prof. Pradeepkumar P. I, Prof. Nandita Madhavan", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Specification / Features: Scale of synthesis: 200nmol / 1 umol/ 10umol Number of columns: 6 columns Number of amidite positions: upto 12 amidite positions Number of reagent positions: 6 positions", "Body": "", "Facility_Description": "This automated synthesizer is used for solid phase oligonucleotide synthesis containing particular sequence of nucleotides.", "Instruction_for_Sample_Preparation": "Chemicals/Reagents/ solvents are to be supplied by end user. Argon Charges are extra.  (Minimum charges are Rs 250 per day )are to be supplied by end user.  If end users do not supply chemicals, reagents/solvents, in addition to above basic charges, there will be additional charges as per the nucleotide sequence. The end-user will be provided a quotation for the same.", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "109", "Facility": "Nucleic Acid and Peptide Synthesis Facility-2 at Chemistry", "Make": "Gyros Protein Technology", "Model": "PurePep Chorus", "Date_of_Installation": "29 July, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Biochemical Synthesis", "Available_Equipment_Mode_of_use": "Solid-phase peptide synthesis", "Facility_In_Charge": "Prof. Pradeepkumar P. I., Prof. Nandita Madhavan", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Specification / Features:1. Scale of Synthesis: 0.005 - 1.0mmol per reaction vessel (Maximum 2 Reaction Vessels at a time) 2. Heating method: Controlled induction heating, configurable to the number of RVs3. Agitation method: Argon bubbling - adjustable, and/or option oscillating shaker mixing 4. Reaction vessel volume: Plastic, disposable: 10 mL Borosilicate glass: 10 mL, 25 mL, 40 mL 5. Number of solvent positions/sizes: upto 8 solvents 6. Number of amino acid positions: 27 amino acid bottles positions 7. Control interface: Proprietary PurePep Chorus control software, internal CPU, tablet (wireless connection)It is used to prepare Solid-phase peptide synthesis (SPPS) which involves the successive addition of protected amino acid derivatives to a growing peptide chain immobilized on a solid phase, including deprotection and washing steps to remove unreacted groups and also side products.", "Body": "", "Facility_Description": "It is used to prepare Solid-phase peptide synthesis (SPPS) which involves the successive addition of protected amino acid derivatives to a growing peptide chain immobilized on a solid phase, including deprotection and washing steps to remove unreacted groups and also side products.", "Instruction_for_Sample_Preparation": "Chemicals/Reagents/ solvents are to be supplied by end user. If end users do not supply chemicals, reagents/solvents, in addition to above basic charges, there will be additional charges as per the peptide sequence. The end-user will be provided a quotation for the same.", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "110", "Facility": "Nucleic Acid and Peptide Synthesis Facility-3 at Chemistry", "Make": "Shimadzu", "Model": "Preparative LC20AR HPLC", "Date_of_Installation": "20 October, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Liquid Chromatography", "Available_Equipment_Mode_of_use": "Anaytical mode, Semi-Prep Mode", "Facility_In_Charge": "Prof. Pradeepkumar P. I, Prof. Nandita Madhavan", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Specification / Features: 1. It can be used for analytical as well as Semi-Prep analysis depending upon column used and mode selected.2. LC-20AR Pump is capable of using Single solvent with max. flow upto 20mL/ min. 3. Autosampler (SIL-20AC HT) is available for Analytical mode which introduces a precise aliquot of a sample solution from a sample container to HPLC column. For Prep Mode, sample is injected manually (max. 1mL) 4. Fraction collector module (FRC-10A): it collects fractions even when the peak elution time varies, by catching the target component according to variations in the chromatogram. 5. Column Oven (CTO-20AC): It can regulate the temperature in a range going from 10 degrees below room temperature to 85 °C. 6. PDA detector (SPD-M20A): It can detect entire Wavelength range of 190 nm - 800 nm simultaneously 7. Following Reverse Phase columns are available with systema) Shim Pack GIST C18, 5um, 4.6 x 250 b) Shim Pack GIST C18, 5um, 10 x 250c) Shim Pack GIST C18, 5um, 20 x 250Only compatible with water-soluble samples of biomolecules.", "Body": "", "Facility_Description": "Analytical HPLC is used to determine sample purity and develop the purification method for semi-preparation chromatography. Semi preparative chromatography is carried out under low backpressures with bigger inner diameter columns and bigger particle size by passing mobile phases at high flow rates. It is used to purify and collect component of interest from all other contaminants in sample.", "Instruction_for_Sample_Preparation": ". Only compatible with water-soluble samples of biomolecules.Charges for chemicals/ reagents/solvents are extra or to be supplied by end user", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "no", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "111", "Facility": "Nucleic Acid and Peptide Synthesis Facility-4 at Chemistry", "Make": "VirTis SP Scientific", "Model": "BTP-8ZGEVX", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Biochemical Synthesis", "Available_Equipment_Mode_of_use": "For drying aqueous samples", "Facility_In_Charge": "Prof. Pradeepkumar P. I., Prof. Nandita Madhavan", "Facility_Manager": "Mr Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Specification / Features: 1. Configuration: 8 litre (It has Direct chamber, flask and/or rack drying capabilities) 2. Lowest condenser Temperature: minus 100°C 3. Maximum ice condensing capacity: upto 3L in 24 hrs 4. Lowest system vacuum: upto 20mT", "Body": "", "Facility_Description": "It executes a water removal process typically used to preserve perishable materials, to extend shelf life or make the material more convenient for transport. Its application is in protein purification, analysis involving plant material, organic tissues etc.", "Instruction_for_Sample_Preparation": "It is only for aqueous samples.For internal users, Sample submitted should be in frozen condition.", "Applications": "Its application is in protein purification, analysis involving plant material, organic tissues etc.", "Chemical_allowed": "Yes. Only aqueous based samples.", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "112", "Facility": "OC-EC or Thermal Optical Carbon Aerosol Analyzer", "Make": "Sunset Laboratory", "Model": "Model 5L", "Date_of_Installation": "20 December, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "NIOSH, IMPROVA & EUSAAR", "Facility_In_Charge": "Prof. Abhishek Chakraborty", "Facility_Manager": "", "Facility_Operator": "Yasarapu Sathish, Rajdeep Singh", "Department": "Environmental Science and Engineering (ESED)", "Features_Working_Principle": "The Sunset Lab Analyser quantifies the carbonaceous species of particulate matter collected on quartz filters through the utilization of the most trusted analytical methods available.Total, Organic, Elemental and Carbonate Carbon species quantified. Thermal-optical method can utilize transmittance or reflectance optical correction. Precision regulated automated gas flow control system provides improved flow stability. High sensitivity and robust detector options. Integrated external standard utilized in every analysis", "Body": "Compliant with all accepted protocols, including NIOSH 5040, EU EN 16909:2017, USEPA VARIAnT, and IMPROVE A. Flame Ionization Detector (FID).Measurement range: Total carbon: 0.20 – 600 µg cm-2, Organic Carbon: 0.20 – 600 µg cm-2, Elemental Carbon: 0.20 – 30 µg cm-2, Detection limit: 0.10 µg cm-2", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Filter paper desiccation", "Applications": "Air quality filter samples analysis", "Chemical_allowed": "", "Gases_allowed": "Helium (UHP)10% Oxygen in Helium5% Methane in HeliumZero AirHydrogen", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "113", "Facility": "Optical Tweezers/Magnetic Twister Facility", "Make": "Optical Tweezer/Magnetic Twister: Bruker; DIC and Confocal Microscope: Nikon", "Model": "Optical Tweezer: JPK NanoTrackerTM 2  Microscope: Nikon Confocal Microscope Eclipse Ti2 A", "Date_of_Installation": "1 June, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Force Microscopy", "Available_Equipment_Mode_of_use": "1.\tOnly DIC imaging (fixed sample), 2.\tOnly Confocal Imaging (4 channels-blue,  green, red, far-red) (fixed sample), 3.\tOnly DIC imaging (live cell sample), 4.\tOnly Confocal imaging (4 channels-blue,  green, red, far-red) (live cell sample), 5.\tOptical Tweezers with DIC Mode (in vitro reconstituted sample), 6.\tOptical Tweezers with Confocal Mode (4 channels-blue,  green, red, far-red) (in vitro reconstituted sample), 7.\tOptical Tweezers with DIC Mode (live cell sample), 8.\tOptical Tweezers with Confocal Mode (4 channels-blue, green, red, far-red) (live cell sample), 9.\tMagnetic Twisters (in vitro reconstituted sample), 10.\tMagnetic Twisters (live cell sample)", "Facility_In_Charge": "Prof. Ambarish Kunwar  akunwar@iitb.ac.in   +(91-22) 2576 7799", "Facility_Manager": "", "Facility_Operator": "Aranyak Mitra", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "WORKING PRINCIPLE:Optical tweezers use highly focused laser beams to trap and manipulate microscopic particles, such as cells, organelles, or nanoparticles, without physical contact. This allows for the measurement of forces in the microscopic scale, which are not possible through any other technique. Forces in the pN range can be accurately measured using this technique.FEATURES:The dual-beam optical tweezer allows trapping and manipulation of two objects at the same time. Additionally, one trap can be multiplexed to form multiple traps which can be used to manipulate multiple objects at the same time. This allows for the formation and manipulation of complex patterns. The magnetic twister allows twisting and manipulation of samples attached to magnetic beads. Simultaneous optical trapping and manipulation and visualization in Confocal mode is possible in the instrument- a powerful and specific tool when manipulating samples whose components are labelled with fluorophores.", "Body": "Optical trapping laser: 1064 nmConfocal lasers: 405 nm (blue), 488 nm (green), 561 nm (red), 640 nm (far-red)Technical Specifications:JPK NanoTrackerTM ControllerSignal Access Module for NanoTrackerTM ControllerJPK NanoTrackerTM Control SoftwareJPK NanoTrackerTM 2 Laser Steering UnitLaboratory Table with Vibration IsolationJPK Multichannel LaminarFlowCell (LFCTM) with Temperature ControlJPK PetridishHeaterTMNikon Ti2-A Inverted Microscope for Confocal and DIC JPK NT2 Head-Magnetic TwisterTMCO2 controller for live cell samples", "Facility_Description": "", "Instruction_for_Sample_Preparation": "In vitro samples:Samples must be prepared in a flow chamber between two coverslips. A square cover slip can be pasted over a rectangular one and the sample flowed in between them. The sample chamber must be sealed before the experiment.Live-cell samples:Samples must be prepared on 35 x 10 mm confocal dishes with glass bottom.", "Applications": "Key applications include:Biophysics: Force measurements in DNA, RNA, and protein interactions; single-molecule studies; cell mechanics.Nanotechnology: Analyzing nanoparticle properties; particle manipulation in microfluidics.Cell Biology: Studying intracellular transport and membrane dynamics.Soft Matter Research: Exploring colloidal behavior and polymer dynamics, microrheology measurementsPrecision Measurements: Nanomechanics and environmental sensing.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "114", "Facility": "Particle Size Analyzer", "Make": "Malvern", "Model": "STP5942", "Date_of_Installation": "31 May, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Scattering", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Hrishikesh Gadgil", "Facility_Manager": "", "Facility_Operator": "", "Department": "Aerospace Engineering", "Features_Working_Principle": "The Malvern Panalytical Spraytec uses the technique of laser diffraction for measurement of the size of spray droplets and spray particles. It does this by measuring the intensity of light scattered as a laser beam passes through a spray. The angular scattering intensity data is then analyzed to calculate the size of the particles responsible for creating the scattering pattern, using the Mie theory of light scattering.", "Body": "Measurement principle:-  Laser diffractionSize range:-  0.1 µm - 2000 µmOptical models:-  Mie Theory and Fraunhofer Approximation including Patented Multiple Scattering correctionLens ranges:-  300 mm lens: 0.1 µm - 900 µm (Dv50: 0.5 µm - 600 µm), 750 mm lens:- 2.0 µm - 2000 µm (Dv50: 5 µm - 1600 µm)Working range:-  150 mm at 0.5 µm extending to >1 m above 5 µmConcentration range:-  Minimum acceptable transmission 5% (dependent on particle size range)Detection system:- 36 element log-spaced silicon diode detector arrayLight source:-  Max 4mW He-Ne Laser, 632.8nmLaser Safety:-  Class 3R laser productOptical alignment system:- Automatic rapid align systemMaximum acquisition rate:- Continuous Mode: 1 Hz, Rapid Mode: 2.5 kHz as standard, 10 kHz with additional software feature keyAccuracy:-  Better than +/- 1% on the Dv50 for NIST-traceable latex standardsPrecision / Repeatability:- Better than +/- 1% COV on the Dv50 for NIST-traceable latex standardsMeasurement triggering Internal:- Based on transmission or light scattering levelsExternal:-  Based on TTL input or simple switch triggerExternal device synchronization:- Via two TTL trigger outputsTemperature:- 15°C - 35°CHumidity:-  35% - 80%, non-condensing", "Facility_Description": "Malvern Panalytical's Spraytec laser diffraction system allows measurement of spray particle and spray droplet size distributions in real-time for more efficient product development of sprays and aerosols. It has been specifically designed to address the unique requirements for spray characterization and deliver robust, reproducible droplet size data.", "Instruction_for_Sample_Preparation": "", "Applications": "Spray characterization of the atomizer used in various fields mentioned below:Aerospace ApplicationsAutomotive applicationsProcess industriesBiomedical/pharmaceutical applicationsAgricultural applications", "Chemical_allowed": "", "Gases_allowed": "Air or inert gases", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "115", "Facility": "Physical Properties Measurement System At Chemistry", "Make": "Quantum Design", "Model": "DynaCool", "Date_of_Installation": "26 May, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Magnetic Characterisation, Electrical Characterisation, Thermal Characterisation", "Available_Equipment_Mode_of_use": "dc-Magnetization, ac-susceptibility, ac and dc-electrical resistivity, heat capacity, thermal transport properties and magneto-torque", "Facility_In_Charge": "Prof. Ramaswamy Murugavel, Dept. of Chemistry, Email: muruks@iitb.ac.in, Ph: +91 22-2576 7163", "Facility_Manager": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Facility_Operator": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "", "Facility_Description": "Quantum Design’s Physical Properties Measurement System with CCR attachment is a versatile instrument for physical properties characterization. This a low temperature ranging from 1.8 K to 300 K facility with high magnetic field ± 9 T and also high ac-frequency up to 10 kHz along with ac-driven field 15 Oe. There are several mode available for different measurement, like dc-magnetization, ac-susceptibility , electrical resistance and heat capacity.", "Instruction_for_Sample_Preparation": "Solid sample is required for all measurements.For ac- and ac- magnetization, solid and powder sample will be requiredFor heat capacity, one flat surface is required and sample mass will be less than 15 mg.For resistance measurement, brick shape sample is required (max size- 1 *0.3*0.3 cm3).The same brick shape is required for thermal transport properties.Note: Liquid sample is not allowed.", "Applications": "Physics/Chemistry/Biology/ Materials Science/Metallurgy", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "116", "Facility": "Physical Properties Measurement System At Chemistry", "Make": "Quantum Design", "Model": "DynaCool", "Date_of_Installation": "26 May, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Magnetic Characterisation, Electrical Characterisation, Thermal Characterisation", "Available_Equipment_Mode_of_use": "dc-Magnetization, ac-susceptibility, ac and dc-electrical resistivity, heat capacity, thermal transport properties and magneto-torque", "Facility_In_Charge": "Prof. Ramaswamy Murugavel, Dept. of Chemistry, Email: muruks@iitb.ac.in, Ph: +91 22-2576 7163", "Facility_Manager": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Facility_Operator": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "", "Facility_Description": "Quantum Design’s Physical Properties Measurement System with CCR attachment is a versatile instrument for physical properties characterization. This a low temperature ranging from 1.8 K to 300 K facility with high magnetic field ± 9 T and also high ac-frequency up to 10 kHz along with ac-driven field 15 Oe. There are several mode available for different measurement, like dc-magnetization, ac-susceptibility , electrical resistance and heat capacity.", "Instruction_for_Sample_Preparation": "Solid sample is required for all measurements.For ac- and ac- magnetization, solid and powder sample will be requiredFor heat capacity, one flat surface is required and sample mass will be less than 15 mg.For resistance measurement, brick shape sample is required (max size- 1 *0.3*0.3 cm3).The same brick shape is required for thermal transport properties.Note: Liquid sample is not allowed.", "Applications": "Physics/Chemistry/Biology/ Materials Science/Metallurgy", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "117", "Facility": "Physical Properties Measurement System At Chemistry", "Make": "Quantum Design", "Model": "DynaCool", "Date_of_Installation": "26 May, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Magnetic Characterisation, Electrical Characterisation, Thermal Characterisation", "Available_Equipment_Mode_of_use": "dc-Magnetization, ac-susceptibility, ac and dc-electrical resistivity, heat capacity, thermal transport properties and magneto-torque", "Facility_In_Charge": "Prof. Ramaswamy Murugavel, Dept. of Chemistry, Email: muruks@iitb.ac.in, Ph: +91 22-2576 7163", "Facility_Manager": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Facility_Operator": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "", "Facility_Description": "Quantum Design’s Physical Properties Measurement System with CCR attachment is a versatile instrument for physical properties characterization. This a low temperature ranging from 1.8 K to 300 K facility with high magnetic field ± 9 T and also high ac-frequency up to 10 kHz along with ac-driven field 15 Oe. There are several mode available for different measurement, like dc-magnetization, ac-susceptibility , electrical resistance and heat capacity.", "Instruction_for_Sample_Preparation": "Solid sample is required for all measurements.For ac- and ac- magnetization, solid and powder sample will be requiredFor heat capacity, one flat surface is required and sample mass will be less than 15 mg.For resistance measurement, brick shape sample is required (max size- 1 *0.3*0.3 cm3).The same brick shape is required for thermal transport properties.Note: Liquid sample is not allowed.", "Applications": "Physics/Chemistry/Biology/ Materials Science/Metallurgy", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "118", "Facility": "Physical Property Measurement System at Physics Dept.", "Make": "Quantum Design", "Model": "PPMS, SVSM, MPMS, VSM1, VSM2", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electrical Characterisation, Mechanical Characterisation, Magnetic Characterisation", "Available_Equipment_Mode_of_use": "Two types of measurements are possible:      M vs H: Field is varied at a fixed temperature and magnetization is measured     M vs T: Temperature is varied at a fixed field", "Facility_In_Charge": "Prof. K G Suresh suresh@phy.iitb.ac.in  +91-22-25767559", "Facility_Manager": "Mr. Satish R Kinikar  kinikarsr@iitb.ac.in, +91-22-2159 6545/6567", "Facility_Operator": "Mr. Niteshkumar Dinesh Singh < br> singhnitesh251@iitb.ac.in, +91-22-2159 6567", "Department": "Physics", "Features_Working_Principle": "Physical property measurement systems are used for the measurement of magnetization of materials. They can measure magnetic moment, magnetization, DC susceptibility, and AC susceptibility of a sample as a function of temperature and/or magnetic field.VSM:Magnetic field (superconducting magnet): -90 kOe to +90 kOeTemperature range (stable or continuous): 1.8 K - 400 KResolution: 10-6 emuSample: bulk/thin film/powderSVSM:Magnetic field (superconducting magnet): -70 kOe to +70 kOeTemperature range (stable or continuous): 1.8 K - 400 KResolution: 10-8 emuSample: bulk/thin film/powderAC Susceptibility Measurement: 0.1 Hz to 1 kHz, sensitivity: ≤ 10-8 emu at 0 T.Ultra - Low Field Capability: ± 0.05 G with a 7 T magnet.", "Body": "VSM Instrument Details (2014):Make & Model: Quantum Design, USAInstalled on: June 2014Purchased under the Scheme: RIFCVSM Technical Specifications:Magnetic Field Range: -90 kOe to +90 kOeTemperature Range: 2 K - 325 KResolution: 10-6 emuSample Size (maximum): length ~ 10 mm, breadth ~ 0.5 mm, thickness ~ 0.5 mmSample: bulk/thin film/powderSQUID - VSM Instrument Details (2011):Make & Model: Quantum Design, USAInstalled on: October 2011Purchased under the Scheme: RIFCSQUID - VSM Technical Specifications:Operating Range: 1.8 K to 400 KMagnetic Field Range: -70 kOe to +70 kOeCooling/Heating Rate: up to 30 K/minResolution: ≤ 8 x 10-8 emuVariable Drive Amplitude: 0.1 to 8 mm (peak)Sample Chamber I.D.: 9 mmSample Size (maximum): length ~ 10 mm, breadth ~ 0.5 mm, thickness ~ 0.5 mmSample: bulk/thin film/powderVSM Instrument Details (2005):Make & Model: Quantum Design, USAInstalled on: September 2005Purchased under the Scheme: ISPC - Thrust AreaVSM Technical Specifications:Magnetic Field Range: -90 kOe to +90 kOeTemperature Range: 2 K - 325 KResolution: 10-6 emuSample Size (maximum): length ~ 10 mm, breadth ~ 0.5 mm, thickness ~ 0.5 mmSample: bulk/thin film/powder", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Your sample can be in pellet, powder, or thin film form.  In case of a powder sample, enclose it in a sample holder or wrap in Teflon tape. The typical sample mass needed is in the range of 10-50 mg. Submit the sample in a sample bottle/box with sample identification and mass clearly marked. The operator will load the sample for you.", "Applications": "PPMS-VSM Facility:Magnetic moment/Magnetization/dc susceptibility of a sample can be measured as a function of temperature or magnetic field.SQUID VSM Facility:Magnetic moment/Magnetization/dc susceptibility/AC Susceptibility of a sample can be measured as a function of temperature and/or magnetic field.Working PrinciplePPMS-VSM Facility:When a magnetic sample is kept in a uniform magnetic field, a magnetic moment is induced according to the nature of magnetism in the sample. If the sample is now vibrated with a certain AC frequency and amplitude, the moments will induce a signal in a set of pick-up coils kept close to the sample. The signal produced in the coils is proportional to the moment of the sample. If this signal can be calibrated with a known moment, then the moment of the given sample can be obtained. For more details, check https://qd-india.com/.SQUID VSM Facility:SQUID VSM uses the same working principle as the normal VSM, but the detection coils (ordinary copper coils in VSM) are replaced by a set of SQUID (Superconducting Quantum Interference Device) sensors in the gradiometer assembly. The presence of SQUID sensors ensures that the sensitivity of detection increases. In addition, some extra features like faster cooling/heating rate and faster charging/discharging of the magnet make this instrument faster than the conventional PPMS-VSM. This instrument also has an additional facility to measure the AC susceptibility of the samples. For more details, check https://qd-india.com/.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "2018:Deepika Rani, Jiban Kangsabanik, K. G. Suresh, N. Patra, D. Bhattacharyya, S. N. Jha, and Aftab Alam, Phys. Rev. Appl. 10 (2018) 054022S. Shanmukharao Samatham, Akhilesh Patel, Alexey Lukoyanov and K. G. Suresh, J. Phys. Cond. Mat., 30 (2018) 295802S Shanmukharao Samatham, K. G. Suresh and V. Ganesan, J. Phys. Cond. Mat., 30 (2018) 145602Y. Venkateswara, Sachin Gupta, S. Shanmukharao Samatham, Manoj Raama Varma, Enamullah, K. G. Suresh and Aftab Alam, Phys. Rev. B 97 (2018) 054407B. N. Sahu, K. G. Suresh, N. Venkataramani, Shiva Prasad and R. Krishnan, AIP Advances 8 (2018) 056118Ranjan Roy, Dushyant Singh, and M. Senthil Kumar, AIP Conference Proceedings 1953, 120015 (2018).DOI: 10.1063/1.5033080Dushyant Singh, Ranjan Roy, and M. Senthil Kumar, IEEE International Magnetics Conference (Intermag-2018), from 23 to 27 April 2018Dushyant Singh, Ranjan Roy and M. Senthil Kumar, International Conference on Magnetic Materials and Applications (ICMAGMA-2018), December 09-13, 2018, NISER, Bhubaneswar, IndiaSharma, H., John, K., Gaddam, A., Navalkar, A., Maji, S.K. and Agrawal, A., Scientific reports, 8(1), p.12717 (2018).2020:LiZn2V3O8: A new geometrically frustrated cluster spin-glass, S. Kundu, T. Dey, A. V. Mahajan and N. Buettgen, Journal of Physics: Condensed Matter 32, 115601 (2020).Signatures of a spin-1/2 cooperative paramagnet in the diluted triangular lattice of Y2CuTiO6, S. Kundu, Akmal Hossain, Pranava Keerthi S., Ranjan Das, M. Baenitz, Peter J. Baker, Jean-Christophe Orain, D. C. Joshi, Roland Mathieu, Priya Mahadevan, Sumiran Pujari, Subhro Bhattacharjee, A. V. Mahajan, and D. D. Sarma, Phys. Rev. Lett. 125, 117206 (2020).Spin-1/2 chain compound Ba2Cu2Te2P2O13: magnetization, specific heat, and local-probe NMR, Vinod Kumar, Aga Shahee, S. Kundu, M. Baenitz, and A. V. Mahajan, Phys. Rev. B 102, 104419 (2020).Gapless quantum spin liquid in the triangular system Sr3CuSb2O9, S. Kundu, Aga Shahee, Atasi Chakraborty, K. M. Ranjith, B. Koo, Jörg Sichelschmidt, Mark T. F. Telling, P. K. Biswas, M. Baenitz, I. Dasgupta, Sumiran Pujari, and A. V. Mahajan, Phys. Rev. Lett. 125, 267202 (2020).Half-metallic ferromagnetism and Ru-induced localization in quaternary Heusler alloy CoRuMnSi, Y. Venkateswara, Deepika Rani, K. G. Suresh and Aftab Alam J. Magn. Magn. Mate oment/Magnetization/dc susceptibility of a sample can be measured as a function of temperature or magnetic field.SQUID VSM Facility:Magnetic moment/Magnetization/dc susceptibility/AC Susceptibility of a sample can be measured as a function of temperature and/or magnetic field.Working PrinciplePPMS-VSM Facility:When a magnetic sample is kept in a uniform magnetic field, a magnetic moment is induced according to the nature of magnetism in the sample. If the sample is now vibrated with a certain AC frequency and amplitude, the moments will induce a signal in a set of pick-up coils kept close to the sample. The signal produced in the coils is proportional to the moment of the sample. If this signal can be calibrated with a known moment, then the moment of the given sample can be obtained. For more details, check https://qd-india.com/.SQUID VSM Facility:SQUID VSM uses the same working principle as the normal VSM, but the detection coils (ordinary copper coils in VSM) are replaced by a set of SQUID (Superconducting Quantum Interference Device) sensors in the gradiometer assembly. The presence of SQUID sensors ensures that the sensitivity of detection increases. In addition, some extra features like faster cooling/heating rate and faster charging/discharging of the magnet make this instrument faster than the conventional PPMS-VSM. This instrument also has an additional facility to measure the AC susceptibility of the samples. For more details, check https://qd-india.com/.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "2018:Deepika Rani, Jiban Kangsabanik, K. G. Suresh, N. Patra, D. Bhattacharyya, S. N. Jha, and Aftab Alam, Phys. Rev. Appl. 10 (2018) 054022S. Shanmukharao Samatham, Akhilesh Patel, Alexey Lukoyanov and K. G. Suresh, J. Phys. Cond. Mat., 30 (2018) 295802S Shanmukharao Samatham, K. G. Suresh and V. Ganesan, J. Phys. Cond. Mat., 30 (2018) 145 mber, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "\"DSM XploreTM 5cm3 twin-screw extruder\" : 1) Conical Twin Screw: Co-rotating, 2) Injection molding (DSM XploreTM 3,5 cm3 Laboratory Injection-Moulding) ,3) Recirculation facility ,4) Tensile/rectangular mold, \"Haake Mini Jet pro\":  1) Injection molding, 2) Molds: Tensile (ISO/ASTM/Type three), Disc, Rectangular, \"Process 11 corotating twin screw extruder\":  1) Extruder: Parallel and Twin die  2) Feeders: Gravimetric single/twin screw feeder ,3) Set of dies (Sheet; Fiber Spinning; Catheter; Filament) ,4) Melt pump ,5) Take-up spool and winder; 6) Pelletizer, \"Single Screw Extruder\":   1) Single Screw, 2) Sheet die, ''Large Scale Cast Film Single Screw Extruder '', ''Large-Scale Twin-Screw Extruder '' (Filament Die)", "Facility_In_Charge": "Prof. Guruswamy Kumaraswamy, Email: guruswamy@iitb.ac.in", "Facility_Manager": "Vishakha Bansod", "Facility_Operator": "Vishakha Bansod", "Department": "", "Features_Working_Principle": "Features : Twin screw extruder (5cc DSM and Haake Process 11)Recirculation (for DSM)Use pellet, powder, or melt samplesProvides efficient sample preparation for mechanical and rheological testingDiameter monitor for the strandSheet take-off setup3D Strand with MP Spooler LaserWorking principle : The majority of polymeric raw materials are available in granules, powder, or flakes form. The transformation from solid to flowable form is carried out by heating the material. Once the material is in a melted state, mold is used to shape the material, and the resulting shape is then fixed by cooling.", "Body": "Types of material we can use: Most thermoplastic materials, including blends, filled systems, etc.Size of material we can use: Typically pellets of 1-2 mm sizeMaximum temperature range of machine: 450 degree Celsius", "Facility_Description": "The Polymer Processing Laboratory at IIT Bombay is equipped with advanced machinery to support research, innovation, and education in polymer science. For external users and internal users also. Key equipment includes a twin-screw extruder with four interchangeable dies (filament, sheet, fiber, and catheter) and a 3D spooler for precise winding, enabling diverse applications such as 3D printing and medical-grade tubing. A single-screw extruder provides efficient processing for simpler polymer formulations. The lab also houses a DSM Micro 5 twin-screw vertical extruder, ideal for small-scale, high-precision material development, and \"Haake Mini Jet pro \"a mini-injection molding machine for prototyping and testing. Additionally, a pelletizer machine ensures uniform polymer pellet production for compounding and recycling. This facility serves as a hub for cutting-edge research and technological advancements in polymer processing.", "Instruction_for_Sample_Preparation": "Material should be dry, and its melting temperature should be within 300 °CRequired sample volume depends on the instrument type that will be used.Carry an extra 30 - 60gm of your material.Material should be totally moisture and contamination free.Main Polymer material should be in the granules or powder form not in liquid.Metals, ceramics, solvents, gaseous and hazardous chemicals as an additive in the compositions are not allowed.", "Applications": "Polymer melt processing, including blends, addition of additives and fillers.Preparation of samples using injection molding (variety of moulds are available).Formulation: Analyze the influence of types of additives, fillers, concentrations, polymer types, etc.Processing: Measure the impact of processing time and temperature.Performance: Predict the performance of the material before actual application.", "Chemical_allowed": "--", "Gases_allowed": "--", "SOP": "SOP_for_External Users.pdf\n  (254.68 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "Technical specifications Of All Instruments.pdf\n  (42.07 KB)", "Publications": "--"}, {"Sr_no": "123", "Facility": "Power Devices Characterization System (PDCS)", "Make": "Form-Factor", "Model": "B1505", "Date_of_Installation": "20 March, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Electrical Characterisation", "Available_Equipment_Mode_of_use": "Working", "Facility_In_Charge": "Prof. Saurabh Lodha", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Mr. Prabhat", "Department": "Electrical Engineering", "Features_Working_Principle": "It supports I–V and C–V measurements using dedicated force and sense probes, requiring four probes for two-terminal devices. The system features automated calibration modules, a display for convenient probing, a vacuum-based chuck for secure sample handling, and a shutter interlock for high-voltage safety. It also offers flexible configurations for two- and three-terminal devices, with gate bias capability provided through a fifth manipulator. The main limitations include the need for separate FORCE and SENSE probes, which increase setup complexity, and the requirement to keep the shutter closed above 42 V in reverse bias due to interlock protection.", "Body": "NA", "Facility_Description": "The Power Device Characterization System (PDCS) enables on-wafer and discrete device testing, primarily under high-power conditions.", "Instruction_for_Sample_Preparation": "NA", "Applications": "For electrical measurements of devices", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "23-09-2025 PDCS SOP Latest.pdf\n  (3.82 MB)", "Training and Other Policy Documents": "23-09-2025 PDCS Policy.pdf\n  (254.36 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "124", "Facility": "Prep HPLC MS at chemistry", "Make": "SHIMADZU", "Model": "Prep System Controller CBM-40", "Date_of_Installation": "29 July, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Liquid Chromatography", "Available_Equipment_Mode_of_use": "Analytical and Prep mode", "Facility_In_Charge": "Prof. Nandita Madhavan , Chemistry", "Facility_Manager": "Charine Astrid Pawar", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "It can be used for analytical as well as Prep analysis depending upon column used and mode selected.LC-20AP Pump along with FCV-200AL unit (Quaternary valve) is capable of using 4 solvents with max. flow up to 50mL/ min. Autosampler LH-40 Liquid Handler is available for Analytical and prep mode which introduces a precise aliquot of a sample solution from a sample container to HPLC column. It also works as the fraction collector which collects fractions even when the peak elution time varies, by catching the target component according to variations in the chromatogram. PDA detector (SPD-M40): It can detect entire Wavelength range of 190 nm - 800 nm simultaneously, wavelength accuracy ± 1 nm.Following analytical column are available with system Shim-pack GIS G C18 5um 4.6 X 250, Shim-pack UC Sil (250 X 4.6,5um).LCMS 2020 combines fast scan speeds with ultrafast polarity switching generates an LCMS/MS instrument that can rapidly analyse numerous compounds with m/z 10 to 2,000.", "Body": "", "Facility_Description": "Preparative Chromatography is carried out under low backpressures with bigger inner diameter columns and bigger particle size by passing mobile phases at high flow rates. It is used to purify and collect component of interest from all other contaminants in sample.", "Instruction_for_Sample_Preparation": "Only solvents compatible with the column can be used. All solvents and any chemicals required to be provided by the user.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "125", "Facility": "Profilometer", "Make": "Bruker/ Dektak XT", "Model": "Bruker/ Dektak XT", "Date_of_Installation": "8 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Microfabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Saurabh Lodha", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Ms. Shilpa", "Department": "Electrical Engineering", "Features_Working_Principle": "Equipment compatible with 2”, 4”, 6” and 8’’ wafers  Stylus, LIS 3, 2um Radius- Type B  Scan length: upto 30 mm  Vertical resolution : less than or equal to 1 A˚ for 2 um vertical step Step height repeatability: 6A˚ or lower for a 1 um step  Stylus size: 2 um and 12.5 um  Capable of measuring samples: up to 50 mm thick  Field of view: 1 mm to 4 mm  Profile auto-leveling and stitching software Stylus force : 1mg-15mg", "Body": "NA", "Facility_Description": "The DektakXT stylus surface profiler is an advanced thin and thick film step height measurement tool. This tool can profile surface topography as well as measure surface roughness", "Instruction_for_Sample_Preparation": "NA", "Applications": "Step thickness measurement, stress measurement", "Chemical_allowed": "NA", "Gases_allowed": "", "SOP": "1.1 Dektak Profilometer SOP_30-10-24.pdf\n  (1.11 MB)", "Training and Other Policy Documents": "Policy for Dektak.pdf\n  (100.04 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "126", "Facility": "Protein Crystallography Facility", "Make": "Rigaku MicroMax-007HF", "Model": "R-Axis IV++", "Date_of_Installation": "1 August, 2014", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Single Crystal XRD", "Available_Equipment_Mode_of_use": "Screening/ diffraction of protein and DNA/RNA crystals for preliminary diffraction to assess and enhance quality., Fibre diffraction of bio-fibres (amyloids)., Atomic level high resolution data collection for solving 3D structures of the bio molecules, Automated crystallisation robots for setting up soluble and membrane protein crystals", "Facility_In_Charge": "Prof. Ruchi Anand", "Facility_Manager": "Ms. Harshada Malvi", "Facility_Operator": "Ms. Harshada Malvi", "Department": "Centre for Research in Nanotechnology and Science (CRNTS)", "Features_Working_Principle": "Protein X-ray crystallography is a powerful technique used to determine the 3D atomic structure of proteins. The process involves several key steps:Crystallisation: Purified protein is crystallised into highly ordered, repeating lattices that allow for X-ray diffraction.X-ray Exposure: The protein crystal is exposed to X-rays, which are scattered by the atoms in the crystal, producing a diffraction pattern.Data Collection: A series of diffraction patterns is collected by rotating the crystal in the X-ray beam, capturing data from different angles.Phase Problem: The diffraction data provide amplitude and orientation, but not phase information. Phasing methods like molecular replacement or heavy atom derivatization are used to solve this problem.Electron Density Map: The data, with phase information, are used to calculate an electron density map, which shows the positions of atoms in the crystal.Model Building and Refinement: Researchers build an atomic model based on the electron density map and refine it by adjusting atom positions to minimise discrepancies with the data.Validation: The final model is validated for accuracy using various quality metrics and tests.", "Body": "Diffractometer:Maximum Rated Output: 1.2 kWRated Tube Voltage-Current: 40 kV; 30 mATarget: Copper (Cu)Radiation Enclosure: Full safety shielding with plastic coverScanning Mode: 0-180° ω scan, 0-180° θ scanOptics: Multilayer confocal typeDetector: Rigaku R Axis IV++Beam Size at the Sample: 100 µmMosquito Crystallization Robot:Designed for screening soluble and membrane proteins (LCP).Capable of performing hanging drop, sitting drop, microbatch, microseeding, and additive screening.Automated syringe dispenser for accurate liquid handling.Highly precise and rapid automated plate setups.Dispense volume range: 25 nL to 1200 nL (protein), 70 µL (well solution).Ensures zero cross-contamination with no washing steps required.Phoenix Crystallization Robot:Ideal for screening soluble proteins.Supports sitting drop, hanging drop, and microbatch reactions.Dispense volume range: 100 nL to 100 µL.Rapid dispensing (< 50 seconds) of screen and protein, minimizing evaporation issues.Flexible dispensing needles.Multiple proteins can be quickly dispensed into multi-well plates.", "Facility_Description": "Our protein crystallography facility is a dedicated laboratory designed to facilitate the research and analysis of protein structures through X-ray crystallography, a leading and widely used method for determining the 3D atomic-level structures of proteins. The facility is equipped with an X-ray diffractometer and automated crystallization robots to support efficient and high-quality experimentation.", "Instruction_for_Sample_Preparation": "Well-isolated protein crystals from crystallisation plates should be supplied for the slot.Crystals can also be flash-frozen in liquid nitrogen with the appropriate cryoprotectant, stored in a Dewar, and sent to us for the slot.Users must provide their own pre-prepared cryoprotectant solutions.Cover-slips, soaking bridges, and loops suitable for your proteins will be provided upon request, with additional charges applicable.For crystallisation, purified proteins with a sufficient concentration should be provided.", "Applications": "Understanding Protein Function: It reveals how protein structures relate to their biological roles, aiding in the study of enzyme mechanisms, signal transduction, and receptor-ligand interactions.Drug Design: Structural insights guide the development of targeted drugs, such as enzyme inhibitors, antibodies, and small molecule therapeutics.Protein-Ligand Interactions: Crystallography helps identify binding sites for small molecules, improving drug discovery and design.Studying Protein Complexes: It provides insights into how proteins interact in larger complexes, crucial for understanding cellular processes.Disease Mechanisms: It aids in understanding how mutations affect protein function, helping in the development of treatments for genetic diseases.Structural Genomics: It contributes to mapping the structures of proteins across various organisms, advancing biological knowledge.Viral and Bacterial Pathogens: Crystallography is used to design antiviral drugs and antibiotics by studying viral and bacterial proteins.Biotechnology: It supports enzyme engineering and the development of industrial enzymes and biocatalysts.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "2022:Singh, J., Sahil, M., Ray, S., Dcosta, C., Panjikar, S., Krishnamoorthy, G., Mondal, J., Anand, R. \"Phenol Sensing in Nature Is Modulated via a Conformational Switch Governed by Dynamic Allostery.\" Journal of Biological Chemistry, 2022, 298(10), 102399. DOISharma, N., Singh, S., Tanwar, A. S., Mondal, J., Anand, R. \"Mechanism of Coordinated Gating and Signal Transduction in Purine Biosynthetic Enzyme Formylglycinamidine Synthetase.\" ACS Catalysis, 2022, 12(3), 1930–1944. DOIKesari, P., Deshmukh, A., Pahelkar, N., Suryawanshi, A. B., Rathore, I., Mishra, V., Dupuis, J. H., Xiao, H., Gustchina, A., Abendroth, J., Labaied, M., Yada, R. Y., Wlodawer, A., Edwards, T. E., Lorimer, D. D., Bhaumik, P. \"Structures of Plasmepsin X from Plasmodium falciparum Reveal a Novel Inactivation Mechanism of the Zymogen and Molecular Basis for Binding of Inhibitors in Mature Enzyme.\" Protein Science, 2022, 31(4), 882–899. DOISakunthala

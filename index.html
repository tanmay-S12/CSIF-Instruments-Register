note Lecture.Umamaheswaran, R., Dutta, S., Kumar, S., & Bera, S. (2022). A novel analytical pyrolysis technique for the assessment of chitinous traces in putative fungal fossils, at The 6th International Palaeontological Congress held at Thailand.Ghosh, S., Dutta, S., Bhattacharyya, S., & Priya, T. (2022). Biomarker and PAH Niceties in Early Permian Coal Lithotypes, at 73rd Annual Meeting and Symposium of ICCP at New Delhi.Priya, T., Dutta, S., & Prasad, V. (2022). Paleodiversity of flora from the Early Paleogene of North-East India: an organic geochemical approach, at The 6th International Palaeontological Congress held at ThailandPriya, T., Dutta, S., & Prasad, V. (2023) Early Palaeogene vegetation from the tropics: Insights from molecular fossils, at Frontiers of Geoscience Research conference, held at PRL Ahmedabad.Priya, T., Dutta, S. & Prasad, V. 2023. Organic Geochemical Insights into the early Palaeogene vegetation from the Tropics. 31st International Meeting on Organic Geochemistry (IMOG), Montpelliar, France.Chand, P., Dutta S. and Mukherji, S. \"Detection and elucidation of fate of organic contaminants in the water-soluble fraction of oily sludge using GCxGC TOF MS\" International Conference on Advanced Materials and Characterization, organized by SG Lab Forum, Singapore, April 25th-26th and 28th 2023.  Oral Presentation.Chand, P., Dutta, S. and Mukherji, S. (2023) \"Analysis of oily sludge and its WSF and estimation of component contribution to toxicity using the Petrotox model\" Symposium on Improving Water Quality by Understanding Environmental Chemical Processes, ACS Fall Meet, San Francisco, CA, USA, 13th to 17th August 2023. Oral Presentation."}, {"Sr_no": "163", "Facility": "Ultra-High-Pressure Liquid Chromatography -High Resolution Orbitrap Mass Spectrometer", "Make": "ThermoFisher Scientific Pvt. Ltd.", "Model": "Q Exactive focus--Orbitrap", "Date_of_Installation": "16 September, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "HESI/APCI", "Facility_In_Charge": "Prof. Amritanshu ShriwastavEmail: - amritan@iitb.ac.inPhone: +91-22-25767858", "Facility_Manager": "", "Facility_Operator": "Mr. Anshul Maheswari , Email: - anshul.m89@iitb.ac.in, Phone: +91-22-25763834", "Department": "Environmental Science and Engineering (ESED)", "Features_Working_Principle": "Sample Injection & Separation:The liquid sample is introduced into the UHPLC system, where it undergoes rapid and efficient chromatographic separation into individual components.Ionization:The separated components are converted into charged ions by ionization techniques like HESI or APCI.Ion Transmission to Orbitrap:The ions are guided into the Orbitrap mass analyzer after initial filtration or focusing using electric and magnetic fieldsMass Analysis in Orbitrap:Ions entering the Orbitrap are captured through \"electrodynamic squeezing,\" after which they oscillate around the central electrode and in between the two outer electrodes. Different ions oscillate at different frequencies, resulting in their separation. By measuring the oscillation frequencies induced by ions on the outer electrodes, the mass spectra of the ions are acquired using image current detection.Data Analysis:The data is processed using software for identifying molecular weights, isotopic patterns, and fragmentation data, enabling compound identification, and structural elucidation.", "Body": "Resolution: 70,000 FWHMMass range:50 to 2000 amuIonization method: HESI/APCIHigh mass accuracy (in the range of ppb)", "Facility_Description": "The UHPLC-HRMS Orbitrap (Ultra-High-Performance Liquid Chromatography coupled with High-Resolution Mass Spectrometry using an Orbitrap analyzer) is an advanced analytical instrument widely used for the precise identification of chemical compounds. It combines the high separation efficiency of UHPLC with the exceptional mass accuracy and resolution of the Orbitrap mass analyzer.", "Instruction_for_Sample_Preparation": "Sample preparation must be completed by the user.The sample must be filtered using a 0.22 µm nylon filter.Ensure that analyte concentrations are less than 3 ppm", "Applications": "Applications:Qualitative analysis of compoundsEnvironmental sample analysisPharma and biomedical sample analysisDegradation studiesDegradation pathway analysis", "Chemical_allowed": "Non-Toxic/Harmful, Non-Infectious/Harmful, Non-Explosive", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "164", "Facility": "Ultra-High-Pressure Liquid Chromatography -High Resolution Triple Quadrupoles Mass Spectrometer", "Make": "ThermoFisher Scientific Pvt. Ltd.", "Model": "TSQ Quantis", "Date_of_Installation": "13 January, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "HESI/APCI", "Facility_In_Charge": "Prof. Amritanshu ShriwastavEmail: - amritan@iitb.ac.inPhone: +91-22-25767858", "Facility_Manager": "", "Facility_Operator": "Mr. Anshul Maheswari , Email: - anshul.m89@iitb.ac.in, Phone: +91-22-25763834", "Department": "Environmental Science and Engineering (ESED)", "Features_Working_Principle": "Sample Injection & Separation:The liquid sample is introduced into the UHPLC system, where it undergoes rapid and efficient chromatographic separation into individual components.Ionization:The separated components are converted into charged ions by ionization techniques like HESI or APCI.Mass Analysis in QQQ:Quadrupole mass analyzers contain four parallelly assembled metallic rods that act as electrodes. A high-frequency electric field is created by applying direct-current (dc) and radiofrequency (rf) potentials across these electrodes. The stable vibratory motion of ions is exploited to attain mass separation through the rf-dc. For a given set of rf-dc parameters, only certain ions within a narrow range of m/q would have established stable trajectories.Data Analysis:The data is processed using software for quantification.", "Body": "Resolution: 70,000 FWHMMass range:50 to 2000 amuIonization method: HESI, APCIHigh mass accuracy (in the range of ppb)", "Facility_Description": "The UHPLC-HRMS Triple Quadrupole (Ultra-High-Performance Liquid Chromatography coupled with High-Resolution Mass Spectrometry using a Triple Quadrupole analyzer) is a sophisticated analytical instrument designed for highly sensitive and selective quantification of chemical compounds. It combines the advanced separation capabilities of UHPLC with the precision and reliability of triple quadrupole mass spectrometry.", "Instruction_for_Sample_Preparation": "Sample preparation must be completed by the user.The sample must be filtered using a 0.22 µm nylon filter.Ensure that analyte concentrations are less than 3 ppm.", "Applications": "Applications:Quantitative analysis of compoundsEnvironmental sample analysisPharma and biomedical sample analysisDegradation studiesDegradation pathway analysis", "Chemical_allowed": "Non-Toxic/Harmful, Non-Infectious/Harmful, Non-explosive", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "165", "Facility": "Ultra-Precision Manufacturing Cell", "Make": "AMETEK Precitech", "Model": "Nanoform X Ultra grind", "Date_of_Installation": "20 December, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Rakesh G. MoteDepartment of Mechanical EngineeringContact: +91-22-25767529Email Id: rakesh.mote@iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Mr. Sharath Raj BL, Department of Mechanical Engineering , Email Id: 10002114@iitb.ac.in", "Department": "Mechanical Engineering", "Features_Working_Principle": "Nanoform X ultra grind is the small-frame ultra-precision machine equipped with pneumatic vibration isolation and a fully flood coolant system. The key features of the facility are the use of air-bearing spindles, pneumatic slides, and a feedback control system that helps in achieving precision movement and accuracy. The machine is designed for diamond turning, which is used to fabricate different components with precision-finished surface quality, having surface roughness in the nanometric level and form accuracy in the sub-micron range. Silicon and other difficult-to-machine materials can be manufactured efficiently with high surface quality using this facility.Diamond turning machine (DTM) uses a sharp-tipped diamond tool, either natural or synthetic, to manufacture precision components with very high surface quality. The process is capable of producing ultra-smooth surfaces that do not require additional polishing. In DTM, the workpiece is mounted on a spindle with rotational motion, and the diamond tool is attached to the tool holder subjected to linear motion. The material removal from the workpiece takes place owing to relative motion between the diamond tool and the workpiece. Surface quality of the work sample is dependent on the tool specification, machining parameters, and material properties.", "Body": "Surface roughness (Sa) - 1.5 nm or less Form accuracy (P-V) - 0.15 µm or less Swing capacity (X and Z axes) - 440 mm Position feedback resolution - 8 pm (0.008 nm) Programming resolution - 0.01 nm", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Freeform and aspheric opticsMirrors/reflectorsLenses Aerospace componentsFunctional structured surfacesBiomedical implantsLasersMedical devices Automotive partsSemiconductorsPrecision moldsDefence equipmentDisplay systemsScientific research instrumentsVideo surveillance systems", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "166", "Facility": "Ultramicrotome Facility", "Make": "Leica Microsystem", "Model": "EM UC7", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sandip Kaledhonkar, sandipk@iitb.ac.in, 022- 2576 7706", "Facility_Manager": "", "Facility_Operator": "Saranya Ajesh, saranya@iitb.ac.in, 022-2159-6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "", "Body": "a. Advanced Control: The innovative advanced touchscreen control unit of the UC7 enables fast and safe alignment of knife and specimen b. Motorized knife stages: Leica Ultramicrotome has fully motorized knife stages. c. Brightness-controlled LED illumination:LED light sources provide outstanding illumination for top light, backlight, and transmit ted illumination", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "Instructions for external users_1.pdf\n  (833.04 KB)", "Publications": ""}, {"Sr_no": "167", "Facility": "UV-Vis Spectrophotometer", "Make": "Agilent Technologies", "Model": "Carry 100 UV-Vis", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "UV- Vis spectroscopy", "Facility_In_Charge": "Head, CSIF, Email- office.saif@iitb.ac.in", "Facility_Manager": "Mrs.Sonali Prashant Duble, sonali@iitb.ac.in", "Facility_Operator": "Mrs.Sonali Prashant Duble, email ID-sonali@iitb.ac.in", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "The Principle of UV-Visible Spectroscopy is based on the absorption of ultraviolet light or visible light by chemical compounds, which results in the production of distinct spectra. Spectroscopy is based on the interaction between light and matter. When the matter absorbs the light, it undergoes excitation and de-excitation, resulting in the production of a spectrum.When matter absorbs ultraviolet radiation, the electrons present in it undergo excitation. This causes them to jump from a ground state (an energy state with a relatively small amount of energy associated with it) to an excited state (an energy state with a relatively large amount of energy associated with it). It is important to note that the difference in the energies of the ground state and the excited state of the electron is always equal to the amount of ultraviolet radiation or visible radiation absorbed by it.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Qualitative and quantitative Analysis  Kinetics  Protein/RNA/DNA quantification  Metal Concentration  Validation", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "168", "Facility": "UV-Vis-NIR-Spectrophotometer at Chemistry", "Make": "Agilent", "Model": "Cary 5000", "Date_of_Installation": "11 October, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "• Transmission (for liquid and solids), • Absorbance (for liquid and solids), • Reflectance ( for solids)", "Facility_In_Charge": "Prof. Deepti Kalsi", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "Ms. Pooja Chougule", "Department": "Chemistry", "Features_Working_Principle": "Features/ Accessories: Experiments can be performed with wide range of wavelength 190 nm - 3300 nm (for Liquid samples) Integrating Sphere with a working range of 250 to 2500 nm (for solids) PMT (photomultiplier tube) for the ultraviolet and visible region. PbS detector for near infrared regionPeltier module for static temperature control with variable stirring speedPrinciple:Typical UV-Vis spectrometers use a deuterium lamp for the UV that produces light from 170–375 nm and a tungsten filament lamp for visible, which produces light from 350–2,500 nm. When a photon hits a molecule and is absorbed, the molecule is promoted into a more excited energetic state. UV-visible light has enough energy to promote electrons to a higher electronic state, from the highest occupied molecular orbital (HOMO) to the lowest unoccupied molecular orbital (LUMO). The energy difference between the HOMO and the LUMO is called the band gap. Typically, these orbitals are called bonding and anti-bonding. The energy of the photon must exactly match the band gap for the photon to be absorbed. Thus, molecules with different chemical structures have different energy band gaps and different absorption spectra. The most common transitions that fall in the UV-Vis range are π-π* and n- π*. Pi orbitals arise due to double bonds, and n orbitals are for non-bonding electrons. Pi star are anti-bonding pi orbitals. Thus, UV-Vis absorption is by molecules that contain double bonds. Pi orbitals adjacent to each other that are connected, called conjugation, typically increases absorption.  The broad bands or shoulders on the UV-Vis structure is due to the numerous vibrational and rotational states of a molecule, which lead to separate energy band gaps of slightly different energies.  Absorption follows Beer's Law, A=εbC where ε is the molar Extinction coefficient, b is path length, and C is concentration. The molar Extinction coefficient is the characteristic of an individual compound to absorb at a given wavelength and this property is due to functional groups, conjugation, etc.", "Body": "", "Facility_Description": "UV-Vis-NIR spectrophotometer is a high sensitivity, high resolution, low stray light instrument for transmission and absorption measurements of powder, thin films, solid and liquid samples", "Instruction_for_Sample_Preparation": "If Any reference material, solvents required are to be supplied by the userProvide solid samples in the fine powder form. Minimum required amount is approximately 1-2 gm. Liquid Samples are prepared by user in appropriate concentration required for the experiment. The required minimum amount is 2-3 ml.  In case any additional Chemicals/ materials  required for recording the samples, Charges would be additional.", "Applications": "Qualitative and Quantitative analysisStructure elucidation of compoundIn biochemistryReaction Monitoring etc", "Chemical_allowed": "Yes", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "169", "Facility": "Variable temperature hall measurement system", "Make": "LakeShore", "Model": "8404", "Date_of_Installation": "24 April, 2014", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electrical Characterisation", "Available_Equipment_Mode_of_use": "Normal (room temperature) mode Low temperature mode", "Facility_In_Charge": "Prof. K. R. Balasubramaniam  bala.ramanathan@iitb.ac.in  022 - 2576-7808", "Facility_Manager": "", "Facility_Operator": "Mr. Harish Sonar p13553@iitb.ac.in Ext. 022 2159 6501", "Department": "Physics", "Features_Working_Principle": "The Variable Temperature Hall Measurement System works on the principle of the Hall Effect and electrical resistivity measurement.When a current-carrying sample is placed in a magnetic field perpendicular to the direction of current flow, a transverse voltage known as the Hall voltage is developed across the sample due to the deflection of charge carriers. The measured Hall voltage is used to determine carrier concentration, carrier mobility, and carrier type.", "Body": "The versatile Hall Measurement System employs an AC magnetic field for measuring low mobilities down to 0.001 cm2/V.s, much lower than ever possible using traditional DC field Hall measurement techniques.The system also has an unusually high resistance option to measure samples with resistance as high as 200 GΩ in van der Pauw geometry.Measurement of low mobilities down to 0.001 cm2/v.s, much lower than ever possible using traditional DC field hall measurement techniques.High resistance option to measure samples with resistance as high as 200GΩ in van der Pauw geometry.LakeShore Model 8404 AC/DC Hall Effect Measurement System (HMS) can provide a full range of Hall measurements using van der Pauw or Hall probe sample geometries. Options include high resistance and low resistance samples, low mobility samples and variable temperature measurement. DC Field measurements : Resistance range: 0.5 mΩ to 200 GΩAC Field measurements : Capable of measuring mobility's down to 0.001 cm2/V.Low temperature option : Variable Temperature assembly (temperature range 15 K to 350 K)", "Facility_Description": "The Variable Temperature Hall Measurement Facility (Lake Shore 8404 Series) is available for characterization of electrical transport properties under controlled temperature and magnetic field conditions.The facility supports measurements such as Hall Effect, resistivity, carrier concentration, carrier mobility, and temperature-dependent electrical properties of thin films, semiconductor materials, nanomaterials, and bulk samples.", "Instruction_for_Sample_Preparation": "It is desirable to have samples of approximate size (8 mm x 8 mm) and thickness 1- 2 mm. Any sample shape is acceptable but the minimum and maximum size should be 5 mm and 15 mm, respectively. Please note that the HMS Facility provides only indium soldering and conductive silver paint for van der pauw contacts to the samples. For the first time measurement on a pellet type or solution casted samples, the user must contact the HMS Technical Staff (hms@iitb.ac.in), before registering for a slot. The user should fix up a mutually convenient time to check if it is possible to make point contacts with the available facilities. In case it is not possible to make such point contacts, it will be the responsibility of the user to come prepared for a HMS slot, with four van der pauw contacts of ~ 1 mm size at the periphery of the sample, using suitable metals, like, aluminium or gold, etc., which make ohmic contact to their material.", "Applications": "The 8400 Series HMS combines the best of both DC and AC field Hall measurement methodologies to facilitate the broadest range of research applications. Optional variable temperature modules and measurement platforms extend the utility HMS to meet the specific needs for a large variety of applications.Solar cells: OPVs, a: Si, μ-Si, CdTe, CuInGaSe (CIGS)Organic electronics: OTFTs, Pentacene, Chalcogenides, OLEDTransparent conducting oxides: InSnO (ITO), ZnO, GaZnO, InGaZnO (IGZO)III-V semiconductors: InP, InSb, InAs, GaN, GaP, GaSb, AIN based devices, high electron mobility transistors (HEMTs) and heterojunction bipolar transistorsII-VI semiconductors: CdS, CdSe, ZnS, ZnSe, ZnTe, HgCdTeElemental semiconductors: Ge, Si on insulator devices (SOI), SiC, doped diamond SiGe based devices: HBTs and FETsDilute magnetic semiconductors: LGaMnAs, MnZnOOther conducting materials: Metal oxides, Organic and inorganic conductorsHigh temperature superconductors", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1.Shravan K Appani, Ashok Kumar Yadav, DS Sutar, SN Jha, D Bhattacharyya, and S S Major,“X-ray absorption spectroscopy study of Ga-doping in reactively sputtered ZnO films”, Thin Solid Films 701, 137966 (2020).2.Mohammad   Monish, Shyam Mohan, D S Sutar, and S S Major, “Gallium   nitride films of high n-type conductivity grown by reactive sputtering” Semicond. Sci. Technol. 35, 045011 (2020).3.Kumar Akash, Sandeep Maurya, Sushobhita Chawla, Suren Patwardhan, and Balasubramaniam Kavaipatti. \"Effect of thickness on metal to semiconductor transition in La doped BaSnO3 films deposited on high mismatch LSAT substrates.\" Applied Physics Letters 114 (21): 212103 (2019).4.Aggarwal Garima, Sandeep Kumar Maurya, Akhilender Jeet Singh, Ashish K. Singh, and Balasubramaniam Kavaipatti. \"Intrinsic Acceptor-like Defects and Their Effect on Carrier Transport in Polycrystalline Cu2O Photocathodes.\" The Journal of Physical Chemistry C 123 (43): 26057-26064 (2019).5.Bera Bapi, Divya Priyadarshani, Miji E. Joy, Anand Kumar Tripathi,   Sandeep Kumar Maurya, Balasubramaniam Kavaipatti, and Manoj Neergat. \"Origin of the Catalytic Activity Improvement of   Electrochemically Treated Carbon: An Electrical and Electrochemical Investigation.\" The Journal of Physical Chemistry C 123   (39): 23773-23782 (2019).6.Aggarwal Garima, Ashish K. Singh, Sandeep K. Maurya, and K. R. Balasubramaniam. \"Copper Oxide Phase Change During Pulsed Laser Deposition of SrTiO3.\" Advances in Energy   Research Springer, Singapore (1): 191-197 (2020).7.Keshav Prasad Dabral and Satish Vitta, “p-type high temperature thermoelectric behavior of Dy filled CoSb3 and Fe1.5Co2.5Sb12 and their magnetic properties”, ACS Applied Energy Materials (2020).8.Aditya Dutt, Mofasser Mallick and Satish Vitta, “Enhancing the high temperature thermoelectric performance of Li(CoNi)O2 by replacement of Ni with earth abundant Mg” Journal of Electronic Materials 49 4324 (2020).9.Keshav Drabral and Satish Vitta, “Tuning the nature of charge carriers by controlling dual substitution in single filled thermoelectric skutterudite, Yb-CoSb3”, Emergent Materials 3 195 (2020).10.Mofasser Mallick and Satish Vitta, “Effect of double doping, Li and Se, on the high temperature thermoelectric properties of Cu2Te” Journal of Materials Science: Materials in Electronics 31 4129 (2020).11.Kalpna Rajput and Satish Vitta, “Effect of trivalent rare earth, Dy3+ substitution for Ba2+ on the low temperature magnetic and high temperature thermoelectric properties of type-I Clathrate, Ba8Al16Si30” ACS Applied Energy Materials 2, 6 4255 (2019).12.Strain-induced variation of bandgap in (111) In2O3 epitaxial films grown on c-sapphire substrates by a pulsed laser deposition technique”, S. K. Yadav, S.Arora, S. Dhar, Semicond. Sci. Technol. 36 (2021) 035011.13.“X- ray absorption study of defects in reactively sputtered GaN films displaying large variation of conductivity”, Md. Monish, C Nayak, D S Sutar, S N Jha, D Bhattacharyya,S S Major, Semicond. Sci. Technol. 36, 075019 (2021).14.“X-ray absorption study of defects in reactively sputtered GaN films displaying large variation of conductivity”, M. Monish, C. Nayak, D. S. Sutar, S. N. Jha, D. Bhattacharyya, S. S. Major,  Semicond. Sci. Technol., 36(2021), 075019.15.“A large area flexible p-type transparent conducting CuS ultrathin films generated at liquid-liquid interface”, S. S. Pathak, L. S. Panchakarla, Applied Materials Today, 24(2021), 101152.16.“Structural, electrical and luminescence properties of (0001) ZnO epitaxial layers grown on c-GaN/sapphire templates by pulsed laser deposition technique”, Simran, S.K. Yadav, S. Dhar, J. Appl. Phys., 131(2022), 015302.17.M. Mishra, R Saha, L. Tyagi, S. Sushama, S.K. panday, S. Chakrabarti, “Investigation of phosphorus-doping of MgZnO thin films using efficient spin-on dopant process”, Journal of luminescence, 257, 119748 (2023).18.M. Mishra, S Bhowmick, R Saha, SK Pandey, S Chakrabarti, “Temperature induced conductivity reversal in ZnO thin films”, Proc. SPIE 12422, Oxide-based Materials and Devices XIV, 124220S (2023).19.P. Mondal & S.S. Major, “Dependence of diode behaviour and photoresponse of Ga-doped  ZnO (GZO)/p-Si junction on the carrier concentration of GZO layer”, Micro and Nanostructure 185, 207719 (2024).20.M. Monish & S.S. Major, “Electrical transport in epitaxially grown undoped and Si-doped degenerate GaN films”, Phys. Scr. 99, 025982 (2024).21.M. Monish & S.S. Major, “Mg incorporation induced microstructural evolution of reactively sputtered GaN epitaxial films to Mg-doped GaN nanorods”, Nanotechnology 35, 225603 (2024)."}, {"Sr_no": "170", "Facility": "Virtual Production System", "Make": "SMC Corporation (India) Pvt. Ltd", "Model": "SMART VIRTUAL MACHINE LAB SETUP", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof  Makarand Kulkarni", "Facility_Manager": "", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "The Virtual Machine Lab system comprises a six-station setup that replicates a smart manufacturing line in a controlled, virtual environment. The system is designed to operate in both centralized and decentralized (individual) modes, offering flexibility for a wide range of research and training scenarios.Station 1 – Raw Material Feeding & Tracking: This is the entry point of the production line, where a robotic arm picks up raw cuboidal jobs from a feeder and places them onto a conveyor. This station also tracks and registers the job information using an RFID reader.Stations 2 to 6 – Virtual Machining Stations: These five stations function as configurable virtual machines. Each station includes:A robotic arm to automatically load and unload jobs from the conveyorA motor that simulates the machining or processing operation for a programmed durationAn RFID reader to read and verify job dataA real camera to perform quality inspection post-processing All stations are interconnected via a conveyor system that facilitates automated job movement. The entire system is controlled and monitored through a centralized Manufacturing Management HMI Application, which allows real-time tracking, production planning, and performance monitoring.", "Body": "", "Facility_Description": "The Virtual Machine Lab Set Up for Smart Manufacturing  provides a perfect platform to facilitate advance research, training, process analysis and understanding of the smart technologies. The system simulates a real industrial manufacturing environment on avirtual setup which includes leading Industry 4.0 technologies.", "Instruction_for_Sample_Preparation": "", "Applications": "The Virtual Machine Lab Setup serves as a versatile platform for a wide range of applications in the domains of manufacturing, education, and research. Some of the key applications include:1. Smart Manufacturing Research and Development    - Development and testing of Industry 4.0 technologies such as cyber-physical systems, digital twins, and intelligent control algorithms    - Evaluation of smart scheduling, predictive maintenance, and real-time quality control strategies  2. Simulation-Based Training and Education   - Hands-on training for students and professionals on automation, robotics, and intelligent production systems    - Visualization and understanding of complex manufacturing processes and the impact of digital technologies  3. Digital Twin and Cyber-Physical Integration    - Creation and validation of digital twin models for real-time data-driven decision-making    - Experimentation with IoT-enabled systems, data acquisition, and machine-level analytics  4. Production Planning and Optimization    - Testing of dynamic production planning, job sequencing, and buffer management algorithms    - Scenario-based analysis to optimize throughput, reduce lead times, and improve overall equipment effectiveness (OEE)  5. AI and Machine Learning Applications    - Implementation of AI/ML algorithms for fault detection, process optimization, and autonomous decision-making    - Data collection for training models in predictive quality, job classification, and adaptive control  6. Human-Machine Interface (HMI) and System Integration   - Development and evaluation of smart HMIs for real-time monitoring and control    - System-level integration of hardware and software components for seamless operations", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "171", "Facility": "WHITE LIGHT INTERFERROMETRY", "Make": "Bruker Contour", "Model": "", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Ramesh Singh", "Facility_Manager": "Arun Nair", "Facility_Operator": "Arun Nair", "Department": "Mechanical Engineering", "Features_Working_Principle": "White light interferometry is a high-resolution, non-contact technique used to measure surface profiles by analyzing the interference patterns produced when white light interacts with a sample surface. A broad spectrum of light is split into two beams, one reflected from the surface and the other from a reference mirror. The interference between these beams depends on the optical path difference, which is influenced by the height variations of the surface. Due to the short coherence length of white light, clear interference fringes only appear for small height differences, allowing precise measurements of surface features. This technique is widely used for 3D surface profiling, step height measurements, and surface roughness analysis.", "Body": "Max. Scan Range ≤10 mm Vertical Resolution", "Facility_Description": "Bruker Contour X200Accurate surface topographySub-nanometer vertical resolution2D & 3D non contact surface Metrology", "Instruction_for_Sample_Preparation": "Samples not allowed - Fluid, Transparent and Highly reflective.Fixture - Need to get one's own fixture if you have an intricate sample.Step Height - Step height if any must be less than 2mm. Avoid 90 -degree step height.Sample Size - Max (150mm x 150mm x 100mm)Sample Weight - less than 500g", "Applications": "Precision EngineeringMEMS and SensorsOrthopedics/OphthalmicsTribologySemiconductorsOptics", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "172", "Facility": "X-Ray Diffractometer Facility at Chemical Engineering", "Make": "Rigaku", "Model": "Rigaku SmartlabSE", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-ray Diffraction", "Available_Equipment_Mode_of_use": "Bragg -Brentano optics (Conventional divergent beam), High-temperature stage", "Facility_In_Charge": "Prof. Arindam Sarkar", "Facility_Manager": "", "Facility_Operator": "Mr. Akash S Shinde,  Ms. Prachi Janjani", "Department": "Chemical Engineering", "Features_Working_Principle": "The X-Ray Diffraction System SmartLab SE includes the SmartLab SE Goniometer with a scanning radius of 300 mm (diameter 600 mm) and a 3 kW sealed ceramic Cu X-ray tube. The maximum tube voltage is 60 kV, and the maximum tube current is 60 mA. The DTex 250 sensor is a semiconductor strip sensor with an active area of 384 mm² (19.2 x 20 mm). The system features an automatic slit exchanger with alignment and control, along with automatic systematic error correction. The solar slits are available in 2.5 degrees and 5 degrees for the incident and diffracted beams, respectively, and are easily interchangeable. Additionally, the system includes a Ni filter. The minimum step angle is 0.0001 degrees, and the scanning angle range is -10 to +160 degrees in 2 theta.The enclosed cabinet has doors designed for easy access and adheres to regulations for X-ray, electrical, and mechanical safety. Additionally, the system includes Data Collector software, which provides functionalities such as data acquisition in an appropriate format, tools for determining measurement strategies, configuration and measurement management, automatic processing, and data conversion and viewing capabilities for X-ray diffraction systems.The High-Temperature Attachment (HT-XRD) can operate from ambient temperature up to 1500°C in air, up to 1450°C in a vacuum, and up to 1300°C in an inert gas. It is equipped with a JIS Type (2) thermocouple. The sample size is 13.5 x 25 x 0.5 mm. The HT-XRD attachment can only run once in a day.", "Body": "For powdered samples: Bragg -Brentano optics (Conventional divergent beam)High-temperature stage - Sample heating stages capable of heating from ambient to 1500C in inert or vacuum with suitable software to collect XRD scans at intermittent temperature. (OPERATIONAL)Electrochemical stage - An electrochemical stage with electrical feedthrough through the X-ray chamber and potentiostat for in-situ analysis for aqueous electrochemistry applications only.", "Facility_Description": "X-ray diffraction has long been the primary tool for identifying phases and determining the structures of mostly crystalline inorganic materials. It remains the most crucial material characterization technique today. With the advent of nanomaterials, XRD has been extended to measure particle size, orientation, lattice distortions, and more. Typically, XRD is the first characterization method used after synthesis to verify if the desired material has been obtained.Make and ModelRigaku SmartlabSEThe present model is also equipped with two stages:High-temperature stage - The High-Temperature Attachment (HT-XRD) can operate from ambient temperature up to 1500°C in air, up to 1450°C in a vacuum, and up to 1300°C in an inert gas.   (OPERATIONAL)Electrochemical stage - An electrochemical stage with electrical feedthrough through the X-ray chamber and potentiostat for in-situ analysis for aqueous electrochemistry applications only. (NOT YET OPERATIONAL).", "Instruction_for_Sample_Preparation": "For powdered samples: kindly submit completely dried and powdered non hazardous samples only. For thin/thick films: the sample dimensions should not be more than 1cm x 1cm.", "Applications": "Identification of unknown crystalline materialsCharacterization of crystalline materialsDetermination of crystal structures", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "173", "Facility": "X-ray Diffractometer Facility at DESE", "Make": "Rigaku", "Model": "Smartlab", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-ray Diffraction", "Available_Equipment_Mode_of_use": "Powder XRD Thin film XRD and GIXRD High temperature XRD X-ray reflectivity", "Facility_In_Charge": "Prof. Sagar Mitra", "Facility_Manager": "", "Facility_Operator": "Ankita Gurung  (30006861@iitb.ac.in)", "Department": "Energy Science and Engineering", "Features_Working_Principle": "X-Ray reflectivity measurementIn-situ electrochemical measurements (yet to be functional)In-situ high temperature XRD measurement (yet to be functionslX-ray diffraction (XRD) is an instrumental technique to study crystalline materials. An X-ray beam is focused on the planes of the atoms forming the crystal lattice of the material under study. Of the incident beam, a part is transmitted, a part is absorbed, a part is refracted and scattered while the remaining part is diffracted. On diffraction of the x-ray beam from the sample, the distances between the planes of the atoms constituting the sample can be obtained by applying the Bragg's law. Bragg's law is given as nλ=2d sinθ, where n is the order of the diffracted beam, λ is the wavelength of the incident x-ray, d is the distance between adjacent planes of atoms and θ is the angle of incidence of the x-ray. With known values of λ and θ the d-spacings of the atoms in the sample can be calculated. The characteristic set of d-spacings and theirs intensity generated in a typical X-ray scan provides a unique \"fingerprint\" of the phases present in the sample. On proper interpretation with comparison with standard references available, the sample material can be identified from the respective \"fingerprints\" obtained.", "Body": "X-Ray reflectivity measurementIn-situ electrochemical measurementsIn-situ high temperature XRD measurementMaximum rated output:                                   3 kWRated tube voltage-current:                            20-60 kV; 2-60 mATarget:                                                             CuFocus Size:                                                     0.4 X 12 mm line/pointRadiation enclosure:                                       Full safety shielding with failsafe open/close mechanismScanning mode:                                              θ-2θ scan, 2θ scanOptics:                                                             Incidenceoptics:                                                              CBO Receiving optics:                                             Automatic variable scattering slit PSADetector:                                                         Scintillator NaI, Dtex", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Please follow the sample preparation methods below, according to the nature of your analysis.For Powder XRDFinely grained powders should be submitted. Powder samples having a minimum weight of 0.01g can be analyzed.For Thin Film XRD and GIXRDSample size should be minimum 5mm X 5mm.For High temperature XRD The powder samples should be mixed with a volatile solvent so as to form slurry. The slurry will then be drop casted on the sample holder.For XRRThin films should be deposited on Si substrates.", "Applications": "Identification of unknown crystalline materialsCharacterization of crystalline materialsDetermination of crystal structures using Rietveld refinementThin film characterizationDetermining thickness, roughness and density of thin films", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "174", "Facility": "X-ray Diffractometer Facility at MEMS", "Make": "Empyrean", "Model": "Empyrean", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-ray Diffraction", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Abhijeet L. Sangle", "Facility_Manager": "Mr. Hitesh Thakur", "Facility_Operator": "", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "X-ray Diffraction is the result of constructive interference between x rays and a crystalline sample.The wavelength of the x-rays used is of the same order of magnitude of the distance between the atoms in a crystalline lattice.This gives rise to a diffraction pattern that can be analysed by applying the Bragg’s Law (nλ=2dsinθ)which is used in the measurement of crystal and their phases.", "Body": "X-ray tube: Cu; long fine focus; spinner stagePixcel 1D detector with prefix interfaceX’pert highscore plus; reflectivity software; easysaxs software", "Facility_Description": "x- ray Diffraction(XRD ) is a versatile non -destructive analytical technique used to analyze physical properties such as phase composition , crystal  stucture and orientation of powder solid samples.    Phase identication can be performed by comparing x-ray diffraction patterns obtained from unkmown samples to patterns in reference database.", "Instruction_for_Sample_Preparation": "Please follow the sample preparation methods below, according to the nature of your analysis.For Powder XRDSamples should be submitted in the form of fine powder (preferably less than 10 μm) to completely fill the rectangular cavity of the sample holder of dimension of 0.6 cm3.i.e. l = 2 cm, b = 1.5cm, h = 0.2 cm.For Pallet Samples, the sample should have diameter of 2 cm and height 1 cm (maximum).For Thin Film XRD and GIXRDSample size should be minimum 5 cm ´ 2.5 cm.For SAXSDetails will be provided upon consultation.", "Applications": "Phase Identification of unknown crystalline materials.Characterization of crystalline materials.Determination of crystal structures using Rietveld refinement.Thin film characterization.SAXS method is useful for the structural characterization of nanomaterials. The samples may be solid objects, powders, gels or liquid dispersions, and they may be amorphous, crystalline or semi-crystalline.Complete Functional system for Phase Analysis & Crystallography.Thin film attachment (GIXRD) & reflectivity measurements.Small angle and wide angle X-ray scattering (SAXS/WAXS) measurements & accessories for solids, composites as well as powder as per technical specifications.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "(1) Jayant K. Dewangan,a Nandita Basub and Mithun Chowdhury *a Cationic surfactant-directed structural control of NaCl crystals from evaporating sessile Droplets. https://pubs.rsc.org/en/content/articlelanding/2022/sm/d1sm01357b(2) Kartikay, P., Sadhukhan, D., Yella, A., & Mallick, S. (2021). Enhanced charge transport in low temperature carbon-based nip perovskite solar cells with NiOx-CNT hole transport material. Solar Energy Materials and Solar Cells, 230, 111241.https://doi.org/10.1016/j.solmat.2021.111241(3). R. Biswas, S. Vitta, T. Dasgupta, Influence of zinc content and grain size on enhanced thermoelectric performance of optimally doped ZnSb, Mater. Res. Bull. 149 (2022) 111702. https://doi.org/10.1016/j.materresbull.2021.111702.(4). R. Biswas, V. Srihari, S. Vitta, T. Dasgupta, Vacancy induced anomalies in the electrical transport properties of Ag-doped Zn1-xCdxSb (x=0.375) solid solutions, Appl. Phys. Lett. 120 (2022) 032102. https://doi.org/10.1063/5.0077175.(5)Laxmi, Dinesh Kabra, Origin of Contrasting Emission Spectrum of Bromide versus Iodide Layered Perovskite Semiconductors https://doi.org/10.1021/acs.jpclett.2c00362"}, {"Sr_no": "175", "Facility": "X-ray Photoelectron spectroscopy facility", "Make": "Kratos Analytical", "Model": "Axis Supra+", "Date_of_Installation": "24 March, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-Ray Photoelectron Spectroscopy", "Available_Equipment_Mode_of_use": "XPS  Angle resolved XPS  Depth profile XPS", "Facility_In_Charge": "Prof. Chandramouli Subramaniam", "Facility_Manager": "", "Facility_Operator": "Ms. Smita Sahu", "Department": "Chemistry", "Features_Working_Principle": "Electron spectroscopy for chemical analysis (ESCA) instrument comprises of X-ray photoelectronspectroscopy (XPS). The surface to be analyzed is placed in a vacuum environment and then irradiated with photons (X-ray orUltra-violet). The incident photons release electrons (called photoelectrons) from their electronic structure(core-levels and valence band) and ionize the atoms. The kinetic energy and the number ofphotoelectrons are precisely measured and counted respectively using an analyzer-detector based onwhich the binding energy and the intensity of the photoelectron are determined.Limitations: ESCA can detect all the elements except H and He. The detection limit is 0.1%Reference Books:1. An Introduction to Surface Analysis by XPS & AES, John F. Watts & John Wolstenholme, Wiley2003.2. Surface Analysis – The Principle Techniques, Edited by John Vickerman & Ian Gilmore, Wiley2009.", "Body": "Two chamber ultra high vacuum system: Analysis chamber (< 2.0 x 10-9 Torr) and Sample load-lock chamber (< 5.0 x 10-8 Torr).Automated sample transfer mechanism and five-axis sample manipulator.XPS Source : Monochromatic (AlK alpha) x-ray source: 1486.6 ev ; (Ag L alpha) x-ray source: 2984.3 evAngle resolved XPSElectron energy analyser and detector: Concentric hemispherical analyzer (CHA) for spectroscopy, and Spherical mirror analyzer for parallel imaging. Multichannel plates stack with delay-line detector for counting. Spectroscopy, snapshot and imaging modes with option of large area and small area analysis.Differentially pumped ion gun: High performance gun for precision depth profiling, Energy range 500 eV to 4 keV for sample etching (cleaning) and depth profiling.Charge neutralizer: For non-conducting samplesSoftware system: Windows based software (ESCApe) for automated sample transfer, data acquisition and data processing. Site license for data processing.Capabilities: Under ideal sample preparation conditions the following can be achievedXPS: energy resolution is ~0.5 eV, & 0.7 eV in case of non-conducting samples", "Facility_Description": "Electron spectroscopy for chemical analysis instrument is used for characterisation of surfaces and interfaces. It can provide great deal of information such as elemental composition, chemical state composition of elements present, spatial distribution of elements and their chemical state, composition as a function of depth, Central Surface Analytical Facility thickness of thin films etc.", "Instruction_for_Sample_Preparation": "Maximum size of samples should be (5 x 5x 3) mm. Smaller samples of the size 3 mm x 3 mm or 3 mm diameter are more suitable. Bigger or smaller samples than the size mentioned here may be possible and user is required to check with lab staff.1)  Label the samples only on the containers. Sample labels/codes should be brief (less than three letters/numbers) for example AB1, 12c.2) Keep the samples clean. Try not to touch the surface of your sample with anything (fingers, gloves, breath etc.)3)The sample should be completely dry and it should be stable in ultra high vacuum (no out-gassing allowed).3) Powders should be made into pellet or form a thin coating on a clean conducting substrate like silicon, aluminum or copper foil. Pressing powder in to indium foil is also another method.User should clearly mention if the sample needs etching (surface cleaning) before recording the data. It may be noted that the etching may alter the chemical composition and chemical state to some extent.4) Samples containing organic molecules /polymers and some high vapour pressure elements such as Na, K, S, P, Zn, Se, As, I, Te or Hg are not suitable for depth profile analysis.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}]</script>

                Applications: 'Applications', Chemical_allowed: 'Chemicals allowed (If Any)', Gases_allowed: 'Gases allowed (If Any)',
                SOP: 'SOP document', 'Training and Other Policy Documents': 'Training / policy documents',
                'Other Related Details Regarding Instrument': 'Other details', Publications: 'Publications (Top five)'
            };

            // Exact Google Sheet column headers — must match your Sheet precisely.
            // This is intentionally separate from FIELD_LABELS (the on-screen wording),
            // since that gets customized for readability and no longer matches headers 1:1.
            const SHEET_HEADERS = {
                Make: 'Make',
                Model: 'Model',
                Date_of_Installation: 'Date of installation',
                Facility_Management_Division: 'Managed by (division)',
                Available_Equipment_Mode_of_use: 'Available equipment / mode of use',
                Facility_In_Charge: 'Facility in-charge',
                Facility_Manager: 'Facility manager',
                Facility_Operator: 'Facility operator',
                Features_Working_Principle: 'Features & working principle',
                Body: 'Specifications',
                Facility_Description: 'Description',
                Instruction_for_Sample_Preparation: 'Sample preparation',
                Applications: 'Applications',
                Chemical_allowed: 'Chemicals allowed',
                Gases_allowed: 'Gases allowed',
                SOP: 'SOP document',
                'Training and Other Policy Documents': 'Training / policy documents',
                'Other Related Details Regarding Instrument': 'Other details',
                Publications: 'Publications'
            };
            const LONG_FIELDS = new Set(['Features_Working_Principle', 'Body', 'Facility_Description',
                'Instruction_for_Sample_Preparation', 'Applications']);


            function isEmpty(v) { return !v || !String(v).trim(); }

            document.getElementById('headerCount').textContent = RAW.length + ' entries in the register';

            // ---------- tabs ----------
            const tabBar = document.getElementById('tabBar');
            function activateTab(tabName) {
                tabBar.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById('view-' + tabName).classList.add('active');
                if (tabName === 'dash') loadDashboard();
            }
            tabBar.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;
                activateTab(btn.dataset.tab);
            });

            // ---------- admin gate ----------
            // Change this to your own secret code. Only someone opening the page with
            // ?admin=YOUR_CODE in the URL will see the Progress & export tab.
            const ADMIN_CODE = "20004114";
            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get('admin') === ADMIN_CODE;
            if (isAdmin) {
                const dashBtn = document.createElement('button');
                dashBtn.className = 'tab-btn';
                dashBtn.dataset.tab = 'dash';
                dashBtn.textContent = 'Progress & export';
                tabBar.appendChild(dashBtn);
            }

            // ---------- backend config ----------
            // Paste the URL you get after deploying the Google Apps Script web app (see setup instructions).
            const API_URL = "https://script.google.com/macros/s/AKfycbwVY5y3JbRtBpDxIkO2GPvg3SuOl5j9gnUQc2Bxctwk7Hw7q5XAIF7G5OxlpFg4qjWDdA/exec";


            const LABEL_TO_FIELD = {};
            FIELD_ORDER.forEach(f => { LABEL_TO_FIELD[FIELD_LABELS[f] || f] = f; });

            let SUBMISSIONS = {};   // keyed by Sr_no (string)
            let dataReady = false;

            async function refreshSubmissions() {
                try {
                    const res = await fetch(API_URL, { method: 'GET' });
                    const rows = await res.json();
                    const next = {};
                    rows.forEach(row => {
                        const srNo = String(row['Sr No']);
                        const fields = {};
                        FIELD_ORDER.forEach(f => {
                            const label = SHEET_HEADERS[f] || f;
                            if (row[label] !== undefined && row[label] !== null && String(row[label]).trim() !== '') fields[f] = row[label];
                        });
                        next[srNo] = { fields, filledBy: row['Last Filled By'] || '', updatedAt: row['Last Updated'] || '' };
                    });
                    SUBMISSIONS = next;
                    return true;
                } catch (e) {
                    console.error('Could not load submissions', e);
                    return false;
                }
            }

            // async function saveSubmission(srNo, facility, data) {
            //     const payload = { srNo: srNo, facility: facility, fields: data.fields, filledBy: data.filledBy, updatedAt: data.updatedAt };
            //     const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            //     const result = await res.json();
            //     if (!result || result.status !== 'ok') throw new Error('save failed');
            //     SUBMISSIONS[String(srNo)] = { fields: data.fields, filledBy: data.filledBy, updatedAt: data.updatedAt };
            // }

            async function saveSubmission(srNo, facility, data) {
                const labeledFields = {};
                Object.keys(data.fields).forEach(f => {
                    const header = SHEET_HEADERS[f] || f;
                    labeledFields[header] = data.fields[f];
                });
                const payload = { srNo: srNo, facility: facility, fields: labeledFields, filledBy: data.filledBy, updatedAt: data.updatedAt };
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (!result || result.status !== 'ok') throw new Error('save failed');
                SUBMISSIONS[String(srNo)] = { fields: data.fields, filledBy: data.filledBy, updatedAt: data.updatedAt };
            }

            // ---------- search ----------
            const searchInput = document.getElementById('searchInput');
            const resultsList = document.getElementById('resultsList');
            const searchPanel = document.getElementById('search-panel');
            const detailPanel = document.getElementById('detail-panel');

            function missingCountFor(rec) {
                const sub = SUBMISSIONS[String(rec.Sr_no)];
                let n = 0;
                FIELD_ORDER.forEach(f => {
                    const val = (sub && !isEmpty(sub.fields[f])) ? sub.fields[f] : rec[f];
                    if (isEmpty(val)) n++;
                });
                return n;
            }

            function renderResults(query) {
                const q = query.trim().toLowerCase();
                let matches = RAW;
                if (q) {
                    matches = RAW.filter(r => {
                        return (r.Facility || '').toLowerCase().includes(q) ||
                            (r.Category || '').toLowerCase().includes(q) ||
                            (r.Department || '').toLowerCase().includes(q) ||
                            (r.Make || '').toLowerCase().includes(q);
                    });
                }
                const resultsCount = document.getElementById('resultsCount');
                resultsList.innerHTML = '';
                if (matches.length === 0) {
                    resultsCount.textContent = '';
                    resultsList.innerHTML = '<div class="no-results">No instruments match that search. Try a different word.</div>';
                    return;
                }
                resultsCount.textContent = q ? `${matches.length} match${matches.length === 1 ? '' : 'es'}` : `Showing all ${matches.length} instruments`;
                matches.forEach(rec => {
                    const row = document.createElement('button');
                    row.className = 'result-row';
                    const miss = missingCountFor(rec);
                    row.innerHTML = `
        <span class="result-tag">#${rec.Sr_no}</span>
        <span class="result-name">${escapeHtml(rec.Facility)}</span>
        <span class="result-meta">${escapeHtml(rec.Category || '')}</span>
        <span class="result-status ${miss === 0 ? 'status-complete' : 'status-pending'}">${miss === 0 ? 'complete' : miss + ' missing'}</span>
      `;
                    row.addEventListener('click', () => openDetail(rec.Sr_no));
                    resultsList.appendChild(row);
                });
            }
            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }
            searchInput.addEventListener('input', () => renderResults(searchInput.value));
            resultsList.innerHTML = '<div class="loading">Loading register…</div>';
            (async () => {
                await refreshSubmissions();
                dataReady = true;
                renderResults('');
            })();

            // ---------- detail view ----------
            async function openDetail(srNo) {
                const rec = RAW.find(r => String(r.Sr_no) === String(srNo));
                if (!rec) return;
                searchPanel.style.display = 'none';
                detailPanel.style.display = 'block';
                detailPanel.innerHTML = '<div class="loading">Loading record…</div>';

                const submission = SUBMISSIONS[String(srNo)] || { fields: {}, filledBy: '', updatedAt: '' };

                // Current value = whatever's in the Sheet (if someone already edited it there),
                // otherwise fall back to the original baked-in data.
                function currentValue(f) {
                    const fromSheet = submission.fields[f];
                    if (!isEmpty(fromSheet)) return fromSheet;
                    return rec[f] || '';
                }

                let missingTotal = 0;
                FIELD_ORDER.forEach(f => { if (isEmpty(currentValue(f))) missingTotal++; });

                let fieldsHtml = '';
                FIELD_ORDER.forEach(f => {
                    const label = FIELD_LABELS[f] || f;
                    const val = currentValue(f);
                    const empty = isEmpty(val);

                    if (NON_EDITABLE_FIELDS.has(f)) {
                        // Read-only display — no textarea, no "required" pill
                        fieldsHtml += `<div class="field" data-field="${f}" data-readonly="true">
        <div class="field-label"><span class="label-text">${label}</span></div>
        <div class="field-value">${escapeHtml(val) || '<em style="color:var(--ink-soft);">Not provided</em>'}</div>
      </div>`;
                    } else {
                        fieldsHtml += `<div class="field${empty ? ' missing' : ''}" data-field="${f}">
        <div class="field-label">
          <span class="label-text">${label}</span>
          <span class="status-pill">${empty ? 'needs input' : '✓ filled'}</span>
        </div>
        <textarea placeholder="Add ${label.toLowerCase()}…" rows="${LONG_FIELDS.has(f) ? 5 : 2}">${escapeHtml(val)}</textarea>
      </div>`;
                    }
                });
                detailPanel.innerHTML = `
      <button class="back-btn" id="backBtn">&larr; Back to search</button>
      <div class="card">
        <div class="card-tab"><span class="no">No. ${rec.Sr_no}</span></div>
        <div class="card-body">
          <h2>${escapeHtml(rec.Facility)}</h2>
          <div class="card-meta"><span>${escapeHtml(rec.Category || '')}</span><span>${escapeHtml(rec.Department || '')}</span></div>
          <div class="search-hint">All fields below are editable. Correct anything that's wrong, and fill in anything that's empty — every field is required before you can submit.</div>
          ${missingTotal === 0 ? '<div class="complete-banner">This record already has every field filled — feel free to review and correct anything before re-submitting.</div>' : ''}
          <div class="name-field">
            <label>Your name (so we know who to thank / ask follow-up questions)</label>
            <input type="text" id="filledByInput" value="${escapeHtml(submission.filledBy || '')}" placeholder="e.g. Dr. A. Sharma">
          </div>
          <div class="field-grid" id="fieldGrid">${fieldsHtml}</div>
          <div class="submit-bar">
            <button class="submit-btn" id="submitBtn">Save</button>
            <span class="save-msg" id="saveMsg"></span>
          </div>
        </div>
      </div>
    `;

                document.getElementById('backBtn').addEventListener('click', () => {
                    detailPanel.style.display = 'none';
                    searchPanel.style.display = 'block';
                    renderResults(searchInput.value);
                });

                // Live-update the "missing" highlight as the user types/clears a field,
                // and auto-grow each textarea to fit its content (so prefilled long text
                // like Specifications/Description isn't cramped into a tiny scroll box).
                function autoGrow(ta) {
                    ta.style.height = 'auto';
                    ta.style.height = ta.scrollHeight + 'px';
                }
                detailPanel.querySelectorAll('.field[data-field] textarea').forEach(ta => {
                    autoGrow(ta);
                    ta.addEventListener('input', () => {
                        const field = ta.closest('.field');
                        field.classList.toggle('missing', ta.value.trim() === '');
                        autoGrow(ta);
                    });
                });

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.addEventListener('click', async () => {
                    const saveMsg = document.getElementById('saveMsg');
                    const filledBy = document.getElementById('filledByInput').value.trim();
                    const updated = {};
                    const emptyLabels = [];
                    // detailPanel.querySelectorAll('.field[data-field]').forEach(el => {
                    //     const f = el.dataset.field;
                    //     const ta = el.querySelector('textarea');
                    //     const val = ta.value.trim();
                    //     updated[f] = val;
                    //     if (!val) {
                    //         emptyLabels.push(FIELD_LABELS[f] || f);
                    //         el.classList.add('missing');
                    //     } else {
                    //         el.classList.remove('missing');
                    //     }
                    // });

                    detailPanel.querySelectorAll('.field[data-field]').forEach(el => {
                        const f = el.dataset.field;
                        if (el.dataset.readonly === 'true') {
                            // Not user-editable — just carry through its current value unchanged.
                            updated[f] = currentValue(f);
                            return;
                        }
                        const ta = el.querySelector('textarea');
                        const val = ta.value.trim();
                        updated[f] = val;
                        if (!val) {
                            emptyLabels.push(FIELD_LABELS[f] || f);
                            el.classList.add('missing');
                        } else {
                            el.classList.remove('missing');
                        }
                    });

                    if (emptyLabels.length > 0) {
                        saveMsg.textContent = `Please fill in: ${emptyLabels.slice(0, 3).join(', ')}${emptyLabels.length > 3 ? ` (+${emptyLabels.length - 3} more)` : ''}`;
                        saveMsg.classList.add('error');
                        return;
                    }

                    submitBtn.disabled = true;
                    saveMsg.textContent = 'Saving…';
                    saveMsg.classList.remove('error');
                    try {
                        const updatedAt = new Date().toISOString();
                        await saveSubmission(srNo, rec.Facility, { fields: updated, filledBy: filledBy, updatedAt: updatedAt });
                        saveMsg.textContent = 'Saved. Thank you!';
                        setTimeout(() => openDetail(srNo), 700);
                    } catch (e) {
                        saveMsg.textContent = 'Could not save — please try again.';
                        saveMsg.classList.add('error');
                        submitBtn.disabled = false;
                    }
                });
            }

            // ---------- dashboard ----------
            async function loadDashboard() {
                const el = document.getElementById('dash-content');
                el.innerHTML = '<div class="loading">Loading submissions…</div>';
                await refreshSubmissions();
                const subs = SUBMISSIONS;

                let complete = 0, missingFieldsTotal = 0;
                const rows = RAW.map(rec => {
                    const sub = subs[String(rec.Sr_no)] || { fields: {} };
                    let miss = 0;
                    FIELD_ORDER.forEach(f => {
                        if (isEmpty(rec[f]) && isEmpty(sub.fields[f])) miss++;
                    });
                    if (miss === 0) complete++;
                    missingFieldsTotal += miss;
                    return { rec, sub, miss };
                });
                rows.sort((a, b) => b.miss - a.miss);

                let rowsHtml = rows.map(r => `
      <tr data-srno="${r.rec.Sr_no}">
        <td style="font-family:'IBM Plex Mono',monospace;">${r.rec.Sr_no}</td>
        <td>${escapeHtml(r.rec.Facility)}</td>
        <td>${r.miss === 0 ? '<span class="result-status status-complete">complete</span>' : '<span class="result-status status-pending">' + r.miss + ' missing</span>'}</td>
      </tr>
    `).join('');

                el.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="num">${RAW.length}</div><div class="lbl">Total instruments</div></div>
        <div class="stat"><div class="num">${complete}</div><div class="lbl">Fully complete</div></div>
        <div class="stat"><div class="num">${missingFieldsTotal}</div><div class="lbl">Fields still missing</div></div>
      </div>
      <button class="dl-btn" id="downloadBtn">Download final data (.csv — opens directly in Excel)</button>
      <div class="dash-note">This always reflects the latest submissions — download it any time to get a fresh copy.</div>
      <table class="dash-table">
        <thead><tr><th>No.</th><th>Facility</th><th>Status</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;

                el.querySelectorAll('tr[data-srno]').forEach(tr => {
                    tr.addEventListener('click', () => {
                        activateTab('find');
                        openDetail(tr.dataset.srno);
                    });
                });

                document.getElementById('downloadBtn').addEventListener('click', () => {
                    exportCSV(rows);
                });
            }

            function csvEscape(v) {
                const s = (v === undefined || v === null) ? '' : String(v);
                if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
                return s;
            }

            function exportCSV(rows) {
                const headers = ['Sr No', 'Facility', ...FIELD_ORDER.map(f => FIELD_LABELS[f] || f), 'Last Filled By', 'Last Updated'];
                const sorted = rows.slice().sort((a, b) => (Number(a.rec.Sr_no) || 0) - (Number(b.rec.Sr_no) || 0));
                const lines = [headers.map(csvEscape).join(',')];
                sorted.forEach(r => {
                    const rowArr = [r.rec.Sr_no, r.rec.Facility];
                    FIELD_ORDER.forEach(f => {
                        const val = !isEmpty(r.rec[f]) ? r.rec[f] : (r.sub.fields && r.sub.fields[f]) || '';
                        rowArr.push(val);
                    });
                    rowArr.push(r.sub.filledBy || '');
                    rowArr.push(r.sub.updatedAt || '');
                    lines.push(rowArr.map(csvEscape).join(','));
                });
                const csvContent = '\uFEFF' + lines.join('\r\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ASC_Instrument_Register_Complete.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }


        })();
    </script>
</body>

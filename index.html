elium dewar) for storage and transfer.", "Body": "Some technical specifications:  14 litres per hour in pure gas mode30-40 litres per hour with liquid nitrogen pre-cooling", "Facility_Description": "", "Instruction_for_Sample_Preparation": "--", "Applications": "The liquid helium produced can be used for cooling purposes down to 2K for doing various experiments at low temperatures. Liquid helium can also be used for cooling superconducting magnets such as the ones used in NMR machines, MRI machines, etc.", "Chemical_allowed": "--", "Gases_allowed": "--", "SOP": "", "Training and Other Policy Documents": "Cryogenic Safety.pdf\n  (436.86 KB)\n, Cryogenic_saftey training ppt_IITB_0.pdf\n  (1.27 MB)", "Other Related Details Regarding Instrument": "", "Publications": "--"}, {"Sr_no": "84", "Facility": "Liquid Helium Plant, ME Department", "Make": "Air Liquide Advanced Technologies, France", "Model": "Helial SL", "Date_of_Installation": "15 April, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "LHe to be provided to users in LHe cryogenic dewar", "Facility_In_Charge": "Prof. Dipanshu Bansal, dipanshu@iitb.ac.in, 022-25767508", "Facility_Manager": "NA", "Facility_Operator": "Praveen Topagi, Email: praveentopagi@iitb.ac.in, 8850964561, Prabhakara S, Email: prabhakaras@iitb.ac.in , 9742311564", "Department": "Mechanical Engineering", "Features_Working_Principle": "The process gas (Helium) is compressed and undergoes isentropic expansion via Turbines until the Helium temperature falls below the inversion temperature. Then, isenthalpic expansion in the Joule-Thomson device and helium gas is liquefied, stored in a dewar at slightly above atmospheric pressure.Main parts of the helium plant Recirculation compressorOil Removal SystemBuffer VesselCold BoxDewarRecovery gas bagRecovery compressor", "Body": "NA", "Facility_Description": "Liquefaction of Helium gas", "Instruction_for_Sample_Preparation": "New Guidelines for users to collecting LHESubmit a request through the Drona portal: Click Here!The LHE facility operator will assign the applicable charges based on the requested quantity. The assigned charges will go to the respective Guide/Faculty via email or the Drona portal. The Guide/Faculty must approve the assigned charges/funds. After approval, the LHE facility operator will provide the slot for the user to collect LHE. The collection slot, The user will receive the slot by email. On the scheduled slot, the user must bring their LHE container to collect LHE.", "Applications": "NMR, MRI Cooling, Superconducting magnets Low-temperature superconductors Material Property testing at Low temperature Dilution Refrigeration PPMS and MPMS Cryopreservation of cells and microbes.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "Cryogenic_saftey training ppt_IITB.pdf\n  (1.27 MB)", "Publications": ""}, {"Sr_no": "85", "Facility": "Liquid Nitrogen Plant:  50 LPH and 100LPH at Mechanical Engineering", "Make": "Stirling Cryogenics, Netherlands", "Model": "StirLIN-4 & StirLIN-8", "Date_of_Installation": "1 January, 2009", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "LN2 to be provided to users in LN2 cryogenic dewar", "Facility_In_Charge": "Prof. Dipanshu Bansal, Email : dipanshu@iitb.ac.in, Contact: +91-22-2576-7508 ,", "Facility_Manager": "NA", "Facility_Operator": "Prabhakara S, Email: prabhakaras@iitb.ac.in, 9742311564, Praveen Topagi, Email: praveentopagi@iitb.ac.in, 8850964561", "Department": "Mechanical Engineering", "Features_Working_Principle": "Features :LN2 Plant – (StirLIN-4) Production Capacity 50LPH, Refrigeration capacity 4.4 kW@65K Chiller Cooling capacity:48 kW Cryogenerator Motor power: 45 kW Working gas: Helium, Filling pressure 22 barg@50Hz Liquid nitrogen purity >99% Air Compressor type: Screw, Compressor Motor power 25kWMax Working pressure of air compressor 12 barg LN2 Plant – (StirLIN-8) Production Capacity 100LPH, Refrigeration Capacity 8.8kW@65KChiller Cooling capacity: 108 kW  Cryogenerator motor power: 90 kW  Working gas Helium Filling pressure 22 barg@50Hz Liquid nitrogen purity >99% Air compressor Compressor type: Screw, Motor power 45kWMax Working pressure of Air compressor 12 bargWorking principle: Liquid Nitrogen plant :The Stirling Liquid Nitrogen plant is used to produce liquid nitrogen. The nitrogen is separated from compressed ambient air (consisting of 78 % nitrogen) using the Pressure Swing Adsorption (PSA) process. Then the nitrogen gas is liquefied using the cooling effect produced by the cryogenerator. Subsequently, the liquid nitrogen is stored as liquid in a storage container under positive pressure.Main parts of the Nitrogen plant Air compressorAir vesselDryerPressure Swing Adsorption systemNitrogen VesselCryogeneratorDewar", "Body": "NA", "Facility_Description": "Liquefaction of Nitrogen gas", "Instruction_for_Sample_Preparation": "Users need to bring LN2 cryogenic dewar", "Applications": "Cryopreservation of cells and microbes. Liquid Helium plant for pre-cooling NMR to prevent heat leaks High-temperature superconductors Material Property testing at Low temperature etc.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Performance evaluation of sintered and stacked mesh regenerator for Stirling cycle based LN2 plant. Praveen Topagi, S. Prabhakara, M. D. Atrey, S. L. Bapat. NSCS-28, IIT Kharagpur 2022Case study of sintered regenerator performance in StirLIN-4 nitrogen liquefier. Praveen Topagi, S. Prabhakara, S. L. Bapat, M.D. Atrey. NSCS-27, IIT Bombay, 2019"}, {"Sr_no": "86", "Facility": "Liquid Nitrogen Plant: 10 LPH", "Make": "Stirling Cryogenics, Netherlands", "Model": "StirLIN-1 Compact", "Date_of_Installation": "9 July, 2007", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "LN2 to be provided to users in LN2 Cryogenic Dewar", "Facility_In_Charge": "Head CSIF/SAIF, head.csif@iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Asifali Ansari, asifali@iitb.ac.in, 022 2159 6890", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "The Stirling Liquid Nitrogen plant is used to produce liquid nitrogen. The nitrogen is separated from compressed ambient air (consisting of 78 % nitrogen) using the Pressure Swing Adsorption (PSA) process. Then the nitrogen gas is liquefied using the cooling effect produced by the cryogenerator. Subsequently, the liquid nitrogen is stored as liquid in a storage container under positive pressure.Main parts of the Nitrogen plant Air compressorAir vesselDryerPressure Swing Adsorption systemNitrogen VesselCryogeneratorDewar", "Body": "LN2 Plant – (StirLIN - 1) Production Capacity 10LPH, Refrigeration capacity 4.4 kW@65K Chiller Cooling capacity: 12 kW Cryo - generator Motor power: 11 kW Working gas: Helium, Filling pressure 22 barg@50Hz Liquid nitrogen purity >99% Air Compressor type: Screw, Compressor Motor power 5.5 kWMax Working pressure of air compressor 10 barg", "Facility_Description": "Cryogenic liquid nitrogen generation facility based on air separation technology, capable of producing high-purity LN₂ at −196 °C for research, testing, cryopreservation, and low-temperature engineering applications.", "Instruction_for_Sample_Preparation": "Users need to bring LN2 Cryogenic Dewar", "Applications": "Cryopreservation of biological samples and cellsLow-temperature material property testingCooling of scientific instruments such as NMR and detectorsPre-cooling for cryogenic and refrigeration systemsSuperconductivity and low-temperature physics researchFreeze grinding and sample preparationShrink fitting and thermal assembly of mechanical componentsInert atmosphere creation for chemical and metallurgical processesEducational demonstrations and academic experiments", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "87", "Facility": "Low pressure gas adsorption analyzer", "Make": "Anton Paar", "Model": "AutosorbiQ", "Date_of_Installation": "1 March, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "N2 GAS ADSORPTION AT 77K LIQ.NITROGEN TEMPERATURE", "Facility_In_Charge": "Prof.Sanjog Nagarkar,   email ID:- lpgaa@csif.iitb.ac.in", "Facility_Manager": "Mr. Darshan Mhatre, Email ID: - darshansmhatre@iitb.ac.in", "Facility_Operator": "Miss.Ruchi Vishwakarma , Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4194 / 4159", "Department": "Chemistry", "Features_Working_Principle": "Autosorb instruments are high vacuum Physisorption analyzers designed for advanced measurements of BET surface area, active area, and pore size distributions.", "Body": "", "Facility_Description": "Get highly accurate physisorption measurements from relative pressures below 10-7 for nitrogen Rely on TruZone active coolant level control for accurate data – even over lengthy analysesAchieve superior high vacuum performance (38 % better than previous generation instruments) with precision-machined manifolds and high-quality pneumatic valves Analyze up to three different samples simultaneously with independent analysis stations and patented temperature control accessories.", "Instruction_for_Sample_Preparation": "", "Applications": "Surface area,Pore size,Pore volume   measurement", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "88", "Facility": "Magnetic Properties Measurement System", "Make": "Quantum Design", "Model": "SQUID-MPMS3", "Date_of_Installation": "16 August, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Magnetic Characterisation", "Available_Equipment_Mode_of_use": "dc-Magnetization and ac-susceptibility", "Facility_In_Charge": "Prof. Maheswaran Shanmugam Dept. of Chemistry Email: eswar@chem.iitb.ac.in Ph: +91 22 2576 7187", "Facility_Manager": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Facility_Operator": "Baidyanath Sahu, Email: 30006098@iitb.ac.in", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "", "Facility_Description": "Quantum Design’s SQUID-MPMS3 is a high sensitive magnetization measurement system. It can be used for variable temperature range 1.8 K to 400 K and magnetic field value of ± 7 Tesla. Ac-susceptibility can be measured upto 1 kHz frequency.", "Instruction_for_Sample_Preparation": "Solid sample is required for all measurements.For ac- and ac- magnetization, solid and powder sample will be required. The sample weight must be 10 to 50 mg.Note: Liquid sample is not allowed.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "89", "Facility": "Mammalian Tissue Culture Facility", "Make": "BSL-2 Facility Tissue Culture Rooms", "Model": "", "Date_of_Installation": "1 January, 2005", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "Electronic Weight Balance (Model BT 224S), Rotary Vacuum Evaporator with heating bath and associated controller, vapour temperature sensor, vacuum trap and vacuum pump (Model No. 8703 RV.0.000, HETTICH, Germany Table top Refrigerated Centrifuge, Model: Universal 320 R etc… Cat. No. 1406, Vertical Down Flow Work Station of S.S. 304 Construction; Standard Feature: Model No. 4x2, Hepa Filter Size: 48 x 24 x4; Overall Dimensions: 51\" x 30\" x 81\"; Filter, Pre-Filter; Motor Blower; Manometers, Air Cleanliness; Qty 2, Part No. 1420-040: Victor V Microplate Reader for 230V/50 Hz operation; It includes 1. Fluorescence (Top & Bottom) (340-850 nm); 2. Luminescence (Flash, Glow & Duel); 3. Visible Absorbance (340 nm - 800 nm); 4. UV Absorbance (260nm / 280 nm); 5. Time Reso, Equitron Laboratory Autoclave the New Single Lever Lock Model SLL - REGULAR SERIES, CRYOCAN MODEL BA-20 WITH CANISTERS, CRYOCAN MODEL BA-35 WITH CANISTERS, \"1. HETTICH, Germany Table top Microlitre Centrifuge, Model: MIKRO 120, 230V, 50Hz. Capacity: 24 x 1.5 / 2.0 ml. Speed: 14000 rpm/17,530 RCF. Impulse key, Electronic display, RPM/RCF. Temperature Catalog No. 1204.  2. Angle Rotor, 24-place, 2-row for 1.5/, SANYO, Professional Cell Culture CO2 Incubator, Make airjacketed, 230V 50 Hz Model: MCO-15AC, SANYO -86°C Deep Freezer, Upright Model with Patented VIP Technology, 230V. 50 Hz; Model: MDF-U32V; Ultra Low Temperature Freezer, Olympus Microscope with 10X, 40X and 60X objectives; Fluorescence Microscope with Camera and Computer, Double Door Fridge, 4°C Fridge", "Facility_In_Charge": "Prof. Shobhna Kapoor", "Facility_Manager": "", "Facility_Operator": "", "Department": "Centre for Research in Nanotechnology and Science (CRNTS)", "Features_Working_Principle": "The Tissue Culture Facility is a biosafety-compliant laboratory designed for the culture, maintenance, and experimentation on mammalian samples under Biosafety Level 1 (BSL-1) and Biosafety Level 2 (BSL-2) containment. The facility is equipped to support a wide range of cell biology, microbiology research while ensuring operator safety, sterility, and environmental containment.HEPA-filtered ventilation system ensuring proper airflow and containment.Biosafety Cabinets for aseptic handling of biological samplesCO₂ Incubators – maintaining precise temperature, humidity, and CO₂ levels for mammalian cell culture.Phase-Contrast and fluorescence microscope – for real-time cell monitoring.Refrigerators & Freezers (4°C, -10-15°C, -80°C) – for media, reagents, and sample storage.Liquid Nitrogen Cryostorage System – for long-term cell line preservation.Centrifuges (Tabletop & High-speed) – for sample preparation and cell pelleting.AutoclaveRules:Use of non-pathogenic cell lines.Basic aseptic techniques for contamination control.General waste disposal following standard guidelines.Proper disinfection protocols (70% ethanol, bleach, UV sterilization).This facility provides a state-of-the-art, safe, and controlled environment for academic and industrial research in cell biology, infectious diseases, and biomedical sciences.", "Body": "", "Facility_Description": "This facility is used for culturing mammalian cells pertaining to BSL-1 and BSL-2 conditions.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "90", "Facility": "Matrix-Assisted Laser Desorption Ionisation -Time Of Flight Mass Spectrometer at BSBE", "Make": "Bruker India Scientific Pvt Ltd", "Model": "Autoflex Speed - GT 0264 G 201", "Date_of_Installation": "22 October, 2012", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "Linear mode- For high molecular weight analytes (>10,000 Da), Reflectron mode- For low molecular weight analytes (", "Facility_In_Charge": "Prof.Ashutosh  Kumar, Email Id :ashutoshk@iitb.ac.in, Contact : 022-25767762", "Facility_Manager": "", "Facility_Operator": "Mr. Nitin Bhoite , Email Id : 30004943@iitb.ac.in , Contact : 022-25764757", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Matrix-assisted laser desorption ionization (MALDI) time-of-flight (TOF) mass spectrometry works by ionizing a sample with a laser beam striking on the sample mixed with matrix. The charged ions generated are then separated in the Time of flight tube based on their mass to charge ratio.", "Body": "Laser technology - 355 nm frequency tripled Nd:YAG SmartBeam laserLaser focus diameter - 10 µm - enables high spatial resolution imaging without pixel overlap.Resolving power - Wide mass range resolving power up to 26,000.Two Modes of operation - Linear mode for labile molecules or anything bigger than 5kDa. &Reflectron mode for small molecules and peptides.Ion source cleaning - Laser based self-cleaning.Target plate - 384 position target plate (~1 µL spot size).Specificity of Ionisation - Can analyse both positive & negative ions in the same spot.Compass software suite - Flex Control for quick and easy data acquisition & Flex Analysis for automatic and interactive data analysis.", "Facility_Description": "Matrix-assisted laser desorption/ionization is a soft ionization technique used in mass spectrometry, allowing the analysis of biomolecules (biopolymers such as DNA, proteins, peptides and sugars) and large organic molecules (such as polymers and other macromolecules). It is used for the study of protein/peptide characterization, polymer analysis, glycan analysis, nucleic acids & small molecule analysis.", "Instruction_for_Sample_Preparation": "Experiments should be discussed with the facility in-charge before appointment.Purity of samples is extremely important for generating good data.Protein concentrations should be measured accurately before starting the experiment.The molecular weight (SDS IMAGE copy mandatory)as well as the pI of the proteins should be known before analysis.Zip-tipping of samples must for all peptide analysis and also for proteins wherever required (will be confirmed by the MALDI staff in charge).Appointments will be provided as per que and the user will be informed about the same.Kindly perform literature review on similar work and accumulate as much information as possible for good quality data.For any further query, kindly contact on Email: maldi.bios@iitb.ac.in, Contact: 022 25764757", "Applications": "Molecular weight determination of intact proteinsMolecular weight determination of GlycansMolecular weight determination for Proteins & peptidesMolecular weight determination for Nucleic AcidsPolymer Characterization", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Joshi S, Khatri L K, Kumar A*, Rathore S A. Monitoring size and oligomeric-state distribution of therapeutic mAbs by NMR and DLS: Trastuzumab as a case study. J Pharm Biomed Anal. 2021. 195, 113841. doi: 10.1016/j.jpba.2020.113841Pravin N, Kumar R, Tripathi S, Kumar P, Mohite GM, Navalkar A, Panigrahi R, Singh N, GadheLG, Manchanda S, Shimozawa M, Nilsson P, Johansson J, Kumar A, Maji SK, Shanmugam M. Benzimidazole‐based Fluorophores for the Detection of Amyloid Fibrils with Higher Sensitivity than Thioflavin‐T. J. Neurochem. 2021. 156(6), 1003-1019. doi: 10.1111/jnc.15138Marathe S, Dhamija B, Kumar S, Jain N, Ghosh S, Dharikar JP, Srinivasan S, Das S, Sawant A, Desai S, Khan F, Syiemlieh A, Munde M, Nayak C, Gandhi M, Kumar A, Srivastava S, Venkatesh KV, Barthel SR, Purwar R. Multiomics Analysis and Systems Biology Integration Identifies the Roles of IL-9 in Keratinocyte Metabolic Reprogramming. J Invest Dermatol. 2021. doi: 10.1016/j.jid.2021.02.013.Debdeep Chatterjee, Reeba S Jacob, Soumik Ray, AmbujaNavalkar, Namrata Singh, ShinjineeSengupta, LaxmikantGadhe, Pradeep Kadu, DebalinaDatta, Ajoy Paul, SakunthalaArunima, SurabhiMehra, ChinmaiPindi, Santosh Kumar, PrafulSingru, SanjibSenapati, Samir K Maji. Co-aggregation and secondary nucleation in the life cycle of human prolactin/galanin functional amyloids. eLife. 2022. 11: e73835LaxmikantGadhe, ArunimaSakunthala, Semanti Mukherjee, NitishaGahlot, Riya Bera, Ajay Singh Sawner, Pradeep Kadu, Samir K. Maji. Intermediates of α-synuclein aggregation: Implications in Parkinson’s disease pathogenesis. Biophysical Chemistry. 2021. 281: 106736Soumik Ray, Nitu Singh, Komal Patel, G. Krishnamoorthy and Samir K. Maji. FRAP & FRET investigation of α-synucleinfibrillization via liquid-liquid phase separation in vitro and in HeLa cells. Methods in Mol Biol. 2021.SurabhiMehra ,LaxmikantGadhe, Riya Bera, Ajay Singh Sawner, Samir K Maji. Structural and functional insights into α-synuclein fibril polymorphism. Biomolecules. 2021. 11(10):1419AS Sawner, S Ray, P Yadav, S Mukherjee, R Panigrahi, M Poudyal, K Patel, D Ghosh, E Kummerant, A Kumar, R Riek and SK Maji. Modulating α-Synuclein Liquid–Liquid Phase Separation. Biochemistry. 2021. 60(48): 3676-3696"}, {"Sr_no": "91", "Facility": "Matrix-Assisted Laser Desorption Ionisation -Time Of Flight Mass Spectrometer at Chemistry", "Make": "Bruker Daltonics GmbH & Co. KG", "Model": "autoflex maX™ MALDI TOF/TOF System", "Date_of_Installation": "26 May, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mass Spectrometry", "Available_Equipment_Mode_of_use": "linear and reflection measurements in positive/negative ion mode for 10KDa", "Facility_In_Charge": "Prof. Chidambar Kulkarni, chidambark@chem.iitb.ac.in, +91 22 2576 7186", "Facility_Manager": "Rajesh G.", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Features:BioTools software allows the identification and detailed characterization of proteins and peptides using various types of mass spectra.This includes database search of single spectra and combined MS and MS/MS datasets, the import of search results and further detection of modifications and mutations.The RapiDeNovo module provides extensive de-novo sequencing capabilities.BioTools also supports various top-down sequencing spectra types for intact protein characterization and enables the annotation and database search of these data.PolyTools™ 2.0 is a program for the interpretation of MALDI mass spectra of polymers. It accepts peak lists and automatically detect the repeat unit, cation and end groups upon loading of the lists. It also calculates characteristic parameters of the chain length distribution like |molecular weight average|, |polydispersity| or |degree of polymerization|. It displays the results in tabular and graphical representation and can export both for further use in other programs. Kendrick Mass Defect (KMD) analysis of the data is possible as well and a variety of KMD analysis types/plots is available (KMD, KMD-RNKM, RKM and RKM-RNKM).smartbeam II (DPSS) Used in autoflex max MALDI TOF TOF. The smartbeam I components (modulator, focus lens, pin hole) are inside the laser housing.", "Body": "Wave length : 355 nm (diode pumped solid state laser)Pulse duration : > 3nsPulse energy : < 100µJRepetition rate : 2000 HzBeam diameter: smartbeam patternDivergence : smartbeam patternLifetime : 3.5 x109 shootsPower supply : 100 - 240 V", "Facility_Description": "autoflex maX™ MALDI TOF/TOF System:MALDI-Time-Of-Flight Mass Spectrometer for accurate mass determination and structure identification of bio-molecules.Includes MALDI Perpetual™ ion source with self-cleaning device, extended pulsed ion extraction PAN™ mass range focusing; Bruker smart beam™-II laser technology for versatile applications with different sample preparation techniques; TOF analyser for linear and reflection measurements in positive/negative ion mode with integrated FlashDetector™ systems; MS/MS capability based on LIFT™ TOF/TOF technology; high-energy CID (Collision-Induced Dissociation) accessory Data System with 10 bit 5 Gs/s digitizer, WIN10 Operating-System, >=24| Widescreen-LCD-Display and Compass™ for Flex software package for MS control, data acquisition and processing", "Instruction_for_Sample_Preparation": "INSTRUCTIONS FOR SAMPLE PREPARATION :• Experiments should be discussed with the facility in-charge before appointment.• Purity of samples is extremely important for generating good data.• Protein concentrations should be measured accurately before starting the experiment.• The molecular weight (SDS IMAGE copy mandatory)as well as the pI of the proteins shouldbe known before analysis.• Zip-tipping of samples must for all peptide analysis and also for proteins wherever required (will be confirmed by the MALDI staff in charge).• Appointments will be provided as per que and the user will be informed about the same.• Kindly perform literature review on similar work and accumulate as much information aspossible for good quality data.• Any query regarding your MALDI experiment can be emailed on rajeshg@chem.iitb.ac.in Whenever the prepared samples are used in the publications appropriate acknowledgement of usage of Chemistry, IIT Bombay MALDI facility must be mentioned. The details should be forwarded to rajeshg@chem.iitb.ac.in", "Applications": "Molecular weight determination of intact proteinsPartial protein sequencingProtein identificationN-terminal sequencingSmall molecule detectionNucleic acid and oligo nucleotide detectionPolymer detection", "Chemical_allowed": "", "Gases_allowed": "NO", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "92", "Facility": "Micro Ceramic 3D Printing", "Make": "Lithoz", "Model": "CeraFab 8500", "Date_of_Installation": "10 May, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Microfabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Gurminder Singh", "Facility_Manager": "", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "Digital Light Projection (DLP)-based ceramic additive manufacturing is a high-resolution 3D printing technique that enables the fabrication of complex ceramic components through photopolymerization. The process begins with the preparation of a ceramic slurry, which consists of finely dispersed ceramic powders (such as alumina, zirconia, or silicon carbide) mixed with a photosensitive resin containing photoinitiators and additives for stability and flow. This slurry is selectively cured layer by layer using projected ultraviolet (UV) light patterns from a Digital Micromirror Device (DMD), which corresponds to the cross-sections of a 3D CAD model. Each exposed layer solidifies, forming the “green part” composed of ceramic particles bound in a polymer matrix.After printing, the green part undergoes thermal debonding (debinding) to remove the organic resin and binders. This step involves slow, controlled heating to prevent internal stresses, cracking, or deformation, resulting in a porous \"brown body\" with low mechanical strength.The final step is sintering, where the debound part is heated to high temperatures to fuse the ceramic particles together. This densification process strengthens the structure and reduces porosity, producing a mechanically robust final ceramic component. Sintering also causes shrinkage, which must be accounted for during the design phase.Overall, DLP-based ceramic additive manufacturing combines high accuracy, surface quality, and design flexibility, making it suitable for producing intricate ceramic parts in fields like biomedical engineering, aerospace, electronics, and advanced structural applications. It enables rapid prototyping and small-scale production of ceramics with complex geometries not achievable through traditional methods.Present facility is for printing only.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "CAD Model", "Applications": "AerospaceBiomedical", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Reddy, Pranith Kumar, Prasanna Gandhi, and Gurminder Singh. \"Additive manufacturing of yttria-stabilized zirconia using digital light processing: Green density and surface roughness analysis.\" Ceramics International 50, no. 13 (2024): 22974-22988.Puchakayla, Pranith Kumar Reddy, Bhaskar Pegu, Prasanna Gandhi, and Gurminder Singh. \"Defects evolution during printing, debinding and sintering for additive manufacturing of yttria stabilized zirconia.\" Materials Characterization (2025): 114752."}, {"Sr_no": "93", "Facility": "Microwave Synthesis System at Chemistry", "Make": "Anton Paar", "Model": "Monowave 400", "Date_of_Installation": "26 April, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Chemical Synthesis", "Available_Equipment_Mode_of_use": "For liquids/ solutions", "Facility_In_Charge": "Prof. C. M. R. Volla", "Facility_Manager": "Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Features: 1. Screen: Touch Screen 8.4inch 2. Camera: Integrated Camera 3. Operating conditions: Max 30 bar and 300°C 4. Reaction Vials available: 10mL, 30mL, SiC vessel", "Body": "", "Facility_Description": "The Anton Paar Monowave 400 is high-performance monomode microwave reactors designed for small to medium-scale microwave synthesis with advanced all-the-time safety features for high-speed, high-pressure, high-temperature reactions. Microwave heating allows for increasing yields while significantly reducing reaction times. Monomode reactor has small compact cavities, in which microwave irradiation is directly focused on one single vessel containing the reaction mixture. Consequently, a high microwave field density is provided, resulting in exceedingly fast heating rates", "Instruction_for_Sample_Preparation": "Chemicals/ reagents/ solvents required for reactions are to be supplied by end user. User must give details about the reaction parameters.", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "94", "Facility": "Milestone Microwave Synthesizer flexiWAVE", "Make": "Milestone", "Model": "flexiWAVE", "Date_of_Installation": "18 October, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Chemical Synthesis", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sanjog Nagarkar, email ID:- sanjog.na@chem.iitb.ac.in, Contact No:- 022-2576 7190", "Facility_Manager": "Mr. Sushant Chopdekaremail ID:- sushantc@iitb.ac.in", "Facility_Operator": "Ms. Ruchita Vadera, email ID:- 30004934@iitb.ac.in, Contact No:- 022-2576 4183", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "", "Facility_Description": "The Milestone flexiWAVE isn’t just flexible, it’s the most powerful system for high pressure and classic glassware synthesis on the market, thus offering functionality of first-class solid phase reactor.Today flexiWAVE for microwave assisted synthesis has become a cutting-edge technology across the pharmaceutical, biotech, polymers, fine and agro-chemical industries, with thousands of units installed worldwide. List of advantages includes:Enhanced selectivityImproved yieldsLower by-products formation and sample contaminationReduced energy consumptionReduced quantity of sample/chemicals (“atom economy”)", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "95", "Facility": "Multi Material 3D printer", "Make": "Optomec", "Model": "AJ5X", "Date_of_Installation": "5 June, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Microfabrication", "Available_Equipment_Mode_of_use": "Ultrasonic, Pneumatic", "Facility_In_Charge": "Prof. Dipti Gupta, diptig@iitb.ac.in, +91-022-2576-7608", "Facility_Manager": "Prof. Dipti Gupta, diptig@iitb.ac.in, +91-022-2576-7608", "Facility_Operator": "Jayant Kalra", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "Key Features:1.     Features sizes ranging from few microns to millimeters.2.     Dispensing support for a wide variety of inks / materials.3.     Repeatable recipe driven dispense4.     Non-planar 3D printing capabilities5.     R&D to low-volume flexibility Aerosol jet printing operates by first atomizing an ink solution into a fine aerosol mist using an atomizer, such as ultrasonic or pneumatic. The aerosol is then transported by a carrier gas to a deposition nozzle, where it is focused into a narrow jet using a sheath gas. This focused aerosol jet is directed onto a substrate, allowing for precise, high-resolution deposition of materials.Aerosol Jet Process:1.     An ink, such as a conductor or dielectric, is atomized within the Print Module creating a dense aerosol with a tight distribution of droplet sizing.2.     The aerosol is transported to the Print Head using high purity nitrogen as a carrier gas.3.     The aerosol is focused within the Print Head by an annular sheath of nitrogen focusing and accelerating the material onto the substrate as it travels through the nozzle.4.     The Print Head’s in-line shutter facilitates fast feature termination. Interchangeable Print Heads with various nozzle geometries allow for feature size flexibility.", "Body": "", "Facility_Description": "Multi Material 3D printer  is an additive manufacturing device that deposits fine patterns of materials onto a substrate by first atomizing an ink solution into a fine aerosol mist using an atomizer, such as ultrasonic or pneumatic. The aerosol is then transported by a carrier gas to a deposition nozzle, where it is focused into a narrow jet using a sheath gas. This focused aerosol jet is directed onto a substrate, allowing for precise, high-resolution deposition of materials.", "Instruction_for_Sample_Preparation": "Instruction Manual for Users:1(a). What kind of samples can the equipment print?Electronic material printing (Ag, Au, Pt, Cu nanoparticle-based ink),Biomaterial/Polymer printingCreating specific micro- patterns (minimum 100 μm)Substrate:Metals, ceramics, and Polymers such as PET, polyimide, and others with smooth surfaces.Substrate Size: Max.: 5cm×5cm and min.: 1cm×1cm1(b). What kind of samples would not be done?● Ink samples with toxic, corrosive and vaporizing at low temperatures.● Substrate surface with high roughness.● Just a blanket coating where other methods of large area can be used● Where the specific micro-patterns are not required and can be done manually.● Ink containing salts would not be done.2. Inks preparation and Testinga) Commercial Inks (Aerosol Inks and Its Vendor Names, MSDS, Date of purchase, Shelf Life)The link for the ink:https://optomec.com/wp-content/uploads/2014/04/AJ_MATERIALS_FAQs-Web0417.pdfLab - prepared Inks● Particle size (", "Applications": "3D-printed electronics, sensors, RFID, antenna etc.Complex 3D structures with embedded electronic componentsComplex Molded Interconnect DevicesMicrofluidicsAcoustics, Battery, etc.", "Chemical_allowed": "Electronic material printing (Ag, Au, Pt, Cu nanoparticle-based ink),Biomaterial/Polymer printingCreating specific micro- patterns (minimum 100 μm)", "Gases_allowed": "Nitrogen", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "96", "Facility": "Multi material Atomic Layer Deposition", "Make": "Veeco", "Model": "FIJI G2", "Date_of_Installation": "5 December, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Saurabh Lodha", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Ms. Anjum", "Department": "Electrical Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "The multi-material atomic layer deposition tool provides precision in depositing multi-material  thin films with atomic-level control with high uniformity, conformality, and thickness control", "Instruction_for_Sample_Preparation": "NA", "Applications": "Thin films, gate oxides", "Chemical_allowed": "", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "97", "Facility": "Multi-Frequency Electron Paramagnetic Resonance Spectroscopy at Chemistry", "Make": "Bruker", "Model": "EMXplus", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "ESR Spectroscopy", "Available_Equipment_Mode_of_use": "X-band measurement at R.T. and 100K Q-band measurement at R.T. and 100K", "Facility_In_Charge": "Prof. Maheswaran Shanmugam Dept. of Chemistry Email: eswar@chem.iitb.ac.in Ph: +91 22 2576 7187", "Facility_Manager": "Baidyanath Sahu Email: 30006098@iitb.ac.in", "Facility_Operator": "Baidyanath Sahu Email: 30006098@iitb.ac.in", "Department": "Chemistry", "Features_Working_Principle": "FeaturesVariable temperature EPR (X and Q-band) measurement(5K-300K)Single crystal measurementFinger dewarn AWorking PrinciplesAn EPR experiment the field of the spectrometer magnet is swept linearly to excite some of the electrons in the lower energy level to the upper energy level while the sample is exposed to fixed microwave irradiation. The free or the upaired electrons have a small magnetic field and orient themselves parallel to the larger field produced by the spectrometer's magnet. At a particular magnetic field strength the microwave irradiation will cause some of the free electrons to \"flip\" and orient against the spectrometer's magnetic field. This separation between the lower and the higher energy level is exactly matched by our microwave frequency. The condition where the magnetic field and the microwave frequency are \"just right\" to produce an EPR resonance (or absorption) is known as the resonance condition is detected by the spectrometer.Digital Ultra High Resolution Hall Field ControllerMicrowave Bridge: Type EMX-m40X(X-band)Source: solid state microwave source;Frequency range: 9,3 to 9,9 GHzlow noise: -130dBc/ 100 kHz from carriermaximum source output : 200mWphase sensitive detectionintegrated frequency counter with 1 kHz resolutionFrequency Tuning:tune bandwidth: 8 MHz,suitable for standard resonator typesAutomatic Frequency Control(AFC):AFC lock range: 4 MHzdigital adjustment for modulation amplitude and gainAFC stability: 10-8Microwave Power Setting:Attenuation : 60dB maxautomatic phase correction over attenuation range,Microwave Reference Arm:Reference Arm with microwave attenuation and phase shifter,Signal Amplifier: low noise preamplifier,20 Hz to 600 kHz,two 50 Ohm signal outputsResonator Tuning and Matching:the system features \"auto tuning\" and \"auto matching\"for most probeheads via irisQ-factor Display:the system evaluates the probehead (resonator) anddisplays the loaded Q-Factor.All parameters of the bridge are software controlledHigh Sensitivity Probe (Type 2)with optical window for CW-EPR in X-Band:10 mm sample access20 G maximum modulation amplitudeautomatic cavity matchingforlossy and non-lossy samplescompatible with ER 4131VT and ER 4112HVunloaded Q > 15.000Sensitivity: Weak Pitch 1200 : 1 Absolute 2.5 x 109 spins / GQ-Band Microwave Bridge with frequency countermicrowave source: GunnOperating frequency: 34 GHzmax. Power: 100 mWoperating range: 100 MHzattenautaion precision: +/- 0.2dBattenuation resolution: 1 dBattenuation max.: 60 dBSignal bandwidth: 30 Hz to 400 kHzIntegrated frequency counter with 1 kHz resolutionER 5106QTCavity for room-, nitrogen, helium temperatures (X-band)Helium Cryostat, 3.8 K to 300 K (Q-band)with 5 mm optical window,compatible with ER 4112HV-1020 control system(including cryostat holder), used for Flexline,K- and Q-Band resonators.ER 5106QTElectrolytic cell assembly (X-band)Single crystal EPR measurement One axis Goniometer", "Body": "", "Facility_Description": "This EPR machine is designed by Bruker company. In the present facility, there are two frequency modes, viz., X-band work on range 9-10 GHz, and Q-band working on 30-35 GHz. The available electromagnet can provide a magnetic field of upto 13 kOe.", "Instruction_for_Sample_Preparation": "For X-band:Minimum 40-50 mg sample is needed for solid state measurementFor solution state measurement 1 x 10-2 M (provide the preferable solvent to dissolve your sample (avoid using highly polar solvent for measurement))For Q-band:Minimum 5-20 mg sample is needed for solid state measurementFor solution state measurement 1 x 10-3 M (provide the preferable solvent to dissolve your sample (avoid using highly polar solvent for measurement))", "Applications": "Interaction between the unpaired electron in the system (Organic or Inorganic complexes)To find out the geometry around metal ions (particularly useful in biology Example: active site of enzymes and metalloproteinase)EPR imagingRadicals trappingProbing the radical mechanism of chemical and biological catalysis reactionTo probe mechanism of Radical polymerizationSpin labelling experimentsQuantitative absolute concentration measurements", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "98", "Facility": "Multi-Ion Beam Imaging system", "Make": "Zeiss and EDAX", "Model": "SEM: CrossBeam 350 WDS: Lamda Plus", "Date_of_Installation": "1 June, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sushil Mishra", "Facility_Manager": "Prof. Sushil Mishra", "Facility_Operator": "Mr. Animesh Mondal, supriya_patil@iitb.ac.in", "Department": "Mechanical Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "99", "Facility": "Multi-Phase Relative Permeability Test", "Make": "Core Lab", "Model": "PREL-300TM", "Date_of_Installation": "25 August, 2022", "Facility_Management_Division": "", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Vikram Vishal", "Facility_Manager": "", "Facility_Operator": "Ms. Sapna Anup Pimparkar", "Department": "Earth Science", "Features_Working_Principle": "Multiphase relative permeability describes the ability of different fluid phases (e.g., oil, water, and gas) to flow simultaneously through a porous medium. It is defined as the ratio of a phase’s effective permeability to the absolute permeability of the rock. The principle is based on the fact that when multiple fluids coexist, they compete for pore space, affecting flow behavior. Relative permeability is a function of fluid saturation, meaning that as the saturation of one phase increases, the permeability of the other phase decreases. Wettability plays a crucial role, determining which phase preferentially occupies the smaller pores. Capillary pressure also influences fluid distribution, impacting flow resistance. Additionally, residual saturation occurs when a portion of a phase remains trapped due to capillary forces, limiting complete displacement. Experimental determination of relative permeability is conducted through core flooding tests, where fluids are injected into rock samples under controlled conditions, and flow rates are measured. Empirical models such as Corey’s equations and the Brooks-Corey model help predict permeability variations.", "Body": "Maximum Overburden Pressure: 10000 psiMaximum Back Pressure: 6000 psiMaximum Flowrate (Liquid): 10 ml/min", "Facility_Description": "The model is designed for the precise evaluation of permeable rock samples under multiphase flow conditions, allowing researchers to assess the rock's ability to transmit fluids of different phases. This instrument facilitates the accurate characterisation of rock permeability, a key parameter in understanding fluid behavior in geological formations. Equipped with SmartPREL software, the system enables sophisticated data acquisition and analysis, adhering to universal standards for permeability testing. This setup is indispensable for studies related to reservoir engineering, energy resource management, and environmental geosciences.", "Instruction_for_Sample_Preparation": "Cylindrical core sample (1.5 inches Diameter and 3 inches Height)", "Applications": "Reservoir EngineeringEnergy Resource ManagementEnvironmental Geosciences", "Chemical_allowed": "", "Gases_allowed": "CO2, N2", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "100", "Facility": "Multiplexed Quantitative Imaging Cell Analysis System", "Make": "Sartorius", "Model": "Incucyte ZOOM", "Date_of_Installation": "17 August, 2021", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Microscopy", "Available_Equipment_Mode_of_use": "Fluorescent imaging, phase contrast imaging (4x, 10x and 20x)", "Facility_In_Charge": "Prof. Sandip Kar  Prof. Shobhna Kapoor", "Facility_Manager": "", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "", "Body": "Objectives available: 4X, 10X, 20XFluorescence channels:Green:    Emission Wavelength: 524 nm;  Passband: [504,544] nm    Excitation Wavelength: 460 nm;  Passband: [440,480] nm    Excitation Current: 1.1 A;  Bounds: [0.1,1.3] A    LED Voltage Bounds: [0.75,5.2] V  Red:    Emission Wavelength: 635 nm;  Passband: [625,705] nm    Excitation Wavelength: 585 nm;  Passband: [565,605] nm    Excitation Current: 0.9 A;  Bounds: [0.1,1.3] A    LED Voltage Bounds: [0.75,5.2] VDetector:Camera Type: Basler Scout 1400-30gmCamera Serial Number:    21529740Camera Model Name:       scA1400-30gm", "Facility_Description": "The IncuCyte ZOOM system is a live-cell imaging and analysis platform that enables automated quantification of cell behavior over time (from hours to weeks) by automatically gathering and analyzing images around the clock. The system is capable of: 1. Real time live cell imaging of cells inside the incubator with 4x, 10x and 20x objective (phase contrast/red/green channel)2. Use of 96/384 well plates for high-throughput imaging3. Kinetic Analysis for cell proliferation, growth curve, confluence, IC50 determination etc using image-based analysis of confluence E.g. IncuCyte Proliferation Assays allow every well of a 96/384 well plate to be imaged and analyzed automatically to provide a microplate readout of cell proliferation over time. Proliferation time-courses reveal concentration-dependent treatment effects. Transform data into concentration-response curves to obtain IC50 and compare pharmacology. 4. Wound healing and migration (Requires special image-lock plates to be procured by the user) 5. Neurite outgrowth assays.", "Instruction_for_Sample_Preparation": "Samples must be in either of the vessels: Confocal dishes, T75, Multi-well plate. Sample preparation must be completed before bringing the same to the facility. The sample must be brought to the facility in aseptic conditions. The user must ensure to receive the sample back once their slot is completed, the facility management will discard any unclaimed samples after the slot is completed.", "Applications": "Biological sample microscopy while in incubationLive-cell imaging under 37°C and 5% CO2 conditionsPhase contrast microscopyFluorescence microscopy: red and green channelsVessels that can be used: Multi-well plate, T75 flask, confocal dishesIncucyte basic analyser:fluorescence, scratch wound, tiled FOV, chemotaxis, angiogenesis, neurotrack", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "101", "Facility": "Nanoindentor Facility", "Make": "Bruker", "Model": "TI Premier", "Date_of_Installation": "25 March, 2019", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "Indentation : Used primarily for measuring hardness and reduced modulus, Scratch tests: For measuring coefficient of friction and adhesion, Nano-DMA: Measurement of the storage and loss moduli (primarily for polymers), CMX (Constant strain rate test) - Hardness as a function of contact depth, High temperature tests : Low load (", "Facility_In_Charge": "Prof. Nagamani Jaya Balila, Email: jayabalila@iitb.ac.in, Tel: +91-022-28767626", "Facility_Manager": "", "Facility_Operator": "Prakash singh, Email: 30005818@iitb.ac.in, Contact no. - 6306317157", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "Nanoindentation is the technique for assessing the mechanical properties of materials at the nano/micro scale. Hardness is measured as the area of the contact at the maximum load and reduced modulus is calculated from the slope of the load-displacements graph obtained.Features: Load Control and Displacement Control capabilities.The same tip used for indentation is also used for scanning the sample.Can be used for testing thin films and small structures.", "Body": "Technical specifications : I) Load Range : Low load - up to 9.5 mN, High load - up to 10 NII) Displacement Range:a) Low load: Maximum Indentation displacement - 5 µm,  Maximum lateral displacement - 10 µmb) High load:  Max indentation displacement- 80 µm, Maximum lateral displacement - 150 mmIII) Low Load Resolution : Indentation 75 nN,  Lateral axis  3 µNIV) Displacement resolution :  Indentation axis up to 0.04 nm, Lateral axis up to 4 nmV) Heating/Cooling stage : Temperature range 25 °C to 600 °CVI) nano- DMA (Dynamic Mechanical Analysis):Range:a) Frequency range: 1Hz  to  300Hz (Below 10Hz, the test can take a very long time)b) Load range : Maximum force- 9.5 mN", "Facility_Description": "TI Premier  i) Low load indentation module                  ii) High load indentation module                  iii)High Temperature Sample heating stage", "Instruction_for_Sample_Preparation": "Sample should be flat and smooth roughness has to be less than 150 nm (mandatory).Loose particles or thin films with porous coatings will not be entertained.Powder samples will not be done. If the pellet can be prepared of the powder by sintering, then it can be done.Liquid samples cannot be done.", "Applications": "Bulk materials-metals, ceramics, polymers, compositesMultiphase materialsMEMS devices-cantilever bending experimentsMicropillar experimentsNanostructured materials and thin filmsBiological materials (solid, not in-vivo)                                    Scratch tests: Protective coatingsDepth profiling of layered materials", "Chemical_allowed": "", "Gases_allowed": "For high temperature indentation, an inert atmosphere is needed to avoid the oxidation of the tip as well as the samples.", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "102", "Facility": "Next Generation Sequencing Platform", "Make": "Illumina", "Model": "NextSeq 550", "Date_of_Installation": "25 June, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Biochemistry", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Santanu Kumar Ghosh santanughosh@iitb.ac.in 022 2576 7766", "Facility_Manager": "NA", "Facility_Operator": "Mr. Santosh Panigrahi  spanigrahi@iitb.ac.in 022-21596746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Theoretically, Illumina NGS technology resembles Sanger sequencing. During the cyclic process of DNA synthesis sequencing, a DNA polymerase catalyzes the incorporation of fluorescently labeled deoxyribonucleotide triphosphates (dNTPs) onto a DNA template strand. Each cycle, as the dNTP is incorporated, the nucleotide is identified via fluorescence excitation. However, diverging from Sanger sequencing, which sequences the entire completed DNA segment, NGS has revolutionized the process through its high-throughput parallel sequencing method.  Flow cell A core sequencing reactor vessel where DNA fragments attach to lanes on the surface. Each lane has adapters that match the adapters added to the ends of the DNA fragments. Workflow The workflow includes library preparation, sequencing, analysis, and sharing. Applications The NextSeq 550 System can be used for RNA sequencing, mRNA sequencing, gene expression profiling, and whole-exome sequencing.The facility is made in such a way so that the entire work flow of the genomics study, that involves multiple steps viz, library preparation, quantitation and sequencing, through utilization of multiple instruments, can be performed within the facility itself.Both the internal users and external users can avail the facility for usage. However the complete sequencing set-up is not yet chargeable because of the costly reagents required for preparing the libraries and the kits required for setting up the run in the NextSeq 550.Right now, we are only charging the sequencing instrument on the data size generated.  Major EquipmentSequencing Platform : Illumina NextSeq 550 from Illumina4150 Tape Station system from AgilentQubit 4 Fluorometer by Thermo Fisher ScientificAnalysis workstation Illumina Nextseq 550The NextSeq 550 System combines tried-and-true next-generation sequencing (NGS) and array capabilities with tunable outputs, enabling both small and large labs to scale to meet their needs. Its fast DNA-to-results workflow enables rapid sequencing of exomes, targeted panels, and transcriptomes in a single run, with the flexibility to switch to low- or high-throughput sequencing as needed. Illumina scientists are available at every point along the way with support and guidance, enabling large clinical research labs to scale with confidence and smaller labs to employ both genotyping and sequencing technologies. The NextSeq 550 System offers various throughput levels, providing users with optimal operational efficiency. The NextSeq 550 System also delivers a one-day turnaround for numerous popular sequencing applications. With this instrument, users can sequence a broad range of samples per run: • 1-12 exomes• 1-16 transcriptomes• 6-96 targeted panels • 12-40 gene expression profiling samples The NextSeq 550 System features an intuitive user interface and load-and-go design that allow users to perform various sequencing applications with minimal training and instrument set-up time. It provides Array Scanning     The NextSeq 550 System offers:    • Ready-to-use reagents     • Radio-frequency identification (RFID)–encoded consumables     • Integrated cluster generation and sequencing capabilities     • Easy-to-follow controls  4150 Tape Station system from Agilent Simplified workflow and minimal hands-on time with fully automated sample processing and the proven, ready-to-use ScreenTape technologyNucleic acid analysis with minimal manual intervention and excellent reproducibility for size, concentration, and integrityWide range of RNA and DNA ScreenTape applications, including assays for genomic and cell-free DNAEasy switching between DNA and RNA ScreenTape assays for excellent application flexibilityFull sample scalability from 1 to 96 samples with constant cost-per-sampleMinimized time to results with as little as 1 to 2 minutes per sample or less than 90 minutes for 96 samplesReduced sample consumption with as little as 1 to 2 µL of DNA and RNA samples, even for high-sensitivity assaysNo risk of cross contamination with individual ScreenTape lanesReliable integrity standards for RNA (RNA integrity number equivalent, RINe), genomic DNA (DNA integrity number, DIN), and cell-free DNA (%cfDNA)Optimized cost of ownership and maximized instrument uptime with the option for self-maintenance tasks Covaris M220 Focused-ultrasonicatorThe M220 Focused-ultrasonicator enables precise and accurate results with AFA-energetics. Acoustic based focused shearing is performed at ultrasonic range of 500Khz.  Thus it functions beyond audible range ensuring no discomfort to operators.The system is able to process 1 sample per run in a minimal time.The system has the capacity to handle a dynamic sample volume range for different sample types i.e. from 15 μl to 1 ml.The system complies with the following key features such as random fragmentation (no fragmentation bias), dynamic range of fragment size (100bp - 5Kbp), isothermal process (no heat-induced bias or sample degradation), concentration independent, uniform genome coverage, high sample reproducibility and sample recovery during the whole process.The system can generate 150bp DNA fragments within processing times as low as 5 minutes. Applications:a. Mechanical shearing of DNA for Next Generation Sequencing. b. DNA/RNA extraction from Formalin-Fixed, Paraffin-Embedded (FFPE) tissue samples. c. Extract DNA for NGS from whole blood. d. Chromatin Mechanical Shearing for ChIP-Seq.", "Body": "Light emitting diode (LED)                            Wavelengths                                    Green 510-525 nm, (laser diode 780 nm, Class IIIb)             Red 645-655 nm Dimensions                                 53.3 cm × 63.5 cm × 58.4 cmW × D × H                                   (21.0 in × 25.0 in × 23.0 in) Weight                                              83 kg (183 lb) Instrument Specification:https://drive.google.com/drive/folders/1ndIcQz3SnApQ-WCpDRIp8eayZ50lJNIK?usp=sharing", "Facility_Description": "The facility is made in such a way so that the entire work flow of the genomics study, that involves multiple steps viz, library preparation, quantitation and sequencing, through utilization of multiple instruments, can be performed within the facility itself.The Illumina next-generation sequencing (NGS) method is based on sequencing-by-synthesis (SBS), and reversible dye-terminators that enable the identification of single bases as they are introduced into DNA strands.", "Instruction_for_Sample_Preparation": "NA", "Applications": "Gene Expression ProfilingExome SequencingSmall Whole-Genome SequencingTargeted sequencing (amplicon-based, gene panel)Transcriptome sequencing (total RNA-Seq, mRNA-Seq, gene expression profiling)Arrays", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "103", "Facility": "Nuclear magnetic resonance spectrometer- 400 MHz  Solid State Facility at Chemistry", "Make": "BRUKER. Switzerland", "Model": "AVANCE NEO", "Date_of_Installation": "12 October, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "The 400 MHz Bruker AVANCE NEO Solid State NMR Spectrometer is a versatile, high-performance system designed to support a wide range of research applications.", "Facility_In_Charge": "Prof. Sanjog S. Nagarkar", "Facility_Manager": "Mr. Niteen Kadam, Mr. Narendra Gaikwad", "Facility_Operator": "Mr. Vaibhav Nagare", "Department": "Chemistry", "Features_Working_Principle": "Features:High-Resolution Spectroscopy: Detailed atomic-level analysis of solid materials.MAS (Magic Angle Spinning): Rotates samples to average anisotropic interactions, improving resolution.CP-MAS (Cross-Polarization): Enhances sensitivity, especially for low-gamma nuclei like ¹³C.Variable Temperature (VT): Enables temperature-dependent experiments.Superconducting Magnet (9.4 T): Provides a stable magnetic field for precise measurements.Efficient Cryogen Management: Low helium and nitrogen consumption.Working Principle:NMR measures how magnetic nuclei in a sample resonate with an external magnetic field, revealing structural and electronic properties.MAS averages interactions to improve resolution.CP transfers polarization from abundant nuclei (¹H) to less sensitive ones (¹³C, ²⁹Si).Provides high-resolution spectra of solid materials, with temperature-dependent capabilities for studying molecular dynamics and reactions.", "Body": "Operating Frequency: 400 MHz for 1H (other nuclei operate at corresponding frequencies).Probes:Liquid-state: i probe.Solid-state: MAS probe with a maximum spinning speed of 14 KHz.", "Facility_Description": "The Bruker AVANCE NEO 400 MHz OneBay FT-NMR Spectrometer is a high-performance system designed for advanced research in organic, inorganic, bio molecular, and solid-state NMR. Featuring a 9.4 T superconducting magnet, AVANCE NEO console, and automatic tuning and matching (ATM), it delivers high-resolution spectroscopy with optimized cryogen efficiency.", "Instruction_for_Sample_Preparation": "For Solid Samples:Ensure the sample is completely dry and finely powdered for optimal results.Required Sample Amounts:4 mm MAS rotor → 150–200 mg of sample.The sample must be non-magnetic and non-conductive (unless explicitly approved).Special Instructions for Sample Handling:Avoid hygroscopic samples unless pre-dried and handled under inert conditions.Ensure there are no volatile solvents or moisture present in the sample.If submitting air-sensitive samples, discuss the procedure with facility staff beforehand.Liquid Samples:Ensure complete solubility in 0.6 mL of the selected solvent.Required amounts:1H NMR: 10-20 mg (depending on molecular weight).13C NMR: 20-30 mg for adequate signal-to-noise ratio.", "Applications": "Major application of NMR spectroscopy lies in the area of synthetic organic chemistry, inorganic chemistry, bio-organic chemistry, bio-inorganic chemistry, polymer chemistry and organometallic chemistry. One of the main advantages of FT-NMR spectroscopy is that a number of FIDs can be accumulated and Fourier transformed, enhancing S/N ratio of the spectrum. This in turn facilitates the analysis of samples with low abundant nuclei and smaller gyro-magnetic ratios, e.g.,13C, 29Si, 15N etc.NMR studies find applications in some of following areas:Molecular conformation in solutionQuantitative analysis of mixtures containing known compoundsDetermining the content and purity of a sampleThrough space connectivity (Overhauser effect)", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "104", "Facility": "Nuclear magnetic resonance spectrometer- 400 MHz III Facility at Chemistry", "Make": "BRUKER. Switzerland", "Model": "AVANCE III HD", "Date_of_Installation": "14 August, 2019", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "The 400 MHz Bruker AVANCE NEO NMR Spectrometer is a versatile, high-performance system designed to support a wide range of research applications.", "Facility_In_Charge": "Prof. Chandra M.R. Volla, Prof. Arnab Datta", "Facility_Manager": "Mr. Niteen Kadam, Mr. Narendra Gaikwad", "Facility_Operator": "Mr. Vaibhav Nagare", "Department": "Chemistry", "Features_Working_Principle": "The spectrometer uses Fourier Transform Nuclear Magnetic Resonance (FT-NMR) to provide high-resolution spectra, offering insights into molecular structure, dynamics, and interactions. Real-time reaction monitoring integrates seamlessly, enabling simultaneous acquisition of kinetic data and structural information.", "Body": "The system features robust hardware for long-term stability, advanced cryogenics for temperature regulation, and state-of-the-art software for data acquisition and analysis.", "Facility_Description": "This facility provides advanced capabilities for the analysis of liquid samples and real-time reaction monitoring.Advanced Probes5 mm Multinuclear i-Probe: Designed for liquid-state studies of nuclei such as ^1H, ^13C, ^19F, ^31P, ^11B, ^27Al, ^77Se, ^125Te, ^199Hg, and more.5 mm Double Resonance ^13C/^1H Probe: Optimized for experiments requiring simultaneous detection of ^1H and ^13C nuclei.Experiment Capabilities1D NMR: Includes experiments like ^1H, ^13C, NOE, APT, DEPT, and more.2D NMR: Supports advanced techniques such as COSY, NOESY, TOCSY, HSQC, HMBC, DOSY, and ROESY.Variable Temperature (VT): Enables experiments in the temperature range of -40°C to +100°C.Sample TypesLiquid Samples: Requires samples to be soluble in 0.6 mL of a suitable solvent.Real-Time Reaction Monitoring: Enables kinetic studies and process optimization with in situ monitoring.24-Sample Auto-Sampler: Facilitates high-throughput analysis by automating the handling of up to 24 samples.", "Instruction_for_Sample_Preparation": "Ensure complete solubility in 0.6 mL of the selected solvent.Required amounts:1H NMR: 10-20 mg (depending on molecular weight).13C NMR: 20-30 mg for adequate signal-to-noise ratio.", "Applications": "Major application of NMR spectroscopy lies in the area of synthetic organic chemistry, inorganic chemistry, bio-organic chemistry, bio-inorganic chemistry, polymer chemistry and organometallic chemistry. One of the main advantages of FT-NMR spectroscopy is that a number of FIDs can be accumulated and Fourier transformed, enhancing S/N ratio of the spectrum. This in turn facilitates the analysis of samples with low abundant nuclei and smaller gyro-magnetic ratios, e.g.,13C, 29Si, 15N etc.NMR studies find applications in some of following areas :Molecular conformation in solutionQuantitative analysis of mixtures containing known compoundsDetermining the content and purity of a sampleThrough space connectivity (Overhauser effect)", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "105", "Facility": "Nuclear Magnetic Resonance Spectrometer- 500 MHz Facility at Chemistry", "Make": "BRUKER. Switzerland", "Model": "AVANCE III HD", "Date_of_Installation": "2 September, 2013", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "500 MHz Bruker AVANCE III HD NMR spectrometer: Specifications Probes Broadband Probe:  Enables observation of a wide range of nuclei across various frequency ranges. Dual Probe:  Allows simultaneous or sequential detection of two nuclei (e.g., 1H and 13C)", "Facility_In_Charge": "Prof. Chandra M.R. Volla, Prof. Arnab Datta", "Facility_Manager": "Mr. Niteen Kadam, Mr. Narendra Gaikwad", "Facility_Operator": "Mr. Vaibhav Nagare", "Department": "Chemistry", "Features_Working_Principle": "Features:NMR spectroscopy is based on the magnetic properties of certain atomic nuclei. When placed in a strong external magnetic field, these nuclei absorb and emit radiofrequency energy corresponding to specific nuclear transitions:External Magnetic Field Interaction: Nuclei with spin align with or against the field.Radiofrequency Energy Absorption: Transitions between energy states occur at specific frequencies.Signal Detection and Processing: Emitted signals are processed to generate spectra, revealing structural, dynamic, and environmental information.High Sensitivity & Resolution: Digital receiver technology for enhanced signal-to-noise ratio.Working Principle:The spectrometer uses a strong superconducting magnet (500 MHz) to align nuclear spins. A radiofrequency (RF) pulse excites the nuclei, and as they relax, they emit signals. These signals are detected by the spectrometer and processed using Fourier Transform (FT-NMR) to generate spectra, revealing molecular structures, dynamics, and interactions.", "Body": "Operating Frequency: 500 MHz for 1H (other nuclei operate at corresponding frequencies).Probes:Liquid-state: BBFO probe.Solid-state: MAS probe with a maximum spinning speed of 14 KHz.Temperature Range: -40°C to +100°C (with VT accessory).", "Facility_Description": "The 500 MHz Bruker AVANCE III HD NMR Spectrometer at the Department of Chemistry, IIT Bombay, is a state-of-the-art analytical instrument designed for advanced research in molecular structure and dynamics. It supports both liquid and solid-state NMR with a range of probes and variable temperature capabilities, catering to diverse academic and industrial applications.FeaturesAdvanced Probes:5 mm Multinuclear Probe (BBFO): For liquid-state studies of nuclei like 1H, 13C, 19F, 31P, 11B, 27Al, 77Se, 125Te, 199Hg, etc.Broadband Solid-State Probe: For MAS experiments with spinning speeds up to 14 KHz.Experiment Capabilities:1D NMR: Includes 1H, 13C, NOE, APT, DEPT, and others.2D NMR: Experiments like COSY, NOESY, TOCSY, HSQC, HMBC, DOSY, and ROESY.Variable Temperature (VT): Experiments in the range of -40°C to +100°C.Sample Types:Liquid Samples: Soluble in 0.6 mL of a suitable solvent.Solid Samples: Fine powders (~20 microns) for MAS-NMR.", "Instruction_for_Sample_Preparation": "Liquid Samples:Ensure complete solubility in 0.6 mL of the selected solvent.Required amounts:1H NMR: 10-20 mg (depending on molecular weight).13C NMR: 20-30 mg for adequate signal-to-noise ratio.Solid Samples (MAS-NMR):Prepare as a fine powder (~20 microns).Required quantity: 150-200 mg for optimal results.", "Applications": "Major application of NMR spectroscopy lies in the area of synthetic organic chemistry, inorganic chemistry, bio-organic chemistry, bio-inorganic chemistry, polymer chemistry and organometallic chemistry. One of the main advantages of FT-NMR spectroscopy is that a number of FIDs can be accumulated and Fourier transformed, enhancing S/N ratio of the spectrum. This in turn facilitates the analysis of samples with low abundant nuclei and smaller gyro-magnetic ratios, e.g.,13C, 29Si, 15N etc.NMR studies find applications in some of following areas :Molecular conformation in solutionQuantitative analysis of mixtures containing known compoundsDetermining the content and purity of a sampleThrough space connectivity (Overhauser effect)", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "106", "Facility": "Nuclear Magnetic Resonance Spectrometer- 600 MHz at Chemistry", "Make": "Bruker", "Model": "Ascend 600, AVANCE NEO console", "Date_of_Installation": "24 June, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "iProbe; BBO and TXI probe (solution)  Multinuclear (1H, 13C, 19F, 31P, 11B, 15N etc.) experiments, 1D, 2D and 3D experiments", "Facility_In_Charge": "Prof. Ishita Senguptaishita@chem.iitb.ac.in", "Facility_Manager": "nmr600ioe@chem.iitb.ac.in", "Facility_Operator": "Dr. Pranav Bhagwat", "Department": "Chemistry", "Features_Working_Principle": "NMR spectroscopy is a high resolution analytical method for structure, conformational analysis and dynamics of molecules. NMR-active nuclear spins are excited by the application of radio-frequency pulses of matching frequency. The magnetic field generated by these spins is detected by the same RF coil which is used to excite them, giving rise to the NMR signal (FID). Signal processing results in a frequency domain spectrum which is then analyzed to reveal information about the environment around the spins.", "Body": "Probe Specifications:1.Bruker 5 mm SmartProbeTM (standard room-temperature BBO probe) for multinuclear measurements of small molecules. The probe can be tuned to observe 19F or any nucleus in the range from 31P- 199Hg and 17O-109Ag excluding 171Yb-9Be. Simultaneous pulsing on 1H and 19F nuclei is possible, enabling the recording of 19F spectra with 1H decoupling. The probe is equipped with a z-gradient (5 G/A*cm), 2H locking and is capable of carrying out solvent suppression using pre-saturation or pulsed-field gradients.2. 5mm Triple resonance (TXI) high-resolution room temperature-probe (with actively-shielded 5 G/A*cm z-gradient and 2H lock). The probe can be used for structural and dynamic analysis of doubly (13C/15N) or singly (15N) labelled biomolecules, using 1H detected measurements and 13C/15N decoupling.3. BCU-I unit for 4-25 degrees temperature range4. High temperature measurements possible till 80 degrees", "Facility_Description": "This facility enables the recording and analysis of a number of conventional 1D and 2D NMR experiments for liquid organic/inorganic small molecule samples as well as 3D measurements for protonated and isotopically labelled biomolecules, below ~15 kilodaltons. These experiments are vital for identification, assignment and structural/dynamic characterization of a wide range of molecules.", "Instruction_for_Sample_Preparation": "Inorganic/organic small molecule samples which are highly soluble (minimum concentration 1 mM- 2mM) in typical NMR solvents (deuterated methanol, deuterated DMSO, deuterated acetone, deuterated chloroform or D2O etc.) can be analyzed. The molecular weight and solubility must be clearly stated when sending in samples.Instructions for preparing NMR samplesUse the correct quantityUse the appropriate amount of material for the type of spectrum you're taking. Remove solidsRemove any solid particles from the sample. You can filter the sample with cotton wool or membrane filters. Use deuterated solventsDissolve the sample in a deuterated solvent, such as CDCl3, DMSO-d6, CD3OD, Acetone-d6 etc. Prepare the sample in a secondary vialDissolve the solid sample in a small vial and then transfer it to the NMR tube. Treat the sampleTreat the sample with heat or vortexing to ensure complete dissolution.Use clean tubes and capsUse clean NMR tubes and caps. Avoid contact between the sample and the cap, or use new caps. Label the sampleLabel the sample tube with the sample name and your group's short-form. You can also attach a flag with the sample name to the sample. Use the right tubeUse an NMR tube with a diameter of 5 mm and a minimum length of 17 cm. The tube should not have any glass defects. Fill to the correct heightThe minimum filling height for an NMR tube is 5 cm (0.6 ml).  Isotopically labelled samples (15N labelled or 13C/15N labelled samples) can be sent in lyophilized form or on ice in the relevant buffer. If sent in lyophilized form, please include the NMR sample buffer. Sample concentrations should be 500 μM or more for 2D experiments and 1 mM or more for 3D measurements. Currently, long experiments are possible only at room temperature, depending upon the stability and solubility of the biomolecular samples.", "Applications": "NMR experiments: Small molecules:1D 1H with and without solvent suppression1D NOESY, 1D DOSY, 1D CPMG (for T2 measurement), 1D Inversion Recovery (For T1 measurement)  1D 13C, 1D 19F, 1D 31P (coupled and decoupled versions), DEPT90, DEPT1352D - NOESY, TOCSY, COSY, DQF-COSY, HETCOR, HSQC, HMBC1D experiments on other X-nuclei (direct detection) - on request Biomolecules:Standard 15N-1H HSQC, 13C-1H HSQC experiments3D experiments for protein backbone and sidechain assignments (HNCO, HNCA, HN(CO)CA, HN(CA)CO, HNCACB, CBCACONH, CC(CO)NH, TOCSY-HSQC etc.)3D 15N/13C edited NOESY-HSQC experiments for distance restraintsDynamics: Backbone (15N) R1, R2, hetNOE experiments  Variable temperature measurements:Please contact and confirm beforehand for slots before booking. A BCU-I unit for measurements down to 4 degrees Celsius isavailable. Please confirm before booking for high temperature measurements.", "Chemical_allowed": "Non-toxic solid and liquid sample", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "107", "Facility": "Nuclear magnetic resonance spectrometer-750 MHz", "Make": "Bruker Biospin Switzerland", "Model": "Ascend 750MHz", "Date_of_Installation": "30 December, 2013", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "Liquid state, Solid state", "Facility_In_Charge": "Prof. Ashutosh Kumar, Email: ashutoshk@iitb.ac.in, Contact: +(91-22) 2576 7762", "Facility_Manager": "Pramod Mali", "Facility_Operator": "Pramod Mali, Extension: 6859", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Features : 1)For solution-state NMR:5mm triple resonance H/C/N nuclei with 2H lock and 50G/cm gradient along Z axis.2) For solid-state NMR:3.2mm CP-MAS DVT triple resonance H/X/Y probe with max spinning speed of 24KHz3.2mm CP-MAS triple resonance (H/C/N) E-free probe (Bio-solid) with max.spinning speed of 24KHz1.9 mm H/C/N CP MAS triple resonance(H/C/N) probe with max. spinning speed of 42KHz3)For wide-line static probes:Low-temperature wide-line probe, solenoid coil5mm and 7.5mm, can be tuned to various nuclei and can go upto 20K.Working principle : Nuclear Magnetic Resonance spectroscopy (NMR) is a one of the powerful and theoretically complex analytical technique. It is a spectroscopy where an ensemble of nuclei of atoms that possesses \"magnetic moments\" and \"angular momentum\" is subjected to an external magnetic field. As the nuclear angular momentum is quantized, these nuclei align either parallel or anti-parallel to the applied magnet field. Depending upon the nature of nuclei, one of these aligned states (in most cases, it is parallel) is more energetically favorable; that gives rise to net bulk magnetization. An external radiofrequency pulse is applied to the bulk magnetization to establish a resonance condition which in turn realigns bulk magnetization in the transverse plane of the external magnetic field. Ensemble of spins then precesses at a characteristic frequency and depending upon their chemical environment these precessional frequencies can be different for different chemical entity (Chmical shift). These ensemble of spin precessing in the magnetic field generates current which is a time decaying function as the spins restore their equilibrium states. Time domain signals are Fourier transformed to generate a frequency domain data which provide characteristic property of various chemical entities.", "Body": "Bruker 750 WB MHz & its configuration :Make and Model : Bruker Biospin Switzerland, Avance III 750 MHzMagnetic Field : 17.61 Tesla, Wide bore (89 mm)Host Computer : HP make Linux PC equipped with Intel Xenon Dual core W3505, 2, 53 GHz, 4 GB RAM, 500 GB Hard Disk, DVD-RW, 20inch TFT monitorSoftware : Topspin 3.6.2 or higher for data processing and analysis", "Facility_Description": "HF NMR 750 MHz available for both internal and external users from IIT Bombay and outsiders.", "Instruction_for_Sample_Preparation": "For Liquid-state

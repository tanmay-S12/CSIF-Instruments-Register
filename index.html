<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASC Instrument Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F6F3EC;
            --paper-deep: #EFEADD;
            --line: #DDD5C3;
            --ink: #23262B;
            --ink-soft: #635C4E;
            --teal: #1F6F63;
            --teal-deep: #164F46;
            --teal-tint: #E4EFEC;
            --amber: #B96A22;
            --amber-tint: #F6E9D6;
            --amber-line: #D9A868;
            --green: #3F7D5B;
            --green-tint: #E4F0E7;
            --white: #FFFFFF;
            --shadow: 0 1px 2px rgba(35, 38, 43, 0.06), 0 6px 20px rgba(35, 38, 43, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 80px;
        }

        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 14px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--teal-deep);
            font-weight: 600;
        }

        h1.title {
            font-family: 'Fraunces', serif;
            font-size: clamp(28px, 4.5vw, 40px);
            font-weight: 600;
            margin: 2px 0 0;
            line-height: 1.05;
            letter-spacing: -0.01em;
        }

        .count-badge {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            text-align: right;
        }

        .tabs {
            display: flex;
            gap: 2px;
            margin: 22px 0 22px;
        }

        .tab-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 4px;
            margin-right: 24px;
            cursor: pointer;
            color: var(--ink-soft);
            font-weight: 600;
        }

        .tab-btn.active {
            color: var(--ink);
            border-bottom-color: var(--teal);
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        /* search */
        .search-box {
            position: relative;
            margin-bottom: 6px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 18px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--ink);
            border-radius: 2px;
            background: var(--white);
            outline: none;
            color: var(--ink);
        }

        .search-box input:focus {
            border-color: var(--teal);
        }

        .search-hint {
            font-size: 12.5px;
            color: var(--ink-soft);
            margin: 8px 2px 20px;
        }

        .results-count {
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 13px 16px;
            cursor: pointer;
            transition: border-color .12s, transform .12s;
            text-align: left;
            width: 100%;
        }

        .result-row:hover {
            border-color: var(--teal);
            transform: translateX(2px);
        }

        .result-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--white);
            background: var(--ink);
            border-radius: 2px;
            padding: 3px 7px;
            flex-shrink: 0;
            min-width: 34px;
            text-align: center;
        }

        .result-name {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
        }

        .result-meta {
            font-size: 12px;
            color: var(--ink-soft);
        }

        .result-status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .status-complete {
            background: var(--green-tint);
            color: var(--green);
        }

        .status-pending {
            background: var(--amber-tint);
            color: var(--amber);
        }

        .no-results {
            color: var(--ink-soft);
            padding: 30px 4px;
            font-size: 14px;
        }

        /* detail card */
        .back-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--teal-deep);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin-bottom: 18px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 3px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--ink);
            color: var(--white);
            padding: 10px 22px;
        }

        .card-tab .no {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            letter-spacing: .04em;
            color: #C9C2AF;
        }

        .card-body {
            padding: 26px 26px 30px;
        }

        .card-body h2 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 26px;
            margin: 0 0 6px;
            line-height: 1.15;
        }

        .card-meta {
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 22px;
        }

        .card-meta span {
            margin-right: 14px;
        }

        .complete-banner {
            background: var(--green-tint);
            color: var(--green);
            border: 1px solid #BFE0CB;
            border-radius: 2px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .name-field {
            background: var(--teal-tint);
            border: 1px solid #C7DDD7;
            border-radius: 2px;
            padding: 16px 18px;
            margin-bottom: 26px;
        }

        .name-field label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--teal-deep);
            margin-bottom: 6px;
        }

        .name-field input {
            width: 100%;
            padding: 9px 10px;
            font-size: 14px;
            border: 1px solid #B7CFC8;
            border-radius: 2px;
            font-family: 'Inter', sans-serif;
        }

        .field-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            border-top: 1px solid var(--line);
            padding-top: 14px;
        }

        .field-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .field-value {
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            color: var(--ink);
        }

        .field textarea {
            width: 100%;
            border: 1.5px solid var(--line);
            background: var(--white);
            border-radius: 2px;
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            line-height: 1.55;
            resize: vertical;
            min-height: 44px;
            outline: none;
            color: var(--ink);
            box-sizing: border-box;
            overflow: hidden;
        }

        .field textarea:focus {
            border-color: var(--teal);
        }

        .field.missing {
            background: var(--amber-tint);
            margin: 0 -14px;
            padding: 14px;
            border-top: 1px dashed var(--amber-line);
            border-radius: 2px;
        }

        .field.missing .field-label {
            color: var(--amber);
        }

        .field.missing textarea {
            border: 1.5px dashed var(--amber-line);
        }

        .field.missing textarea:focus {
            border-style: solid;
            border-color: var(--amber);
        }

        .filled-tag {
            font-size: 11px;
            color: var(--green);
            font-weight: 600;
        }

        .edit-toggle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            background: none;
            border: none;
            color: var(--ink-soft);
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
        }

        .submit-bar {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .submit-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 14.5px;
            background: var(--teal);
            color: var(--white);
            border: none;
            border-radius: 2px;
            padding: 13px 26px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: var(--teal-deep);
        }

        .submit-btn:disabled {
            background: #B7BBB6;
            cursor: not-allowed;
        }

        .save-msg {
            font-size: 13px;
            color: var(--green);
            font-weight: 600;
        }

        .save-msg.error {
            color: #B23A2E;
        }

        /* dashboard */
        .stat-row {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 140px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 2px;
            padding: 16px 18px;
        }

        .stat .num {
            font-family: 'Fraunces', serif;
            font-size: 30px;
            font-weight: 600;
            line-height: 1;
        }

        .stat .lbl {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 6px;
        }

        .dl-btn {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            background: var(--ink);
            color: var(--white);
            border: none;
            border-radius: 2px;
            padding: 16px;
            cursor: pointer;
            margin-bottom: 26px;
        }

        .dl-btn:hover {
            background: var(--teal-deep);
        }

        .dl-btn:disabled {
            background: #B7BBB6;
        }

        .dash-note {
            font-size: 12px;
            color: var(--ink-soft);
            margin: -16px 0 26px;
        }

        table.dash-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        table.dash-table th {
            text-align: left;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--ink-soft);
            border-bottom: 2px solid var(--ink);
            padding: 8px 10px;
        }

        table.dash-table td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
        }

        table.dash-table tr {
            cursor: pointer;
        }

        table.dash-table tr:hover td {
            background: var(--paper-deep);
        }

        .loading {
            color: var(--ink-soft);
            font-size: 14px;
            padding: 30px 0;
            text-align: center;
        }

        @media (max-width:640px) {
            .card-body {
                padding: 20px 16px 24px;
            }

            .field.missing,
            .field.filled-by-user {
                margin: 0 -8px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="masthead">
            <div>
                <div class="eyebrow">Centre for Sophisticated Instruments &amp; Facilities</div>
                <h1 class="title">Instrument Register</h1>
            </div>
            <div class="count-badge" id="headerCount">— entries</div>
        </div>

        <div class="tabs" id="tabBar">
            <button class="tab-btn active" data-tab="find">Find your instrument</button>
        </div>

        <div class="view active" id="view-find">
            <div id="search-panel">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by instrument, department, or category…"
                        autocomplete="off">
                </div>
                <div class="search-hint">Type a few letters — e.g. "XRD", "confocal", "chemistry" — or scroll the full
                    list
                    below.</div>
                <div class="results-count" id="resultsCount"></div>
                <div class="results" id="resultsList"></div>
            </div>
            <div id="detail-panel" style="display:none;"></div>
        </div>

        <div class="view" id="view-dash">
            <div id="dash-content">
                <div class="loading">Loading submissions…</div>
            </div>
        </div>
    </div>

    <script id="instrument-data"
        type="application/json">[{"Sr_no": "1", "Facility": "3D Animal Imaging Facility", "Make": "Micro CT: Perkin Elmer; IVIS Spectrum: Perkin Elmer; Laser Doppler Imaging and Monitoring System: Moor Instrument; Multiphoton Confocal Microscope: Zeiss", "Model": "MIcro CT: Quantum GX2, IVIS: Spectrum, Laser Doppler Imaging and Monitoring System: VMS LDF, Multiphoton Confocal Microscope: LSM980", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy, X-ray Microscopy, Optical Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Prakriti Tayalia", "Facility_Manager": "Dr. Mamatha Pillai", "Facility_Operator": "Mr. Aniket Mhase", "Department": "", "Features_Working_Principle": "MicroCT (Quantum GX2, Perkin Elmer)Equipment description: The Quantum GX2 is a basic unit consisting of a Cathode Ray Tube mounted onto a gantry rotor along with detector and emitter, a control and display system, a power supply unit. The main outlet is able to incorporate various bed and bed covers for appropriate sizes of samples. Power supply unit is placed at the back of the system.Principle: There are cathode ray tubes present in the upper dome of the instrument, whereas below that there is a rotor gantry with detector, emitter, and sample holder, and down in the working mechanics of the equipment. When a particular current with a high voltage hits the cathode tubes, X rays are generated which are focused toward the sample passing through the particular filter. Once the X rays are focused onto the sample, it will absorb, scatter the x ray. The aligned detector is a CMOS camera which will convert the X ray beam into a displayable image onto the screen area. Further this image is analyzed using a particular software.Applications: Micro-Computed tomography is a useful tool to get sharper images of a sample based on absorption of X-ray for better visualization and representation at a micro level. Micro-CT uses a PMT tube and variety of filter for a wide range of sample type and size. Micro-CT can be used to image and measure bone density and fat contents of the small animalsIn vivo Imaging System (IVIS Spectrum, Perkin Elmer) Equipment description: The IVIS Spectrum comprises a laser, a bed, an anesthesia unit, a set of filters, and a CCD camera detector. Additionally, it includes a PC for display and dedicated software called Living Images for image analysis.Principle: The IVIS emits laser beams across a range of wavelengths from the UV to far infrared region. When a sample is placed within the field of view (FOV), the laser passes through an excitation filter to obtain desired wavelength light, which interacts with the sample and emits photons. The emitted light passes through an emission filter, allowing the desired wavelength to form an image using the CCD camera.Applications: IVIS Spectrum facilitates various applications, including:Luminescence and fluorescence in vivo samplingBio-distribution studiesLong-term monitoring of drug effectsMutiphoton Confocal Microscope (LSM 980, Carl Zeiss)To analyze samples such as small animals, cells, 3D cell seeded scaffolds etc. with as little disturbance as possible, you must use low labelling density for your biological models. This requires excellent imaging performance combined with low phototoxicity and high speed. LSM 980, your platform for confocal 4D imaging, is optimized for simultaneous spectral detection of multiple weak labels with the highest light efficiency.Laser Doppler imaging and monitoring systemThe moorVMS-LDF laser Doppler monitor for blood flow and temperature monitoring is a high performance, medical grade module for clinic or laboratory. Use of DSP technology brings you a portable, lightweight module featuring uncompromised specification, quality and reliability at a breakthrough price.The moorLDI2 laser Doppler imager is suitable for a wide range of pre-clinical research investigations, more typically where smaller areas are under investigation. The system features unique focused optics to provide 50 micron pixel size and 512 x 512 pixel resolution for high resolution blood flow images. The scan areas range from just 2.5cm x 2.5cm up to 25cm x 25cm with scan times typically less than 5 minutes. Use of a focussed laser provides a deeper measurement depth, optimal for angiogenesis studies such as hind limb ischemia and tumour modelling and pre-clinical cerebral blood flow imaging. Highly refined image measurement and analysis software allows for flexibility in measurement set up and comprehensive analysis functions. The moorLDI2 features a colour photo image of the scanned area and automatic distance measurement, making the positioning and comparison of images easier.", "Body": "", "Facility_Description": "The facility comprise of high end instrument like Micro CT, IVIS, Multiphoton confocal microscope and Laser doppler and monitoring system.", "Instruction_for_Sample_Preparation": "In Vivo Imaging basically uses live animal for imaging hence no prior sample preparation is usually required, however ex vivo imaging protocol require staining which differ according to its applications, which should be discussed briefly with the operator while booking the slot.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "Standard Operating Procedures.pdf\n  (330.02 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "2", "Facility": "3D Bioprinter", "Make": "CELLINK", "Model": "BioX6 , Inkredible", "Date_of_Installation": "13 March, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Microfabrication", "Available_Equipment_Mode_of_use": "3D BIOPRINTER BIO X6 and Inkridble , CO2 Incubator, Biosafety cabinet", "Facility_In_Charge": "Abhijit Majumder, Shamik Sen", "Facility_Manager": "JITENDRA KUMAWAT", "Facility_Operator": "JITENDRA KUMAWAT , 30006312@iitb.ac.in", "Department": "Chemical Engineering", "Features_Working_Principle": "The Cellink BIO X6 3D bioprinter operates on the principle of additive manufacturing, where biological components, biochemicals, and living cells are precisely deposited in a layer-by-layer fashion to fabricate complex three-dimensional structures. This process is guided by a digital design file, ensuring accurate spatial control over the placement of functional constituents", "Body": "Theoretical resolution XY: - 1μmTheoretical layer resolution Z:- 1μmSoftware Resolution XYZ:- 10μm–     Pressure range (internal pump) :- 0–200 kPaPressure range (external air supply) :- 0-700 kPaOutput Pressure Offset:-+/- 5 kPaNo. of printhead slots - 6Photocuring sources (built-in):- 365 nm, 405 nm, 475 nm, 520 nmPrintbed temperature range :- 4-65°CTemperature-controlled Printhead temperature :- 4–65°CPneumatic printhead temperature range:- 30–65°CFilter class, chamber airflow :- HEPA 14UV sterilization :- UV-C (275 nm) 2W outputDimensions:- 800 mm (L) × 400 mm (W) × 500 mm (H) Weight :- 47.4 kg (104.5 lbs) Supported file formats:- G-code, stl, amf, 3mf, obj.", "Facility_Description": "The CELLINK 3D Bioprinter is an advanced system for fabricating tissue-like structures using bioinks with living cells, biomaterials, and growth factors. With high-precision extrusion, multi-material printing, and temperature control", "Instruction_for_Sample_Preparation": "1. Bioink PreparationSelection: Choose bioink based on biocompatibility, viscosity, and crosslinking needs.Mixing: Thaw, pre-warm, and homogenize bioink.Cell Encapsulation: Harvest, centrifuge, and mix cells into bioink under sterile conditions.2. Printing Surface PreparationSurface Selection: Use multiwell plates, petri dishes, or scaffolds.Coating (if needed): Apply collagen or fibronectin for better adhesion.Sterilization: Use UV light, autoclaving, or ethanol.3. Loading Bioink into PrinterCartridge Preparation: Load bioink, remove air bubbles, and seal.Nozzle Selection: Choose an appropriate diameter for resolution and viscosity.Temperature Control: Adjust printhead temperature as required.4. Pre-Printing ChecksCalibration: Align nozzle and perform test prints.Crosslinker Preparation: Prepare appropriate agents for stabilization.5. Post-Printing CareStabilization: Apply crosslinking agents promptly.Incubation: Transfer constructs to an incubator (e.g., 37°C, 5% CO₂).Cleaning: Sterilize nozzles, cartridges, and printbed after use.Reference:-Mandrycky et al. (2016). 3D Bioprinting for Engineering Complex Tissues. Biotechnology Advances, 34(4), 422-434.", "Applications": "Biofabrication of Functional BiomaterialsDisease Modeling & Drug TestingTissue Engineering & Regenerative MedicineScaffold Preparation.Research and Education", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "SOP 3D Bioprinter.pdf\n  (153.09 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "3", "Facility": "3D Laser Lithography", "Make": "Nanoscribe", "Model": "Photonic Professional (GT)", "Date_of_Installation": "30 November, 2018", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Microfabrication, Nanofabrication", "Available_Equipment_Mode_of_use": "1. Mesoscale fabrication of 3D/2D structures on ITO-coated glass substrates/Si wafer using the resist IP-S., 2. Nanoscale fabrication of 3D structures on Borosilicate coverslips using the resist IPL-780, 3. Nanoscale fabrication of 3D structures on Fused silica using the resist IP-DIP", "Facility_In_Charge": "Prof. Prakriti Tayalia, prakriti@iitb.ac.in, 91-22-2576 7797", "Facility_Manager": "", "Facility_Operator": "Ms. Saranya Ajesh, 022-2576-6746, 3dlitho@iitb.ac.in / lithography3d@gmail.com", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "A Phenom tabletop Scanning Electron Microscope (SEM) is available for inspecting printed structures. Internal users can access the SEM by submitting a slot request through Drona, which includes a request form provided alongside the 3D Lithography facility.The Thermo Scientific Phenom ProX Scanning Electron Microscope (SEM) is based on the 5th-generation Phenom desktop SEM platform and is a high-performance SEM for imaging and analysis. It offers a serious alternative to floor model SEMs in applications that include materials science, industrial manufacturing, electronics, earth science, life sciences, education, and more.Make and Model Phenom ProX SEM Specifications / Features : Magnification range- 200x – 20,000x Accelerating Voltage: 5kV to 15 kV Image formats- JPEG/ TIFF Image resolution options- up to 2048 x 2048 pixels Sample stage- Computer-controlled motorized X and Y Detector - Backscattered electron detector (BSD) Sample size – up to 10mm (Ø), up to 5mm (h)Powdered or wet samples are not allowed", "Body": "", "Facility_Description": "The 3D Laser Lithography is a high-resolution 3D printer based on two-photon polymerization (2PP) and designed for ultra-precise and rapid nano and microfabrication. It combines flexibility in design with straightforward operation. Therefore, it is an ideal instrument for science and prototyping in multi-user facilities and research laboratories.Lateral feature size: 200nmLateral resolution: 500nmWorking Principle:3D Printing uses Two-Photon Polymerization (2PP) technology to fabricate three-dimensional micro and nanostructures using photo-sensitive materials based on direct laser writing.A necessary condition for two photons of near-infrared light being absorbed simultaneously is a sufficiently high light intensity that is provided by a femtosecond pulsed laser beam. Typically, the laser is focused on the resin, and two-photon polymerization (2PP) is triggered only in the focal spot volume, where the light intensity exceeds a polymerization threshold. The resin is otherwise transparent to the wavelength of the photons.The smallest printable 3D volume is termed a voxel, which is analogous to a 2D pixel. Moving the laser focus along a trajectory in all three dimensions enables the printing of structures built from multiple voxels and printed lines. This technology enables the printing of structures with small, medium, and large feature sizes in 3D as well as 2D patterns.", "Instruction_for_Sample_Preparation": "For SEM analysisThe sample size should not exceed 10mm (Ø), up to 5mm (height)Powdered samples are not allowed for SEM.Samples should be dried properly; wet samples are not allowed for SEM.", "Applications": "Applications of the 3d Laser Lithography Facility:-Life sciencesMicrofluidicsMicroopticsIntegrated photonicsMaterials engineering Micromechanics and MEMSApplications of the SEM Facility:-Materials Science/MetallurgyDental and medical Corrosion  Polymer Science Energy Science/Engg. Biological and life sciences SemiconductorsCivil and Earth SciencesNanotechnologyCeramicsPharmaceuticals", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Sweta Rani, Arun Jaiswal, Rahul Kumar Das, Gaurav Pratap Singh, Ajinkya Palwe, Sumit Saxena, Wenlong Cheng, and Shobha Shukla*. “Fabrication of All-dielectric, 3D Chiral Metamaterial Using Two-photon Lithography”. Frontiers in Optics + Laser Science 2023 (FiO, LS) Technical Digest Series (Optica Publishing Group, 2023), paper JM7A.6Sweta Rani, Arun Jaiswal, Rahul Kumar Das, Gaurav Pratap Singh, Ajinkya Palwe, Sumit Saxena, Wenlong Cheng, and Shobha Shukla*. “Femtosecond-Laser Assisted Fabrication of Two-Dimensional Photonic Crystal Slab”. Technical Digest Series (Optica Publishing Group, 2023), paper JM7A.37  Pillai MM, Ajesh S, Tayalia P*. “Two-photon polymerization based reusable master template to fabricate polymer microneedles for drug delivery”. MethodsX. 2023. 102025, ISSN 2215-0161. Indian patent application no.202221036495- “A method of producing a template and negative mold for microneedle array” filed on 24 June 2022."}, {"Sr_no": "4", "Facility": "4K Magneto-optic microscope with IV characterization", "Make": "attocube", "Model": "attoDRY1000", "Date_of_Installation": "25 April, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "Widefield magnetic field imaging [4K to 70K], Confocal micro-PL imaging [4K to 70K], Low temperature spectroscopy [4K to 70K]", "Facility_In_Charge": "Prof. Kasturi Saha", "Facility_Manager": "Ms. Varsha Ingle, varshaingle@iitb.ac.in", "Facility_Operator": "Mr. Swapnil Ravindra Bait, 24d0536@iitb.ac.in, Dr. Somak Basistha, somak.basistha@iitb.ac.in", "Department": "Electrical Engineering", "Features_Working_Principle": "The system is cryogen-free cryostat capable of reaching temperatures as low as 4 K and magnetic fields up to 1 T. It utilizes pulse tube technology for cooling without the need for cryogenic liquids, minimizing vibrations and allowing for easy sample exchange.", "Body": "Pulse Tube Cold Head: Drives the cooling via gas compression and displacement. Sample Vacuum Space: Providesisolation and thermal coupling for the sample. Outer Vacuum Space: Enclosesthe sample vacuum space, providing an additional insulation layer.Compressor Unit: Provides high-pressure helium to the pulse tube.Overpressure Valves: Ensures pressure safety in both the inner and outer vacuum chambers", "Facility_Description": "Cryostat model : attoDRY 1000Base temperature: 3.5 KMimimum sample temperature: 4 K (variable up to 70 K)Superconducting vector magnets : upto ±1 Tesla in X, Y, Z directionExcitation laser : 532 nm    (0 - 40 mW)Brightfield & magnetic field imaging possibleMicrowave measurement : 12.4 MHz - 6 GHzPer pixel sensitivity : 1-5 µT/√Hz Low temperature I-V measurements are also possibleSpectrometer : Andor Kymera 328i  PL measurements are also possible from 4 K to 70 K", "Instruction_for_Sample_Preparation": "NA", "Applications": "", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "SOP for attodry 1000 Cryostat_0.pdf\n  (4.79 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "5", "Facility": "600 MHz JEOL Nuclear Magnetic Resonance Spectrometer", "Make": "JEOL, JAPAN", "Model": "ECZR Series 600 MHz NMR SPECTROMETER", "Date_of_Installation": "1 August, 2017", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "Solution and Solid State modes,Capable of Multinuclear NMR and 1D, 2D, 3D NMR and Variable Temperature experiments", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022 2159 6851", "Facility_Operator": "Meenal Hande,  Mayura Chaubal, nmr600.saif@csif.iitb.ac.in,  nmr600@iitb.ac.in,  022 2159 6889", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Principle: Nuclear Magnetic Resonance (NMR) spectrometers are analytical devices that exploit the magnetic properties of certain atomic nuclei to determine physical and chemical properties of atoms or the molecules in which they are contained.NMR is a spectroscopic technique that detects energy absorbed by changes in the nuclear spin state. It involves transition of a nucleus from one spin state to another with the resultant absorption of radiofrequency radiation by spin active nuclei (nuclei with spin ≠ to zero) when they are placed in a magnetic field. A plot of peak intensity versus the frequency absorbed (represented as δ,chemical shift) constitutes an NMR spectrum. Features:  Spectrometer Frequency: 600 MHzThree Solution State Probes:1) Royal Probe - A Multinuclear 5 mm double resonance Broadband Liquid Probe with Variable temperature facility to cover nuclei preferably 15N to 31P and Variable temperature accessory for -100oC to +150oC. Automatic tuning and matching for all observation Nuclei.2) Triple Resonance 5mm HCN Probe for performing 3D NMR experiments with 1H,13C and 15N at temperatures in the range -20oC to +100 oC3) TH5 Probe - Observation Nuclei 15N to 31P and 1H and 19F, and Variable temperature accessory for -100o to +150oC. Automatic tuning and matching for all observation Nuclei.Two Solid Sta/te CP MAS Probes:i) 3.2mm HXMAS probe with fast MAS = 20KHz spinning speed to cover nuclei in the range of 15N to 31P and Variable temperature capability in the range -20 oC to +80 oC.ii) 1mm HXMAS Probe with fast MAS = 75KHz spinning speed to cover nuclei in the range of 15N to 31P and Variable temperature capability in the range -40 oC to +40 oCAuto Sample Changer: Available for 64 samples.NMR Processing Software: Delta NMR Data Processing Software.", "Body": "", "Facility_Description": "Spectrometer Frequency - 600 MHz with 3RF Channels, Solution State Probes - 5mm multinuclear Solution State - Royal Probe and TH5 probe, HCN Triple Resonance Solution probe for 3D NMR, 1 mm and 3.2 mm CPMAS probes for Solid State NMR, Auto sampler and Variable Temperature capabilities", "Instruction_for_Sample_Preparation": "Users should mention the correct solubility of the samples and the type of experiment to be done along with the Spectral range (ppm) to be scanned.", "Applications": "Studying reaction processes and Structural analysis of organic compounds.Drug screening and designMetabolite and bio-fluids analysisDetermination of tertiary structures and dynamics of biomolecules.Quantitative analysis of mixtures containing known compounds.Chemical dynamics and Diffusion coefficients, etc.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "6", "Facility": "Advanced Liquid Handling Platform", "Make": "Tecan Sales Austria GmbH", "Model": "Tecan Freedom Evo 150", "Date_of_Installation": "27 April, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sarika Mehra", "Facility_Manager": "", "Facility_Operator": "Ms. Sheetal Tapkire, rcp_chemical@che.iitb.ac.in", "Department": "Chemical Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "The Tecan Freedom EVO 150 is a high-precision automated liquid handling system designed to support medium- to high-throughput research in molecular biology, genomics, proteomics, drug discovery, and clinical diagnostics. As part of the Freedom EVO series, it offers scalability, modularity, and reproducibility, making it an essential tool for laboratories requiring precise liquid handling with minimal manual intervention. It supports microliter to milliliter volume handling, utilizing air displacement and liquid-filled pipetting technologies to ensure highly accurate and reproducible liquid transfers.Integrated Modules for Research ApplicationsLiquid Handling ArmsConfigurable with single-channel, 8-channel, or 96-channel pipetting armsEquipped with capacitive liquid level sensing for precise aspiration and dispensingSupports low-volume pipetting, essential for NGS library prep, qPCR, and cell-based assaysRobotic Manipulator (RoMa) ArmAutomates the transfer of microplates, tubes, and labware across the deckFacilitates seamless workflow automation, reducing manual intervention and increasing throughputSpark Multimode Microplate Reader with Magellan SoftwareEnables high-throughput absorbance, fluorescence, luminescence, and multimodal detectionControlled via Magellan software, allowing advanced data analysis, kinetic studies, and spectral scanningIdeal for ELISA, enzymatic assays, protein quantification, and cell viability assaysIntegrated Temperature-Controlled IncubatorProvides precise thermal  and CO2 levels regulation for cell culture, enzyme kinetics, and biochemical reactionsSupports variable temperature settings and humidity control for assay reproducibilityEnsures optimal conditions for long-duration experiments and kinetic studiesPCR WorkstationDesigned for high-throughput PCR/qPCR reaction setup, ensuring sterility and contamination controlIntegrates HEPA filtration and UV sterilization for a contamination-free environmentSupports automated master mix preparation, sample dilution, and plate sealingMagnetic Bead & Vacuum-Based Extraction ModulesOptimized for nucleic acid purification, protein extraction, and immunoassaysCompatible with magnetic bead-based separation and vacuum filtration workflowsMicroplate Stackers & ShakersAutomates plate handling, mixing, and incubation to improve walkaway automationEnsures homogeneity in assay preparation and cell-based workflowsThe Tecan Freedom EVO 150, integrated with Spark, Magellan, an advanced incubator, and a PCR workstation, is a cutting-edge solution for high-throughput research laboratories, enhancing assay reproducibility, sample integrity, and workflow automation.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "7", "Facility": "Advanced Mechanical Testing Facility", "Make": "MTS Systems Corporation", "Model": "1.Planar Biaxial System – 100kN,  2.Axial Torsion Test System-250kN/2000Nm, 3.Axial Fatigue System- 100kN, 4.Rotary Bending Fatigue System- 20Nm", "Date_of_Installation": "13 January, 2020", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Name : Prof. Sushil Mishra, Email : sushil.mishra@iitb.ac.in", "Facility_Manager": "KT Benny", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "Features : 1. Planar Biaxial System – 100kN:This system employs multiaxial loading technology to apply and measure in-plane stresses in both the X and Y axesa) Strain measurement Using DIC and Video extensometerHigh Temperature Test Facility Upto 600oC2. Axial Torsion Test System-250kN/2000Nm: a) Video extensometer:This is an Optical (non-contact) instrument to measure strain on specimen.b) Electronic extensometer Room Temperature:Fixed gauge length: 25 mm (max. elongation  50% of gauge length)Variable gauge length: 10, 15, 20, 25, 30, 35, 40, 45, 50 mm5 mm and 10 mm dynamic extensometerHigh Temperature (up to 14000C ):Gauge length: 12mm (Max. elongation +20%/-10%)Multi-axial Extensometer: Gauge length: 25 mmc) Clip on gauge or CTOD gaugeGauge length: 5 and 12 mmd) Environmental chamberTemperature Range:  -120 0C to +350 0Ce) FurnacesTwo zone furnace: 200-1200 degC ( Min. Gauge Length: 120 mm)Three zone furnace: 200-1200 degC (Min. Gauge length: 16 mm) **Threaded samples are required.f) Three Point and Four Point bend fixturesSpan: 38-305 mm3. Axial Fatigue System- 100kN:a) Video extensometerThis is an Optical (non-contact) instrument to measure strain on specimen.b) Electronic extensometerRoom Temperature:Fixed gauge length: 25mm (max. elongation  50% of gauge length)Variable gauge length: 10, 15, 20, 25, 30, 35, 40, 45, 50 mm5 mm and 10 mm dynamic extensometerHigh Temperature (up to 1200 degC ):Gauge length: 12mm (Max. elongation +20%/-10%)c) Clip on gauge or CTOD gaugeGauge length: 5 and 12 mmd) Environmental chamberTemperature Range:  -120 0C to +350 0Ce) Furnaces:Two zone furnace: 200-1200 degC ( Min. Gauge Length: 120 mm)Three zone furnace: 200-1200 degC (Min. Gauge length: 16 mm) **Threaded samples are required.f) Three Point and Four Point bend fixturesMinimum Span: 38 mmMaximum Span: 305 mmg) MTS High temperature grips for Threaded and Shouldered End Samples4. Rotary Bending Fatigue System- 20Nm: Specifications: Machine capacity: up to 20 Nm (Bending moment) Operating speed: 200-10000 RPM Speed resolution: 1 RPM Operating temperature: ambient to 1000 degC Temperature control: +/- 20 degC Component diameter: 2-16 mm Dead weight: 1N-3Nos., 2N-1No., 5N-1No., 10N-2Nos., 20N-1No., 50N-1No. 5. Digital Image Correlation (DIC):The VIC-3D Fulcrum Module allows low-speed cameras to capture displacement and strain measurements during periodic, high-speed events. It allows users to accurately trigger low-speed cameras at peaks, valleys, or phase intervals in the driving frequency. Applications include fatigue tests.Since VIC-3D calculates the Lagrangian strain tensor on the specimen surface, the transverse strain can be used to calculate the reduction in a cross-sectional area of the sample using a volume conservation constraint.Technical specification related to high speed camera  :Maximum image capture rate: 1,50,000 fps (at minimum resolution) and 2000 fps(at maximum resolution)Minimum image capture rate: 50 fpsMaximum Resolution: 1280×1024 pixelsMemory Capacity: 17,500 images at maximum resolution. Working Principle : 1. Planar Biaxial System – 100kN:It is a servo hydraulic machine which is an automatic device that uses error-sensing negative feedback to correct the action of a mechanism. It usually includes a built-in encoder or other position feedback mechanism to ensure that the output achieves the desired effect.It applies correctly only to systems where the feedback or error-correction signals help control mechanical position, speed or other parameters. The system uses closed-loop feedback, which classifies it as a servomechanism.2. Axial Torsion Test System-250kN/2000Nm:It is a servo hydraulic machine which is an automatic device that uses error-sensing negative feedback to correct the action of a mechanism. It usually includes a built-in encoder or other position feedback mechanism to ensure that output is achieving the desired effect.It applies correctly only to systems where the feedback or error-correction signals help control mechanical position, speed or other parameters. The system uses closed-loop feedback, which classifies it as a servomechanism.3. Axial Fatigue System- 100kN:It is a servo hydraulic machine which is an automatic device that uses error-sensing negative feedback to correct the action of a mechanism. It usually includes a built-in encoder or other position feedback mechanism to ensure that the output achieves the desired effect.It applies correctly only to systems where the feedback or error-correction signals help control mechanical position, speed or other parameters. The system uses closed-loop feedback, which classifies it as a servomechanism.4. Rotary Bending Fatigue System- 20Nm:The machine is designed based on the rotating beam principle. The load condition is similar to that of a simple beam symmetrically loaded at two points. When the load is applied, tensile and compressive stresses develop in the material below and above the neutral axis respectively. For the first one half revolutions, the stresses in the specimen originally below the neutral axis are reversed from tension to compression and vice versa. Upon completing the revolution, the stresses are again reversed so that during one revolution, the test specimen passes through a complete cycle of flexural stresses (tension and compression).5. Digital Image Correlation (DIC):DIC relies on finding the maximum of the correlation array between pixel intensity array subsets on two or more corresponding images, which gives the integer translational shift between them. The method tracks the changes in grey value pattern in small neighbourhoods called subsets during deformation.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "1. Planar Biaxial System – 100kN:Sample Dimensions (mm): Preferable ASTM/equivalent standard samplesa) Gauge length: 200-350 mmb) Width: 10-50 mmc) Thickness: 0.5 - 19mm2. Axial Torsion Test System-250kN/2000Nm:Preferable ASTM/equivalent standard samplesa)RoundGauge length: 20-300 mmDiameter: 6-26 mmb)FlatGauge length: 20-300 mmWidth: 10-50 mmThickness: ~0.5-25.9 mm3. Axial Fatigue System- 100kN:a) RoundGauge length: 20-300 mm Diameter: 6-22.9 mmb) Flat Gauge length: 20-300 mmWidth: 10-70 mmThickness: ~0.5-19 mm4. Rotary Bending Fatigue System- 20Nm:Preferable ASTM standard samplesa) At Room temperatureGauge length: 60-200 mmDiameter: 2-16 mmb) At elevate temperatureGauge length: 200 mmDiameter: 2-16 mm", "Applications": "1.Planar Biaxial System – 100kN: 1.a) Aerospace and Power Generation: To study engine turbine materials, like metal alloys, ceramics and composites, to allow them to operate at increasingly higher temperatures for improved efficiency 1.b) Ground Vehicle: To validate new material models for sheet metal or composite components that are being used to meet more stringent fuel economy targets and increased safety requirements 1.c) Construction: To study advanced materials that are increasingly used to allow more complex designs, to address security issues from natural and man-made disasters and to meet environmental requirements. 1.d) Oil and Gas Pipeline Components: To evaluate the material properties for high temperature and corrosive environment. To design high efficiency turbine, pressure vessels, heat-exchanges etc. 1.e) Large Scale Wind Turbine Structures: Efficient design of wind turbine structures by evaluating the material properties at multiaxial loading. 2.Axial Torsion Test System-250kN/2000Nm: Axial-torsion testing machines help characterize biaxial mechanical properties of materials, both in static and dynamic conditions, which helps in choosing the right materials for different applications where components are exposed to axial torsion loading profiles. 2.a) Fatigue Testing This system is ideal for the exacting demands of material fatigue testing. Highly stiff integrated actuator beams, patented hydraulic grips, high resolution force transducers and precision alignment fixtures combine to deliver tightly controlled and consistent through-zero specimen loading. Example: Constant Amplitude, Variable Amplitude, Low Cycle Fatigue (LCF) and High Cycle Fatigue (HCF) 2.b) Fracture Testing The system can be readily configured to perform linear elastic and elastic-plastic fracture toughness testing. The system load frame can be used for both pre-cracking and fracture testing and equipped with a selection of standard compliant grips and precision clip-on displacement gauges. Example: Fracture Toughness, Fatigue Crack Growth, Crack Propagation, JIc and KIc 2.c) Component Testing Highly configurable MTS Axial Torsional System feature the test space and performance flexibility required to perform both static and dynamic component testing. These systems can be equipped with fixtures for single and multiple specimens, as well as a full selection of extensometers that are versatile enough to measure displacement from a variety of locations on a specimen. Example: Strength and Mechanical Properties of Components and Assemblies 2.d) Monotonic Testing Multipurpose MTS Axial Torsion systems are equipped to meet a full spectrum of monotonic—or static-material testing requirements. These systems run industry-leading MTS Test Suite software, which combines powerful test definition capabilities with simplified runtime operation and the ability to analyse data report test results in a variety of standard and custom formats. Example: Tensile, Compression, Bend and Stress Relaxation3. Axial Fatigue System- 100kN: 3.a)Fatigue Testing The MTS Landmark system is ideal for the exacting demands of material fatigue testing. Highly stiff integrated actuator beams, patented hydraulic grips, high resolution force transducers and precision alignment fixtures combine to deliver tightly controlled and consistent through-zero specimen loading. Example: Constant Amplitude, Variable Amplitude, Low Cycle Fatigue (LCF) and High Cycle Fatigue (HCF) 3.b) Fracture Testing The system can be readily configured to perform linear elastic and elastic-plastic fracture toughness testing. The system load frame can be used for both pre-cracking and fracture testing and is equipped with a selection of standard compliant grips and precision clip-on displacement gauges. Example: Fracture Toughness, Fatigue Crack Growth, Crack Propagation, JIc and KIc 3.c) Component Testing Highly configurable MTS Landmark systems feature the test space and performance flexibility required to perform both static and dynamic component testing. These systems can be equipped with fixtures for single and multiple specimens, as well as a full selection of extensometers that are versatile enough to measure displacement from a variety of locations on a specimen. Example: Strength and Mechanical Properties of Components and Assemblies 3.d) Monotonic Testing Multipurpose MTS Landmark systems are equipped to meet a full spectrum of monotonic—or static-material testing requirements. These systems run industry-leading MTS Test Suite software, which combines powerful test definition capabilities with simplified runtime operation and the ability to analyse data report test results in a variety of standard and custom formats. Example: Tensile, Compression, Bend and Stress Relaxation Digital Image Correlation (DIC): Strain Contour on the specimen, strain on individual points, average and maximum strains and various other geometric data can be obtained by using DIC technique. Using the High Speed Camera, crack propagation can be clearly studied. Can use DIC to analyse images of in situ tensile or compression test.4. Rotary Bending Fatigue System- 20Nm: To test the fatigue strength of materials under bending stress. It can be used in a variety of industries, including Automotive, Medical, Rail transit, Energy and Materials research.", "Chemical_allowed": "--", "Gases_allowed": "--", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Journal Publications:1. \" Fracture toughness characteristics of thermo-mechanically rolled direct quenched and partitioned steels\" Gaurav Kumar, Sumit Ghosh, Sakari Pallaspuro, Mahesh Somani, Jukka Kömi ,Sushil K. Mishra , Amol A. Gokhale Material Science and Engineering A, Volume 840 (2022)2.\"The Role of Microstructure Inhomogeneity in Ti-6Al-4V Forging on Fracture Toughness Behaviour\", Anish Ranjan, Jyoti Shankar Jha, Sushil K. Mishra, Journal of Materials Engineering and Performance. (2022)3. Hitarth Maharaja, Bimal Das, Amit Singh, Sushil Mishra, “Comparative assessment of strain-controlled fatigue performance of SS 316L at room and low temperatures”, International Journal of Fatigue (2023)4. A. H. Siddiqui, J. P. Patil, S. Mishra, “Design of a Biaxial Cruciform Specimen with a High Degree of Plastic Deformation and Yield Locus Evolution”, Experimental Mechanics (2023)5.Micromechanics-based understanding of the stability of film-like austenite in steelsG Kumar, TK Bhandakkar, SK Mishra, AA Gokhale - Materials Science and Technology,Journal of “Materials Science and Technology” (2023)6. Stress Intensity Range Dependent Slowing Down of Fatigue Crack Growth under Strain‐Induced Martensitic Transformation of Film‐Like Retained Austenite G Kumar, S Ghosh, S Pallaspuro, MC Somani, J Kömi… - steel research international (2024)7. Effect of crystallographic orientation on the formation of α-case in Ti-6Al-4Vtitanium alloyJornal of “ metallurgical and Materials transactions” (2024) Oral Presentation:Gaurav Kumar , Jeet Patil , Sakari Pallaspuro , Sumit Ghosh , Mahesh Somani , Sushil K. Mishra , Amol A. Gokhale \"Tensile and Fracture Toughness Behaviour of Thermo-mechanically Rolled Direct Quenched & Partitioned (TMR-DQP) Steels\".Presented in :ASIA STEEL 2021 (5th-9th December 2021)Paper presentation:1. \"Structural integrity assessments of Ni-Cr-Mo-V Steel\", Satyaprakash Mishra, Anish Ranjan, Sushil Mishra, 8th international Conference on Product Life cycle Modeling and Synthesis (PLMSS) -2021, Paper Accepted for publication.2. Yield Locus Develepment and Microstructure charactarisation of AA2219 under planar Biaxial Loading, Presented at IDDRG 2023 Sweden and NUMIFORM 2023 poland by priya Tiwari3. Yield locus evolution of SS 316L at high strain: experimental and numerical modeling Presented at NUMIFORM2023 poland by Rubal Dongarwar4. Maharaja, H., Das, B., Singh, A., Mishra, S., Enhancement in fatigue resistance at low temperature strain-controlled fatigue of SS 316L: Assisted by martensitic transformation,FEMS EUROMAT 2023Poster Presentation: 1. Rubal Dongarwar, Sushil Mishra, Rakesh Mote, Rajeev Kapoor, \"Phase transformation in SS316L by low cycle cryo fatigue and it's reversion\", NMD ATM 20222. Anantha Lakshmi Prasanna Tatavarty, Amit Singh, Sushil Mishra, SVS Narayana Murty, “Modeling the low cycle fatigue behaviour of AA2219 aluminium alloy”, NMD ATM 20223. Priya Tiwari, Amit Singh, SVS Narayan Murty, Sushil k. Mishra, “Mechanical and Microstructural Characterisation of AA2219”, NMD ATM 20224. Anish Ranjan, Amit Kumar Singh, Sushil Mishra, “Local Anisotropy in Strain Response of an α/β Titanium Alloy”, NMD ATM 2022"}, {"Sr_no": "8", "Facility": "Advanced Rheology Facility", "Make": "ARES G2 from TA Instruments, MCR 702 from Anton Paar, Rosand RH07 capillary rheometer from NETSCH", "Model": "ARES G2 from TA Instruments, MCR 702 from Anton Paar, Rosand RH07 capillary rheometer from NETSCH", "Date_of_Installation": "15 October, 2020", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Structural Characterization, Structural Characterization", "Available_Equipment_Mode_of_use": "High Temperature Accessories. Linear Dynamic Mechanical Analysis (DMA) TwinDriveRheo-Microscopy RHEO-SALS UV Curing Cell RHEO-PIV RHEO-DRD (Di-Electro Rheology Device) RHEO-MRD (Magneto Rheology Device) RHEO-ERD (Electro Rheology Device) POWDE", "Facility_In_Charge": "Prof. Jyoti R. Seth jyoti@che.iitb.ac.in022-2576-7226  and 022-2572-6895 (Fax)", "Facility_Manager": "Dr. Madhuri Bhatt (madhuribhatt27@iitb.ac.in, rheometer@iitb.ac.in)", "Facility_Operator": "Dr. Madhuri Bhatt (madhuribhatt27@iitb.ac.in, rheometer@iitb.ac.in)", "Department": "Chemical Engineering", "Features_Working_Principle": "Working PrincipleRheology is the study of flow and deformation of materials. Deformation and flow are referred to as strain or strain rate, respectively, and indicate the distance over which a body moves under the influence of an external force, or stress. For this reason, rheology is also considered to be the study of stress-strain relationships in materials. A rheometer is a precision instrument that contains the material of interest in a geometric configuration, controls the environment around it, and applies and measures wide ranges of stress, strain, and strain rate.Material responses to stress and strain vary from purely viscous to purely elastic to a combination of viscous and elastic behaviour, known as viscoelasticity. These behaviours are quantified in material properties such as modulus, viscosity, and elasticity.FeaturesARES-G2The ARES-G2 provides independent measurements of stress and strain. The ARES-G2 is the only Separate Motor and Transducer (SMT) rheometer in the world. An SMT is more than two drives. It is a separate motor and transducer optimized for every aspect of rheological measurement. A motor designed for perfect deformation. A transducer optimized for exacting stress measurements. The result is the purest rheological measurements, free of instrument artefacts over the widest ranges of stress, strain and frequency. The ARES-G2 Torque Rebalance Transducer (TRT) is the third generation of rebalance transducers designed and optimized exclusively for the most exacting measurements of sample stress. The ARES-G2 incorporates patented non-contact temperature sensor technology for active measurement and control of both the upper and lower plate temperature.MCR 702MCR 702 MultiDrive as a CMT (Combined Motor Transducer) rheometer with a single EC motor . Performing ‘classic’ stress-controlled tests. Signal from encoder and torque from upper motor to calculate rheological properties. Connection of all temperature devices and application-specific accessories of the MCR rheometer series possible. Compliance calibration is done as part of calibration. Temperature control of air bearing responsible for long-lasting torque and normal force accuracy. Both motor units are employed in a synchronized fashion. One motor (upper) is brought to a fixed position and operated solely as a torque transducer. Offer Zero Compliance. One motor (lower) operates as a drive unit. Speed or angle from bottom motor and torque from upper motor are used to calculated rheological properties. Software displays the physical properties of both motors.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Fluid type (suspension, emulsions, polymer solution, electrorheological fluid, magnetorheological fluid, etc..), if there are particles then their size and material, if is it volatile, MSDS of sample.Type of measurement (shear sweep, SAOS, electrorheology, interfacial rheology, etc,).Required volume of sample is depends on the type of analysis and test.", "Applications": "NanotechnologyBiology and Life SciencesMaterial SciencePharmaceutical AnalysisSemiconductorsPolymer SciencePaint IndustryPetroleum industryFormulation: Measure and predict the consequences of formulations based on chemistry, concentration, and phase structure. Study existing materials and understand formulation based on rheological propertiesProcessing: Choose formulations and processes that save time, power, and preserve desired finished properties.Performance Prediction: Make a priori predictions of material performance based on known use conditions without specifically mimicking application conditions.Consumer Acceptance: Quantitatively optimize properties that customers perceive as valuable based on consistency, texture, mouth feel, behavior at chewing and swallowing, applicability, spreading, pourability, and stability during storage", "Chemical_allowed": "Chemical has a pH between 4 to 10.Sample should be compatible with Stainless Steel 316, aluminum, and quartz.DMSO, DMF, THF and any highly acidic and basic solvents are not allowed to be used.", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Details of published paper for F. Y. 2021-2022Shinde, Sachin Balasaheb, and Lalit Kumar, \"New Method for Gelation Temperature Measurement without Disturbing the Crystal Network.\" Industrial & Engineering Chemistry Research 60, no. 23 (2021): 8565-8578.George E, Jahan I, Barai A, Ganesan V, Sen S,.”High ligand density drives extensive spreading and motility on soft GelMA gels.” Biomed Mater. 2021 Aug 13;16(5)Ankita Jain, Jyoti R. Seth, Vinay A. Juvekar, Nidhi Verma and Nandini Pandey, “Remarkable decrease in the viscosity of waxy crude oil under an electric field,” Soft Matter, 2020,16, 10657-10666Details of published paper for F. Y. 2022-2023Samim Ali, Anju Tiwari, Thean Yeoh, Pankaj Doshi, Narayani Kelkar, Jaymin C. Shah and Jyoti R. Seth (2022), Crystallization and Rheology of Mono- and Diglycerides and Their Role in Stabilization of Emulsion Droplets in Model Topical Ointments, Langmuir, 38, 28, 8502–8512Mithun Madhusudanan, Jotypriya Sarkar, Sudeshna Dhar and Mithun Chowdhury (2023), Tuning the Plasticization to Decouple the Effect of Molecular Recoiling Stress from Modulus and Viscosity in Dewetting Thin Polystyrene Films, Macromolecules, 56, 4, 1402–1409Jijo Easo George, Riddha Manna, Shomdutta Roy, Savita Kumari, Debjani Paul (2023), Pump-free and high-throughput generation of monodisperse hydrogel beads by microfluidic step emulsification for dLAMP-on-a-chip, BiorxivNamrata Singh, Komal Patel, Ambuja Navalkar, Pradeep Kadu, Debalina Datta, Debdeep Chatterjee, Semanti Mukherjee, Ranjit Shaw, Nitisha Gahlot, Abhishek Shaw, Sachin Jadhav, Samir K Maji, (2023), Amyloid fibril-based thixotropic hydrogels for modeling of tumor spheroids in vitro, Biomaterials, 295, 122032-122049Details of published paper for F. Y. 2023-2024Samim Ali, Anju Tiwari, Thean Yeoh, Pankaj Doshi, Narayani Kelkar, Jaymin C. Shah and Jyoti R. Seth (2022), Crystallization and Rheology of Mono- and Diglycerides and Their Role in Stabilization of Emulsion Droplets in Model Topical Ointments, Langmuir, 38, 28, 8502–8512  Mithun Madhusudanan, Jotypriya Sarkar, Sudeshna Dhar and Mithun Chowdhury (2023), Tuning the Plasticization to Decouple the Effect of Molecular Recoiling Stress from Modulus and Viscosity in Dewetting Thin Polystyrene Films, Macromolecules, 56, 4, 1402–1409 Jijo Easo George, Riddha Manna, Shomdutta Roy, Savita Kumari, Debjani Paul (2023), Pump-free and high-throughput generation of monodisperse hydrogel beads by microfluidic step emulsification for dLAMP-on-a-chipNamrata Singh, Komal Patel, Ambuja Navalkar, Pradeep Kadu, Debalina Datta, Debdeep Chatterjee, Semanti Mukherjee, Ranjit Shaw, Nitisha Gahlot, Abhishek Shaw, Sachin Jadhav, Samir K Maji, (2023), Amyloid fibril-based thixotropic hydrogels for modeling of tumor spheroids in vitro, Biomaterials, 295, 122032-122049Details of published paper for F. Y. 2024-2025Lalit Bhola, Saurav, A. K., Mujumdar, P. M., Guruprasad, P. J. 2023. A numerical approach for modeling response of shape memory polymer composite corrugated structure. Smart Materials and Structures, 32(8):085004Yadav, D., Das, R.K., Saxena, S. and Shukla, S., 2023. OGF nanocomposite foam for enhanced recyclability and oil-recovery. Journal of Cleaner Production, 411, p.137266.Avinash Kumar Saurav, Lalit Bhola, Mujumdar, P. M., Guruprasad, P. J. 2024. Equivalent plate model of shape memory polymer composite based variable height corrugated structure. Mechanics of Advanced Materials and Structures"}, {"Sr_no": "9", "Facility": "Alicona micro CMM", "Make": "Bruker Alicona", "Model": "Brukar Alicona Mirco CMM", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Ramesh Singh", "Facility_Manager": "", "Facility_Operator": "Arun Nair", "Department": "Mechanical Engineering", "Features_Working_Principle": "Focus variation microscopy (FVM) is a 3D imaging technique that captures high-resolution surface topography by analyzing changes in focus as the microscope moves through different focal planes. It works by focusing at various depths on the sample and capturing images at each plane. The sharpness of each image varies with the surface height, allowing the system to reconstruct a detailed 3D model of the surface. FVM is a non-contact, high-precision method used for measuring surface roughness, step heights, and other surface features without damaging the sample.", "Body": "Number of measurement points - single measurement: X: 1720, Y: 1720, X x Y: 2.95 Mio. multi measurement: up to 500 Mio.Positioning volume (X x Y x Z) - 310 mm x 310 mm x 310 mm = 29 791 000 mm³Travel speed of axes - up to 100 mm/sCoaxial illumination - LED coaxial illumination (color), high-power, electronically controllable3D Accuracy 10360-8 - EUni:Tr:ODS,MPE = (0.8 + L/600) μm (L in mm) Axis accuracy based on ISO 10360-8. EUniZ:St:ODS,MPE = (0.15 + L/50) μm (L in mm) Valid for single measurements, height step measurements.", "Facility_Description": "Non-contact 3D profiling and imaging deviceForm and roughness measurementMeasure step height ranging from nm to mmTrue Color 3D Imaging", "Instruction_for_Sample_Preparation": "Samples not allowed - Fluid, Transparent and Highly reflective.Fixture - Need to get one's own fixture if you have an intricate sample.Step Height - Step height if any must be less than 2mm.Sample Size - Max (150mm x 150mm x 100mm)Sample Weight - less than 10kg", "Applications": "Surface Quality Inspection Dimensional Measurement 3D Profile Measurement Tolerancing and Geometric Dimensioning Tool Wear Monitoring Optical Metrology", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "10", "Facility": "Analytical Ultracentrifugation Facility", "Make": "Beckman Coulter", "Model": "Optima AUC", "Date_of_Installation": "7 January, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Biochemistry", "Available_Equipment_Mode_of_use": "Absorbance, Intereference", "Facility_In_Charge": "Prof. Ashutosh Kumar, ashutoshk@iitb.ac.in, 02225767762", "Facility_Manager": "Mr. Nitin Bhoite Email Id : 30004943@iitb.ac.in Contact : 022-25764757", "Facility_Operator": "", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Sedimentation of solute particle makes heavier particles to sink and lighter particles to float. If the solution is subjected to high angular velocity, the effect of gravity and thereby the rate of sedimentation greatly increases due to application of external force which is centrifugal force. In analytical ultracentrifuge this redistribution of the particles is monitored using absorbance or interference optical system. This rate of redistribution is used to get the sedimentation coefficients which ca further help to get hydrodynamic properties of the molecular species in the solution.", "Body": "Speed range: 1,000 — 60,000 RPMSpeed control — Actual measured rotor speed, ± 2 RPM at steady state (1,000 RPM to rated speed), It should have option for Braking speed.TimeSet time: — Up to 1000 hrs ( approx.), including Hold runs.Time display indicates time remaining and time elapsed in method scan.Time accuracy ± 50 ppm (5 seconds/day) or similarTemperatureSet temperature: 4 to 40°C in 1°C increments Temperature display: Actual rotor temperature in 0.1°C incrementsAmbient temperature range: 10 to 30°CScanning UV/VIS Absorbance Optical SystemIt should have 10 μJM Xenon Flash Absorbance optics or equivalentWavelength range – 180 to 800 nm (precision: ± 0.5 nm)Photometric display range – 0 to 3 absorption UnitsUsable concentration range – 0 .005 - ~50 mg/mLWavelength scan mode — wavelength increment step size 1.0 nm, from 190 nm to 800 nmInterference Optical SystemRayleigh interference detectionUsable concentration range 0.01 to 20mg/mLWavelength – 660 nmLaser - Red laser 120 mW DiodeScan Rate - approximately every 5 secondsInterferometer precision - approximately ± 0.008 fringeAnalytical RotorsAn-50 Ti Maximum speed up to 50000 RPM and up to 7 samples and a counterbalance can be run at one time.An-60 Ti Maximum speed up to 60000 RPM and up to 3 samples and a counterbalance can be run at one time.Analytical cell, torque stand, counterbalance kit, accessory kit, and cell housing kit.", "Facility_Description": "Beckman Coulter Optima AUC is a tool that provides data used to determine protein molecular weight in basic protein research and quantification of aggregation levels for academic and biopharma research.", "Instruction_for_Sample_Preparation": "", "Applications": "AUC technology can help to provide answers to critical questions about biomolecules. It can give information about following properties:Shape: How spherical is my protein?Diameter: What’s the size of my particle?Mass: What’s the molecular weight of my protein or complex in solution?Stoichiometry: How many subunits comprise my protein?Purity: Are there other particles in my sample?Formulation: How does my protein behave in this buffer?Heterogeneity: Is my protein bound to other molecules, and what’s the configuration of the complex?Aggregation: Is my protein still in a usable form? Should I expect an immune response with my drug formulation?Association: Does my protein associate and/or dissociate with other proteins?Conformation:  Does the conformation of my protein change upon binding to a ligand?", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "11", "Facility": "Atom Probe Tomography", "Make": "CAMECA", "Model": "LEAP 5000XR", "Date_of_Installation": "28 June, 2018", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "Laser Mode, Voltage Mode", "Facility_In_Charge": "Prof. Nagamani Jaya Balila", "Facility_Manager": "", "Facility_Operator": "Mr. Amit Vitthal Kumbhar, amitkumbhar@iitb.ac.in, 022-21596864", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "APT is a unique characterization technique that facilitates three-dimensional visualization as well as in‐depth analysis of nano‐scale features at near‐atomic scale resolution (lateral resolution: 0.3-0.5 nm and depth resolution 0.1-0.3 nm). A sharp tip sample is prepared using Focused Ion Beam (FIB). Prepared sample is then cooled and tip is biased at high DC voltage. Due to the sharpness of the tip, high electrostatic field can be generated. This field is sufficient to field evaporate atoms. By applying voltage pulse or laser pulse the field evaporated ions are projected on the position sensitive detector. Time (Time of flight measurement) taken by the ions to reach the detector is noted and the x, y position of the ions is detected. This allows to reconstruct the original position of the evaporated atoms in the analyzed sample.", "Body": "", "Facility_Description": "IIT Madras has established the National Facility for Atom Probe Tomography (NFAPT) which houses a state of art atom probe tomography \"Local Electrode Atom Probe (LEAP 5000 XR)\" along with \"Helios Dual Beam Scanning Electron Microscope with Focused Ion Beam (FIB)\" for LEAP sample preparation. IIT Bombay, as a founding partner institute, has a remote terminal for the operation of the instrument and software for the analysis of the data after data acquisition. More details can be found on https://nfapt.iitm.ac.in .", "Instruction_for_Sample_Preparation": "Sample dimensions may vary from thin film samples to small blocks (1 cubic cm) of metallic or non-metallic materials. Porous or soft samples cannot be analyzed using APT. All information about the material including processing technique and mechanical properties should be provided with the sample.It is recommended to have some prior results from SEM and TEM and a clear idea about the features to be studied before proceeding for Atom Probe Tomography experiment.The sample preparation will be carried out using FIB at NFAPT, IIT Madras.", "Applications": "Interface analysis in magnetostrictive materialsGrain boundary analysis in metals Investigation of phase change separation processes Atomic scale characterization of dopants  Characterization of advanced alloysThin film characterization Oxide growth in metals", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "LEAP-Step by step procedure to remote mode operation.pdf\n  (1 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1. High Pressure Torsion Processing of Maraging Steel 250: Microstructure and Mechanical Behaviour Evolution, Kevin Jacob, K., Yadav, D., Dixit, S., Hohenwarter, A. and Jaya, B.N., 2020. Materials Science and Engineering: A, p.140665.2. Evolution of sub-surface microstructure under linear reciprocating wear of nanostructured bainitic steel, Kritika Singh, SudharmRathore, Aparna Singh, Materials Characterization (2021),Vol 180: 111407. 3.Oriented assembly of Ni-clusters embedded in semi-insulating NiO epitaxial films, Santosh Kumar Yadav, Bhabani Prasad Sahu and SubhabrataDhar, J. Phys. D: Appl. Phys. 55 (2022) 035002 (7pp).4.Effect of dislocation network on precipitate morphology and deformation behaviour in maraging steels: Modelling and experimental validation,Kevin Jacob, Abhinav Roy, M P Gururajan, Nagamani Jaya Balila5. Formation of tungsten carbide by focused ion beam process: A route to high magnetic field resilient patterned superconducting nanostructures, H Chakraborti et al. Appl. Phys. Lett. 120,132601 (2022).6. Revealing a correlation between microstructure, stoichiometry, coherency strains and mechanical behavior of bulk polycrystalline oxide-based age hardened/toughened ceramic alloys, Luv Gurnani and Amartya Mukhopadhyay, Materials Science and Engineering: A 854 (2022) 143810.7. Micro-mechanisms of failure in nano-structured maraging steels characterised through in situ mechanical tests, Jacob, K., Sahasrabuddhe, H., Hohenwarter, A., Dixit, S. and Jaya, B.N., 2022. Nanotechnology.8. An experimental study on laser ablation of Ultra-thin SiNx layer of PERC solar cells, Pinal Rana, Durga Prasad Khatri, Anil Kottantharayil, and Deepak Marla.  DOI: 10.1177/251659842211299589.Understanding the effects of tetrahedral site occupancy by Zn-dopant in Li-NMC towards high voltage compositional-structural-mechanical stability via operando and 3D Atom Probe Tomography studies, A. Sharma, A. H. Pandey, M. K. Jangid, V. Srihari, H. K. Poswal, A. Mukhopadhyay, ACS Appl. Mater. Interfaces, 2023, 15, 1, 782–794.10. Gupta R., Bhowmick S., Kumar K.C.H., Prasad M.J.N.V. and Pant P, \"Transformation of borides in directionally solidified nickel base superalloy and its mechanical response“, Journal of Alloys and Compounds, p.169996, 202311. BinitaTongbram, Vidya P. Deviprasad, Amit VitthalKumbhar, SaumyaSengupta, Subhananda Chakrabarti, \"Formation of strain reduced In0.54Al0.34Ga0.12As layer of vertically coupled QDs arrays for O-band telecom single photon sources\" Journal of Alloys and Compounds , 960, 17061, 202312. Vivek Kumar Singh, DebarajSahoo, MurugaiyanAmirthalingam, Shyamprasad Karagadde, Sushil K. Mishra, \"Dissolution of the Laves phase and δ-precipitate formation mechanism in additively manufactured Inconel 718 during post printing heat treatments ”Additive Manufacturing ,81, 104021, 202413. Pinal Rana, Durga Prasad Khatri, Anil Kottantharayil, Deepak Marla, \" Laser ablation of thin SiNx layer coated on silicon wafer—evaluation of process performance for PERC solar cell application\", 2024 ,Semicond. Sci. Technol. 39 065003"}, {"Sr_no": "12", "Facility": "Atomic Force Microscopy Park NX20", "Make": "Park Systems", "Model": "NX20", "Date_of_Installation": "2 August, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Force Microscopy", "Available_Equipment_Mode_of_use": "Non-Contact Mode, Contact Mode, Magnetic Force Microscopy (MFM), Conductive AFM, Liquid AFM, Piezoresponse force microscopy (PFM)", "Facility_In_Charge": "Prof. Shobhna Kapoor", "Facility_Manager": "Vijay Mistari", "Facility_Operator": "Vijay Mistari", "Department": "Chemistry", "Features_Working_Principle": "Atomic Force Microscopy (AFM) operates by scanning a sharp probe (cantilever tip) across a sample surface to measure interactions at the nanoscale. The fundamental principle relies on the detection of forces between the probe and the sample.Cantilever & Tip InteractionA sharp tip is mounted on a flexible cantilever.As the tip approaches the sample, intermolecular forces (van der Waals, electrostatic, etc.) cause the cantilever to deflect.Laser-Based Detection SystemA laser beam is focused on the back of the cantilever and reflected onto a position-sensitive photodetector (PSPD).Changes in cantilever deflection are recorded to generate surface topography and force measurements.Feedback MechanismA feedback loop maintains a constant force or distance between the tip and the sample, ensuring precise imaging.Different Imaging ModesNon-Contact ModeContact ModeMagnetic Force Microscopy (MFM)Conductive AFMLiquid AFMPiezoresponse force microscopy (PFM)", "Body": "The Atomic Force Microscope (AFM) consists of a rigid metal or composite frame designed for stability and vibration isolation. It features a piezoelectric scanner that enables precise movement, typically allowing an XY scan range of 10–80 µm and a Z range of a few nanometers to micrometers. The cantilever system, with a sharp probe tip, interacts with the sample to capture topographical and mechanical properties. A laser-based detection system measures cantilever deflection, with feedback control ensuring accurate imaging. The AFM also includes an environmental chamber for imaging in air, liquid, or controlled atmospheres, along with advanced data acquisition software for real-time analysis.", "Facility_Description": "The Atomic Force Microscopy (AFM) Facility is a specialized laboratory equipped for high-resolution surface characterization, nanomechanical measurements, and molecular interactions at the nanoscale. The facility supports a broad range of research applications in materials science, biology, and biophysics.Key Features and Capabilities:High-Resolution Imaging: Enables topographical mapping of surfaces with nanometer-scale resolution.Force Spectroscopy: Measures mechanical properties such as stiffness, elasticity, and adhesion forces at the molecular level.Modes of Operation: Includes contact mode, tapping mode, and non-contact mode for diverse sample analysis.Environmental Control: Options for imaging in ambient air, liquid environments, and controlled atmospheres for biological and material studies.Advanced Data Analysis: Software for

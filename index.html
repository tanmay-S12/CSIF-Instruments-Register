ttps://pubs.acs.org/doi/pdf/10.1021/acs.macromol.0c015012021:Sushanth Gudlur, Garima Goyal, Arpan Pradhan, James C. S. Ho, Rohit Srivastava, and Bo Liedberg*, Cationic Liposomes Enable Shape Control in Surfactant-Free Synthesis of Biocompatible Gold Nanorods, Chem. Mater. 2021, 33, 12, 4558–4567 https://doi.org/10.1021/acs.chemmater.1c00973Pradhan, A.; Mishra, S.; Basu, S. M.; Surolia, A.; Giri, J.; Srivastava, R.; Panda, D. Targeted Nanoformulation of C1 Inhibits the Growth of KB Spheroids and Cancer Stem Cell-Enriched MCF-7 Mammospheres. Colloids and Surfaces B: Biointerfaces 2021, 202, 111702 https://doi.org/10.1016/j.colsurfb.2021.111702Barkha Singh, Rohan Bahadur, Misah Rangara, Mayuri N. Gandhi, and Rohit Srivastava*, Influence of Surface States on the Optical and Cellular Property of Thermally Stable Red Emissive Graphitic Carbon Dots,  ACS Appl. Bio Mater. 2021, 4, 5, 4641–4651, https://doi.org/10.1021/acsabm.1c00379Mehak Jain, Jyoti R. Seth, Lohitha R. Hegde, Kamendra P. Sharma* “Unprecedented Self-Assembly in Dilute Aqueous Solution of Polyethyleneimine: Formation of Fibrillar Network, Macromolecules 2020, 53, 8974−8981 https://pubs.acs.org/doi/pdf/10.1021/acs.macromol.0c01501Patwardhan S*, Mahadik P, Shetty O, Sen S*, \"ECM stiffness-tuned exosomes drive breast cancer motilitythrough thrombospondin-1\", Biomaterials, 2021, 279: 121185.Barai A, Mukherjee A, Das A, Saxena N, and Sen S*, \" actinin-4 drives invasiveness by regulatingmyosin IIB expression and myosin IIA localization\", J. Cell Sci, 2021: jcs.258581.George E, Jahan I, Barai A, Ganesan V, and Sen S* (2021), \"High ligand density drives extensivespreading and motility on soft GelMA gels\", Biomed. Mater. 16, 054103.NishadKadam A.Sarkar “A rechargeable zinc–air battery with decoupled metal oxidation and oxygenreduction reactions” Journal of Power Sources 230375.2022:BS Tomar, MS Tirumkudulu*, W Yu, A Berchielli and P Doshi “Osmotic tablet coatings: Drying stress,mechanical properties and microstructure”, Int J Pharm, 617, 121611 (2022)"}, {"Sr_no": "23", "Facility": "Cryogenic Transmission Electron Microscopy", "Make": "Thermo Fischer Scientific", "Model": "Titan Krios G4 300kV", "Date_of_Installation": "1 January, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "Imaging techniques for both cryogenic and negative-stained Transmission Electron Microscopy (TEM).", "Facility_In_Charge": "Prof. Ruchi Anand - Chemistry", "Facility_Manager": "Ms. Harshada Malvi", "Facility_Operator": "Ms. Harshada Malvi", "Department": "Centre for Research in Nanotechnology and Science (CRNTS)", "Features_Working_Principle": "Cryo-Electron Microscopy (Cryo-EM) is a technique used to capture high-resolution 3D images of biological samples in their frozen, near-native state. The process begins by rapidly freezing the sample in vitreous ice to preserve its structure. The sample is then imaged using an electron microscope, which captures 2D projection images from multiple angles. These images are computationally processed to generate a 3D reconstruction of the sample. Cryo-EM enables the visualization of macromolecules at near-atomic resolution, making it ideal for studying complex biological structures like proteins, protein complexes, and viruses. This method eliminates the need for crystallisation or staining, providing detailed insights into molecular architecture.", "Body": "Microscope: Titan Krios G4Imaging: Utilizing an Extreme High-Brightness Field Emission Gun (X-FEG) and offering a flexible accelerating voltage range from 80 to 300 kV, complete with automatic condenser, objective, and SA apertures to facilitate multiple image acquisitions per grid hole.Detector: Equipped with both BioContinuum GATAN K3 detector and Ceta D detectors.Energy Filter: Incorporating the Biocontinuum K3 energy filter.Software for Data Collection and Screening: Utilizing EPU for streamlined data collection and screening processes.", "Facility_Description": "Our facility features a 300 kV Thermo Fisher Krios G4 cryo-electron microscope for high-resolution cryo-EM analysis, equipped with a BioContinuum GATAN K3 detector and an Amtek-Gatan energy filter. This setup supports both single-particle analysis and tomography, with all necessary accessories for preparing frozen-hydrated samples. Additionally, we have a TalosL120C screening microscope and sample preparation tools such as the Vitrobot, Cryo-Ultramicrotome, and High-Pressure Freezer, ensuring efficient sample handling. This advanced infrastructure enables detailed imaging of biomolecules like proteins, viruses, and nanoparticles, providing valuable insights into cellular structures.", "Instruction_for_Sample_Preparation": "Before booking a slot for the Krios 300kV microscope, users must first examine the sample on a negatively stained grid, followed by screening on a cryo-conditioned grid using the Talos 120kV microscope. The corresponding data should be submitted when reserving the slot.", "Applications": "Structural Biology: It helps visualize protein complexes, viruses, and macromolecular interactions at near-atomic resolution.Drug Discovery: Cryo-EM aids in identifying drug targets and designing therapeutics by revealing detailed biomolecular structures.Cell Biology: It allows the study of cellular architecture and dynamics through cryo-tomography, including organelles and protein interactions.Virology: Cryo-EM is essential for studying viral structure and interactions with host cells, contributing to vaccine and drug development.Nanotechnology: It is used to analyze nanoparticles and nanomaterials for biomedical and technological applications.Neuroscience: Cryo-EM helps investigate synaptic structures and neurodegenerative diseases.Microbial Research: It provides insights into bacterial structures and protein folding, aiding the study of antibiotic resistance and disease mechanisms.Materials Science: Cryo-EM is employed to study the atomic structures of materials and nanostructures.Cryo-Tomography: It enables 3D imaging of cells and tissues, preserving their native state.Functional Studies: Cryo-EM captures conformational changes in proteins, aiding the understanding of their biological functions.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "24", "Facility": "Cubic Immersive Virtual Reality System", "Make": "Cubic Immersive Virtual Reality Lab Equipment", "Model": "Barco F80 Q9 Projectors, Stewart Projection Screens, VizDisplay GP0404 RPS–Display Management System, JBL Audio system with CrownXLS1502 amplifiers, Harman BSS BLU 101 Digital signal processor, ART trackers (head and flystick tracking), Volfoni 3D glasses", "Date_of_Installation": "23 March, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Service", "Available_Equipment_Mode_of_use": "Barco F80 Q9 Projectors, Stewart Projection Screens, VizDisplay GP0404 RPS–Display Management System, JBL Audio system with CrownXLS1502 amplifiers, Harman BSS BLU 101 Digital signal processor, ART trackers (head and flystick tracking), Volfoni 3D glasses", "Facility_In_Charge": "Prof. Avijit Maji, Civil Engineering Department", "Facility_Manager": "", "Facility_Operator": "Ashutosh Pandey, Research Scholar, Civil Engineering Department. Email ID: 22d0272@iitb.ac.in", "Department": "Civil Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "The Cubic IVRS system, as the name suggests, is a cube-shaped facility resembling a small room. It comprises three or more walls functioning as large monitor screens that display images via multiple high-performance projectors. The virtual environment is created by projecting two slightly offset high-resolution images onto the walls, which are perceived as 3D visuals through specialized headsets. The facility offers a wide field of view and is equipped with motion tracking technology, enabling the virtual environment to respond dynamically to users' movements. The facility possesses a wide range of applications across various domains.", "Instruction_for_Sample_Preparation": "At present, the software supports the gltf model exported from NAVISWORKS, SOLIDWORKS, CATIA, AVEVA, CREO, SIEMENS NX, SOLID EDGE, 3DS MAX, or any other software that exports the model in gltf. Ensure that all exported files (along with gltf) are in zip format to upload.", "Applications": "Transportation and traffic simulationArchitecture and Urban DesignEducation and TrainingPsychology and Cognitive SciencesProduct Development and ErgonomicsVisualizations of 3D models", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "SOP_IVRS.pdf\n  (7.54 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "25", "Facility": "Deep Reactive Ion etching", "Make": "Oxford", "Model": "PlasmaPro®100 Cobra", "Date_of_Installation": "7 July, 2025", "Facility_Management_Division": "", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "Etching of SiC", "Facility_In_Charge": "Prof. Dipankar Saha", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Mr. Anuraag", "Department": "Electrical Engineering", "Features_Working_Principle": "In an ICP (Inductively Coupled Plasma) system, a coil surrounding the process chamber operates at 13.56 MHz to generate an electromagnetic field that ionizes the process gases through inductive coupling, creating a high-density plasma with reactive species necessary for chemical etching. A separate RF power, typically at 2.56 MHz, is applied to the wafer chuck (table) to accelerate ions from the plasma toward the wafer surface, ensuring directional ion bombardment and achieving anisotropic etching profiles. The wafer is held securely during the process using an electrostatic chuck (ESC) to provide stable clamping throughout the etch.", "Body": "Substrate: GaN on SiC,SiCSubstrate size:0.5”, 1” wafers and small piecesTemperature of chamber:80C (max, while running the process)ICP power:3000W( allowed only till 2400W (80%))RF Power:600W(allowed only till 480W (80%))Carrier wafer:Sapphire of 4” only with 0.6 mm thickness Gases connected:SF6,Ar,He,O2,CL2,BCL3,CF4", "Facility_Description": "Deep RIE or ICP-RIE is a plasma-based etching technique used to create deep, high-aspect-ratio features in substrates such as  silicon carbide (SiC), gallium nitride (GaN), and others. It is widely used in processing of GaN-on-SiC devices.", "Instruction_for_Sample_Preparation": "Sample preparation should be  on a Sapphire of 4” only with 0.6 mm thickness", "Applications": "", "Chemical_allowed": "NA", "Gases_allowed": "SF6,Ar,He,O2,CL2,BCL3,CF4", "SOP": "", "Training and Other Policy Documents": "DRIE Usage Policy_V2.pdf\n  (66.81 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "26", "Facility": "Deformation Simulation Laboratory (Gleeble 3800 Thermomechanical Simulator + Dilatometer DIL 805-AD)", "Make": "Dynamic Systems Inc. (DSI), USA  +TA  Instruments, Germany", "Model": "Gleeble 3800 system + DIL805A/D", "Date_of_Installation": "1 January, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Mechanical Characterisation, Thermal Characterisation", "Available_Equipment_Mode_of_use": "Gleeble 3800 :Flow Stress Uniaxial Compression Plain Strain CompressionDiffusion BondingRound Tensile TestingFlat Tensile TestingStrip AnnealingWelding Simulation, DIL805A/D :Heating and Cooling cycles Alpha Measurement (Ceramics, Metals)Sub-Zero Alpha MeasurementDeformation", "Facility_In_Charge": "Prof. Anirban Patra (anirbanpatra@iitb.ac.in)", "Facility_Manager": "", "Facility_Operator": "Abhishek Bhushanraj Pawar (30004460@iitb.ac.in)", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "DIL 805A Quenching Dilatometer – Measurement PrincipleThe DIL 805A/D is used to observe dimensional changes under extreme conditions of controlled heating and cooling. A solid or a hollow sample is inductively heated to a temperature plateau and is then continuously cooled with different (linear or exponential) rates. The phase transformation occurring in the continuous cooling process or in the isothermal plateau (which may also be a multi-step transition) is indicated by the measured change of length. An array of cooling curves represent a continuous or an isothermal TTT diagram (Time-Temperature- Transformation diagram). The beginning and end of the transformation indicate the alloy phase boundaries, e.g. ferrite, carbide, graphite, pearlite, bainite, martensite or other eutectoid phase batches.Dynamic Systems Inc. (DSI), Gleeble 3800 systemDirect Resistance Heating (Joule Heating): The system passes high current at low voltage directly through the specimen. This method allows for extremely fast heating rates up to 10,000°C per second and produces uniform temperature throughout the specimen's cross-section.Rapid Cooling and Quenching: The machine is equipped with water-cooled jaw carriers to allow fast cooling. An optional air/water spray quenching. Servo-Hydraulic Mechanical System: A high-speed hydraulic system provides precise control of force and displacement. It can exert up to 20 tons in compression and 10 tons in tension, with stroke rates as fast as 2,000 mm/s.Closed-Loop Feedback Control: The system uses thermocouples for temperature feedback, along with transducers to monitor force, displacement, and strain.Atmospheric Control: The tests are conducted inside a sealed chamber, which can be filled with argon/nitrogen or evacuated to create a vacuum to prevent oxidation during high-temperature testing.", "Body": "", "Facility_Description": "1. Dynamic Systems Inc. (DSI), Gleeble 3800 system, USASpecification/Features:Controlled deformation at different heating (10,0000C/s) and cooling (~6500C/s)Physical simulations for all fabrication and thermo-mechanical processing.Strain rate: 10^-3 to 100Atmosphere: Vacuum, Ambient air, Argon, Nitrogen Cooling conditions: Water Quenching, Forced Air Cooling, Forced Argon Coolinghttps://gleeble.com/products/gleeble-systems/gleeble-3800.html2. TA Instruments-DIL 805A/D, GermanySpecification/Features:Accurate (0.05 μm & 0.05 0C) identification of all transformationsControlled simulations for investigation of microstructural evolutionStrain rate: 10^-3 to  10^-1Atmosphere: Vacuum, Ambient air, Argon, Nitrogen, Helium Cooling conditions: Argon, Nitrogen, Helium Coolinghttps://www.tainstruments.com/dil-805ad/", "Instruction_for_Sample_Preparation": "The sample should be free from rust.The sample should be in the given standard dimensions.", "Applications": "Instrument Details: Gleeble 3800 Thermomechanical Simulator Thermal Cycles and Heat Treatments Flow Stress & plane strain Compression Testing Melting & Solidification Strain Induced Crack Opening (SICO) Procedure Strip Annealing Process Simulation Instrument Details. Dilatometer Quenching Mode to Determine Phase Transformations Deformation Mode for Hot compression Sub-zero Module for quenching below room temperature Alpha Measuring System Heating Ring for Non-thermally Conductive Samples.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1) Manil Raj, Bidyapati Mishra, Umesh M. Ahire, Haripria T. Padmaganesan, M.J.N.V. Prasad, K. Narasimhan, “Microstructure and mechanical response of dissimilar joint of ferritic interstitial-free steel to austenitic low-density steel produced by diffusion bonding,” Materials Science & Engineering A 856 (2022) 144020 (1-14).2) Aditya Sarkar, S.V.S. Narayana Murty, and M.J.N.V. Prasad, “Effect of deformation mode on hot deformation characteristics and microstructural evolution in Cu-Cr-Zr-Ti alloy,” Materials Characterization 186 (2022) 111813 (1-10).3) Manil Raj, M.J.N.V. Prasad and K. Narasimhan, “Effect of bonding temperature and interlayer(s) on microstructure evolution, hardness, and shear properties of diffusion bonded Ti-6Al-4V alloys,” Materials Performance and Characterization 11 (2022) 264-280.4) Aditya Prakash, Tawqeer Nasir Tak, Namit N. Pai, Harita Seekala, S.V.S. Narayana Murty, P. S. Phani, Sivasambu Mahesh, P. J. Guruprasad and Indradev Samajdar (2023): Inception of Macroscopic Shear Bands During Hot Working of Aluminum Alloys, IJP, In Press.5) S. Kumar, S. Manda, S. K. Giri, S Kundu, S. Karagadde, R. Balamuralikrishnan, SVS N Murty, C. R. Anoop and I. Samajdar (2023): Relating Martensite Variant Selection with Prior Austenite Microstructure: A Coupled Study of Experiments and Pixel-by-Pixel Reconstruction, Mater. Charac., 199, 112822.6) Sanjay Manda, Saurabh Kumar, Kaushik Pal, Arup R. Bhattacharyya, Ajay S. Panwar and Indradev Samajdar (2023): Snoek-Dominated Internal Friction Response in bcc Steel: Relating Experiments with a Multi-Scale Atomistic Computational Framework, MMTA, 54A, 562-5767) M. I. Khan, A. Sarkar, H. K. Mehtani, P. Raut, A. Prakash, M.J.N.V. Prasad, I. Samajdar, and S. Parida (2022): Microstructure and Aqueous Corrosion in Carbon Steel: An Emerging Correlation, Mater. Chem. Phys., 126623, 1-138) Aditya Prakash, Tawqeer Nasir Tak, Abu Anand, Namit N. Pai, S.V.S. Narayana Murty, Chandra Veer Singh, P. J. Guruprasad and Indradev Samajdar (2022): Mechanistic Origin of Orientation Dependent Substructure Evolution in Aluminum and Aluminum-Magnesium Alloys, MMTA, 53A, 2689-27079) Riya Mondal, Parvej Raut, Sunil Kumar Bonagani, Saurabh Kumar, P.V. Sivaprasad, G. Chai, V. Kain and I. Samajdar (2022): Relating Hot deformed Microstructures and Corrosion Performance in a Super Duplex Stainless Steel, JMEPEG, 31, 1478-149210) Namit Pai, Indradev Samajdar, Anirban Patra, “Study of orientation-dependent residual strains during tensile and cyclic deformation of an austenitic stainless steel”, International Journal of Plasticity, Vol. 185, 2025, 104228."}, {"Sr_no": "27", "Facility": "Dielectric broadband spectrometer facility", "Make": "Novocontrol Technologies", "Model": "Germany, Concept 80", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electrical Characterisation", "Available_Equipment_Mode_of_use": "Low/high temperature (-150°C to 900°C) magnetodielectric measurements piezoelectric measurements ferroelectric loop measurements.", "Facility_In_Charge": "Prof. Prasanna Kumar S Mural", "Facility_Manager": "", "Facility_Operator": "Ms. Ruchita Vadera, bds@iitb.ac.in", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "It has two separate analyzers:From 3MHz to 20MHz working on gain phase measurement methodFrom 1MHz to 3GHz working on coaxial line reflectometry method.Permittivity, modulus, conductivity (AC), specific resistance (resistivity), tan δ, capacity, impedance, admittance, inductivity, measured temperature, measured time, measured AC volt, measured DC volt, measured AC current, measured DC current.Magneto dielectric measurement (For bulk and thin film sample)P-E loop measurement (For bulk and thin film samples)Piezoelectric measurement (only for bulk sample)", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Sample should be well polished and having smooth surface.Maximum of six samples will be accepted at a time for room temperature.Maximum of two samples will be accepted at a time with temperature measurement.Maximum sample dimension should be diameter of 3 cm and thickness 0.3 cm for Low frequency, and diameter 1 cm and 0.2 cm thickness for RFAfter applying silver paste (Conducting coating) to ceramics samples it should be heated at 150oC at least for one hour.User has to bring liquid nitrogen.Only one registration will be accepted at a time.", "Applications": "Polymers, rubbers, liquid crystals, ferroelectrics, ceramics, Dielectric spectra, molecular relaxation and dynamics, glass transition.Pharmaceutical applications, characterization of drugs.Structural material properties like phase transitions, phase compositions, and crystallization processesSemiconductors, organic crystals: charge transport, activation energy, charge mobility.Civil engineering, characterization of concrete.Pharmaceutical applications, characterization of drugs.Structural material properties like phase transitions, phase compositions and crystallization processesSemiconductors, organic crystals: charge transport, activation energy, charge mobility.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "28", "Facility": "Differential Scanning Calorimeter.", "Make": "Rigaku", "Model": "DSC Vesta", "Date_of_Installation": "1 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Maximum Temperature: 700 °C  Minimum temperature: -150 °C Rate of degree :  10°C /Min to 20 °C /Min Gas Type :N2 Sample type: Powder", "Facility_In_Charge": "Prof.Sanjog Nagarkar, Email ID: - dsc.chem@csif.iitb.ac.in", "Facility_Manager": "Mr.Darshan Mhatre, Email ID: - darshansmhatre@iitb.ac.in, Contact No: - 022-2576 4157/59", "Facility_Operator": "Miss.Ruchi Vishwakarma , Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4194 / 4159", "Department": "Chemistry", "Features_Working_Principle": "Differential scanning calorimetry (DSC) works by measuring the difference in thermal energy applied to a sample and a reference material as a function of temperature. The device that performs this measurement is called a differential scanning calorimeter, or DSC", "Body": "", "Facility_Description": "The Differential Scanning Calorimeter (DSC) is used to quantify the energy changes occurring during phase transitions, such as melting (Tm), solid-solid phase transitions, crystallization (Tc), and glass transition (Tg) temperatures. It is widely employed in research and development as well as quality control, particularly in the fields of polymer science, pharmaceuticals, and glass research.", "Instruction_for_Sample_Preparation": "1) Sample form: powder (~25 mg).2) The analysis can't be carried out if the temperature range and the heating rate/ heating cycle are not specified. 3) Explosive, poisonous samples and samples giving rise to toxic/obnoxious gases/fumes on heating cannot be undertaken for DSC. 4) The sample holders are of Aluminum (Al) and Platinum (Pt). The user must ensure that samples will not react with crucible materials during DSC Analysis.5)TGA data is mandatory for any DSC analysis. Without TGA data, DSC analysis will not beperformed. Weight loss during TGA should not be more than 2% for DSC analysis range.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "29", "Facility": "Differential Scanning Calorimetry-7020", "Make": "Hitachi", "Model": "DSC7020", "Date_of_Installation": "14 October, 2022", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Measurement Method:-Heat Flux       Temperature Range:-(-150C to 725C)       Scanning Rate:-0.1 to 100C       Gas Type:-N2,Air,Ar,O2       Gas Flow Rates:-50 to 500 ml/m", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022- 2159-6851", "Facility_Operator": "Mrs. Aradhana Naudiyal, dsc7020.saif@csif.iitb.ac.in       ,  022- 2159 6866, Mrs. Meenal Yogesh Hande                            , nmr600@iitb.ac.in,  022- 2159 6889", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "DSC is a thermal analytical technique that looks at how a material’s heat capacity (Cp) is changed by temperature. It measures the amount of heat released or absorbed by a material and hence DSC enables the measurements of the transition such as the glass transition, melting, and crystallization.", "Body": "Measurement Method:-Heat Flux Temperature Range:-(-150C to 725C) Scanning Rate:-0.1 to 100CGas Type:-N2, Air, Ar, O2  Gas Flow Rates:-50 to 500 ml/min", "Facility_Description": "Heat Flux DSCA technique in which the sample and reference crucible are heated uniformly (under the same conditions) with a definite amount of heat. The difference in temperature between the sample and the reference material gives the heat capacity of the sample and is measured as a function of time and temperature.", "Instruction_for_Sample_Preparation": "At least 30-40 mg of sample should be submitted.Sample size should be < 5mm in diameter and < 2.5mm in thickness.Samples containing halogens should not be sent and will not be accepted for analysis.Samples should not be toxic or hazardous.Heating program should be less than the decomposition temperature.Samples containing corrosive substances that will react with Aluminium/Platinum/Ceramic pans should not be sent for analysis by DSC.", "Applications": "Glass Transition temperatureMelting and Crystallization temperaturePercent CrystallinitiesCompositional analysis of blendsThermal historiesThermal denaturation for proteinsPurity DeterminationPolymorphismDrug Compatibility studies, etc.", "Chemical_allowed": "Non-explosive, non-corrosive, non-toxic, halogen-free, non-carcinogenic.", "Gases_allowed": "N.A.", "SOP": "", "Training and Other Policy Documents": "Lab Policy TGA & DSC.pdf\n  (216.67 KB)\n, Training policy for TA's.pdf\n  (182.25 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "30", "Facility": "Dual Chamber Sputter system", "Make": "AJA International", "Model": "Orion-8-CH1", "Date_of_Installation": "25 August, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication, Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Ashwin Tulapurkar", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Ms. Akanksha", "Department": "Electrical Engineering", "Features_Working_Principle": "Target Size: 2” Gases used in the system: O2, Ar, PN2  Substrates used: Si,Substrate size: Small samples, 2” and 4” diameter wafer.Magnetic targets allowed", "Body": "", "Facility_Description": "Sputter deposition is a physical vapour deposition (PVD) method of depositing thin films by sputtering material from a 'target', then depositing it onto a 'substrate'. Magnetron sputtering applies a magnetic field around the target in order to energize argon atoms for bombarding the target.", "Instruction_for_Sample_Preparation": "NA", "Applications": "Thin film deposition, metal contacts", "Chemical_allowed": "NA", "Gases_allowed": "N2, O2", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "31", "Facility": "Dual Vacuum HR Scanning Electron Microscope", "Make": "JEOL", "Model": "JSM-IT800(SHL)", "Date_of_Installation": "16 June, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "Low and High Vacuum Imaging, EDS (Point and Area, Line scan, Area Mapping), EBSD", "Facility_In_Charge": "Prof. M.J.N.V. Prasad, mjnvprasad@iitb.ac.in, 022-2576-7642", "Facility_Manager": "Mrs. Pritee Navghare, pritee.navghare@iitb.ac.in, 022-2159-6765", "Facility_Operator": "", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "The integrated In-Lens Schottky Plus and low aberration condenser lens achieves high beam brightness. Ample probe current (100nA@5kV) is available even at low accelerating voltage. This allows the user to perform high resolution observation, high speed elemental mapping, EBSD analysis and Soft X-ray analysis with minimal adjustment of SEM parameters.It is equipped with multiple detectors such as Secondary Electron detector, Variable back-scattered detector, Upper Hybrid Detector, Upper Electron Detector which helps to observe variety of materials. Instrument has an attachment of Ultim Max 6.5 EDS and Symmetry S2 EBSD which delivers data with high speed without compromising quality. Aztech sofware has a unique feature of live chemical imaging along with routine point/Area Analysis and mapping.", "Body": "None", "Facility_Description": "Model: JSM- IT 800(SHL)Resolution: 0.5nm at 15kV       0.7nm at 1kVAccelerating Voltage: 0.01 to 30kVThe JSM-IT800 incorporates “In-lens Schottky Plus field emission electron gun\" for high resolution imaging and an innovative electron optical control system \"Neo Engine\" with high and low vacuum mode.", "Instruction_for_Sample_Preparation": "Facility is available for microscopic examinations only, and the sample preparation (including sputtering/electropolishing) is not under scope of this facility usage. It is solely the user’s responsibility to come up with a well-prepared sample(s).Sample dimensions will be 10mmX10mmX10mm max if you wish to do multiple samples at a timeThe samples should be dry and should withstand ultra-high vacuumSamples leaving loose particles will not be entertained.Please mention in the request form if your samples needs special handling.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "32", "Facility": "Dynamic Light Scattering and Zeta Potential Facility at Chemistry", "Make": "Brookheavan", "Model": "NanoBrook Omni", "Date_of_Installation": "21 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "DLS mode for particle size measurement, ELS mode and PALS mode for zeta potential", "Facility_In_Charge": "Prof. Nandita Madhavan", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "Ms. Pooja Chougule", "Department": "Chemistry", "Features_Working_Principle": "Features/ Accessories: 35mW 660nm diode laser15°, 90° and 173° angular measurements with temperature control (-5 to 110°C)Bi – SREL universal Electrode assembly for use with water/ simple polar and with non polar liquidsBI-APDX high sensitive APD detector90 PDP: Debye plot software for absolute molar weight determination", "Body": "", "Facility_Description": "The instrument is used for fast, routine, sub-micron measurements of size and zeta potential. Based on the principles of Dynamic Light Scattering (DLS) for particle sizing and distribution, and based on Doppler velocimetry (electrophoretic light scattering or ELS) for zeta potential measurement, most measurements take very less time. The instrument also includes Phase Analysis Light Scattering (PALS) measurements for samples with low mobilities", "Instruction_for_Sample_Preparation": "If Any reference material, solvents required are to be supplied by the user Liquid Samples are prepared by user in appropriate concentration required for the experiment and It should be filtered through appropriate sized Filter. Required volume of Sample solution is around 3 mL. In case any additional Chemicals/ materials  required for recording the samples, Charges would be additional.", "Applications": "", "Chemical_allowed": "yes", "Gases_allowed": "no", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "33", "Facility": "Dynamic Mechanical Analyzer", "Make": "Netzsch", "Model": "DMA 242 E Artemis", "Date_of_Installation": "", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "Temperature Range:-170 to 600°C     Heating Rates:0.01 to 20°C     Frequency range:0.01 to 100 Hz     High Force Range:24N (12N static and 12N dynamic)     Amplitude range:±0.1 upto 240 µm, Modulus range:10-3 to 106 MPa (depends on deformation mode)     Static deformation:20 mm     Maximum Deformation amplitude:+240 µm     Available Geometries:Three-point bending (40 mm)     Single and Dual Cantilever (2 x 16 mm), Shearing (Sandwich geometry)     Compression/ penetration (Ø 15 mm)     Tension (15 mm)     Atmosphere:    Nitrogen and Air     Cooling Devices:Liquid Nitrogen and Air Intra Cooler, Accessories:Immersion Bath, Humidity Generator", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022- 2159-6851", "Facility_Operator": "Meenal Hande,   Aradhana Naudiyal, dma.saif@csif.iitb.ac.in,   nmr600@iitb.ac.in , 022 2159 6889/6857", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Dynamic Mechanical Analyzer (DMA) measures the mechanical properties of a material as a function of time, temperature, and frequency under an oscillatory load. The DMA works by applying an oscillatory force to the sample at a specific frequency and measuring the resulting deformation. The amplitude and phase of the applied force and the resulting deformation are recorded, allowing for the calculation of various mechanical properties.By varying the frequency, temperature, and applied stress or strain, the DMA can provide information about the material's viscoelastic properties. Viscoelastic properties refer to their ability to exhibit both elastic and viscous responses when subjected to deformation. The instrument can measure properties like storage modulus (elastic response), loss modulus (viscous response), glass transition temperature, and other mechanical properties.", "Body": "", "Facility_Description": "Deformation modes3-point bending Single / dual cantilever bending ·Shearing ·Tension ·Compression/penetrationForce Range with high force of 24N (12N static and 12N Dynamic)Temperature -170°C to 600°C", "Instruction_for_Sample_Preparation": "Sample size should be uniform and dimensions should be as per the deformation mode selected.  ModeLength/diameterWidthThickness/Height1.Tension18-20 mm4-6 mm< 6 mm2.Single Cantilever Bending30-40 mm< 12 mm< 5 mm3.Double Cantilever Bending55-60 mm< 12 mm< 5 mm4.3-point bending55-60 mm< 12 mm< 8 mm5.Shear mode with flat surface15 mm15 mm< 6 mm6.Compression and penetration15 mm---< 8 mm", "Applications": "Viscoelastic properties such as:  - Storage modulus: E', G' (purely elastic component).  - Loss modulus: E\", G\" (purely viscous component).  - Loss tangent: tan δ (E\"/E’), and their dependence on temperature/ frequency.Damping characteristics and viscoelastic behaviour.Polymer structure and morphology.Glass transition temperature Tg.Primary & secondary relaxation behaviour.Crystallization processes.Influence of fillers in polymers, etc", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "34", "Facility": "Electro-chemical STM and KPFM", "Make": "Bruker India Scientific Private Limited", "Model": "Multimode 8", "Date_of_Installation": "7 January, 2025", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Force Microscopy", "Available_Equipment_Mode_of_use": "AFM mode currently", "Facility_In_Charge": "Prof. Manoj Neergat", "Facility_Manager": "", "Facility_Operator": "None assigned. Will be run with students trained on the facility, initially.", "Department": "Energy Science and Engineering", "Features_Working_Principle": "The system is equipped to achieve high resolution in imaging in air or any other fluid either by tuning the cantilever resonance frequency by photo thermal (not piezo) or by imaging at off resonance frequency by driving the z scanner sinusoidally without the need to tune the cantilever.", "Body": "Modes: Contact/Non-contact/TappingMedia: Air or any other fluid", "Facility_Description": "Electrochemical STM (EC-STM)- Can perform Scanning Tunneling Microscopy (STM). It also includes potentiostat/galvanostat hardware to perform EC-STM experiments. Lateral/frictional force microscopy, conductive AFM, magnetic and electric force microscopy, and Kelvin Probe Microscopy can be done. Experiments can be conducted in contact/non-contact/tapping mode in air or any other fluid.", "Instruction_for_Sample_Preparation": "Samples for AFM imaging should be immobilized on a rigid substrate. Macroscopic samples (such as certain biomaterials, crystals, polymer membranes, etc.) can be attached directly to a stainless steel sample disk with an adhesive. Dissolved or suspended samples like cells, proteins, and DNA are usually bound to a flat substrate like mica or glass. Most scanning probe systems are able use the following substrates:Microscope slidesCover slipsMica discs and sheetsPetri dishes", "Applications": "Scanning Tunneling Microscopy (STM)Electrochemical STM (EC-STM)Lateral/frictional force microscopyConductive AFMMagnetic and Electric Force MicroscopyKelvin Probe Microscopy Scanning Capacitance MicroscopyTunneling Atomic Force MicroscopyScanning Spreading Resistance MicroscopyConductive Atomic Force Microscopy", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "35", "Facility": "Electron Beam Lithography (Physics)", "Make": "Zeiss + NPGS", "Model": "Zeiss Sigma 300 & NPGS v9", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "3 hour slots will be provided for Electron Beam Lithography. Spin coating, hot plate, Oxygen Plasma ashing are available for sample preparation prior to lithography. Development can be done under fume hood. All processes must be cleanroom compatible., However faciltites like dry/wet etch, metallisation etc are not part of the faciltiy. The user needs to do these separately.", "Facility_In_Charge": "Kantimay Das Gupta (Phy) & Suddhasatta Mahapatra (Phy)", "Facility_Manager": "", "Facility_Operator": "No dedicated operator. TAs can assist or user has to undergo training to work with own samples", "Department": "Physics", "Features_Working_Principle": "Electron Beam sensitive resist (typically PMMA, HSQ) are coated on the sample using a spin coating system. The electron beam is programmed to write the desired pattern on the substrate using specified exposure doses. Pattern is then developed in suitable developer solution for the next phase of processing.", "Body": "", "Facility_Description": "Zeiss sigma 300 SEM and NPGS pattern generation software are coupled together to make an Electron Beam Lithography system. Typically small samples of about 1 cm x 1 cm are handled.  The facility is not for full wafer writing.  The user will have to learn the basics of the NPGS system and write their own pattern using integrated QCAD software.  User needs to be familiar with basic features of CAD systems and preparing clean DXF files with layers.Note: The system is based on the following :Zeiss Sigma 300 FE SEM  https://www.zeiss.com/microscopy/en/products/sem-fib-sem/sem/sigma.htmlNPGS v9 external pattern generator  https://www.jcnabity.com/We do not have metallization/dry or wet etching/gas injection write capabilities.  The facility offers pattern writing on electron beam compatible resists and developing. Subsequent processing steps are to be done by the user separately.", "Instruction_for_Sample_Preparation": "Samples should be within 10 mm x 10 mm in size. The maximum writing field is generally 1 mm x 1 mm", "Applications": "TBA", "Chemical_allowed": "Processing chemicals are typically solvents like Acetone, IPA, PMMA (& similar polymers) , MIBK and DI water.", "Gases_allowed": "not applicable", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "36", "Facility": "Electron Spin Resonance Spectrometer", "Make": "JEOL, Japan", "Model": "JES - FA200 ESR Spectrometer with X and Q band", "Date_of_Installation": "", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "ESR Spectroscopy", "Available_Equipment_Mode_of_use": "X band  Room Temp, Variable Temp  -170oC to +200oC and Liquid Nitrogen Temp 77 K and Q band  \tRoom Temperature (RT)", "Facility_In_Charge": "Head, CSIFoffice.saif@iitb.ac.in0091-22- 2576 7691/2", "Facility_Manager": "Mr. Naresh Ambati naresh.ambati@iitb.ac.in", "Facility_Operator": "Mr. Nilesh Marle nileshmarle@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "SpecificationsEStandard Frequency (X band) - 8.75-9.65 GHzSensitivity - 7x109 spins/0.1mTResolution - 2.35(micro)T or betterTemperature study - Any temp. from +200oC to liquid nitrogen temp.Available accessories :Aqueous cellSample Angular Rotation deviceElectrochemical cellUV irradiationsample mixing cellElectron Spin resonance spectroscopy is based on the absorption of microwave radiation by an unpaired electron when it is exposed to a strong magnetic field. Species that contain unpaired electrons (namely free radicals, odd-electron molecules, transition metal complexes, rare earth ions, etc.) can therefore be detected by ESR.Working PrincipleWhen an atomic or molecular system with unpaired electrons is subjected to a magnetic field, the electronic energy levels of the atom or molecule will split into different levels. The magnitude of the splitting is dependent on the strength of the applied magnetic field. The atom or molecule can be excited from one split level to another in the presence of an external radiation of frequency corresponding to the frequency obtained from the difference in energy between the split levels. Such an excitation is called a magnetic resonance absorption. The atom or molecule under investigation may be in different environments in an actual sample. The magnetic resonance frequency will hence be influenced by the local environment of the atom or molecule. The electron spin resonance technique is therefore, a probe for a detailed identification of the various atomic and molecular systems and their environments and all associated parameters.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Electron Spin Resonance, ESR, is a powerful non-destructive and non-intrusive analytical method. ESR yields meaningful structural information even from ongoing chemical or physical processes, without influencing the process itself. It is the ideal technique to complement other analytical methods in a wide range of application areas.One can perform studies related to :     Molecular structure     Crystal structure     Reaction kinetics     Valence electron wave functions     Molecular motion         Relaxation properties     Electron transport     Crystal / ligand fields     Reaction mechanisms", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "ESR SOP_SAIF_0.pdf\n  (698.24 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "37", "Facility": "Environmental Scanning Electron Microscope facility (ESEM)", "Make": "FEI", "Model": "QUANTA 200", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "High Vacuum Mode, Low Vacuum Mode, Environmental SEM (ESEM mode), EDS- Area/Line/Mapping", "Facility_In_Charge": "Prof. Amartya Mukhopadhyay, amartya_mukhopadhyay@iitb.ac.in", "Facility_Manager": "Ambati Naresh, CSIF/SAIF IIT BombayContact : 022-21596273Email Id : naresh.ambati@iitb.ac.in", "Facility_Operator": "Ms. Rashmi Poojari, 30004563@iitb.ac.in, 6862, Mr Anand Mehta, 30004841@iitb.ac.in", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "The FEI Quanta 200 scanning electron microscope is a versatile microscope with a tungsten electron source and three modes of operation. High vacuum (HV) mode allows analysis of electrically conducting and non conducting samples (non conducting samples can be analysed after sputter coating) Low Vacuum & ESEM modes allow analyzing biological and insulating samples without coating.", "Body": "Resolution : 3.0 nm resolution at 30 kV Magnification : 25X to 20,000X Accelerating Voltage : 200 V to 30 kV Vacuum Modes : High Vacuum, Low vacuum, ESEM Mode", "Facility_Description": "ESEM MODEL QUANTA 200 WITH EDS SDDF DET MODEL:ELEMENT C5MODES: LOW VACUUM, HIGH VACUUM , ESEM", "Instruction_for_Sample_Preparation": "Medium for Dispersion Ethanol /Methanol / Water /Iso-propyl alcohol. Any other medium should be provided by the user. Dispersion will be done by ultrasonication.Kindly mark the edge of the sample to be observed for Cross section.Base of the sample should be flat for mounting on sample holder.Sample preparation if any should be done at user end (cutting the sample for CS, freeze fracturing, sample fixation for biological samples, staining of samples, oven drying should be done by the user)For any further query, kindly contact on Email: esem@iitb.ac.in, Contact: 022 21596862", "Applications": "Materials Science/MetallurgyFractography (samples which have bigger dimensions can be analysed) Micro drilling and cutting tools Dental and medical Corrosion  Polymer Science Energy Science/Engg. Biological and life sciences SemiconductorsCivil and Earth SciencesNanotechnologyCeramicsPharmaceuticals", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "ESEM SOP.pdf\n  (425.87 KB)", "Training and Other Policy Documents": "ESEM Training Policy.pdf\n  (153.25 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "38", "Facility": "Eye Tracker", "Make": "Tobii", "Model": "Pro fusion 250hz", "Date_of_Installation": "12 April, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Infrared/ Raman Imaging", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Arti D. Kalro", "Facility_Manager": "Raj Saroj", "Facility_Operator": "Raj Saroj", "Department": "Others", "Features_Working_Principle": "", "Body": "", "Facility_Description": "Eye Tracker 250hz (Tobii Pro Fusion Screen Based)", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "Pro_Fusion_User_Manual_v1.1.pdf\n  (1.9 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "Tobii_Pro_Fusion_Product_Description.pdf\n  (1.16 MB)", "Publications": ""}, {"Sr_no": "39", "Facility": "Fanuc Training Kit- 3 Axis", "Make": "FANUC", "Model": "1) Fanuc Series oi-MF Plus (Machining Centre)  2)Fanuc Series oi-TF Plus (Turning Centre)", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof  Makarand Kulkarni", "Facility_Manager": "", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "Fanuc  Oi-MF Plus and  Oi-TF Plus  simulators have advanced connectivity capabilities using FOCAS and MT Link i.High-frequency controller data acquisition via MT Link I softwareSupports predictive maintenance and real-time health monitoringEnables creation and testing of AI/ML models for smart manufacturingFull data read/write functionality for experimentation and researchSimulator setup ensures risk-free and versatile testing of industrial applicationsPerfect for developing digital twin prototypes and communication protocols", "Body": "", "Facility_Description": "CNC machine simulator and Data Acquisition Lab equipped with Siemens and Fanuc simulators, enabling high-frequency data extraction for real-time monitoring, predictive maintenance, and AI/ML applications. This facility supports comprehensive experimentation in digital twin development, industrial data communication, and smart manufacturing strategies, without limitations imposed by physical machines.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "40", "Facility": "Femtosecond Laser Microfabrication", "Make": "Light conversion", "Model": "Pharos 10 W", "Date_of_Installation": "6 April, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Microfabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Deepak Marla", "Facility_Manager": "", "Facility_Operator": "Subhashish Parhi", "Department": "Mechanical Engineering", "Features_Working_Principle": "Femtosecond laser microfabrication is a high-precision technique that leverages ultrashort laser pulses to process materials at the microscale. The laser beam emerging from the femtosecond laser source is first modulated using a combination of beam expanders and focusing optics to achieve a tightly focused spot size ranging from approximately 5 to 100 micrometers, depending on the application and material system. This focused beam is then directed onto the target substrate mounted on a high-precision xyz stage, allowing for controlled patterning in two or three dimensions.The extremely short pulse duration and high peak intensities ensure that the energy is deposited into the material within a very brief time interval. This ultrafast energy deposition leads to nonlinear absorption mechanisms, such as multiphoton ionization and avalanche ionization, especially in transparent or wide band-gap materials. These mechanisms can induce localized phase transformation, ablation, or even micro-explosions in the focal region, enabling precise removal or modification of material.Due to the femtosecond pulse duration, there is minimal thermal diffusion to the surrounding material, which significantly reduces the heat-affected zone (HAZ). This thermal confinement is crucial for achieving high spatial resolution and avoiding thermal damage, making it suitable for microstructuring sensitive materials such as polymers, glasses, semiconductors, and biological tissues.", "Body": "Power =10 WMax. repetition rate=1 MHzPulse width = 205 fs - 10 psWavelength = 515, 1030 nmBeam exit diameter = 3.65 mmFocal length =   20 - 120 mmBeam spot diameter = 5- 100 μm", "Facility_Description": "The femtosecond laser system can be used for microfabrication applications for all kinds of materials including metals, non-metals, semiconductors, polymers, and transparent materials.  It is equipped with a Pharos Femtosecond Laser, optical system, galvo scanner with an f-theta lens, xyz precision stage and objective lens.  This system delivers laser pulses of energy up to 200 mJ, and with  pulse durations tuneable from 209 femtoseconds to 10 picoseconds. It operates at 1030 nm and 515 nm wavelengths, with output power of up to 10 W with repetition rates ranging from 1 kHz up to 1 MHz., making it suitable for a wide range of nonlinear and precision applications.The output beam has a Gaussian profile (M2", "Instruction_for_Sample_Preparation": "", "Applications": "Precision micromachiningLaser ablation Laser shock peeningDeep hole micro drillingSurface texturingMicrochannels and micropillarsPrecision cutting of metals and non-metalsSubsurface marking in transparent materials like glass, sapphire, and diamondOptical waveguide in transparent materialsDiamond marking and cutting", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "41", "Facility": "Field Emission Gun-Scanning Electron Microscope (FEG-SEM)", "Make": "JEOL", "Model": "JSM-7600F", "Date_of_Installation": "4 April, 2010", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "ImagingEDS- Area/Line/Mapping", "Facility_In_Charge": "Head, CSIF  office.saif@iitb.ac.in  0091-22- 2576 7691/2", "Facility_Manager": "Mr. Naresh Ambatinaresh.ambati@iitb.ac.in", "Facility_Operator": "Ms. Mayura Chaubal     mayurasule@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "The Jeol field emission scanning electron microscope is a versatile high resolution scanning electron microscope. This Machine combines two proven technologies – an electron column with semi-in-lens objective lens which can provide high resolution imaging by low accelerating voltage and Schottky FEG with strong electrostatic field to induce electron emission. An FEG emitter gives a more coherent beam and its brightness is much higher than the tungsten filament. The instrument is also specialised with Gentle Beam (GB) mode applies a negative voltage to a specimen and decelerates incident electrons just before they irradiate the specimen, thus the resolution is improved at an extremely low accelerating voltage. Thus, this method is suitable for observation of fine structures, especially on low-density materials, non-conductive materials at high magnification with effective detection of low angle backscattered electrons. Source: Field emission gunSEI Resolution: 1.0nm at 15 kv                         1.5nm at 1 kv, in GB modeMagnification: Low: 25X to 10,000X                       High: 100X to 1,000,000X at 4x5 photo sizeAccerating Voltage: 0.1 to 30 kvProbe Current Range: 1 pA to ≥ 200 nA", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Sample type that can be analysed: Biological / Composite Material / Thin Film / Crystalline Solid / Metal/Polymer/Ceramic/Composite/Rock/CementSample form that can be analysed: Powder/Pellet/Suspension/Film/Sample on silicon waferMedium for Dispersion Ethanol /Methanol / Water /Iso-propyl alcohol. Any other medium should be provided by the user.Dispersion will be done by ultrasonication.Kindly mark the edge of the sample to be observed for Cross section.Base of the sample should be flat for mounting on sample holder.Biological samples will be accepted only after user has done primarily fixation with suitable fixative.Sample preparation if any should be done at user end (cutting the sample for CS, freeze fracturing, sample fixation for biological samples, staining of samples, oven drying should be done by the user)Cross-section analysis of powdered samples cannot be performed.Samples should be in dry form. Hydrated samples must be dried properly before sending.The samples should withstand high vacuum (~ 10 -5 Pa). Wet samples cannot be done.The bulk sample size should be less than 12.5 mm x 12.5 mm x 10 mm (height) For any further query, kindly contact on Email: fegsemlab@iitb.ac.in, Contact: 022 2159 6863", "Applications": "Materials Science/MetallurgyFractographyMicro drilling and cutting tools Dental and medical Corrosion  Polymer Science Energy Science/Engg. Biological and life sciences SemiconductorsCivil and Earth SciencesNanotechnologyCeramicsPharmaceuticals", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "Field Emission Gun- Scanning Electron Microscope (FEG-SEM) SOP.pdf\n  (1.26 MB)", "Training and Other Policy Documents": "Training and other policy documents.pdf\n  (14.93 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "42", "Facility": "Field Emission Gun-Scanning Electron Microscope (FEG-SEM) at Chemistry", "Make": "Carl Zeiss", "Model": "Sigma 500", "Date_of_Installation": "20 February, 2020", "Facility_Management_Division": "", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Deepti Kalsi", "Facility_Manager": "Ms.Pooja Chougule.", "Facility_Operator": "Ms.Pooja Chougule.", "Department": "Chemistry", "Features_Working_Principle": "Zeiss Sigma 500 Scanning Electron Microscope (SEM) is a high-performance technique designed for advanced imaging and analytical applications. It features a field emission gun (FEG) for high-resolution imaging, capable of achieving nanometer-scale detail. The Sigma 500 offers a user-friendly interface, fast image acquisition, and superior signal-to-noise ratio. Without the Electron Back scatter Diffraction (EBSD) detector, the instrument focuses on secondary and back scattered electron imaging, along with energy-dispersive X-ray spectroscopy (EDS) for elemental analysis, making it ideal for material characterization and failure analysis. Its modular design allows future upgrades for additional analytical capabilities.Main features:• Schottky type field emitter system• Resolution: 0.8nm at 15 kV; 1.6 nm at 1 kV• Accelerating voltage: 0.02 to 30 kV• Beam current configurations: 100nA .• Electromagnetic beam alignment• Work distance 0 – 50 mm• Magnification Range: 10 – 10,00,000x", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Sample type that can be analyzed: Biological / Composite Material / Thin Film / Crystalline Solid / Metal/Polymer.Sample form that can be analyzed: Powder/Pellet/Film/Sample on silicon waferKindly mark the edge of the sample to be observed for Cross section.Base of the sample should be flat for mounting on sample holder.Biological samples will be accepted only after user has done primarily fixation with suitable fixative.Sample preparation if any should be done at user end (cutting the sample for CS, freeze fracturing, sample fixation for biological samples, staining of samples, oven drying should be done by the user)Cross-section analysis of powdered samples cannot be performed.Samples should be in dry form. Hydrated samples must be dried properly before sending.The samples should withstand high vacuum (~ 10 -5 Pa). Wet samples cannot be done.The bulk sample size should be less than 12.5 mm x 12.5 mm x 10 mm (height) For any further query, kindly contact on Email: fegsem@chem.iitb.ac.in.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "43", "Facility": "Field Emission Gun-Transmission Electron Microscope 300kV with STEM , EDS and EELS (FEG-TEM 300kV)", "Make": "FEI", "Model": "Tecnai G2, F30", "Date_of_Installation": "25 February, 2015", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "TEM Bright field/dark field imaging, HR-TEM imaging,Diffraction pattern       Energy Dispersive spectroscopy (EDS)       Electron Energy Loss spectroscopy (EELS)", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in,  0091-22- 2576 7691/2", "Facility_Manager": "Dr. Bharati Patro     bharati@iitb.ac.in", "Facility_Operator": "Mr. Amit Kumbhar, amitkumbhar@iitb.ac.in, Mrs. Suhasini Pai, 30002616@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Features:Resolution: Point : 2.0 Angstrom                     Line : 1.0 AngstromAccelerating Voltage: 300 kV Magnification Range: 58 x to 1 Million x  Accessories•       EDS : EDAX with Octane ELITE T Super•       STEM : on axis BF/DF & HAADF detector•       EELS with GIF (Gatan Image Filter) Working Principle: Transmission Electron Microscopy (TEM) is a technique in which a beam of high energy electrons is transmitted through a very thin specimen to form an image which reveals the information about morphology and crystallography. FEG-TEM can go upto atomic scale resolution to view the atomic arrangement of the material.Scanning Transmission Electron Microscopy (STEM) in which the electron beam is focused to a fine spot to scan in the raster pattern across the specimen and is suitable for analytical techniques such as Z-contrast, annular dark-field imaging, and spectroscopic mapping for chemical composition by Energy Dispersive Spectroscopy (EDS) and as well as Electron Energy Loss Spectroscopy (EELS). These signals can be obtained simultaneously, allowing direct correlation of images and spectroscopic data.", "Body": "TEM Bright field/dark field imaging, HR-TEM imaging,Diffraction patternEnergy Dispersive spectroscopy (EDS)Electron Energy Loss spectroscopy (EELS)", "Facility_Description": "", "Instruction_for_Sample_Preparation": "The user has to collect TEM grids from the 300kV FEG TEM lab.The user has to come for analysis with a prepared sample on the TEM grid.The samples should be prepared on TEM grids of 3mm size and sample thickness should be 50- 100 nm for analysis.Any query related to your 300kV FEG-TEM an doped CdS quantum dots, Sharmistha Das, Gourab Rana , Fariyad Ali and Anindya Datta, Nanoscale, 2023,15, 4469-4476"}, {"Sr_no": "45", "Facility": "Field Sweep Nuclear Magnetic Resonance Spectrometer at Physics", "Make": "Cryomagnetics  , TecMag", "Model": "Cryo-free 9T magnet with VTI, Redstone NMR spectrometer", "Date_of_Installation": "7 August, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "NMR Spectroscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Avinash V. Mahajan", "Facility_Manager": "", "Facility_Operator": "Monika Jawale (monikaj@iitb.ac.in), Dr. Vaibhav Singh (vaibhaviitbombayy@gmail.com)", "Department": "Physics", "Features_Working_Principle": "Field range : 0 - 9 TTemperature range: 1.6 - 300 K", "Body": "", "Facility_Description": "A cryofree, 9 Tesla NMR magnet (Cryomagnetics USA) with field sweep capability + an NMR spectrometer (Tecmag USA) for solid samples together with a cryofree variable temperature insert (1.6 K to 300 K) has been installed as a central facility. This spectrometer is suitable for NMR measurements where a large linewidth is expected (low resolution).", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "46", "Facility": "Fluorescence activated cell sorting / flow cytometer facility", "Make": "Becton Dickinson (BD)", "Model": "BD FACS Aria SORP (FACS2)", "Date_of_Installation": "21 December, 2016", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Cytometery", "Available_Equipment_Mode_of_use": "Cell/particle analysis, Cell segregation based on scatter/ fluorescence properties", "Facility_In_Charge": "Prof. Anirban Banerjee, abanerjee@iitb.ac.in, +(91-22) 2576 7794", "Facility_Manager": "", "Facility_Operator": "Shikha Gupta Kesharwani", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Designed to sort cells at high flow speed The sorted cells can be collected in a varietyof vessels including 15ml Falcon tubes for 2-waysort, 5ml FACS tubes for 4-way or 2-way sort & 12 well, 24 well, 48 well & 96 well plates for plate sort. The collection vessels should contain media or buffer Lasers: FACS1 (4 lasers) -UV laser (355nm) Blue (488nm), Yellow Green (561nm) & Red laser (633nm) FACS2 (5 lasers) - UV laser (355nm) Blue (488nm), Yellow Green (561nm), Red laser (637nm) & Violet (405). Detectors: FACS1- 13 parameters can be detected including scatter properties. FACS2 – 20 parameters can be detected including scatter propertiesFACS is a sophisticated high throughput instrument. It enables sorting of heterogeneous mixture of biological cells depending upon the specific light scattering characteristics and/or fluorescent characteristics of each cell in population.A beam of light hits hydrodynamically focused sample stream. Combination of different filters and detectors collect the scatterd light from sample.", "Body": "", "Facility_Description": "FACS is a sophisticated high throughput instrument. It enables sorting of heterogeneous mixture of biological cells depending upon the specific light scattering characteristics and/or fluorescent characteristics of each cell in population.", "Instruction_for_Sample_Preparation": "Type/Toxicity/Pathogenecity of the samples and precautions during sample analysis and sample disposal need should be discussed with the operator/TAs before booking the slot.Samples should not be viscous.Samples should not be prepared in Organic solvents (e.g. THF, Acetone, Hexane, Toluene etc)Sample should be a single cell suspension.Clumping should be avoided. Clumps can block nozzle and can affect analysis.Minimum volume of sample required for acquisition is 500ul and Sample density should be approx. 1x106 cells or particles per ml for better analysis.User should bring appropriate compensation controls required for the experiment.The users are expected to bring their own samples for analysis.The user should bring an unstained sample for each experiment.", "Applications": "Apoptosis assaysImmuno-phenotypingIntra-cellular stainingCell viability assay", "Chemical_allowed": "", "Gases_allowed": "Not allowed", "SOP": "BD_FACSAria_Fusion_User_Guide.pdf\n  (7.77 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1. Tubulin-Binding 3,5-Bis(styryl)pyrazoles as Lead Compounds for the Treatment of Castration-Resistant Prostate Cancer,Vivian W.Y. Liao, Anuradha Kumari, Rajeshwar Narlawar, SomaVignarajan, David E. Hibbs, Dulal Panda and Paul W. Groundwater, MolecularPharmacology June 1, 2020, 97 (6) 409-422; https://doi.org/10.1124/mol.119.1185392. Poojari, Radhika; Sawant, Avishkar V; Kini, Sudarshan; Srivastava, Rohit; Panda, Dulal(2020). Antihepatoma activity of multifunctional polymeric nanoparticles via inhibition ofmicrotubules and tyrosine kinases. Nanomedicine, 15(4), 381–396. 10.2217/nnm-2019-03493. Three-dimensional cryogel matrix for spheroid formation and anti-cancer drug screeningArchana Singh 1, Prakriti Tayalia 1J Biomed Mater Res A . 2020 Feb;108(2):365-376.doi: 10.1002/jbm.a.36822. Epub 2019 Nov 7. IF 4.394. The Th9 axis reduces oxidative stress and promotes the survival of malignant T-cells incutaneous T-cell lymphoma patients. Mol Cancer Res . 2020 Apr;18(4):657-668. doi:10.1158/1541-7786.MCR-19-0894.https://www.ncbi.nlm.nih.gov/pubmed/31996468 IF 5.25. A Navalkar, S Pandey, N Singh, K Patel, B Mohanty, S Jadhav, P Chaudhari and SK Maji (2020),Direct evidence of cellular transformation by prion-like p53 amyloid infection. J. Cell Science,134(11): 2583166. S Ray, N Singh, R Kumar, K Patel, S Pandey, D Datta, J Mahato, R Panigrahi, A Navalkar, SMehra, L Gadhe, D Chatterjee, AS Sawner, S Maiti, S Bha

quantitative analysis of surface roughness, particle size, and force-distance curves.Multi-Sample Compatibility: Capable of analyzing biological samples (cells, membranes, biomolecules), polymers, thin films, and nanomaterials", "Instruction_for_Sample_Preparation": "AFM Sample Preparation InstructionsClean the Sample Surface: Ensure the sample is free from dust, debris, and contaminants. Use compressed air, deionized water, or appropriate solvents (e.g., ethanol, acetone) to clean the surface, depending on the sample type.Adjust Sample Thickness: The sample should be thin and flat to ensure proper tip approach. If necessary, polish or section thick samples to obtain a smooth and even surface.Dry or Hydrate as Needed: For dry samples, ensure complete drying to prevent drift. For liquid-phase imaging (e.g., biological samples), place the sample in an appropriate liquid cell with buffer solution to maintain native conditions.Check Sample Compatibility: Ensure the sample is compatible with the selected AFM mode (contact, tapping, or non-contact) and does not degrade under scanning conditions.Final Inspection: Before imaging, inspect the sample under an optical microscope to confirm cleanliness and proper adhesion to the holder. Avoid large surface irregularities that could interfere with AFM scanning.", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "13", "Facility": "ATR-FTIR at Chemistry", "Make": "Bruker", "Model": "Alpha II", "Date_of_Installation": "2 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "ATR mode, Transmission mode for both solids and liquids, • Reflectance ( for solids)", "Facility_In_Charge": "Prof. Shobhna Kapoor", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "Ms. Pooja Chougule", "Department": "Chemistry", "Features_Working_Principle": "Features/ Accessories: Diamond ATRSpectral Range: 4000-500 cm-1Rock Solid Cube Corner InterferometerDetector: Temperature controlled DLATGS detectorSpectral range : 2 cm-1 or better Optics: ZnSe Beamsplitter and ZnSe windowsDemountable transmission cells with circular CaF2 windowsPrinciple:An attenuated total reflection accessory operates by measuring the changes that occur in a totally internally reflected infrared beam when the beam comes into contact with a sample. An infrared beam is directed onto an crystal with a high refractive index at a certain angle. This internal reflectance creates an evanescent wave that extends beyond the surface of the crystal into the sample held in contact with the crystal. The sample absorbs IR energy. The attenuated energy from each evanescent wave is passed back to the IR beam, which then exits the opposite end of the crystal and is passed to the detector in the IR spectrometer which generates an infrared spectrum.", "Body": "", "Facility_Description": "Alpha II is very compact ATR-FTIR spectrometer for quick, easy and reliable IR analysis.", "Instruction_for_Sample_Preparation": "If Any reference material, is to be supplied by the userProvide solid samples in the fine powder form. In case any additional Chemicals/ materials  required for recording the samples, Charges would be additional.", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "na"}, {"Sr_no": "14", "Facility": "Automated Flow Chemisorption Analyzer", "Make": "Anton Paar", "Model": "ChemBET Pulsar", "Date_of_Installation": "1 March, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "•\tTemperature Programmed Reduction (TPR).  •\tTemperature Programmed Desorption (TPD).  •\tTemperature Programmed Oxidation (TPO).  • Pulse Titration.", "Facility_In_Charge": "Prof.Sanjog Nagarkar., Email ID:- afca.chem@csif.iitb.ac.in", "Facility_Manager": "Mr.Darshan Mhatre., Email ID: - darshansmhatre@iitb.ac.in, Contact No: - 022-2576 4157/59", "Facility_Operator": "Miss.Ruchi Vishwakarma , Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4194 / 4159", "Department": "Chemistry", "Features_Working_Principle": "Chemisorption is a chemical adsorption process that involves the formation of a chemical bond between an adsorbent and an adsorbate", "Body": "", "Facility_Description": "The ChemBET Pulsar is a fully automated chemisorption analyzer designed for high-precision titration and surface characterization. The system is equipped with TPRWin software, allowing for programmed analysis sequences, including metal area and dispersion determination. An automatic loop injector and gas switching enhance accuracy and efficiency. The Pulsar uses a highly sensitive Thermal Conductivity Detector (TCD), resistant to oxidation and ammonia, ensuring baseline stability and reproducible signals. The system is optimized for a wide range of gases, with high-temperature quartz sample cells and in-cell thermocouples for accurate sample temperature measurement.", "Instruction_for_Sample_Preparation": "Sample should be dry, and only solid samples in the form of powder are accepted.", "Applications": "CO₂-TPD:-To measure the basic sites on a catalyst or adsorbent by quantifying the desorption of chemisorbed CO₂ as the temperature increases.Step-by-Step Procedure for CO₂-TPD1. Sample PreparationWeigh an appropriate amount of the sample (typically 50–200 mg) and load it into a quartz tube.Secure the sample in the instrument .2. Pre-treatment (Activation)Purpose: To remove any physically adsorbed species or contaminants.Conditions:Flow: Inert gas (e.g., Helium or Argon).Temperature: Usually 350–500 °C (depending on sample stability).Time: ~30–60 minutes.Cool down to adsorption temperature (commonly ~50 °C or RT).3. CO₂ AdsorptionIntroduce CO₂ gas into the system.Flow: Typically 5–10% CO₂ in inert gas (e.g., He or Ar).Time: 30–60 minutes or until saturation is achieved.Temperature: Keep constant at adsorption temperature (~50 °C).4. Purging (Physisorbed Gas Removal)Switch to inert gas flow (He or Ar) to remove loosely bound or physisorbed CO₂.Time: 30–60 minutes.Keep the temperature constant during purge.5. Temperature Programmed Desorption (TPD)Start ramping the temperature at a controlled rate (typically 10 °C/min).Final temperature: ~600–800 °C, depending on the sample.Detector: TCD (Thermal Conductivity Detector) or MS (Mass Spectrometer) monitors desorbed CO₂.6. Data Collection and AnalysisObtain TPD profile: Desorption peaks correspond to different types of basic sites (weak, moderate, strong).Quantify the desorbed CO₂ (area under peaks) to estimate the total basic site concentration.------------------------------------------------------------------------------------------------------------------------------------------------ NH₃-TPDTo determine the amount, type (strength), and distribution of acid sites on the surface of catalysts or adsorbents by measuring ammonia desorption as a function of temperature.Step-by-Step Procedure for NH₃-TPD1. Sample LoadingWeigh ~50–200 mg of the powdered sample.Load it into a quartz tube and fix inside the chemisorption analyzer.2. Pre-treatment (Activation)Purpose: To remove surface impurities, water, and pre-adsorbed gases.Gas: Flow of inert gas (Helium or Nitrogen).Temperature: 400–550 °C depending on the sample.Duration: 1–2 hours.After pretreatment, cool the sample to the NH₃ adsorption temperature (usually 50–100 °C).3. NH₃ AdsorptionIntroduce NH₃ gas or diluted NH₃ in inert carrier (e.g., 5–10% NH₃ in He).Flow time: ~30–60 minutes to ensure saturation.Maintain constant adsorption temperature (typically 50–100 °C).NH₃ adsorbs onto both Brønsted and Lewis acid sites.4. Purging (Desorption of Physisorbed NH₃)Switch to inert gas (e.g., He or N₂) to purge weakly adsorbed or physisorbed ammonia.Temperature: Keep the same as adsorption (no ramp yet).Time: 30–60 minutes or until the baseline stabilizes.This step ensures only chemisorbed ammonia remains on the surface.5. TPD Run (Desorption)Ramp the temperature gradually (e.g., 10 °C/min) up to 600–800 °C.Carrier gas: Continue with inert gas (He or N₂).Detection: Use a TCD (Thermal Conductivity Detector) or MS (Mass Spectrometer) to monitor desorbed NH₃.6. Data Collection & AnalysisTPD Profile: The desorption curve typically shows multiple peaks:Low-temp peaks = weak acid sites.Mid-temp peaks = moderate acid sites.High-temp peaks = strong acid sites.Integration of peaks gives total acid site concentration (in µmol/g or mmol/g).--------------------------------------------------------------------------------------------------------------------------------------------H₂-TPRTo study the reducibility of metal oxides or supported catalysts by measuring H₂ consumption as temperature increases.You can:Identify reduction peaks for different metal oxides.Determine reduction temperatures.Quantify H₂ uptake (→ calculate oxygen content or reducible species).Step-by-Step H₂-TPR Procedure1. Sample LoadingWeigh ~50–100 mg of the sample.Load into a U-shaped tube.Place in the instrument sample holder.2. Pre-treatment (Optional)If needed, remove moisture or contaminants:Gas: Inert (He or N₂)Temperature: 150–200 °CTime: 30–60 minThen cool to starting TPR temperature (~50 °C)3. TPR Gas IntroductionBegin flow of H₂ gas (usually 5–10% H₂ in He or N₂).Set flow rate to 30–50 mL/min.Allow system to stabilize at starting temperature (~50 °C).4. Temperature Programmed Reduction(TPR)Begin temperature ramp:Heating rate: typically 5–10 °C/minFinal temperature: 600–900 °C depending on materialThe TCD (Thermal Conductivity Detector) monitors H₂ consumption as the sample is heated.As reduction occurs, the sample consumes H₂ → decrease in TCD signal.5. Data CollectionThe TPR profile shows reduction peaks.Each peak corresponds to a specific reducible species or metal oxide state.Quantify H₂ consumed:Use calibration or integrate area under curve.Gives amount of oxygen removed → degree of reduction.Post-AnalysisPeak positions → indicate reduction temperature for metal oxides.Area under peaks → H₂ consumed → used to calculate:Oxygen stoichiometryMetal reducibilityDegree of reduction in % or µmol H₂/g--------------------------------------------------------------------------------------------------------------------------------------------H₂ Pulse ChemisorptionTo measure the amount of chemisorbed hydrogen on a reduced metal catalyst surface, which helps calculate:Metal dispersion (%)Active metal surface area (m²/g)Average particle size (nm)Step-by-Step Procedure for H₂ Pulse Titration Chemisorption1. Sample LoadingWeigh ~50–200 mg of catalyst.Load into the quartz sample tube in the chemisorption instrument.2. Sample Pretreatment (Reduction)Purpose: To reduce the metal oxide (e.g., PtO, NiO) to metallic form.Gas: Pure H₂ or 10% H₂ in Ar/N₂.Temperature: 300–500 °C depending on metal type.Flow rate: 30–50 mL/min.Duration: ~1–2 hours.✅ After reduction:Switch to inert gas (He or N₂).Purge at the same temperature for ~30–60 minutes to remove excess H₂.Cool the sample to adsorption temperature (typically 35–50 °C).3. Titration by H₂ Gas (Pulse Chemisorption)Start injecting pulses of a known volume of H₂ gas (commonly 0.1–0.5 mL per pulse).Use inert carrier gas (He or N₂) to carry the pulses over the sample.Monitor the amount of H₂ not adsorbed using a TCD (Thermal Conductivity Detector). Repeat pulses until the TCD signal for H₂ stabilizes (i.e., the sample surface is saturated and no more H₂ is chemisorbed).4. Data CollectionRecord H₂ uptake per pulse.Sum of all chemisorbed H₂ = total H₂ uptake (µmol or mL STP).Convert this to:Dispersion (%)Metal surface area (m²/g)Average metal particle size (nm)(using known stoichiometry and assumptions, e.g., 1 H₂ molecule per 1 surface metal atom)Key CalculationsTotal uptake (µmol/g) = Total chemisorbed H₂.Dispersion (%) = (Surface metal atoms / Total metal atoms) × 100Metal surface area = Based on atomic cross-sectional area of the metal.Average particle size (nm) = Calculated using known shape factors and atomic dimensions.------------------------------------------------------------------------------------------------------------------------------------------------", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "15", "Facility": "Bio-Atomic Force Microscope Facility", "Make": "Oxford Instruments Asylum Research Inc, USA.", "Model": "MFP-3D BIO", "Date_of_Installation": "2 January, 2014", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Force Microscopy, Electrical Characterisation", "Available_Equipment_Mode_of_use": "The Bio-AFM can be operated routinely in the following modes:, 1. Contact Mode (Under Dry and Wet Condition)., 2. Tapping Mode (Under Dry and Wet Condition)., Other advanced modes of operation are as follows:, 3. Force Mode, 4. Force Map, 5. Piezo-response Force Microscopy, 6. Lateral Force Microscopy, 7. Conductive AFM, 8. Scanning Kelvin Microscopy, 9. Electrostatic Force Microscopy, 10. AM-FM Viscoelastic Mapping, 11. Loss Tangent imaging, 12. Poly Heater, 13. Bio-Heater, Note:, 1. In Force Mode “Dwell” can be used., 2. In PFM High voltage can be used up to 200V., 3. Heater can be used up to 200° C., 4. Coolers can be used from -20° to 120° C.", "Facility_In_Charge": "Prof. Shamik Sen, shamiks@iitb.ac.in, 022-2576-7743", "Facility_Manager": "", "Facility_Operator": "Vijay Krushna Mistari    , mistarivijay@iitb.ac.in, 022-2159-6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "The principle of operation of the AFM is very simple - A sharp cantilever tip interacts with the sample surface sensing the local forces between the molecules of the tip and sample surface. This instrument is not a “conventional microscope” that collects and focuses light. The word microscope has been associated with this instrument because it is able to measure microscopic features of the sample. The most characteristic property of the AFM is that the images are acquired by “feeling” the sample surface without using light. In this way, not only the sample topography can be recorded with good resolution, but also the material characteristics and the strength of interaction between the sample surface and the cantilever tip. Due to the fact that no light is involved in acquiring the sample properties, the AFM reaches a resolution far below the diffraction limit offered by the optical microscopy. Its resolution is limited only by the tip radius and the spring constant of the cantilever.", "Body": "SYSTEM SPECIFICATION: Closed loop sensors on all three axes: X & Y range 120 μm, X & Y sensors", "Facility_Description": "The Bio-AFM facility was installed in January 2014, in the department of “Bio-Science & Bio-Engineering” Central Facility as per RIFC norms. The Facility is open for all IIT Bombay internal users, other institute, National Laboratory and Industry.", "Instruction_for_Sample_Preparation": "All type of samples can be done. Expect Suspended and semi liquid sample are not allowed", "Applications": "Biological sciences. Life science Physical sciences Material science Polymer science Electrical characterization Nanolithography Nanotechnology Nano-mechanics.", "Chemical_allowed": "Cell Media is allowed", "Gases_allowed": "No need of gases", "SOP": "01_MFP_3D_User_Guide_Ver_13_Rev_1661_compressed.pdf\n  (12.62 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument erosols outside the facility by filtering the incoming as well as outgoing air and maintaining a negative pressure. Apart from Bio-safety cabinets, the facility also houses all other necessary equipments to perform experiments which involves pathogen biology, host-pathogen interaction etc. Access to BSL-2 facility is strictly restricted and should be approved by BSL-2 user committee.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "The facility can only be used for projects that are approved by IBSC. Following IBSC's approval the protocol of different experiments needs to be approved by the user committee. Once the protocols are approved, the user (a PhD student or Post doc) will be trained and made aware of different hazards associated with working inside the facility. Following completion of training, the user will have to sign an undertaking that he/she has been trained and now responsible for any safety related hazards the he/she faces. The user must inform the facility supervisor in case of any accident or spillage at the earliest. If he/she feels sick, they need to inform the doctor about their work in BSL-2 facility and different kind of pathogens that are being handled inside the facility.", "Applications": "Pathogen Characteristization", "Chemical_allowed": "", "Gases_allowed": "CO2 Cylinders", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Surve MV, Anil A, Kamath KG, Bhutda S, Sthanam LK, Pradhan A, Srivastava R, Basu B, Dutta S, Sen S, Modi D, Banerjee A. (2016) Membrane Vesicles of Group B Streptococcus Disrupt Feto-Maternal Barrier Leading to Preterm Birth. PLOS Pathogens 12(9): e1005816. Patel Y, Mehra S (2017) Synergistic Response of Rifampicin with Hydroperoxides on Mycobacterium: A Mechanistic Study. Frontiers in Microbiology (under revision)PublicationsKotta KB, Ghosh S, Mehra S. Potentiating the Anti-Tuberculosis Efficacy of Peptide Nucleic A  molecular mechanistic and physiological diversity of autophagy, EMBO, Hungary, held on 27th June 2022.Battaje, R. R., Dhaked, H. P. S, & Panda, D. (2022). Interdomain cleft of FtsZ as a target for BTBenzo- 29, an inhibitor of Streptococcus pneumoniae cell division. Poster Presentation at the International Symposium on Recent Trends and Future Opportunities in Pharmaceuticals at National Institute of Pharmaceutical Education and Research, S.A.S. Nagar, Punjab, India held on November: 10-12, 2022.Kuldeep Sharma presented poster “Temperature-induced alteration in teichoic acid biosynthesis in Streptococcus pneumoniae” at Biological Transactions: From molecules to organisms (BTMO 2023), IISc Bangalore, held on January 18-23, 2023.Shruti Apte presented “Ubiquitination of bacterial substrates act as novel innate sensing strategy” at Pathogen Immunity and Signaling, EMBO conference, Saint Malo, France held on 4-8 April 2022.Shruti Apte presented “Ubiquitination of bacterial surface proteins aid in pathogen clearance” at All India Cell Biology Conference (AICBC), Banaras Hindu University, Varanasi, held on 20-22 January 2023.Sourav Ghosh presented “Ubiquitin-mediated tweezer like nanomachine protects the host from invasive bacterial infections” at Bacterial morphogenesis, survival and virulence: Dynamic genomes & envelopes, EMBO conference, Goa, held on February 6-10, 2023.Anirban Banerjee presented a poster at Bacterial morphogenesis, survival and virulence: Dynamic genomes & envelopes, EMBO conference, Goa, held in February 6-10, 2023."}, {"Sr_no": "17", "Facility": "Carbonaceous Aerosol Speciation System", "Make": "Magee", "Model": "CASS (TCA 08 + AE33)", "Date_of_Installation": "6 November, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "Single", "Facility_In_Charge": "Prof. Abhishek Chakraborty", "Facility_Manager": "", "Facility_Operator": "Vidit Parkar, Chinmoy Mandal", "Department": "Environmental Science and Engineering (ESED)", "Features_Working_Principle": "The Magee Scientific Carbonaceous Aerosol Speciation System (CASS), is a combined unit of a TCA08 Total Carbon Analyzer, and the Magee Scientific Aethalometer® AE33, providing a revolutionary scientific instrument that measures the Total Carbon Content (“TC”), the Elemental Carbon content (EC), the Organic Carbon content (OC) and the Black Carbon content (BC) of suspended aerosol particles in near-Real Time.", "Body": "TC measurement with thermal protocol with temperature ramp upto 950°CBC measurement with optical attenuation at 7 wavelengths (370,470,520,660,880,950 nm)", "Facility_Description": "Online Carbonaceous Aerosol measurement system", "Instruction_for_Sample_Preparation": "Not suitable for offline sample analysis.", "Applications": "Online aerosol BC-OC analyzer", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "18", "Facility": "Central surface analytical facility-ESCA Facillity", "Make": "Kratos Analytical", "Model": "AXIS Supra", "Date_of_Installation": "15 February, 2016", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "X-Ray Photoelectron Spectroscopy", "Available_Equipment_Mode_of_use": "XPSUPS", "Facility_In_Charge": "Prof. Chandramouli Subramaniam   csubbu@chem.iitb.ac.in912225767194", "Facility_Manager": "", "Facility_Operator": "Ms Smita Sahu", "Department": "Physics", "Features_Working_Principle": "Working Principle: Electron spectroscopy for chemical analysis (ESCA) instrument comprises of X-ray photoelectron spectroscopy (XPS), Ultra-violet photoelectron spectroscopy (UPS) and Auger electron spectroscopy (AES) / Scanning Auger Microscopy (SAM).The surface to be analyzed is placed in a vacuum environment and then irradiated with photons (X-ray or Ultra-violet). The incident photons release electrons (called photoelectrons) from their electronic structure (core-levels and valence band) and ionize the atoms. The kinetic energy and the number of photoelectrons are precisely measured and counted respectively using an analyzer -detector based on which the binding energy and the intensity of the photoelectron are determined. AES/SAM is based on the Auger effect (series of internal relaxation events upon ionization of core level) leading to emission of electrons called Auger electrons. It uses primary electron beam (3 to 10 keV) and the possibility to focus and scan this primary electron beam in nm and µm range. The Auger electrons are part of the secondary electron spectrum with characteristic energy allowing one to identify the emitting element. The experimental setup is somewhat similar to that of SEM with a difference, that is, the electrons are not only used for imaging but also for chemical identification of the surface atoms.Limitations: ESCA can detect all the elements except H and He. The detection limit is 0.1% Reference Books:An Introduction to Surface Analysis by XPS & AES, John F. Watts & John Wolstenholme, Wiley 2003.Surface Analysis – The Principle Techniques, Edited by John Vickerman & Ian Gilmore, Wiley 2009.", "Body": "", "Facility_Description": "Make: Kratos Analytical, UK (SHIMADZU group) Model: AXIS SupraTwo chamber ultra high vacuum system: Analysis chamber (< 2.0 x 10-9 Torr) and Sample load-lock chamber (< 5.0 x 10-8 Torr)Automated sample transfer mechanism and five-axis sample manipulator.XPS source: Monochromatic (AlKα) 600 W X-ray source; 1486.6 eVUPS source: High photon flux He gas discharge lamp (He-I 21.2 eV and He-II at 40.8 eV)Auger: Field emission gun for Auger electron spectroscopy and Scanning Auger microscopy. Source energy range up to 10 kVElectron energy analyser and detector: Concentric hemispherical analyzer (CHA) for spectroscopy, and Spherical mirror analyzer for parallel imaging. Multichannel plates stack with delay-line detector for counting. Spectroscopy, snapshot and imaging modes with option of large area and small area analysis.Differentially pumped ion gun: High performance gun for precision depth profiling, Energy range 500 eV to 4 keV for sample etching (cleaning) and depth profilingSample cleaning ion gun: Broad beam sputter ion gun in sample entry chamber. Energy ranges 300 eV to 3 keV.Charge neutralizer: For non-conducting samples.Software system: Windows based software (ESCApe) for automated sample transfer, data acquisition and data processing. Site license for data processing.", "Instruction_for_Sample_Preparation": "Maximum size of samples should be 5 mm x 5 mm x 5 mm. Smaller samples of the size 3 mm x 3 mm or 3 mm diameter are more suitable. For samples of different sizes, the user is required to contact the ESCA laboratory staff.Label the samples only on the sample containers. Sample labels/codes shall be of three letters/number.ESCA analysis is surface sensitive. Do not contaminate the surface of your samples by any means; including touching them with or without gloves to be analysedThe sample should be completely dry and it should be stable in ultra-high vacuum (no out-gassing allowed).Powders should be made into pellets or from a thin coating on a clean conducting substrate like silicon, aluminium or copper foil. Pressing powder in to indium foil is also another method .User should clearly mention if the sample needs etching (surface cleaning) before recording the data. It may be noted that the etching may alter the chemical composition and chemical state to some extent; which needs to be taken into account when interpreting the data.Samples containing organic molecules / polymers and some high vapour pressure elements such as Na, K, S, P, Zn, Se, As, I, Te or Hg are not suitable for depth profile analysis.UPS and Auger is possible only on sufficiently conducting samples. Insulating samples in the form of very thin films on the conducting substrate may work.", "Applications": "Chemical states of elementsRelative quantification of each chemical state of each elementThickness of thin filmsDepth profilingSpatial distribution of material and chemical stateElemental composition of surface and quantification of their relative concentration", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "1) Dharmveer Yadav, Rahul Kumar Das, Sumit Saxena, Shobha Shukla, “OGF nanocomposite foam for enhanced recyclability and oil-recovery”, Journal of Cleaner Probuction, 137266, (2023).2) Karthik Kiran Sarigamala, Alexander Struck, Shobha Shukla, Sumit Saxena, “Heterophase interfacial hybrid//grapheme nanoscrolls based high performance lithium-ion hybrid supercapacitor”, Electrochimica Acta, Volume 450, 142266, (2023).3) Abhishek Pandey, Rahul Kumar Das, Amit K. Chakarborty, Shobha Shukala, Sumit Saxena, “Nanodefects assisted removal of reative dyes using biomass derived reduced 3D-OGFs”, Journal of cleaner production, volume 362, 132257, 15August (2022).4) Ramu Banavath, Anand Abhinav, Rohit Srivastava, Parag Bhargava, “ Highly sensitive ascorbic acid sensors from EDTA chelation derived nickel hexacyanoferrate/grapheme nanocomposites/grapheme nanocomposites”, electrochimica acta, volume 419, 140335, 1 july (2022).5) Mihir Kumar Jha, Neelam Sunariwal, Bradyn J. Parker, Neil Cameron, Chandramouli Subramaniam, “Multi-cationic ionic liquid combination enabling 86- fold enhancement in frequency response and superior energy density in all solid state supercapacitors, Journal of energy storage, Volume 53, 105164, September (2022)."}, {"Sr_no": "19", "Facility": "CHNSO Elemental Analyzer", "Make": "ThermoFisher Scientific", "Model": "Flash smart V CHNS/O", "Date_of_Installation": "18 July, 2022", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head CSIF, office.saif@iitb.ac.in,  0091-22- 2576 7691/2", "Facility_Manager": "Dr. Bharati Patro, bharati@iitb.ac.in", "Facility_Operator": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376/6884, Ms. Pallavi Khapre, pallaviag@iitb.ac.in, 022 2159 6875", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "The CHNS(O) Analyzer find utility in determining the percentages of Carbon, Hydrogen, Nitrogen, Sulphur and Oxygen of organic compounds, based on the principle of \"Dumas method\" which involves the complete and instantaneous oxidation of the sample by \"flash combustion\". The combustion products are separated by a chromatographic column and detected by the thermal conductivity detector (T.C.D.), which gives an output signal proportional to the concentration of the individual components of the mixture.There are different techniques for the determination of CHN\\CHNS\\O. It brings a new level of precision, accuracy, speed of analysis and ease of operation.The built in chromatographic column converts the compound and elutes it in the form of NO2,CO2, SO2,H2O which are then detected with the help of Thermal Conductivity Detector.The instrument is calibrated with the analysis of std compounds using the K-factors calculations. Thus the instrument ensures maximum reliability of the results because the combustion gases are not split or diluted but directly carried to build in GC system simultaneous determination of CHNS can be done in less than 10 mins. This method finds greatest utility in finding out percentages of C, H, N, S, (O) in organic compounds which are generally combustible at 1800o C.Key components of CHNS are auto sampler, combustion reactors ,chromatographic column, and T.C.D. detector.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Organic compoundsPharmaceuticalsFood & Agricultural IndustriesChemistry & Chemical Engineering Geological & Environmental samples Organometallics Gasoline and fuels Coal and coke Graphite and carbides  Metals and alloys  Polymers and explosives  Building materials and your samples…", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "20", "Facility": "Conductive atomic force microscope facility", "Make": "Asylum/Oxford Instruments", "Model": "MFP3D Origin", "Date_of_Installation": "5 August, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Force Microscopy, Electrical Characterisation", "Available_Equipment_Mode_of_use": "Contact mode, Tapping mode, PFM, cAFM, MFM, KPFM, EFM, SThM, Tapping mode, PFM mode, KPFM mode, SThM mode, Conductive mode, MFM mode", "Facility_In_Charge": "Prof. Udayan Ganguly, udayan@ee.iitb.ac.in, +91-22-2576-7698", "Facility_Manager": "Shweta Nair", "Facility_Operator": "Shweta Nair, shweta_nair@iitb.ac.in, 8898413122", "Department": "Electrical Engineering", "Features_Working_Principle": "Features:Has a maximum scan area of 90x90 μm2 and minimum scan area is around 10 to 30nm. Maximum scan depth is 14μm and minimum can be a few nanometresGood external noise isolationHigh speed pulse measurement capability through tipThe sample preparation is minimumIt has a maximum Scan Area of 90 x 90 μm2 and minimum scan area determined by tip radius, which is around 10 to 30nm. Maximum Scan Depth is 14μm and minimum can be a few nanometres.Good external noise Isolation.It can measure localized IV using standard and custom waveforms though nano scale conductive tips.High speed pulse measurement capability through tip is also added.Working Principle:IThe cAFM facility was installed in Electrical engineering department as a Central Facility as per RIFC norms. The facility is open for all IIT Bombay internal users to meet their research necessities.The AFM consists of a nanoscale tip mounted on a cantilever that scans over the sample interacting with its force fields. The resulting deflections of the cantilever is converted into a laser beam deflections and it is used to map topography and morphology of samples. Additionally it can measure electrical, magnetic and piezo-electric behaviour of the surface using suitable probes.", "Body": "", "Facility_Description": "This facility s a technique that uses a AFM tip to measure the topography of a sample surface along with its local electrical conductivity. This facility was installed in Aug 2015 and is widely used to study the electrical properties of materials like semiconductors, nanomaterials, organic electronics etc.", "Instruction_for_Sample_Preparation": "Preferably samples size should be less than 2cm × 2cm. For CAFM measurements back contact or visible bottom contacts/ pads are required.Max sample size permitted is 3cm * 3cm * 3cm. For better results, sample should be much smaller than the maximum sample size.", "Applications": "Material characterization applications including thin dielectric films, nanotubes,conductive polymers, and others Characterize ferroelectric and Piezoelectric materials, temperature control measurements.", "Chemical_allowed": "All chemicals are allowed", "Gases_allowed": "All non toxic gases allowed", "SOP": "S.O.P.pdf\n  (600.96 KB)", "Training and Other Policy Documents": "Training Policy_.pdf\n  (38.19 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "21", "Facility": "Cryo high resolution transmission electron microscope facility", "Make": "JEOL", "Model": "NEOARM 200F", "Date_of_Installation": "25 September, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "Room temperature imaging of dry samples Cryo mode-Imaging of vitrified sample EDS-Elemental mapping  STEM-Brightfield and darkfield images Electron diffraction for crystallography studies", "Facility_In_Charge": "Prof. Jayesh Bellare", "Facility_Manager": "Ashish Karale", "Facility_Operator": "Ashish Karale", "Department": "Chemical Engineering", "Features_Working_Principle": "Working PrincipleAberration corrected Cryo-HRTEMMake and Model: JEOL NEOARM 200F \"NEOARM\" / JEM-ARM200F comes with unique cold field emission gun (Cold FEG) and a new Cs corrector (ASCOR) that compensates for higher order aberrations. The combination of a Cold FEG and ASCOR enables atomic-resolution imaging at not only 200 kV accelerating voltage, but also a low voltage of 30 kV.\"NEOARM\" is also equipped with an automated aberration correction system that incorporates aberration correction algorithm for automatic fast and precise aberration correction. This system enables higher-throughput atomic-resolution imaging.Furthermore, a new STEM detector that provides enhanced contrast of light elements is incorporated as a standard unit. Contrast enhancement of light elements is achieved by a new STEM imaging technique, facilitating observation of light-element materials, even at low accelerating voltages.Cryo-HRTEM The JEM-2100 is a multipurpose, 200 kV analytical electron microscope with LaB6 source. supports research and development in wide scientific fields, for biology to materials researches.Cryo-Ultramicrotome Make and Model: Leica EM UC7Useful to prepare high-quality ultra- or semi-thin sections for your transmission electron or light microscope investigation whilst simultaneously creating perfectly smooth block face surfaces for atomic force, scanning electron, or incident light microscopy. For ultrathin cryo- sections or surfacing of cryogenic material, EM UC7 ultramicrotome can be equipped with the EM FC7 low-temperature sectioning system as needed.4. Freeze fractureMake and Model: Leica EM ACE900Freeze fracture describes the technique of breaking a frozen specimen to reveal internal structures. Freeze etching is the sublimation of surface ice under vacuum to reveal details of the fractured face that were originally hidden. A metal/carbon mix enables the sample to be imaged in a SEM (block-face) or TEM (replica).5. Cryo-plunger Make and Model: Leica EM GP2System offers automated vitrification to provide fast, easy, and reproducible sample preparation for cryo-EM. It performs the cryo-fixation process at constant physical and mechanical conditions like temperature, relative humidity, blotting conditions, and freezing velocity. This ensures high-quality cryo-fixation results and a high sample preparation throughput prior to cryo-TEM observation.", "Body": "Transmission Electron Microscope Configuration:Point resolution: 0.27 nmLattice resolution: 0.14 nmSTEM resolution: 0.082 nmElectron Source: Cold field emission gun.Accelerating Voltage: 80 kV & 200 kVMagnification: X2000 - X1500000Specimen Tilt angle X/Y:   +- 35°", "Facility_Description": "This facility facilitates TEM analysis of biological as well as soft solids on cryo mode or Room temperature mode. This facility works on Cryo EM technique where biological samples are preserved in vitreous ice and imaged by EM at cryogenic temperatures. High contrast helps in imaging biological samples without staining.", "Instruction_for_Sample_Preparation": "", "Applications": "Nanotechnology, Biology and Life sciences, Material science, Pharmaceutical analysis, Semiconductors.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "List of publications1. In Vivo Analysis of Biodegradable Liposome Gold Nanoparticles as Efficient Agents for Photothermal Therapy of Cancer AK Rengan, AB Bukhari, A Pradhan, R Malhotra, R Banerjee, Nano letters 15 (2), 842-8482. Mayur K Temgire, Akkihebbal K. Suresh,  Shantaram G. Kane,and Jay tg@iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Ms. Aditi Mahata", "Department": "Chemical Engineering", "Features_Working_Principle": "The JSM-7600F The Field Emission Gun (FEG) Scanning Electron Microscope (SEM) was installed at the IIT Bombay in 13th September  2012. The FEG-SEM will be used to obtain high resolution images of materials, cells, and tissues at the micron, sub-micron, and nanometer scale, taking advantage of the high resolution of SEM's with FEG electron sources. The FEG-SEM will also be integrated with a serial sectioning device to achieve sequential SEM images of materials following serial sectioning. The combination of devices will allow 3-dimensional analysis of tissue specimens with low-nanometer resolution in the X-Y plane and Z-plane resolution depending on the serial sectioning device.The Cryo unit (PP3010T) by Quorum was installed at the IIT Bombay in 22nd November 2024, is a highly automated, easy to use, column-mounted, gas-cooled cryo preparation system. The PP3010T has all the facilities needed to rapidly freeze and transfer specimens. The cryo preparation chamber is turbomolecular pumped and includes tools for cold fracturing, controlled sublimation and specimen coating. The specimen can then be transferred onto a highly stable SEM cold stage for observation. Cold trapping in the cryo preparation chamber and SEM chamber ensures the whole process is frost-free.", "Body": "FEG-SEM (JSM-7600F) :Source: Field emission gunSEI Resolution: 1.0nm at 15 kv                         1.5nm at 1 kv, in GB modeMagnification: Low: 25X to 10,000X                       High: 100X to 1,000,000X at 4x5 photo sizeAccerating Voltage: 0.1 to 30 kvProbe Current Range: 1 pA to ≥ 200 nA Cryo Preparation System (PP3010T) :Column mounted preparation chamber essential for frost free transfer and ease of use.Gas-cooled nitrogen cold stage assembly (-192 °C to 50 °C): Temp. stability", "Facility_Description": "This facility facilitates SEM analysis of biological as well as soft solids on Cryo mode. This facility works on Cryo EM technique where biological samples are preserved in vitreous ice and imaged by EM at cryogenic temperatures. High contrast helps in imaging biological samples without staining.", "Instruction_for_Sample_Preparation": "Magnetic samples can seriously damage the instrument. As per the manufacturer's instruction magnetic samples are not allowed.The sample thickness should be less than 3 mm.Any query related to the Cryo-FEG-SEM analysis should be emailed to cryofegsem@iitb.ac.in , Contact: 022 2159 4201", "Applications": "NanotechnologyBiology and Life sciencesMaterial sciencePharmaceutical analysisSemiconductorsDental and medical SciencePolymer ScienceMicrobiologyPlant ScienceFood ScienceThe main advantages of using a Cryo-SEM over a normal SEM are listed below:Specimen viewed in its fully hydrated stateSoluble materials are retainedLittle or no mechanical damage to the specimenIdeal for time resolved experiments (biological and industrial)High resolution capability (compared to low-vacuum techniques)Extra information obtained by low-temperature fracturingExcellent for liquids, semi-liquids and beam sensitive specimens.", "Chemical_allowed": "See MSDS form available at the time of booking slot", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Nehra, A.;Yarramala, D. S.; Hinge, V. K.; Samanta, K. and Rao, C. P.Differentiating Phosphates by an Mg2+ Complex of the Conjugate of Calix[4]arene via the Formation of Ternary Species and Causing Changes in the Aggregation: Spectroscopy, Microscopy, and Computational Modeling. Analytical Chemistry 2015, 87, 9344-9351.Bandela, A. K.; Hinge, V. K.; Yarramala, D. S. and Rao, C. P. Versatile, Reversible, and Reusable Gel of a Monocholesteryl Conjugated Calix[4]arene as Functional Material to Store and Release Dyes and Drugs Including Doxorubicin, Curcumin, and Toc

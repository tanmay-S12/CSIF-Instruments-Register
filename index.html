asuring optical distribution of light and mode structure at different emission wavelengths of waveguides and microlasers. Correlating this information with electrical properties of the devices, both on a macro scale and on a micro scale, by using the NSOM tip for monitoring carrier distribution and injected charge.Measuring the thermal distribution in such devices.Electric optical switching devices.Polymer electro-luminescence – either collect or inject light and measure electrical properties of devices made of such materials.Porous silicon.Gallium Nitride lasers.Measuring light distribution in electro-optically active crystals as a function of injection of electrical charge.Optical fiber and optical waveguide switches characterization.4. Applications in Bacteriology Staining nucleic acids and proteins in bacteria and measuring distribution of specific proteins and DNA and RNA in bacteria.Bacterial imaging without staining using specific laser wavelengths, such as in the DNA absorption at 266nm.Correlating the previous two measurements with the bacterial life cycle.5. 3D Optical Microscopy/NSOM/AFM Combination Correlating a CCD digital optical image, a confocal image, or a non-linear optical image obtained through a microscope with NSOM and AFM data at specific points.Use this NSOM and AFM data as super-resolution constraints for mathematical deconvolution algorithms that rapidly de-convolve the entire 3D optical image at resolutions unachievable with lens-based far field microscopy.6. Biotechnology AFM based topographic structure and simultaneous NSOM chemical structure identification by optical staining. On-line correlation of all this data with far field optical images.Dissection of specific regions of chromosome correlated with the previous measurement and sequence identification of these regions by the application of PCR technology.Relationship of mechanics of specific regions using AFM capabilities with optical imaging (NSOM and far field) of stained DNA and the dissected chemical structure. Investigation of the nature of fragile sites.7. Laser Tweezer/AFM Combination Correlating laser tweezer forces with AFM detected forces in nano-regions.8. Gold or Silver Ball Immuno-Labeling Antibody Attachment to Specific Proteins Competitive use of NSOM instead of electron microscopy in pathology laboratories and in investigations of gold and silver labeled biological tissue and sectioned biological tissue, such as brain slices for monitoring neuronal interconnections. In addition, live tissue investigations with such staining are possible.9. Optical Ion Sensing Ion sensing around membrane channels with NSOM and force sensing of sub-nanometer protein and membrane movements.NSOM/Ion conductance/AFM.NSOM focal uncaging of neurotransmitters and other molecules for the investigation of synaptic function and plasticity.Ion conductance using a multi-channel AFM/optical fiber probe for simultaneous measurements of membrane ion conductivity, channel movement, and optical signals, such as fluorescence of fusing synaptic vesicles, local fluorescence near membrane, and intracellular ion sensing dyes.Full correlation of all of the above with far field optical confocal or non-linear optical fluorescence imaging and evanescent wave microscopy.10. Fountain Pen Force Sensing Applications Chemical writing with single or dual channel nanopipettes.Selective etching with gases or liquids.Flat panel display correction.Tribology with specific lubricants in the fountain nanosensor monolayer deposition.Crystal growth with mother liquor in one channel and ion sensing in the other channel using NSOM. To understand the underlying mechanisms that lead to crystal growth, it is crucial to know the ionic environment at and above a specific crystal plane as it grows. When this is coupled to the ability of chemical sensors (also manufactured by Nanonics) to measure surface forces, one obtains a multidimensional view of crystal growth that has never before been achievable. This should lead to new views of how crystals grow and how to coax the growth of crystals, from those associated with small molecular systems to biological macromolecules.Lipid deposition in specific membrane domains with lipid tip coated/force sensing cantilevered nanopipettes.Simultaneous capillary electrophoretic delivery of chemicals to cells and with AFM sensing.11. Photoresist Exposure in the UV, Deep UV (193nm) and Ultra Deep UV (157nm) For photoresist development and characterization in the microelectronics industry.12. Data Storage Applications Magneto-optic investigations.Etching structures for data storage investigation.Optical / AFM integration - optical alterations with AFM detection.13. NanoRaman, Nano IR, Nano-Two Photon, and Nano-Second Harmonic Spectroscopy Apertureless enhancement in nanoregions with unique glass cantilevers nanotipped with a silver particle of controlled size, from two to hundreds of nanometers.14. Nano-Aperture Based Infrared Application Local heating for micro-soldering.Collection of infrared light for monitoring light distribution in quantum cascade lasers (see also 2 above) and correlating this information with electrical properties of such lasers.Vibrational spectral imaging of single molecules and their films.15. Thermal Sensing Cantilevered Tips with Optical Sensing 16. Scanning Electro-Chemical Microscopy Using multi-channel cantilevered glass tips to perform simultaneous electrochemical and near-field optical imaging. Fully correlated with far-field optical microscopy.17. Ultra-Fast Laser Spectroscopy and Surface Modifications Femtosecond pulse delivery in nano-regions.Pump-probe spectroscopy. For example, carrier injection in semiconductors together with force sensing techniques.Femto-second lithography of metals and metallic structures without associated heating.18. Monitoring Optically Induced Dynamic Structural Alterations in Proteins, Membranes, and Chalcogenides With microsecond time resolution.19. Fluorescence NSOM/Confocal Imaging Single molecules, nanocrystals and thin films with and without imposed forces, electrical fields, etc.Cellular fluorescence imaging.", "Chemical_allowed": "Isopropanol and ethanol", "Gases_allowed": "Nitrogen, Argon, and Oxygen", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "SNOM_Description.pdf\n  (739.6 KB)", "Publications": ""}, {"Sr_no": "134", "Facility": "Scanning probe microscope facility - I at MEMS", "Make": "Agilent, Switzerland", "Model": "5500", "Date_of_Installation": "9 October, 2014", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Force Microscopy", "Available_Equipment_Mode_of_use": "Atomic force microscopy-contact, non-contact and tapping mode Lateral force microscopy-stiffness, frictional forces Magnetic force microscopy-changes in the phase of the cantilever due to interatomic magnetic force Scanning tunneling microscopy, Electrostatic force microscopy-Phase response of the cantilever induced by the interaction of the conducting tip and the electrostatic field of the sample surface Kelvin force microscopy-contact potential difference between tip and sample Time series, For now, only Contact Mode, Non-Contact Mode, Tapping Mode are available Modes.", "Facility_In_Charge": "Prof. Tanushree H. Choudhury, tanuhc@iitb.ac.in", "Facility_Manager": "Prof. Tanushree H. Choudhury", "Facility_Operator": "Ruchita Vadera, spm_mems@iitb.ac.in, Extension: 02221596332", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "Scanners: Lateral range X-Y imaging area up to 50 μm x 50 μm, Vertical (Z) range: 7μm; (For now, only Contact Mode, Non-Contact Mode, Tapping Mode are available Modes.)AFM stands for Atomic Force Microscopy or Atomic Force Microscope and is often called the \"Eye of Nanotechnology\". AFM, also referred to as SPM or Scanning Probe Microscopy, is a high-resolution imaging technique that can resolve features as small as an atomic lattice in the real space. It allows researchers to observe and manipulate molecular and atomic level features.AFM works by bringing a cantilever tip in contact with the surface to be imaged. An ionic repulsive force from the surface applied to the tip bends the cantilever upwards. The amount of bending, measured by a laser spot reflected on to a split photo detector, can be used to calculate the force. By keeping the force constant while scanning the tip across the surface, the vertical movement of the tip follows the surface profile and is recorded as the surface topography by the AFM.The predecessor of AFM is STM, Scanning Tunneling Microscopy or the Scanning Tunneling Microscope, was invented in 1981 by G. Binnig and H. Rohrer who shared the 1986 Nobel Prize in Physics for their invention. An excellent technique, STM is limited to imaging conducting surfaces.Atomic Force Microscopy has much broader potential and application because it can be used for imaging any conducting or non-conducting surface. The number of applications for AFM has exploded since it was invented in 1986 and now encompass many fields of nanoscience and nanotechnology. It provides the ability to view and understand events as they occur at the molecular level which will increase our understanding of how systems work and lead to new discoveries in many fields. These include life science, materials science, electrochemistry, polymer science, biophysics, nanotechnology, and biotechnology.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "Life ScienceMaterial SciencePolymer ScienceElectrical characterizationBiotechnology", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Saurabh Soni, Pushkar Sathe, Sudipta Kumar Sarkar, Ashok Kushwaha, Dipti Gupta, “Inkjet-printed sub-zero temperature sensor for real-time monitoring of cold environments”, International Journal of Biological Macromolecules”, v128, p128774, (2024)Subhankar Sahu, Lokesh Kumar, Sumita Das, Dipti Gupta and Ruchi Anand, “Ultrasensitive detection of aromatic water pollutants through protein immobilization driven organic electrochemical transistors”, Chem. Sci. of Royal society of chemistry, v15, p 710, (2024)Akanksha Adaval, Vaibhav Khurana, Bharat B Bhatt, Shiva Singh, Dipti Gupta, Pradip K Maji, Mohammed Aslam, Terence W Turney, George P Simon, Arup R Bhattacharyya, “Piezoelectric properties of noncovalently functionalized 2D nanomaterials incorporated poly (vinylidene fluoride) nanocomposites”, Journal of Applied Polymer Science, v141, p e54814, (2024)S. Sarkar, D. Majhi, S. Kurup, Dipti Gupta*, “Photonic Cured Metal Oxides for Low-Cost High-Performance Low Voltage Flexible and Transparent Thin Film Transistors”, ACS Applied Electronic Materials, v4, p2442, (2022)Javed Alam Khan, Ajay Singh Panwar, Dipti Gupta, “Domain modulation and energetic disorder in ternary bulk-heterojunction organic solar cells”, Organic Electronics, v102, p106376, (2022) J Khan, Ramakant Sharma, Ajay Singh Panwar, Dipti Gupta, “Impact of non-fullerene acceptors and solvent additive on the nanomorphology, device performance, and photostability of PTB7-Th polymer based organic solar cells”, Journal of Physics D: Applied Physics, v55, p495503"}, {"Sr_no": "135", "Facility": "Scanning probe microscope facility - II at Physics", "Make": "Bruker (Previously Veeco)", "Model": "Multimode Nanoscope-IV", "Date_of_Installation": "1 September, 2004", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Force Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. M. Aslam, m.aslam@iitb.ac.in  022-2159 6746", "Facility_Manager": "", "Facility_Operator": "Mr. Harish Sonar  p13553@iitb.ac.in  Ext. 022 2159 6501", "Department": "Physics", "Features_Working_Principle": "", "Body": "AFM Modes and AccessoriesRoutine ModesContact mode AFMTapping mode AFMAdvanced ModesSTM with following applications:Low current STMScanning Tunneling Spectroscopy (STS)Fluid Cell AFMMagnetic Force Microscopy (MFM)Electric Force Microscopy (EFM)Conductive AFM (C-AFM)Electrochemical AFM and STMNanoindentation and Nanoscratching* Subject to availability of manpower with relevant expertise.Available ScannersJ scanner (125 × 125 × 5 µm)E scanner (10 × 10 × 5 µm)A scanner (0.4 × 0.4 × 5 µm)Other AccessoriesVibration isolation table and acoustic isolation hoodOptical microscope with color digital video for area selectionDigital image processing and analysis softwareQuadrexed phase signal processing for higher phase sensitivity and fast scan micro actuator cantilevers", "Facility_Description": "Scanning Probe Microscope facility is used to characterize surfaces and structure at nanoscale using variety of physical probes. The facility includes Atomic Force Microscopy (AFM), Scanning Tunneling microscope (STM) etc.", "Instruction_for_Sample_Preparation": "", "Applications": "AFM Techniques and ApplicationsSurface Topography and RoughnessSurface topography and roughness characterization involves measuring the texture and irregularities of a surface. Atomic Force Microscopy (AFM) is commonly used for this purpose, providing high-resolution images that reveal surface features at the nanoscale. This analysis is crucial for understanding material properties and behavior in various applications.Particle Size AnalysisParticle size analysis using AFM helps determine the dimensions and distribution of particles at the nanometer scale. This is important for materials science and engineering, where particle size can significantly influence the properties and performance of materials.Atomic Resolution ImagingAFM allows for atomic resolution imaging, enabling the visualization of individual atoms on a surface. This capability is essential for research in nanotechnology and materials science, providing detailed insights into atomic-scale structures and phenomena.Electrical MappingElectrical mapping with AFM involves measuring the electrical properties of a sample surface, such as conductivity and potential distribution. Techniques like Conductive AFM (C-AFM) and Electrostatic Force Microscopy (EFM) are used for this purpose, helping to analyze and optimize electronic materials and devices.Magnetic MappingMagnetic Force Microscopy (MFM) is an AFM technique used to map magnetic properties at the nanoscale. This method is valuable for studying magnetic materials and devices, providing insights into magnetic domain structures and behaviors.Mechanical PropertiesAFM can measure mechanical properties such as hardness, elasticity, and stiffness by probing the sample with a sharp tip. Techniques like nanoindentation and Force Modulation Microscopy (FMM) provide quantitative data on material mechanical behavior.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Research PublicationsJournal Articles“Oriented assembly of Ni-clusters embedded in semi-insulating NiO epitaxial films”, S. K. Yadav, B. P. Sahu, S. Dhar, J. Phys. D: Appl. Phys., 55 (2022) 035002 (7pp).“CoFeVSb: A Promising Candidate for Spin Valve and Thermoelectric Applications”, J. Nag, D. Rani, D. Singh, R. Venkatesh, B. Sahni, A. K. Yadav, S. N. Jha, D. Bhattacharyya, P. D. Babu, K. G. Suresh, A. Alam, (Archive) https://arxiv.org/abs/2111.14081.“Phosphorus doping of ZnO using spin-on dopant process : A better choice than costly and destructive ion-implantation technique”, M. Mishra, S. Sushama, S. K. Pandey. S Chakrabarti, J. Lumin., vol. 233, no. January, p. 117921, 2021.“Fabrication of Through-glass Vias (TGV) based 3D microstructures in Glass Substrate by a lithography-free process for MEMS applications”, V. K. Bajpai, D. Mishra, P. Dixit, Applied Surface Science, vol. 584 (2022), 152494.“Growth of Hybrid Perovskite Films via Single‐Source Perovskite Nanoparticle Evaporation”, R. Yadav, M. Roy, G. Banappanavar, M. Aslam, Chem: An Asian Journal 2022. https://doi.org/10.1002/asia.202200087.“Ordered stripes to crack patterns in dried particulates of DNA-coated gold colloids via modulating nanoparticle–substrate interactions”, S. Bhattacharjee, S. Srivastava, Soft Matter, 19(12), 2265(2023).“Study of residual stress in reactively sputtered epitaxial Si doped GaN films”, M. Monish, S.S. Major, Mater. Sci. Semicond. Process., 150, 106902 (2022).“Highly sensitive few–layer MoS2 nanosheets as a stable soil moisture and humidity sensor”, M. S. Siddiqui, A. Mandal, H. Kalita, M. Aslam, Science Direct, Sensors and Actuators B: Chemical, 365, 131930(2022).“Highly Stable and Reusable 3D Graphene-Quinizarin Voltammetric pH Sensor”, M. S. Siddiqui, M. Aslam, Journal of the Electrochemical Society, 170, 4 (2023).“Investigation of phosphorus-doping of MgZnO thin films using efficient spin-on dopant process”, M. Mishra, R Saha, L. Tyagi, S. Sushama, S.K. panday, S. Chakrabarti, Journal of luminescence, 257, 119748 (2023).“Preclinical safety assessment of red emissive gold nanocluster conjugated crumpled MXene nanosheets: a dynamic duo for image-guided photothermal therapy”, B. Singh, R. Bahadur, P. Maske, M. Gandhi, D. Singh, R. Srivastava, Nanoscale, 15, 2932(2023).“Study of lithium incorporation in (111) NiO epitaxial layers grown on c-sapphire substrates by pulsed laser deposition technique”, B. P. Sahu, S. K. Yadav, S. Arora, S. Dhar, Journal of Physics D: Applied Physics. (DOI 10.1088/1361-6463/accc41)“BiOBr Surface-Functionalized Halide Double-Perovskite Films for Slow Ion Migration and Improved Stability”, Bhawna, M. Roy, A. Kaur, A. Alam, M. Aslam, ACS Appl. Mater. Interfaces, 15, 14, 18473–18481(2023).Conference PresentationsS. Bhattacharjee, “Transition from stripe to crack like pattern in dried droplet of colloidal particles” - International Conference on Smart Materials for Sustainable Technology-II (SMST-2022), organized by SIRMB, IIT Bombay, IIT-BHU on 13th -16th October 2022 (Oral).S. Bhattacharjee, “Concentric-ring to crack formation in particulates of DNA-AuNP suspension by modulating nanoparticle-substrate interaction” – Complex Fluid Symposium (CompFlu 2022), organized by Indian Society of Rheology (ISR), IIT-KGP on 19th -21st December 2022 (Poster)"}, {"Sr_no": "136", "Facility": "Semi-prep HPLC at chemistry", "Make": "SHIMADZU", "Model": "Semi-Prep CBM -20A HPLC", "Date_of_Installation": "25 August, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Liquid Chromatography", "Available_Equipment_Mode_of_use": "Analytical and Semi prep mode", "Facility_In_Charge": "Prof. Debabrata Maiti, Chemistry", "Facility_Manager": "Charine Astrid Pawar", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "It can be used for analytical as well as Semi-Prep analysis depending upon column used and mode selected.LC-20AP Pump along with FCV-200AL unit (Quaternary valve) is capable of using 4 solvents with max. flow upto 50mL/ min. Autosampler ( SIL-20AC HT) is available for Analytical mode which introduces a precise aliquot of a sample solution from a sample container to HPLC column. For Prep Mode , sample is injected manually ( max. 2mL)Fraction collector module (FRC-10A): it collects fractions even when the peak elution time varies, by catching the target component according to variations in the chromatogram. PDA detector(SPD-M40): It can detects entire Wavelength range of 190 nm - 800 nm simultaneously, wavelength accuracy ± 1 nm.Following Reverse Phase column are available with system Shim Pack GIST C18, 5um, 4.6 x 250 Shim Pack GIST C18, 5um, 10 x 250 Shim Pack GIST C18, 5um, 20 x 250", "Body": "", "Facility_Description": "Semi preparative Chromatography is carried out under low backpressures with bigger inner diameter columns and bigger particle size by passing mobile phases at high flow rates. It is used to purify and collect component of interest from all other contaminants in sample.", "Instruction_for_Sample_Preparation": "Only solvents compatible with the column can be used. All solvents and any chemicals required to be provided by the user.", "Applications": "", "Chemical_allowed": "Yes", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "137", "Facility": "Siemens Training Kit - 3axis", "Make": "Vraj MachinesTools Pvt Ltd", "Model": "1) Siemens 840D(CSR - 840DSL-M)  2) Siemens 828D (CSR-828D-T)", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof  Makarand Kulkarni", "Facility_Manager": "", "Facility_Operator": "Mrs. Ashwini Patil", "Department": "Mechanical Engineering", "Features_Working_Principle": "Siemens CNC SimulatorsEquipped with advanced Siemens 840DSL-M and 828D-T simulators, this setup allows in-depth exploration of controller-level data and integration frameworks for Industry 4.0 research and applications.Supports industrial communication via Profibus, OPC UA, and STEP7Full parameter extraction from controllers in real-timeEnables experimentation on data read/write processesFacilitates digital twin creation and predictive maintenance modelingIdeal for validating AI/ML algorithms in a simulated environmentSimulator-based setup allows flexibility for custom industrial scenarios", "Body": "", "Facility_Description": "CNC machine simulator and Data Acquisition Lab equipped with Siemens simulators, enabling high-frequency data extraction for real-time monitoring, predictive maintenance, and AI/ML applications. This facility supports comprehensive experimentation in digital twin development, industrial data communication, and smart manufacturing strategies, without limitations imposed by physical machines.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "138", "Facility": "Simultaneous Thermogravimetric Analyzer (TGADTA)", "Make": "Hitachi", "Model": "NEXTA STA300", "Date_of_Installation": "14 October, 2022", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Temperature Range\t: Regular use\t: RT to 1300 ℃;  Scanning Rates\t: 0.1 to 100 ℃ DTA Measurement range\t: ± 1000 µV Gas Type\t: N2, Air, Ar, O2 Gas Flow rates\t: 50 to 500 ml/min Auto sampler\t: 50 samples, Temperature Range\t: RT to 1450 ℃  for  Special Requirements", "Facility_In_Charge": "Head, CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022 2159 6851", "Facility_Operator": "Mrs. Aradhana Naudiyal , Mrs. Meenal Hande, tgdta.saif@csif.iitb.ac.in, nmr600@iitb.ac.in, 022 2159 6866", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Simultaneous Thermogravimetric Analysis is a method in which thermogravimetry and differential thermal analysis are combined and measured simultaneously by a single apparatus.Thermogravimetry (TGA) is a technique that measures mass change in a sample as a function of time and temperature, and it is used to detect evaporation, decomposition, oxidation and other effects of temperature change that cause mass changes. Differential Thermal Analysis (DTA) measures the temperature difference between a sample and a reference as the temperature is increased. Changes in the sample, either exothermic or endothermic, can be detected relative to the inert reference. Thus, a DTA curve provides data on the transformations that have occurred, such as glass transitions, crystallization, melting and sublimation.", "Body": "", "Facility_Description": "The Nexta STA300 has a temperature range from ambient to 1450 ℃, with horizontal digital dual beam balance system.The TGDTA Instrument measures weight loss and thermal properties of a sample in a single experiment as a function of temperature.", "Instruction_for_Sample_Preparation": "At least 30-40 mg of sample should be submitted.Sample size should be < 5mm in diameter and < 2.5mm in thickness.Samples containing halogens should not be sent and will not be accepted for analysis.Samples containing corrosive substances that will react with Aluminium/Platinum/Ceramic pans should not be sent for analysis by TG-DTA.Samples should not be toxic or hazardous.Radioactive material, unstable and explosive compounds are not accepted for analysis.Interpretation of spectra is NOT undertaken.Samples containing alkali metal oxides, hydroxides, heavy metals, alkali metal halides, nitrates, or large amounts of sulphur heated in a platinum crucible can erode the crucible.If heavy metals like lead, bismuth, tin, arsenic, silver, mercury, copper, Selenium, tellurium, etc. are present then do specify them in the MSDS form.", "Applications": "Changes in mass due to decomposition, oxidation, evaporation, or combustion.Volatilization rate of materials, Moisture content & Solvent content Thermal Stability for quality assurance and safety purposes.Kinetics analysis.Additives, Polymer content, Filler content, etc. Glass transitions, Endothermic(Melting) and Exothermic reactions (Crystallization)", "Chemical_allowed": "Non-explosive, non-corrosive, non-toxic, halogen-free, non-carcinogenic.", "Gases_allowed": "Nitrogen, Argon, Oxygen and Air", "SOP": "", "Training and Other Policy Documents": "Training policy for TA's.pdf\n  (182.25 KB)\n, Lab Policy TGA & DSC_0.pdf\n  (216.67 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "139", "Facility": "Single Crystal Xray Diffractometer at Chemistry", "Make": "Bruker", "Model": "D8 Quest", "Date_of_Installation": "10 December, 2019", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Single Crystal XRD", "Available_Equipment_Mode_of_use": "At 150K low temperature", "Facility_In_Charge": "Prof. Ramaswamy Murugavel ,   email ID:- muruks@iitb.ac.in,", "Facility_Manager": "Mr.Darshan Mhatre,  email ID:- darshansmhatre@iitb.ac.in,  Contact No:- 022-2576 4157/59", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "A single crystal X-ray diffractometer works on the principle of X-ray diffraction from a periodic arrangement of atoms in a crystal. It uses Bragg’s Law to measure how X-rays scatter from different crystal planes, and from this scattering pattern, it reconstructs the 3D atomic structure of the crystal.", "Body": "", "Facility_Description": "The Bruker D8 QUEST is a state-of-the-art single-crystal X-ray diffractometer (SC-XRD) widely used in chemical crystallography and structural biology. Designed for single-wavelength experiments, it delivers high-quality structural data in a compact, modular, and air-cooled package.Key Features & ComponentsDetectors:PHOTON II: Photon-counting detector with mixed-mode technology.X-ray Sources:Sealed-tubeMicro-focus IµS 3.0Goniometer:FIXED-CHI (simpler, fewer moving parts) and KAPPA Enclosure & Cooling:TÜV-certified safety enclosure.Fully air-cooledAPEX (chemical crystallography suite).", "Instruction_for_Sample_Preparation": "", "Applications": "Determination of crystal Structure, bond angle, bond length, chirality, Stereochemistry.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "140", "Facility": "Size Exclusion Chromatography - Multi Angle Dynamic Light Scattering Facility", "Make": "Wyatt Technology", "Model": "Multi Angle Dynamic Light Scattering S WD38,228-65012-58", "Date_of_Installation": "7 February, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Liquid Chromatography", "Available_Equipment_Mode_of_use": "•\tSEC-MALS with DLS, •\tSEC-MALS without DLS", "Facility_In_Charge": "Prof. Ashutosh Kumar, Email Id.: ashutoshk@iitb.ac.in, Contact: 022-25767762", "Facility_Manager": "Mr. Nitin Bhoite Email Id : 30004943@iitb.ac.in Contact : 022-25764757", "Facility_Operator": "", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "SEC-MALS describes a technique for measuring the light scattered by a sample into a plurality of angles. It is used for determining both the absolute molar mass and the average size of molecules in solution, by detecting how they scatter light. A collimated beam from a laser source is most often used, in which case the technique can be referred to as multiangle light scattering (MALS).", "Body": "DAWN 8, Static Light Scattering Detector (Ex.Wyatt Technology) (WD38) Multi-angle, digital signal processing (DSP) light scattering detector with Programmable laser (10 - 100%) Laser Wavelength: 658 nm 8 angle research grade light scattering photometer for absolute molar mass determinations. Temp Control Ambient Molar Mass Range: 2000 Da to 100 MDa. Molecular Size Range: ≈ 10 to 300 nm Eliminates column calibration Built in-COMET (Cell Operation Maintenance Enhancing Technology) device for in- situ flow cell cleaning Detector Resolution: 24 bit Determines absolute molar masses, sizes and conformations", "Facility_Description": "Absolute Molecular Weight determination", "Instruction_for_Sample_Preparation": "Liquid samples prepared in appropriate buffer and pH as per column specifications", "Applications": "Protein aggregation studiesProtein-protein interactionsFor the study of pharmaceutical drug stability", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "141", "Facility": "Small Angle X-ray Scattering (SAXS)", "Make": "Xenocs SAS", "Model": "Xeuss 2.0", "Date_of_Installation": "1 December, 2018", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Structural Characterization", "Available_Equipment_Mode_of_use": "Small Angle X-ray Scattering (SAXS), Wide Angle X-ray Scattering (WAXS), ,", "Facility_In_Charge": "Head CSIF, office.saif@iitb.ac.in, 022- 25767691/2", "Facility_Manager": "Dr. Gajender Saini, gsaini@iitb.ac.in, 022-21596481", "Facility_Operator": "Ms. Vinita Anvekar, vinitas@iitb.ac.in, 022-21596867, Ms. Reshma Kadam, reshmas@iitb.ac.in, 022-21596867", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "X-rays are scattered at the electrons of the atomic shell. During the scattering process the electron is starts oscilating. Itbecomes a dipol and a spherical wave is sent out. The wavelength and energy of the scattered wave does not change (elastic scattering).By detecting x-rays scattered at different angles, different sample information is gained at different resolutions: SAXS has nanoscale resolution (good for samples 100-1 nm in size) while WAXS has atomic resolution (1-0.1 nm). Due to this, SAXS can be typically used to analyse larger scale bulk microstructure within a sample, while WAXS is more similar to x-ray diffraction.", "Body": "X-ray Source: (Dual Source Module)     GeniX3D Cu 30 Watts Cu tube with 50 KV  0.6mA current     GeniX3D Mo, System shielded microfocus tube ( 50 Watts-50 kV/1 mA)Optics: Single reflection multilayer parabolic mirror.Slits: Single crystal scatter less slits ( S1, S2)Detector: Eiger R 1M with vacuum feed through set high resolution hybrid pixel photon counting detector with a 75 µm pixel sizeAutomation: SpecFE based software to control motors slits, etc.Data Acquisition: FoxtrotAnalysis Software: Xsact software provided by Xenocs for basic modelling, and SASfit software freeware provided.Accessories :      1)Capillary Flow Cell      2)High temperature sample stage (-150 ⁰C to 350 ⁰C)      3)Tensile Stage (0-200N) with humidity :      4)Operating temperature range: -150 ⁰C to +250 ⁰C without the relative humidity Generator      5)Multisample holders for powder and gels      6)Multipurpose X-ray Temperature stage (-30⁰C to 150 ⁰C)      7)Capillary cells of different sizes      8)High Pressure cell GiSAXS module      9)Shear Cell System ( ambient to 350 ⁰C)", "Facility_Description": "SAXS is an analytical characterization tool used to determine the structure of particle systems in terms of averaged sizes or shapes. The materials can be solid or liquid and they can contain solid, liquid or gaseous domains (so-called particles) of the same or another material in any combination. The method is accurate, non-destructive and usually requires only a minimum of sample preparation. Applications are very broad and include the metal, cement, oil, polymer, plastics, food and pharmaceutical industries and can be found in research as well as in quality control.The state of the art machine just installed at SAIF IITB provides opportunities to analyze samples in various environments (ambient, low and high temperature, high pressure, and flow conditions).", "Instruction_for_Sample_Preparation": "", "Applications": "1)The Properties of functional materials are strongly linked to their size, shape, interaction potential.2)Functionalization of self-assembled structure.3)Self assemblies of amphiphilic molecules called micelles are often utilized to stabilized water –insoluble functional substances  such as vitamins, perfumes and many more in water based products.4)Pharmaceutical materials- Drug delivery systems are made of nano-carrier.5)Food and nutrients- The structural information has become more and more important for developing better texture and functionalities that make food product wholesome.6)Nano size inorganic particles are used in a wide verity of industrial fields such as cosmetics, paints and ceramics production.7)Nano composites8)Lipoproteins- SAXS often fast and precise measurement of LP particles using only small amount of samples.", "Chemical_allowed": "NA", "Gases_allowed": "NA", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "142", "Facility": "Spectrofluorometer- Fluorolog-QM at Chemistry", "Make": "Horiba", "Model": "FQ5310022306A00168", "Date_of_Installation": "2 March, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "Quantum yield and Phosphorescence for solid and liquids", "Facility_In_Charge": "Professor Arindam Chowdhury", "Facility_Manager": "Mr Amol Hanumante", "Facility_Operator": "Mr Amol Hanumante", "Department": "Chemistry", "Features_Working_Principle": "Features/ Accessories: Source: 450 W Xenon lampPulsed Source for Lifetime studyFelix FL softwareAutomated polarizers located at entrance and exit of sample compartmentDouble Excitation 350nm Czerny-Turner coma-corrected monochromatorsSingle Emission 350nm Czerny-turner coma-corrected monochromatorIntegrating Sphere for direct PLQY sample measurement Multimode PMT detector Liquid Nitrogen cooled InGaAs detector (Range 800-1500nm) SS holder for thin film, Powdered samplesPrinciple: https://www.horiba.com/ind/scientific/technologies/fluorescence-spectroscopy/what-is-fluorescence-spectroscopy/ 2.  https://www.horiba.com/ind/scientific/technologies/fluorescence-spectroscopy/what-are-luminescence-quantum-yields/", "Body": "--", "Facility_Description": "This Spectrophotometer offers the ultimate sensitivity in fluorescence or emission profile of the complex under investigation. It is controlled by Felix software for steady state and lifetime experiments. It has wavelength range from UV to NIR and used for NIR steady state and phosphorescence lifetime detection.", "Instruction_for_Sample_Preparation": "If Any reference material, solvents required are to be supplied by the userUser should provide solid samples in the fine powder form. Minimum required amount is approximately 1-2 gm. Liquid Samples are prepared by user in appropriate concentration required for the experiment. The required minimum amount is 2-3 ml. In case any additional Chemicals/ materials required for recording the samples, Charges would be additional.", "Applications": "Qualitative and Quantitative In Biotechnology life time measurement and Quantum Yield Industrial etc", "Chemical_allowed": "No", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "143", "Facility": "Spectrofluorometer-Fluoromax Plus at Chemistry", "Make": "Horiba", "Model": "Fluoromax Plus", "Date_of_Installation": "2 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "Fluoroscence  for Solid/ liquid/ films", "Facility_In_Charge": "Prof. Arindam Chowdhury", "Facility_Manager": "Mr. Amol Hanumante", "Facility_Operator": "Mr. Amol Hanumante", "Department": "Chemistry", "Features_Working_Principle": "Features/ Accessories: Source: 150 W Ozone-free xenon arc lampGrating: 1200 groove/mm blazed at 330 nm (excitation) and 500 nm (emission), plane ruled. Automatic self-calibration of all wavelength drives and slitsMonochromators: All reflective optics, Czerny-Turner spectrometersWater Raman S/N: 10,000:1 (FSD method). See Signal-to-noise ratioDetectors: Multialkali PMT emission detector (200-870nm)Liquid nitrogen cooled InGaAs detector (800-1550nm). It requires liquid N2 supplyRapid Peltier controlled single sample holder, -15° to 105°C water circulatorAutomated polarizers located at entrance and exit of sample compartmentSS sample holder for thin film, powder samples, pellets etcFluorEssence software for control and data analysis  Principle: https://www.horiba.com/ind/scientific/technologies/fluorescence-spectroscopy/what-is-fluorescence-spectroscopy/", "Body": "---", "Facility_Description": "The Fluorescence Spectrophotometer offers the ultimate sensitivity in fluorescence or emission profile of the complex under investigation. The instrument is easy to use and is controlled by FluorEssence software with Origin embedded for sophisticated data analysis.", "Instruction_for_Sample_Preparation": "User must contact the Technical operator before booking slot and discuss the experimental parameter If Any reference material, solvents required are supplied by the userProvide solid samples in the fine powder form. Minimum required amount is approximately 1-2 gm. Liquid Samples are prepared by user in appropriate concentration required for the experiment. The required minimum amount is 2-3 ml.  In case any additional Chemicals/ materials  required for recording the samples, Charges would be additional.", "Applications": "Qualitative and Quantitative analysisIn Biotechnology IndustriesEnvironmental etc", "Chemical_allowed": "No", "Gases_allowed": "No", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "144", "Facility": "Spinning disc confocal microscope facility", "Make": "Yokogawa Electric Corporation", "Model": "CSU-X1", "Date_of_Installation": "20 June, 2015", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "SD Confocal Mode: Three channel/color imaging along with brightfield/DIC imaging Z-stacks, Multipoint, and Time series (with or without Z-stack)., Fluorescence/Widefield microscope mode: Six channel/color imaging along with brightfield/DIC imaging Z-stacks, Multipoint, and Time series (with or without Z-stack).", "Facility_In_Charge": "Name: Prof. Swati Patankar, Email: patankar@iitb.ac.in, Contact: +91 22-2159 7773", "Facility_Manager": "", "Facility_Operator": "Name: Mr. Pradip Shinde, Email: sdconfocal@iitb.ac.in, confocal002@gmail.com , Contact: +91022-2119 6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Working Principle:There is a trade-off between image acquisition at high-resolution and at high speed with conventional scanning probe confocal microscopy. This is because each point in the sample plane is scanned in a sequential manner to obtain a 2D image. In a spinning-disk confocal microscope, multiple points within the sample are excited simultaneously. The image is recorded using an array detector like a high-speed sensitive EMCCD camera instead of a point detector (e.g. PMT). This system is suitable for capturing fast changing phenomena, such as, imaging swimming bacteria, etc.The Yokogawa CSU-X1 spinning disc has a combination of upper and lower disks rotated by a motor. The laser light is first defocused to expand to a larger spot size. This larger laser beam spot is then translated into ~20000 small focused laser beam spots by the upper microlens array disk. These laser beam spots then pass through a dichroic mirror and are perfectly aligned to pass through corresponding pinholes on the lower pinhole array disk. The laser spots are then focused by the objective lens onto the sample. Fluorescent light from the specimen returns along the same path through the objective lens and pinholes, is reflected by a dichroic mirror, and is focused at a camera. Thus, the light beams can illuminate the entire observation area of the specimen and form a confocal optical slice at the camera.", "Body": "Zeiss Observer Z1 Microscope Specifications:Microscope and spinning disc: Zeiss observer Z1 inverted motorized and computer-controlled fluorescence microscope fitted with high-speed microlens-enhanced nipkow spinning disc.Objectives: 10X/0.45 NA (air), 20 X/0.8 NA (air), 40 X/1.2 NA (air), 40 X/1.3 NA (oil), 63 X/1.4 NA (oil) & 100 X 1.4 NA (oil). DIC imaging is possible with all the objectives.Lasers: 405nm (50mW), 488nm (50mW), and 561nm (20mW) solid-state lasers as excitation sources.HXP 120W metal-halide illuminator for wide-field fluorescence.Fluorescence filter sets (wide-field; non-confocal):Image acquisition at 50 fps at full resolution.Three colour (DAPI, Alexa fluor 488, and Rhodamine) confocal imaging is possible.", "Facility_Description": "A spinning disk confocal microscope, when coupled with a sensitive electron-multiplying charge-coupled device (EMCCD) camera, can exceed the sensitivity of a laser scanning confocal microscope system. The fast acquisition time of a spinning disk confocal microscope also allows the collection of three- or four-dimensional data that may not be possible on other systems. For example, it takes seconds rather than minutes to acquire data of a 15-μm Z-stack with individual slices separated by 0.25 μm (68 μm by 68 μm field of view). The acquisition time is dictated by the intensity of the fluorescence signal, which depends on protein concentration, laser power, and the camera's sensitivity. Since the immobilization of live animals may not be complete, fast acquisition time also minimizes the probability of sample movement during image acquisition. This in turn allows high-quality reconstruction of all signals in a three-dimensional space. The spinning-disk confocal microscope facility is suitable for capturing fast-changing phenomena, such as imaging swimming bacteria, lipid droplets, etc. Most powerful tools for live cell imaging.", "Instruction_for_Sample_Preparation": "Spinning Disc Confocal Microscope Facility Guidelines:Only online registration through the IRCC Drona webpage will be accepted.The form should be completely filled out, and all sample details must be provided in the requisition form.Each slot is 2 hours long, and a maximum of 4 samples are allowed per slot; charges apply per slot.If an appointment is given but cannot be honored, notify sdconfocal@iitb.ac.in immediately to cancel the slot.USB drives are prohibited due to potential computer virus issues.After the analysis, users should retrieve data from the analysis PC.All data must be transferred within 7 days of imaging, without exception.Subsequent slots are allocated only after the current slot is completed and payment is made.", "Applications": "High-speed imaging and versatility.Z- stacks and 3D image reconstruction.Time series (with or without Z-stack).Tile scanning to image different parts of the sample automatically over long durations)Multi-point with or without time-lapse imagingCo-localization analysis, 3D volume rendering and 3D measurementSingle-color and three-color imaging and brightfield/DIC imaging.Fast dynamic processes.Multi-position imaging (up to 100 hours).", "Chemical_allowed": "Chemicals are often used in confocal microscopy, primarily to enhance image contrast and allow visualization of specific cellular components or processes. These chemicals include fluorescent dyes, fixatives, and other contrast agents", "Gases_allowed": "Incubation Stage: CO2-controlled incubation stage", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Research Publications:Rao, V. K., Ashtam, A., Panda, D., and Guchhait, S. K. (2024). Natural-Product-Inspired Discovery of Trimethoxyphenyl-1,2,4-triazolosulfonamides as Potent Tubulin Polymerization Inhibitors. ChemMedChem. 19, e202300562.Batra, P. J., Kumari, A., Liao, V. W. Y., Hibbs, D. E., Groundwater, P. W., and Panda, D. (2023).

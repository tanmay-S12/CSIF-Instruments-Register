 Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Swaroop Ganguly", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Mr. Pankaj, Mr. Nihal", "Department": "Electrical Engineering", "Features_Working_Principle": "Temperature range: RT to 900°C Max Ramp Rate 150°C/s (for Si) 40°C/s (for Susceptor)Max. Safe Ramp Rate (for Si processing) - 100°C/s  Max. Safe Ramp Rate (for III-V processing using Graphite Susceptor) - 25°C/s  Vacuum range: Atmosphere approx to 1 mBar", "Body": "NA", "Facility_Description": "The rapid thermal processor has the capability to run the following processes (a) Rapid thermal annealing of compound semiconductors (b) Rapid Thermal Oxidation (RTO) (c) Rapid Thermal Nitridation (RTN)", "Instruction_for_Sample_Preparation": "NA", "Applications": "RTA (Rapid Thermal Annealing RTO (Rapid Thermal Oxidation) Diffusion Compound semiconductor annealing Nitridation, Silicidation Crystallization and Densification", "Chemical_allowed": "NA", "Gases_allowed": "Ar, N2, O2", "SOP": "Nano RTP_SOP.pdf\n  (461.94 KB)", "Training and Other Policy Documents": "Policy for RTP.pdf\n  (98.97 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "146", "Facility": "Stopped-Flow Fluorescence Spectrometer", "Make": "TgK Scientific Limited", "Model": "SF61-DX2", "Date_of_Installation": "8 September, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "absorbance, fluorescence", "Facility_In_Charge": "Professor Ishita Sengupta", "Facility_Manager": "Pranav Bhagwat", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Stopped-flow is a technique that rapidly mixes two or more solutions to study fast reactions ( ms timescale), using a high-efficiency mixer, and then observing the reaction's progress in real-time through methods like absorbance or fluorescence spectroscopy", "Body": "", "Facility_Description": "Versatile Detection Options – The system features a high performance optical system that combines low stray light with high throughput. A modular approach allows selection of the appropriate light sources and detectors according to the work being done. Multi-wavelength absorbance analysis from a single shot using the KinetaScan CCD detector can be especially useful for small quantities of samples. Fluorescence polarisation and anisotropy measurements are fully software controlled, whilst conductivity allows the study of fast conductimetric reactions.Stability, Sensitivity And Flexibility – Reference channel optics offer outstanding stability and immunity from interference to allow even smaller signal changes to be followed and over extended time scales without the effects of drift. Ease of use and intuitive operation are the product of Kinetic Studio, our Windows-based software. This features easy to follow set up routines and auto calibration.Operation over a wide temperature range is enhanced by the use of the low temperature option, allowing work down to -90°C. Or down to -20°C by using the innovative T-Pod option.Innovative Design – The unique flow circuit design ensures that the minimal amount of solution is used for each experiment. This is particularly important if you are using volume limiting samples (e.g. mutant enzymes or other proteins) or equally novel materials. A robust ceramic stop/waste valve gives extended life. All components have been carefully selected for compatibility and reliability.The robust nature and careful design of the flow circuit has led to it being an instrument of choice for users wishing to carry out their experiments under anaerobic conditions – the containment of reagents under low oxygen (anaerobic) conditions is noteworthy. For some users, the choice is to use a glove box – we have expertise in adapting instruments for use in glove boxes.Programmable Multi-Shot Capability – Bringing added versatility for multi-wavelength analysis for both absorbance and fluorescence, even into the deep UV part of the spectrum. The KinetAsyst system is fully programmable for number of shots and wavelength, with the SF-61DX2 instrument adding age time to the list of user-controlled variables.Kinetic Studio Speeds Data Processing – Its modern Windows interface allows Kinetic Studio to provide a host of data handling and visualisation facilities. An easy export utility brings compatibility with other data processing packages such as ReactLab, SPECFIT/32, ORIGIN, KaleidaGraph and THE SCIENTIST.", "Instruction_for_Sample_Preparation": "Samples have to be soluble, high concentration, and devoid of solid particles. buffers should not be viscous, filtered and degassed", "Applications": "fast reactions in the 2 ms timescale slower (binding, folding, scattering assays etc)", "Chemical_allowed": "non corrosive", "Gases_allowed": "none", "SOP": "", "Training and Other Policy Documents": "Kinetic Studio Manual 19.01.pdf\n  (6.62 MB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "147", "Facility": "Stylus Profilometer", "Make": "Bruker", "Model": "DektakXT", "Date_of_Installation": "1 January, 2016", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "Scan Type     : Standard Scan, Static Tower scan, Static scan, Map Scan 3D                   Range (vertical)  : 6.5 um,65.5 um,524 um,1 mm      ,               Profile            : Hills &Valley                   Stylus Force:  1 mg - 15 mg            Scan length: scan length between 50 to 55 mm", "Facility_In_Charge": "Head, CSIFoffice.saif@iitb.ac.in0091-22- 2576 7691/2", "Facility_Manager": "Mr. Naresh Ambati, naresh.ambati@iitb.ac.in", "Facility_Operator": "Mr. Nilesh Marle, nileshmarle@iitb.ac.in", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Stylus profilometers use a probe to detect the surface, physically moving a probe along the surface in order to acquire the surface height. This is done mechanically with a feedback loop that monitors the force from the sample pushing up against the probe as it scans along the surface. A feedback system is used to keep the arm with a specific amount of torque on it, known as the ‘setpoint’. The changes in the Z position of the arm holder can then be used to reconstruct the surface. The DektakXT system takes measurements electromechanically by moving a diamond –tipped stylus over the sample surface according to user-programmed scan length, speed and stylus force. Because a stylus profilometer involves physical movements in X, Y, and Z while maintaining contact with the surface, it is slower than non-contact techniques. The stylus tip size and shape can influence the measurements and limit the lateral resolution.", "Body": "", "Facility_Description": "The DektakXT stylus surface profiler is an advanced thin and thick film step height measurement tool. Profiling surface topography and waviness. In addition to taking two-dimensional surface profile measurements, the DektakXT system can produce three-dimensional measurements (3D Mapping) also. Stress Measurement for calculating tensile or comprehensive stress on processed wafers.", "Instruction_for_Sample_Preparation": "Substrate Dimension: Provide solid samples Min- 1 cm x 1 cm, Maximum 10 cm x 10 cm (size either in the form square/ rectangular/circular).Kindly mark the sample side for the analysis.Base of the sample should be flat for mounting on sample holder.Samples should be in dry form. Sample preparation if any should be done at user end (cutting the sample).Chemical Allowed: No wet chemicals allowed. No sticky and soft sample allowed.MSDS (Material Safety Data Sheet) should be given along with samples to ensure that samples should not be toxic or hazardous", "Applications": "Solar cell finger width and heightThin-film stress calculationsTransparent films/photoresist thickness, thin and thickfilm measurementsMicrolens height/curvature and V-groove depth analysesRoughness studies on machined partsSurface quality and defect reviewMetal etch uniformity on wafers", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "SOP_Stylus Profilometer.pdf\n  (418.41 KB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "148", "Facility": "Super Critical Dryer@Chemistry", "Make": "Tousimis", "Model": "Autosamdri-931", "Date_of_Installation": "20 August, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Biochemical Synthesis", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sanjog S. Nagarkar", "Facility_Manager": "", "Facility_Operator": "Mr Amol A Hanumante, amol_ah@iitb.ac.in, 00225764159", "Department": "Chemistry", "Features_Working_Principle": "Accessories/ Features:Bright LCD touchscreen controlTousimis 931.GL with 1.25” ID x 1.25“ Depth chamberCritical Point Dryer with stasis programmingExternal LCO2 Filtration system : removes water/ oil particulates down to 0.5umLCO2 tank scale with remote readout displayIPS step down transformer for tank scaleIntegrated CO2 and Alcohol sorter condenser into 931 cabinetCarboy., 2.5gal capacity with 2 quick connect ¼ “ hose barbs", "Body": "", "Facility_Description": "Supercritical drying, also known as critical point drying, is a process used to remove liquid in a precise and controlled way. The application of supercritical drying in the production of aerogel and other porous materials, drying of pharmaceuticals and foods, and the production of microelectromechanical systems.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "149", "Facility": "Super Resolution Confocal Microscope Facility", "Make": "Nikon and Visitech", "Model": "Nikon- Confocal AXR, Super Resolution (SR)- VT-i-SIM, Nikon-Super Resolution N-STORM", "Date_of_Installation": "15 April, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Confocal Microscopy", "Available_Equipment_Mode_of_use": "VT i-SIM Visitech, AXR Confocal Nikon, N-STORM Nikon", "Facility_In_Charge": "Name: Prof. Santanu Kumar Ghosh, Email: santanughosh@iitb.ac.in, Contact: +(91-22) 2576 7766", "Facility_Manager": "", "Facility_Operator": "Name: Mr. Pradip Shinde, Email: pradips@iitb.ac.in, srconfocal@gmail.com , Contact: +91 22-2159 6719/6746", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "VT-iSIM Structured Illumination Microscopy:The leading ISM technique for live cell imaging is Instant SIM and in particular, the VT-iSIM, which allows for super-resolution fluorescence imaging to be achieved at high frame rates with reduced photo bleaching. The iSIM utilises a galvanometer scanner to scan a 2-Dimensional (2D) array of points at the sample plane. The 2D-array scan architecture was developed by VisiTech in the early 2000’s and became the basis for the analogue based ISM techniques as per York, Shroff, et al (doi:10.1038/nmeth.2687). For the iSIM, it means that the emission signal is de-scanned by the galvo. Hence, you have a conjugate image plane in an isolated emission path where you can place the re-assignment optic (a μ lens array) and then re-scan the emission onto the camera.The re-assignment optic shrinks each individual emission Point Spread Function (PSF) in the array by 0.5x. This subsequently doubles the Numerical Aperture (NA) of the light in the emission path. In the iSIM; as the re-assignment optic is in a conjugate image plane in the emission path (and not in the excitation path), there is no requirement for intermediary magnification and hence much improved S2N.The re-assignment optic is a μ lens array.  μ lens are designed to collect as much light as possible. If the out-of-focus light is not removed first, it will be collected by the re-assignment optic and focused through the pin-holes, thus increasing the overall background signal.N-STORM (Nikon):STochastic Optical Reconstruction Microscopy (STORM) reconstructs a super-resolution image by combining the high-accuracy localization information of individual fluorophores in three dimensions and multiple colorsN-STORM uses stochastic activation of relatively small numbers of fluorophores using very low-intensity light. This random stochastic \"activation\" of fluorophores allows temporal separation of individual molecules, enabling high-precision Gaussian fitting of each fluorophore image in XY. By utilizing special 3D-STORM optics, N-STORM can also localize individual molecules along the Z-axis with high precision. Computationally combining molecular coordinates in three dimensions results in super-resolution 3D images. High-precision Z-axis position detection: Using a cylindrical lens that asymmetrically condenses light beams in either X or Y direction, Z-axis molecule locations can be determined with an accuracy of about 50 nm. Location in Z is determined by detecting the orientation of the astigmatism-induced stretch in the X or Y direction and the size of the out-of-focus point images. 3D fluorescent images can be reconstructed by combining the determined Z-axis location information with XY-axis location information.", "Body": "Modes of VT iSIM scanning: Imaging High-Speed: 65fps @ 1024x1024 pixel, and 130fps @ 512x512 pixel. Dual CMOS Camera Configuration: Photometric Prime BSI Express Camera. Spatial Resolution: 120nm Laterally (XY) and 300nm Axially (Z).Modes of STORM: Super-resolution imaging with special sample preparation to achieve resolution up to 20nm (XY) and 50nm (Z).Modes of confocal scanning: High-speed XY galvo scanner with minimum 180⁰ scan rotation with total scan flexibilities of line, freehand curved line, XY, XYZ, XYZ t AND XYZ t λ combinations. Travel range of 250nm.", "Facility_Description": "Super-resolution microscopy is a relatively new method compared to confocal microscopy, and ongoing developments aim to improve its standards. While confocal microscopy has been praised for its high contrast, recent methods show that super-resolution microscopy, specifically via the instant-structured illumination microscopy (i-SIM) technique, is capable of capturing reflectance imaging with more than double the resolution of confocal microscopy. This increased resolving capability has been applied to imaging nanoparticle uptake and localization inside cells. These developments contribute to super-resolution microscopy becoming a validated alternative to confocal microscopy for imaging subcellular activity. Whilst maintaining the necessary temporal resolution and at a low photo bleaching level, VT-iSIM offers a spatial resolution of 100nm and axial resolution of 300nm.Super-resolution microscopy allows us to see the smallest structures in living cells that are not visible with standard widefield or confocal fluorescence microscopy. This Stochastic Optical Reconstruction Microscopy (N-STORM) technique provides a 3D resolution that is much higher than the diffraction limit, giving us new insights into the organization of cells and the dynamics of bio-molecular assemblies at a near-molecular level. Super-resolution microscopy overcomes the diffraction barrier, enabling \"nanoscopy\" with greatly improved optical resolution down to 20nm. This method relies on the physical or chemical properties of nearby fluorophores to distinguish them from each other.", "Instruction_for_Sample_Preparation": "To achieve the best results during examination in the Super-Resolution Confocal Microscope (SRM), perfect SRM sample preparation (for i-SIM and STORM) is required.The required techniques depend on the type of samples (biological samples, material samples) as well as on the application.Only if each step of sample preparation is of the highest quality, one can get optimum results from a high-resolution STORM microscope.Currently, we can image fixed samples sealed between a glass slide and a cover slip. Do not bring samples without sealing them with a cover slip.35 mm diameter Petri dishes. Please use specifically available imaging Petri dishes with coverslip bottoms if you wish to use oil immersion objectives.Multi-well plate dishes. Please use a specifically available imaging multi-well plate with coverslip bottoms if you wish to use oil immersion objectives.For the STORM sample preparation, please find the link below. https://drive.google.com/drive/folders/1ECHlv0TUvUzwLi50cE0RR97LlqIpuUR-?usp=sharing", "Applications": "High-speed imaging.Frame/line/lambda capturingZ- stacks and 3D image reconstruction2D and 3D image deconvolutionTime series (with or without Z-stack)Tile scanning to image different parts of the sample automatically over long durations)FRET, FRAPMulti-point time-lapse imagingCo-localization analysis, 3D volume rendering and 3D measurementReal-time ratio-display", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "NA"}, {"Sr_no": "150", "Facility": "Surface Plasmon Resonance", "Make": "GE Healthcare (now Cytiva)", "Model": "Biacore T200 Model (Cytiva)", "Date_of_Installation": "20 August, 2013", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "Assay Development for measuring binding constants for Bimolecular interactions. Interaction Kinetics analysis of Proteins, Nucleic acid, Carbohydrates, Lipids, Small Molecule, Drugs. Calibration Free Concentration analysis.", "Facility_In_Charge": "Prof. Samir K. Maji ,samirmaji@iitb.ac.in ,+(91-22) 2576 7774", "Facility_Manager": "Rucha Gadre,ruchagadre1@gmail.com, spr.bios@iitb.ac.in ,4757", "Facility_Operator": "Rucha Gadre,ruchagadre1@gmail.com, spr.bios@iitb.ac.in ,4757", "Department": "Biosciences and Bioengineering", "Features_Working_Principle": "Surface Plasmon resonance (SPR) instrument use an optical method to measure the changes in refractive index within about 150 nm from the sensor surface. It monitors molecular interactions in real time, using a non-invasive label-free technology that responds to changes in the concentration of molecules at a sensor surface as molecules bind to or dissociate from the surface. The essential components of a Biacore analytical system are sensor chip, optical detector and integrated microfluidic cartridge (IFC) . To study the interaction between two binding partners, one partner is attached to the sensor surface (ligand) and the other is passed over the surface through flow cells in sample solution (analyte). As the analyte binds to the ligand the accumulation of protein on the sensor surface causes an changes in refractive index. A sensorgram is a plot of response against time, showing the progress of the interaction.The SPR response is directly proportional to the change in mass concentration close to the sensor chip surface.", "Body": "Detection technology: Surface Plasmon Resonance (SPR) biosensorInformation provided: Kinetic and affinity data (KD, ka, and kd), specificity, selectivity, concentration, and thermodynamic dataData presentation: Result tables, result plots, and real-time monitoring of sensorgramsAnalysis time per cycle: Typically, 2 to 15 minAutomation: 48 h unattended operationSample type: LMW drug candidates to high molecular weight proteins (also DNA, RNA, polysaccharides, lipids, cells, and viruses) in various sample environments (e.g., in DMSO-containing buffers, plasma, and serum)Required sample injection volume: Plus 20 - 50 µl volume (application dependent)Injection volume: 2 to 350 µlFlow rate range: From 1 to 100 µl/minFlow cell volume: 0.06 µlFlow cell height: 40 µmSample/reagent capacity: 1 x 96-or 384-well microplate and up to 33 reagent vialsAnalysis temperature: 4°C to 45°C (maximum 20°C below ambient temperature)Sample storage: 4°C to 45°C (maximum 15°C below ambient temperature)Sample refractive index range: 1.33 to 1.40Buffer selector: Automatic switching between 4 buffersIn-line reference subtraction: Automatic", "Facility_Description": "Surface Plasmon Resonance (SPR) instruments is an optical spectroscopy that allow measuring binding constants of molecular interactions. It is a label-free, real- time technique. Capable to measure binding affinities and kinetics for bio-molecular interactions. This facility caters to a wide range of applications in drug discovery, protein interaction studies, antibody validation, lipids, nucleic acids binding kinetics, drugs small molecule screening, Fab, Mab screening,epitope binning.", "Instruction_for_Sample_Preparation": "Experiments should be discussed with PI/TA and the facility in-charge before proceeding. As SPR involves an assay development hence many procedures need to be planned before. (like choice of buffer, sensor chips, immobilization methods, and many critical parameters)Purity of samples is extremely important for generating good data.Protein concentrations should be measured accurately before starting the experiment.The molecular weight as well as the pI of the proteins should be known before immobilization.All buffers should be filtered through 0.22 μm filters and degassed.", "Applications": "Assay Development for binding studies for Biomolecule, Small molecules, Drugs binding studies.Binding study of these molecules in crude lysates, whole cells, etcInteraction Kinetics analysis of Proteins, Nucleic acid, carbohydrates, Lipids, Small molecule, Drugs.Mab screening.Epitope Binning.Immunogenicity testingCalibration Free Concentration analysisSensor development for testing", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "BiacoreT200_gettingstarted_handbook_IITB SPR Central Facility.pdf\n  (3.15 MB)", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Publications: Sharma, K., Mehra, S., Sawner, A. S., Markam, P. S., Panigrahi, R., Navalkar, A., Chatterjee, D., Kumar, R., Kadu, P., Patel, K., Ray, S., Kumar, A., & Maji, S. K. (2020). Effect of Disease-Associated P123H and V70M Mutations on β-Synuclein Fibrillation. ACS chemical neuroscience, 11(18), 2836–2848. Harish, M., & Venkatraman, P. (2021). Evolution of biophysical tools for quantitative protein interactions and drug discovery. Emerging topics in life sciences, 5(1), 1–12. Chatterjee, D., Jacob, R. S., Ray, S., Navalkar, A., Singh, N., Sengupta, S., Gadhe, L., Kadu, P., Datta, D., Paul, A., Arunima, S., Mehra, S., Pindi, C., Kumar, S., Singru, P., Senapati, S., & Maji, S. K. (2022). Co-aggregation and secondary nucleation in the life cycle of human prolactin/galanin functional amyloids. eLife, 11, e73835. Top of FormGaikwad, D. D., Bangar, N. S., Apte, M. M., Gvalani, A., & Tupe, R. S. (2022). Mineralocorticoid interaction with glycated albumin downregulates NRF–2 signaling pathway in renal cells: Insights into diabetic nephropathy. International Journal of Biological Macromolecules, 220, 837-851.Kadu, P., Gadhe, L., Navalkar, A., Patel, K., Kumar, R., Sastry, M., & Maji, S. K. (2022). Charge and hydrophobicity of amyloidogenic protein/peptide templates regulate the growth and morphology of gold nanoparticles. Nanoscale, 14(40), 15021-15033.Dey, A., Mitra, D., Rachineni, K., Khatri, L. R., Paithankar, H., Vajpai, N., & Kumar, A. (2022). Mapping of Methyl Epitopes of a Peptide‐Drug with Its Receptor by 2D STDD‐Methyl TROSY NMR Spectroscopy. ChemBioChem, e202200489.Panigrahi, R., Krishnan, R., Singh, J. S., Padinhateeri, R., & Kumar, A. (2023). SUMO1 hinders α‐Synuclein fibrillation by inducing structural compaction. Protein Science, e4632.Bhambid, M., Dey, V., Walunj, S., & Patankar, S. (2023). Toxoplasma Gondii Importin α Shows Weak Auto-Inhibition. The Protein Journal, 42(4), 327–342Poudyal M, Patel K, Gadhe L, Sawner AS, Kadu P, Datta D, Mukherjee S, Ray S, Navalkar A, Maiti S, Chatterjee D, Devi J, Bera R, Gahlot N, Joseph J, Padinhateeri R, Maji SK. Intermolecular interactions underlie protein/peptide phase separation irrespective of sequence and structure at crowded milieu. Nat Commun. 2023 Oct 4;14(1):6199. Venkatramani, A., Ashtam, A., & Panda, D. (2024). EB1 Increases the Dynamics of Tau Droplets and Inhibits Tau Aggregation: Implications in Tauopathies. ACS chemical neuroscience, 15(6), 1219–1233."}, {"Sr_no": "151", "Facility": "Table Top -Open CNC Machine", "Make": "Interface Design Associates Pvt. Ltd.", "Model": "OMM-2", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof  Makarand Kulkarni", "Facility_Manager": "", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "The Table-Top CNC Milling Machine is a compact and versatile 3-axis system (X, Y, Z), designed for small-scale machining operations, prototyping, and educational use. It offers axis travels of approximately 300 mm (X), 300 mm (Y), and 150 mm (Z), with a sturdy worktable , equipped with standard 12 mm T-slots for mounting vices and fixtures. The table supports a maximum load of up to 25 kg. The machine operates with variable spindle speeds ranging from 100 to 5000 RPM, allowing it to machine a wide variety of materials such as aluminum, brass, plastics, and wood.The drive system uses either stepper or servo motors, with the CNC variant offering a resolution of 0.01 mm and a repositioning accuracy of ±0.02 mm. It is powered by a motor rated between 0.5 kW and 1.5 kW and runs on a standard 220V, single-phase 50Hz power supply. Control is managed through Mach3 software, with communication via USB or Ethernet. The system is compatible with CAM software  and includes safety features such as emergency stop buttons and limit switches for enhanced operator protection and reliability.", "Body": "", "Facility_Description": "The Table-Top CNC Milling Machine is a compact and versatile 3-axis system ideal for precision machining, prototyping, and educational use. It features a sturdy worktable with T-slots for easy fixture mounting and supports a variety of materials such as metals, plastics, and wood. The machine offers smooth and accurate motion control, powered by stepper or servo motors. It operates using standard control software like Mach3 and is compatible with popular CAM tools. Built-in safety features ensure reliable and secure operation.", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "152", "Facility": "TG-DTA / Photo ionization Mass Spectrometer Simultaneous Measurement System", "Make": "Rigaku", "Model": "Thermo Mass Photo", "Date_of_Installation": "1 December, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Analysis Range RT to 1100 °C  Rate of temperature : 10°C /Min to 20°C/Min.  Gas: Helium gas flow 300 ml/Min.  Sample Form: Powder", "Facility_In_Charge": "Prof.Sanjog Nagarkar,   email ID:- tgdtams.chem@csif.iitb.ac.in,", "Facility_Manager": "Mr. Darshan Mhatre., Email ID: - darshansmhatre@iitb.ac.in, Contact No: - 022-2576 4157/59", "Facility_Operator": "Miss.Ruchi Vishwakarma , Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4194 / 4159", "Department": "Chemistry", "Features_Working_Principle": "TG-MS, a simultaneous technology coupling thermogravimetry (TG)—which determines mass change as a function of temperature—and mass spectrometry (MS), is a typical method in evolved gas analysis (EGA).", "Body": "", "Facility_Description": "The Thermo Gravimetric Mass Analyzer (TG-MS) features a skimmer-type interface combined with fragment-free photoionization technology, enabling the measurement of molecules without destruction. The system's high-precision gas introduction interface and soft photoionization technology allow real-time discrimination and analysis of generated gases, even when multiple components are present simultaneously. This advanced configuration is ideal for analyzing complex gas mixtures during thermogravimetric experiments.", "Instruction_for_Sample_Preparation": "1) Sample form: powder (~25 mg).2) The analysis can't be carried out if the temperature range and the heating rate are not specified. 3) Explosive, poisonous samples and samples giving rise to toxic/obnoxious gases/fumes on heating cannot be undertaken for Thermal Analysis. 4) The sample holders are of Aluminum (Al) and Platinum (Pt). The user must ensure that samples will not react with crucible materials during Thermal Analysis.", "Applications": "TGA / TG-MS analysis", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "153", "Facility": "Thermogravimetric Analyzer at chemistry", "Make": "Rigaku", "Model": "TGA-STA8122", "Date_of_Installation": "3 February, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Thermal Characterisation", "Available_Equipment_Mode_of_use": "Analysis Range RT to 1000 °C  Rate of temperature: 10°C /Min to 20°C/Min.  Gas: Nitrogen/Zero Air.  Sample Form: Powder", "Facility_In_Charge": "Prof.Sanjog Nagarkar,   email ID:- tga.chem@csif.iitb.ac.in", "Facility_Manager": "Mr.Darshan Mhatre., Email ID: - darshansmhatre@iitb.ac.in, Contact No: - 022-2576 4194 / 4159", "Facility_Operator": "Miss.Ruchi Vishwakarma, Email ID - 30004935@iitb.ac.in, Contact Number: - 022-2576 4159/022-2159 6203", "Department": "Chemistry", "Features_Working_Principle": "In thermogravimetry, measuring the sample’s change in weight enables us to analyze the reaction temperature and the rate of weight change in reactions such as dehydration, thermal decomposition, evaporation, oxidation. Differential thermal analysis (DTA) measures the endothermic or exothermic reaction temperatures such in transition, melting, crystallization, dehydration, decomposition, oxidation and glass transition temperature.", "Body": "", "Facility_Description": "The Thermo Gravimetric Analyzer (TGA) measures a sample's change in weight as a function of temperature, enabling detailed analysis of reactions such as dehydration, thermal decomposition, evaporation, and oxidation. Additionally, Differential Thermal Analysis (DTA) detects endothermic and exothermic reactions during phase transitions, melting, crystallization, decomposition, and glass transition temperatures.Rigaku’s TGA utilizes a horizontal differential triple-coil balance, designed to cancel out fluctuations and ensure highly accurate weight change measurements, providing robust data for thermal analysis.", "Instruction_for_Sample_Preparation": "At least 20 mg of sample should be submitted.Sample size should be < 5mm in diameter and < 2.5mm in thickness.Samples containing halogens should not be sent and will not be accepted for analysis.", "Applications": "TGA-DTA analysis.", "Chemical_allowed": "Non explosive and non-corrosive", "Gases_allowed": "N2 and Zero Air", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "154", "Facility": "Time Resolved Fluorescence Spectroscopy and Microscopy", "Make": "1) TCSPC- M/s. Horiba Scientific   2) Microtime 200 - M/s. PicoQuant", "Model": "1) TCSPC - DeltaFlex TCSPC Fluorescence Lifetime System.   2) Microtime 200 Fluorescence Microscope System", "Date_of_Installation": "1 April, 2019", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Microscopy, Optical Spectroscopy", "Available_Equipment_Mode_of_use": "TCSPC : Two modes are available- Reverse Mode and Forward Mode MicroTime 200: Fluorescence Lifetime Imaging Microscopy (FLIM) and Fluorescence Correlation spectroscopy (FCS)", "Facility_In_Charge": "Prof. Arindam Chowdhury, Chemistry, Email Ids: achowdhury@iitb.ac.in, arindam@chem.iitb.ac.in, Contact No: 022-2576-7154", "Facility_Manager": "", "Facility_Operator": "Ms. Reshma Poojari, reshmap@iitb.ac.in, 6895", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "Features of TCSPC:Up to 1,000 measurements per second- ideal for kinetics studiesmonochromator wavelength selectionMeasurement modesLifetime – measure 60 ps to 1-2 microsecondsAnisotropy – reconvolution analysis to resolve shorter rotational correlation times.Time-Resolved Emission Spectra (TRES) – Collect up to 100 wavelength dependent decays.Steady-State.Features of MicroTime 200 : Complete confocal system with laser combining unit, inverted microscope body, and dual-channel detection unitTurn-key diode lasers for multicolor excitation of 405, 440, 532 and 640 nmTwo parallel detection channels using application-optimized detection with SPADs.Time-Correlated-Single Photon Counting (TCSPC) and TTTR mode for investigation of fast dynamics in FCS and FLIMPiezo scanning for 2D- and 3D-lifetime imaging and accurate point positioningData acquisition, analysis and visualization software SymPhoTime 64Principle of TCSPC:Time-correlated single photon counting (TCSPC) is a common technique to measure fluorescence decays in the time domain. In principle, single photon events are detected, and their time of arrival is correlated to the laser pulse, which was used for excitation of the sample. Principle of Fluorescence Lifetime Imaging Microscope (FLIM):FLIM is a fluorescence imaging technique that resolves and displays the lifetimes of individual fluorophores rather than their emission spectra. The fluorescence lifetime is defined as the average time that a molecule remains in an excited state prior to returning to the ground state by emitting a photon. Principle of Fluorescence Correlation Spectroscopy (FCS):Fluorescence Correlation Spectroscopy (FCS) is a correlation analysis of temporal fluctuations of the fluorescence intensity. FCS enables the determination of important biochemical parameters such as the concentration and size or shape of the particle (molecule) or viscosity of their environment", "Body": "SYSTEM/ TECHNICAL SPECIFICATIONS:1) Instrument specifications (Company Name) - M/s. Horiba2) Model - DeltaFlex TCSPC, Horiba3) Repetition rate - 80 MHz i.e 8 MHz (8×106 photons per second), adjustable from the RF in the Harmonic Generation Module4) Type of light source used for the excitation - Mai Tai laser source 5) Laser line/ pulse width - 100 fs6) Prompt FWHM- 60-100ps7)  MaiTai Tuning Range - 690-1040 nm8) Excitation wavelength sets available for TCSPC measurements are- 275-315 nm and 365-520 nm. 9)  In FLIM, four excitation sources are available - 405, 440, 532 & 640 nm.10)  Minimum Lifetime - 50ps11) Maximum lifetime - Few microsecond is possible i.e tac range can go upto 2 microsecond.", "Facility_Description": "This facility allows time-resolved fluorescence spectroscopy and microscopy measurements on both liquid and solid samples. For ensemble (liquid or solid samples) measurements, pulsed excitation laser sources are available between 365-520 nm and 275-310 nm. Ensemble measurements on fluorescence lifetime is performed using Time-resolved single-photon counting (TCSPC) both in the UV-Vis and near IR regions, at room temperature and at 77K, with a time resolution of ~ 100 ps (IRF), and maximum average lifetime measurement of ~1 micro-sec. Fluorescence lifetime imaging microscopy (FLIM) can be performed using a PicoQuant MicroTime200 with diode laser sources (405, 436, 532, 640 nm)  along with Fluorescence Correlation Spectroscopy (FCS), dual-channel (color or polarization, filters available) imaging and single-molecule FRET in solution and under immobilized conditions. Measurements such as photon-antibunching can also be performed on single-particles/molecules. Additionally, spatially-resolved fluorescence spectra can be acquired. Normally measurements are done at room temperature, however, a cryogenic microscopy stage is available for measurements between 77-500K.", "Instruction_for_Sample_Preparation": "For TCSPC: For solid powder samples 10/15 mg of sample will work and for solution 10-50 μM of sample in your preferred solvent.For MicroTime 200:1)Solution samples should be well dispersed.  2)Samples for microscopy experiments should be sealed between glass slide and coverslip3) For any further related query, kindly contact on Email: trfs@iitb.ac.inContact: 022-2159-6895", "Applications": "Application of TCSPC:Determination of Fluorescence lifetime.Applications of MicroTime 200:Single Molecule Spectroscopy/DetectionFluorescence Lifetime Imaging (FLIM)Fluorescence Correlation Spectroscopy (FCS)Fluorescence Lifetime Correlation Spectroscopy (FLCS)Foerster Resonance Energy Transfer (FRET)Fluorescence Anisotropy (Polarization)Time-Resolved Photoluminescence (TRPL)", "Chemical_allowed": "Not applicable", "Gases_allowed": "NO", "SOP": "", "Training and Other Policy Documents": "Internal users- Training rules.pdf\n  (189.03 KB)", "Other Related Details Regarding Instrument": "", "Publications": "1) Kistwal, T.; Mukhopadhyay, A.; Dasgupta, S.; Sharma, K. P.; Datta, A. Ultraslow Biological Water-Like Dynamics in Waterl nge - 690-1040 nm8) Excitation wavelength sets available for TCSPC measurements are- 275-315 nm and 365-520 nm. 9)  In FLIM, four excitation sources are available - 405, 440, 532 & 640 nm.10)  Minimum Lifetime - 50ps11) Maximum lifetime - Few microsecond is possible i.e tac range can go upto 2 microsecond.", "Facility_Description": "This facility allows time-resolved fluorescence spectroscopy and microscopy measurements on both liquid and solid samples. For ensemble (liquid or solid samples) measurements, pulsed excitation laser sources are available between 365-520 nm and 275-310 nm. Ensemble measurements on fluorescence lifetime is performed using Time-resolved single-photon counting (TCSPC) both in the UV-Vis and near IR regions, at room temperature and at 77K, with a time resolution of ~ 100 ps (IRF), and maximum average lifetime measurement of ~1 micro-sec. Fluorescence lifetime imaging microscopy (FLIM) can be performed using a PicoQuant MicroTime200 with diode laser sources (405, 436, 532, 640 nm)  along with Fluorescence Correlation Spectroscopy (FCS), dual-channel (color or polarization, filters available) imaging and single-molecule FRET in solution and under immobilized conditions. Measurements such as photon-antibunching can also be performed on single-particles/molecules. Additionally, spatially-resolved fluorescence spectra can be acquired. Normally measurements are done at room temperature, however, a cryogenic microscopy stage is available for measurements between 77-500K.", "Instruction_for_Sample_Preparation": "For TCSPC: For solid powder samples 10/15 mg of sample will work and for solution 10-50 μM of sample in your preferred solvent.For MicroTime 200:1)Solution samples should be well dispersed.  2)Samples for microscopy experiments should be sealed between glass slide and coverslip3) For any further related query, kindly contact on Email: trfs@iitb.ac.inContact: 022-2159-6895", "Applications": "Application of TCSPC:Determination of Fluorescence ning mass spectra directly from TLC plates. This instrument utilizes a head that forms a leak-tight seal on the surface of the TLC plate, which allows an extraction solvent to be delivered onto the TLC spot. Another channel extracts the analytes and solvent for introduction into a mass spectrometer. Features: 1. Ion Source: ESI ion source 2. Single Quadrapole MS 3. Mass Range: m/z upto 1200 4. Ionization mode: +ve and –ve 5. Isocratic Pump for direct injection.6. Plate express-CMS interface for analyzing planar surfaces such as TLC plates. 7. Nitrogen Generator is connected separately for continuous nitrogen supply.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "TLC must be prepared by the useronly polar solvent methanol / acetonitrile to be used component solubility should be in methanol /acetonitrileNon polar solvents not be used", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "157", "Facility": "Total Organic Carbon Analyzer", "Make": "Elementar", "Model": "Enviro TOC", "Date_of_Installation": "6 January, 2025", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Chemical Characterisation", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head CSIF, office.saif@iitb.ac.in,  0091-22- 2576 7691/2", "Facility_Manager": "Dr. Bharati Patro, bharati@iitb.ac.in", "Facility_Operator": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376/6884, Ms. Pallavi Khapre,  pallaviag@iitb.ac.in, 022 2159 6875", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "The TOC measuring principle of the enviro TOC is based on catalytic high-temperature combustion of the sample in an oxygen stream (for liquid-8500C & for Solid-9500C). Under these conditions, all bound and dissolved carbon is oxidized to CO2, which is determined quantitatively with an IR detector. Sample pre treatment steps, e.g. for removing the inorganic carbon from the sample, are fully automated. The TOC analysis provides easily evaluable results since matrix effects are negligible and the carbon concentration in the sample correlates linearly with the CO2 signal. In comparison to other techniques for the determination of organic contamination, the use of hazardous substances is avoided and the analysis time is a few minutes.", "Body": "", "Facility_Description": "Estimation of Total Organic Carbon (TOC) in water, solid, and other samples, and Bound Nitrogen (TNb at ppm level)", "Instruction_for_Sample_Preparation": "", "Applications": "Environmental monitoring (e.g., water quality in lakes, rivers)Wastewater treatmentDrinking water analysisIndustrial applications (e.g., pharmaceuticals, chemicals)Research and quality control", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "158", "Facility": "Transient Analysis of Product Reactor", "Make": "TAP-2B, Mithra Technologies", "Model": "TAP -2B", "Date_of_Installation": "", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Chemical Synthesis", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Sonali Das", "Facility_Manager": "Jitendra Kumawat", "Facility_Operator": "Jitendra Kumawat , 30006312@iitb.ac.in", "Department": "Chemical Engineering", "Features_Working_Principle": "The Transient Analysis of Products (TAP) reactor operates under high-vacuum and pulse-response conditions to study intrinsic catalytic kinetics without transport limitations. A small amount of reactant gas is introduced into the reactor as a short pulse (typically milliseconds) over a catalyst bed under Knudsen diffusion conditions. The transient response of reactants and products is monitored using a mass spectrometer at the reactor outlet.Key principles:Knudsen diffusion regime ensures that molecular transport is governed by wall collisions rather than intermolecular interactions. Temporal separation of elementary steps allows identification of adsorption, desorption, and surface reaction kinetics. The system eliminates heat and mass transfer limitations, enabling extraction of intrinsic kinetic parameters. Pulse-response curves are analyzed to determine reaction mechanisms, rate constants, and surface intermediates.", "Body": "", "Facility_Description": "The Transient Analysis of Products (TAP) Reactor is a high-vacuum, pulse-response catalytic reactor designed for the investigation of intrinsic reaction kinetics and mechanisms under transport-free conditions. The system enables the introduction of precisely controlled microsecond to millisecond pulses of reactant gases over a catalyst bed, allowing detailed analysis of transient behavior.The facility is particularly suited for:Identification of active sites and reaction pathways Quantification of rate constants and surface intermediates Study of catalyst structure–activity relationshipsInvestigation of deactivation, poisoning, and promotion effects Overall, the TAP reactor serves as a state-of-the-art platform for fundamental catalysis research, bridging the pressure and material gap.", "Instruction_for_Sample_Preparation": "Catalyst samples must be finely powdered (typically 300 –450 µm particle size) to ensure uniform packing and diffusion behavior.The sample should be free of moisture and contaminants; pre-drying under vacuum or inert gas is recommended.Typical catalyst loading is in the range of 10–30 mg, diluted with inert material (e.g., quartz sand) to maintain Knudsen conditions.Avoid agglomeration; ensure homogeneous mixing with inert diluent.Use only chemically stable materials that do not decompose under vacuum or experimental temperatures", "Applications": "Determination of intrinsic catalytic kinetics under transport-free conditions Study of elementary reaction steps (adsorption, desorption, surface reaction) Investigation of reaction mechanisms and intermediates Quantification of active sites and site utilizationAnalysis of metal-support interactions and catalyst states Study of poisoning, promotion, and deactivation mechanisms Microkinetic model development and validation", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "159", "Facility": "Transmission Electron Microscopy Facility (300 kV) at MEMS", "Make": "Thermo Scientific", "Model": "Themis 300 G3", "Date_of_Installation": "2 August, 2019", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Electron Microscopy", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof.I Samajdar, indra@iitb.ac.in                   +91-22-2576-7621", "Facility_Manager": "Mr. Prakash Ishte, prakash007@iitb.ac.in,022-21596765", "Facility_Operator": "Mrs Parul Thakur,30005125@iitb.ac.in,022-21596765", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "SpecificationsPoint resolution – 0.2 nm for TEM, 0.12 nm for STEMInformation limit – 0.18 nmMinimum Brightness – 9.88 x 107 A/m2srVEDS energy resolution at Mn – 125 eVMaximum spot drift – 0.45 nm/min", "Body": "", "Facility_Description": "The transmission electron microscope is a 300kV high-resolution microscope with a field emission gun and excellent analytical performance. This facility is used for analysis of elemental composition by energy dispersive spectroscopy, diffraction for crystal structure determination and crystallographic studies.", "Instruction_for_Sample_Preparation": "Powder sample should be sonicated properly and should not agglomerate", "Applications": "Deformation in Metals: Deformation in metals involves changes in the shape or size of a metal object due to the application of an external force. It can occur through various mechanisms such as slip, twinning, or grain boundary movement.Nano Science/Nano Technology: Nano science and nanotechnology deal with the study and application of extremely small things, typically on the scale of nanometers. This field encompasses various disciplines such as chemistry, biology, physics, and engineering.Thin Films: Thin films are layers of material ranging from fractions of a nanometer to several micrometers in thickness. They are used in various applications including electronics, optics, and coatings.Energy Science/Engineering: Energy science and engineering focus on the development of technologies for energy production, conversion, and storage. This includes renewable energy sources, batteries, fuel cells, and energy-efficient systems.Chemical Composition and Quantification (TEM): Transmission Electron Microscopy (TEM) is used to determine the chemical composition and quantify elements in materials at the atomic level. It provides high-resolution imaging and analytical capabilities.Elemental Mapping (STEM): Scanning Transmission Electron Microscopy (STEM) is used for elemental mapping to visualize the distribution of elements within a sample. This technique combines imaging with spectroscopy for detailed analysis.Orientation Mapping (A-Star): Orientation mapping using the A-Star technique involves determining the crystallographic orientation of grains in a material. This is done using advanced electron diffraction methods such as 4D-STEM, which provides high precision and resolution.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Research ReferencesR. Tripathi et al. ACS Appl. Nano Mater. 2022, 5, 12, 17767–17782P. Gandharapu et al. Clean Technologies and Environmental Policy. 2023Vaibhav Verma et al. Carbon, Volume 209, 5 June 2023, 118007B.S Kumar et al. Adv. Energy Mater. 2023, 2204407Anagha Pradeep et al. Carbon Volume 201, 5 January 2023, Pages 1-11I Biswas et al. Chem. Commun., 2023, 59, 4332-4335B S Kumar et al. Chem. Mater. 2022, 34, 23, 10470–10483Kankona Singha Roy et al., ACS Appl. Mater. Interfaces, 13(8) (2021) 9897-9907Anagha Pradeep et al., Elec. Acta, 362 (2020) 137122P. Manikandan et al., MMTA, (2021) https://doi.org/10.1007/s11661-021-06337-yAgrawal et al., MMTA, 52 (2021) 1465-1476Saurabh Kumar et al. Mater. Charac., 2023, 199, 112822Aditya Prakash et al., IJP, 2023Saurabh Kumar et al., MMTA, 2023, 54A, 1236-1251Soudip Basu et al., Mater. Charac., 2023, 197, 112704Sanjay Manda et al., MMTA, 2023, 54A, 562-576A. Sarkar et al., Mater. Charac., 2023, 194, 112426, 1-15"}, {"Sr_no": "160", "Facility": "Transmission Electron Microscopy- Sample Preparation Facility at MEMS", "Make": "GATAN Inc. USA", "Model": "Model 691", "Date_of_Installation": "2 September, 2013", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Service", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Prita Pant  pritapant@iitb.ac.in   +91-22-2576-7616", "Facility_Manager": "", "Facility_Operator": "Ms. Priyanka Kathar priyankakathar@iitb.ac.in extension : 3613  9920610767", "Department": "Metallurgical Engineering & Materials Science (MEMS)", "Features_Working_Principle": "TEM Sample PreparationThe quality of Transmission Electron Microscopy (TEM) images heavily relies on the preparation of the sample. This process includes: Thinning the sample through cutting.Grinding to achieve the required thickness.Dimpling the sample surface.Ion-milling to further reduce thickness and improve transparency to electrons. It's crucial to ensure that these steps do not alter the intrinsic properties of the material being studied.", "Body": "Variable Low Speed Diamond SawMaterials (ceramics and metals) can be reduced to 0.5mm in thickness using this technique, which uses a diamond blade, with the wheel speed varying between 100 to 400 rpm.Tuned Piezo Cutting ToolThis is used for cutting the material (both ceramic and metal) in the desired size and shape, so that it can be placed inside the TEM sample holder Ratings and SpecificationsDisc Cutter External PSU (Power Supply Unit)Input Voltage: 100-240 VAC (~)Output Voltage: 24VDCOutput Power: 30WFrequency: 47-63 HzMains supply voltage fluctuations are not to exceed 10% of the nominal supply voltageDisc Cutter Power Jack (\"DC in\")DC Input Voltage: 24 VDCDC Input Current: 1.25 AStereo Microscope Power Jack (\"DC Out\")Used to power optional microscopeOutput Voltage: 24 VDC Output Current: 0.4AEnvironmental ConditionsNon-operating relative humidity (non-condensing): 10-90%Storage temperature range: 0-65°COperating Humidity Range: 20-80%Operating maximum thermal gradient: 15°C/hrOperating temperature range: 16-24°C(Information partly obtained from GATAN Manual)Disc PunchUsed only for metallic sheets. The Disc punch prepares specimen discs of 3 mm in diameter and material thicknesses ranging from 10 µm to above 100 µm.Specimen Mounting Hot PlateThis is used for firmly attaching specimen discs to stubs during grinding. This is done by using a low melting point wax polymer, heated on the hot plate, to form a strong, thin, hard adhesive bond. Operating temperature range is up to 130°C.Disc GrinderThis is used for holding the stub with the specimen attached for grinding down to a certain thickness. The GATAN Model 623 Disc Grinder possesses superior resolution and preloading of the specimen drive screw to result in excellent control of specimen thickness. By using the weight of the grinder it limits the maximum polishing pressure the operator is able to reduce specimen damage to a minimum. The samples are polished using different grit silicon carbide papers such as 40 µm, 15 µm, and 5 µm, in sequence.(Information partly obtained from GATAN Manual)Dimple GrinderAfter manual grinding, using a disc grinder, precision thinning near the central region of the 3 mm disc specimen (or forming a dimple) is performed using a dimple grinder.Specifications:External PSU Input Voltage: 100-240 VAC (~)Output Voltage: 24 VDCOutput Power: 30WFrequency: 47-63 HzPower Jack (\"DC in\")DC Input Voltage: 24 VDCDC Input Current: 1.25AStereo Microscope Power Jack (\"DC out\")Output Voltage: 24 VDCOutput Current: 0.4AEnvironmental ConditionsNon-operating relative humidity: 10-90%Storage temperature range: 0-65°COperating humidity range: 20-80%Operating maximum thermal gradient: 15°C/hrOperating temperature range: 16-24°CPrecision Ion Polishing System (PIPS)   After dimple grinding, the final stage of precision polishing (thinning) of the 'dimpled' region up to electron transparency is done with the PIPS. Specifications:    Input Voltage: 100/120/240VInput Current: 3/3/1.5AFrequency: 50/60HzOutput Voltage: 120VAC 50/60HzOutput Current: 3.0 A Max.Non-operating relative humidity (non-condensing): 10-90%Storage temperature range: 0-65°COperating humidity range: 20-80%Operating maximum thermal gradient: 15°C/hrOperating temperature range: 5-35°CFor indoor use only(Information partly obtained from GATAN Manual)", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "TEM Sample Preparation FacilityThe Transmission Electron Microscopy (TEM) sample preparation facility specializes in creating thin samples that are electron-transparent for TEM analysis. Equipped with advanced tools and techniques, the facility can produce both planar and cross-sectional samples across a wide range of material types.Methods employed include focused ion beam (FIB) milling, mechanical polishing, and other precise techniques to ensure the samples meet the stringent requirements for TEM analysis.This capability is crucial for research in materials science, nanotechnology, and other fields where high-resolution imaging of material structures at the atomic level is essential.", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "161", "Facility": "Two-dimensional gas chromatography with time of flight mass spectrometer facility", "Make": "LECO", "Model": "Pegasus 4D with Agilent 7890B GC", "Date_of_Installation": "15 January, 2016", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Gas Chromatography, Mass Spectrometry", "Available_Equipment_Mode_of_use": "Liquid/gas injection, Cooled injection system and thermal desorption unit (CIS-TDU), Headspace injection, Stir bar sorptive extraction (twister), solid phase micro-extraction (SPME), Pyrolysis", "Facility_In_Charge": "Prof. Suryendu Dutta, s.dutta@iitb.ac.in, +91-22-2576 7278", "Facility_Manager": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376", "Facility_Operator": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "Features:High resolution gas chromatographic separation can be achieved for complex samples, when operated in 2-D mode.Independent temperature programming for each of the columns possibleMS can collect > 20 full range spectra across a 50ms GC peakHigh dynamic range can be achievedWorking Principle:The GC-GC-TOF-MS facility was installed in Centre for Research in Nanotechnology and Science (CRNTS) in January 2016 as a Central Facility as per RIFC norms. The facility is available for meeting the research needs of all users.It can perform all analysis that a typical GC-TOF-MS can perform. Its particular benefit is for analysis of organic compounds from complex mixtures and environmental samples where high end separation is involved. It involves two columns (that can achieve separation based on different attributes). A thermal modulator ensures cryo focusing of effluent from the first column before its release to the second column. The two-dimensional output helps in resolving the peak of target analytes even when matrix interferences are present. The enhanced spectral collection rate of the TOF-MS detector together with the software capabilities can help in de-convolution of co-eluting compounds.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "The sample should be dissolved in volatile organic solvents, preferably hexane or isooctane.Other solvents like, methanol, ethanol, ethyl acetate etc. can also be used.Solvents such as DMSO, THF and water are not acceptable.The sample should be free of particulates of size > 0.45 μm", "Applications": "Environmental.GeochemistryBiologicalChemical/Chemistry", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Publications:Kumar, S., Dutta, S., Bhui, U.K., 2021. Provenance of organic matter in an intracratonic rift basin: insights from biomarker distribution in Palaeogene crude oils of Cambay Basin, western India. Organic Geochemistry 162, 104329Bhattacharya, S., Dutta, S., Kumar, S., 2021. Identification of lanostanes, A-ring methylated steranes and secosteranes in late Neoproterozoic crude oils by GC×GC-TOFMS: New insights into molecular taphonomy of steroids. Geobios68, 47-59Dhiman, H., Dutta, S., Kumar, S., Verma, V., Prasad, G.V.R., 2021. Discovery of proteinaceous moieties in Late Cretaceous dinosaur eggshell. Palaeontology 64, 585-595.Mishra, S., Dutta, S., Singh, V.P., Kumar, S., Mathews, R.P., Jha, N., 2021. A new acritarch spike of Leiosphaeridiadessicata comb. nov. emend. from the Upper Permian and Lower Triassic sequence of India (Pranhita-Godavari Basin): Its origin and palaeoecological significance. Palaeogeography, Palaeoclimatology, Palaeoecology 56 ": "Two-dimensional gas chromatography with time of flight mass spectrometer facility", "Make": "LECO", "Model": "Pegasus 4D with Agilent 7890B GC", "Date_of_Installation": "15 January, 2016", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Gas Chromatography, Mass Spectrometry", "Available_Equipment_Mode_of_use": "Liquid/gas injection, Cooled injection system and thermal desorption unit (CIS-TDU), Headspace injection, Stir bar sorptive extraction (twister), solid phase micro-extraction (SPME), Pyrolysis", "Facility_In_Charge": "Prof. Suryendu Dutta, s.dutta@iitb.ac.in, +91-22-2576 7278", "Facility_Manager": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376", "Facility_Operator": "Ms. Mursaleen Shaikh, mursaleen@iitb.ac.in, 022 2159 6376", "Department": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Features_Working_Principle": "Features:High resolution gas chromatographic separation can be achieved for complex samples, when operated in 2-D mode.Independent temperature programming for each of the columns possibleMS can collect > 20 full range spectra across a 50ms GC peakHigh dynamic range can be achievedWorking Principle:The GC-GC-TOF-MS facility was installed in Centre for Research in Nanotechnology and Science (CRNTS) in January 2016 as a Central Facility as per RIFC norms. The facility is available for meeting the research needs of all users.It can perform all analysis that a typical GC-TOF-MS can perform. Its particular benefit is for analysis of organic compounds from complex mixtures and environmental samples where high end separation is involved. It involves two columns (that can achieve separation based on different attributes). A thermal modulator ensures cryo focusing of effluent from the first column before its release to the second column. The two-dimensional output helps in resolving the peak of target analytes even when matrix interferences are present. The enhanced spectral collection rate of the TOF-MS detector together with the software capabilities can help in de-convolution of co-eluting compounds.", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "The sample should be dissolved in volatile organic solvents, preferably hexane or isooctane.Other solvents like, methanol, ethanol, ethyl acetate etc. can also be used.Solvents such as DMSO, THF and water are not acceptable.The sample should be free of particulates of size > 0.45 μm", "Applications": "Environmental.GeochemistryBiologicalChemical/Chemistry", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": "Publications:Kumar, S., Dutta, S., Bhui, U.K., 2021. Provenance of organic matter in an intracratonic rift basin: insights from biomarker distribution in Palaeogene crude oils of Cambay Basin, western India. Organic Geochemistry 162, 104329Bhattacharya, S., Dutta, S., Kumar, S., 2021. Identification of lanostanes, A-ring methylated steranes and secosteranes in late Neoproterozoic crude oils by GC×GC-TOFMS: New insights into molecular taphonomy of steroids. Geobios68, 47-59Dhiman, H., Dutta, S., Kumar, S., Verma, V., Prasad, G.V.R., 2021. Discovery of proteinaceous moieties in Late Cretaceous dinosaur eggshell. Palaeontology 64, 585-595.Mishra, S., Dutta, S., Singh, V.P., Kumar, S., Mathews, R.P., Jha, N., 2021. A new acritarch spike of Leiosphaeridiadessicata comb. nov. emend. from the Upper Permian and Lower Triassic sequence of India (Pranhita-Godavari Basin): Its origin and palaeoecological significance. Palaeogeography, Palaeoclimatology, Palaeoecology 567, 110274.Menon, N.G., Tatiparti, S.S.V. and Mukherji, S. (2021) “Efficacy and reusability of mixed-phase TiO2- ZnO nanocomposites for the removal of estrogenic effects of 17β-estradiol and 17α-ethinylestradiol from water” Journal of Environmental Management, 288:112340.Chand, P. D

ar, A., Maji, S. K. \"Amyloid Formation of Growth Hormone in Presence of Zinc: Relevance to Its Storage in Secretory Granules.\" Scientific Reports, 2016, 6(1). DOIJacob, R. S., George, E., Singh, P. K., Salot, S., Anoop, A., Jha, N. N., Sen, S., Maji, S. K. \"Cell Adhesion on Amyloid Fibrils Lacking Integrin Recognition Motif.\" Journal of Biological Chemistry, 2016, 291(10), 5278–5298. DOI"}, {"Sr_no": "127", "Facility": "Q-Exactive Plus Biopharma- High Resolution Orbitrap Liquid Chromatograph Mass Spectrometer", "Make": "Thermo Fisher Scientific India Pvt. Ltd.", "Model": "Q-Exactive Plus Biopharma-High Resolution Orbitrap", "Date_of_Installation": "1 January, 2017", "Facility_Management_Division": "Sophisticated Analytical Instrument Facility (SAIF)", "Category": "Liquid Chromatography, Mass Spectrometry", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Head CSIF, office.saif@iitb.ac.in, 0091-22- 2576 7691/2", "Facility_Manager": "Dr. Nutan Agadi, nmagadi@iitb.ac.in, 022- 21596851", "Facility_Operator": "Dr. Manali Jadhav , manaliv@iitb.ac.in , 022- 21596874", "Department": "Sophisticated Analytical Instrument Facility (SAIF)", "Features_Working_Principle": "Specifications: Vanquish UHPLC for small molecules & Nano-HPLC for large moleculesDirect Infusion Mass with ESI & APCI (Positive & Negative mode ionization)Quaternary UHPLC with Variable Wavelength Detector Mass SpectrometerNano HPLC (Micro fluidic column) - Mass spectrometerUnique Features of the Q-Exactive Plus: Characterize, quantify and confirm with unmatched confidence using the Q-Exactive Plus mass spectrometer.Advanced Quadrupole technology featuring Thermo Fisher segmented HyperQuad.Resolving power up to 280,000.Maximum scan speed 12 Hz.Spectral multiplexing for enhanced duty cycle.RF-Lens ion source for increased sensitivity.Advanced Active Beam Guide intelligent ion beam management for high flux ion sources.Intact Protein Mode option for characterizing intact proteins with ease.Enhanced Resolution Option maximizing resolution at 280,000.Working Principle The Orbitrap is an ion trap mass analyzer consisting of two outer electrodes and a central electrode, which enable it to act as both an analyzer and detector. Ions entering the Orbitrap are captured through \"electrodynamic squeezing.\" Once captured, ions oscillate around the central electrode and between the two outer electrodes at different frequencies, depending on their mass-to-charge ratios. This oscillation separates the ions. By measuring these oscillation frequencies induced by ions on the outer electrodes, the mass spectra of the ions are acquired using image current detection.Liquid Chromatography / Mass Spectrometry (LC/MS) combines high-performance liquid chromatography (HPLC) for separation with mass spectrometry for analysis and detection. It utilizes two common atmospheric pressure ionization (API) processes: Electrospray Ionization (ESI) and Atmospheric Pressure Chemical Ionization (APCI), both of which are soft ionization techniques.The Q Exactive Plus mass spectrometer provides fast, sensitive, reliable, and confident detection and identification of compounds in complex mixtures while maintaining full compatibility with UHPLC and fast chromatography. The HCD collision cell enhances functionality by providing ion fragmentation while preserving high resolution, accurate mass, and high sensitivity.Main Features of Instrument Mass Range (m/z): 50-8000 amuResolution: 140,000 @ m/z 200 (280,000 with Enhanced Resolution mode option)High Mass Accuracy (Typically less than 1 ppm)High Sensitivity (500 fg of Buspirone, S/N 100:1)Ionization Method:API:HESI positive & negativeAPCI positive & negativeDirect Infusion for Mass Analysis (MS, MS/MS)Binary Nano HP-LC system with Mass as detectorQuaternary UHPLC with Variable Wavelength Detector Mass Spectrometer", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "Expected structure or mass can be provided.Solvent for mobile phase should be mentioned or solubility of compound in volatile solvent.As HP-LC is available in most departments, LC of submitted samples indicating the operation should be supplied along with the sample.Currently, C8, C18 & others like cyano, amino, Si columns are available. You can submit the interest for separation or repeatability of HP-LC run.For HPLC-UV analysis, the wavelength should be given.Protein samples should be properly digested and desalted.Source of the protein should be mentioned.MS-DS (Material Safety Data Sheet) should be given along with samples.Samples should not be toxic or hazardous. Samples will not be accepted unless MS-DS is given.Software Details: Thermo Proteome Discoverer 2.2 & 2.5 for Protein identificationThermo Compound Discoverer 3.2 for Metabolite identificationBioPharma Finder Software 2.0 (for intact mass identification, protein deconvolution and peptide mapping)Protein Deconvolution softwareChromelon 7.0 Software for UHPLCCompound Discover 2.0 and MF 7.0 SR3 software for MetabolomicsLipidSearch Software 4.2.29 for Lipidomics identification", "Applications": "Quantitative identification of Nitrosamine impurities\"Proteomics\" - Qualitative and Quantitative Proteomics identification\"Metabolomics\" - Metabolite identification from natural extracts (like plants, fruits, etc.)Metabolite identification from environmental samples\"Lipidomics\" - Qualitative and Quantitative Lipids IdentificationIntact mass identification & Peptide mappingImpurity ProfilingDegradation studiesPharmacokinetics", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "128", "Facility": "REACTIR Facility at Chemistry", "Make": "Mettler Toledo", "Model": "ReactIR 702L", "Date_of_Installation": "20 October, 2022", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Spectroscopy", "Available_Equipment_Mode_of_use": "For liquids/ solutions", "Facility_In_Charge": "Prof. D. Maiti, Chemistry Department", "Facility_Manager": "Amol Hanumante", "Facility_Operator": "", "Department": "Chemistry", "Features_Working_Principle": "Accessories/ Specification:Software: iC IRDetector: TE MCTOptical Range: 4000 - 800 cm-1Probe optical window: 2500 – 650 cm-1Probe: 9.5mm x 1.5m x 305mm, Wetted materials: Au, Diamond, C-22pH range for probe: 1-14Temperature Range for probe : upto 180 degreesPressure: upto 69 bar", "Body": "", "Facility_Description": "It enables to monitor reaction progression in situ and in real time, providing highly specific information about kinetics, mechanism, pathways, and the influence of reaction variables on performance.Using ReactIR, directly track reactants, reagents, intermediates, products, and by-products as they change, in real time throughout the reaction.", "Instruction_for_Sample_Preparation": "User must provide all solvent, solutions involved required for the reactionUser must give all information about the reaction/ solution involved to technical operator.User must ensure that reaction should not contain chemicals like strong acids, bases, cyanides, Fluorides, peroxides, explosive/ corrosive chemicals etc which affect to instrument probe.", "Applications": "It enables to monitor reaction progression in situ and in real time, providing highly specific information about kinetics, mechanism, pathways, and the influence of reaction variables on performance.Using ReactIR, directly track reactants, reagents, intermediates, products, and by-products as they change, in real time throughout the reaction.", "Chemical_allowed": "yes", "Gases_allowed": "no", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "129", "Facility": "Reactive Ion etching System", "Make": "Sentech", "Model": "SI500", "Date_of_Installation": "17 May, 2023", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)-IoE Funded", "Category": "Nanofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Kasturi Saha", "Facility_Manager": "Dr. Deepti Rukade", "Facility_Operator": "Ms. Shilpa, Mr. Anuj", "Department": "Electrical Engineering", "Features_Working_Principle": "RIE involves a combination of chemical and physical etching, where reactive gases are introduced into the chamber and ionized by the plasma, and ions are accelerated toward the substrate, causing etching (material removal).", "Body": "NA", "Facility_Description": "The ICP-RIE (Inductively Coupled Plasma Reactive Ion Etching) system is a highly advanced tool used for dry etching in the fabrication of micro- and nanostructures. It provides high precision, high anisotropy, and high selectivity in etching processes.The system can achieve highly anisotropic etching (vertical sidewalls) and high etching selectivity between different materials", "Instruction_for_Sample_Preparation": "NA", "Applications": "Device Fabrication using litho and etch using ICPRIE", "Chemical_allowed": "NA", "Gases_allowed": "CL2, BCL3,CHF3,O2,N2,CF4,Ar,SF6,He", "SOP": "ICPRIE DIa.pdf\n  (8.22 MB)", "Training and Other Policy Documents": "ICPRIE_Training and Usage_18-10-2024 (1).docx_.pdf\n  (151.7 KB)", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "130", "Facility": "Robotic Laser Welding", "Make": "FANUC and GW LaserTech", "Model": "", "Date_of_Installation": "25 March, 2022", "Facility_Management_Division": "", "Category": "Macrofabrication", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "", "Facility_Manager": "", "Facility_Operator": "", "Department": "Mechanical Engineering", "Features_Working_Principle": "", "Body": "", "Facility_Description": "", "Instruction_for_Sample_Preparation": "", "Applications": "", "Chemical_allowed": "", "Gases_allowed": "", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "131", "Facility": "Rock Triaxial Test", "Make": "Wille Geotechnik", "Model": "High Pressure-High Temperature", "Date_of_Installation": "19 March, 2022", "Facility_Management_Division": "", "Category": "Mechanical Characterisation", "Available_Equipment_Mode_of_use": "", "Facility_In_Charge": "Prof. Vikram Vishal", "Facility_Manager": "", "Facility_Operator": "Ms. Sapna Anup Pimparkar", "Department": "Earth Science", "Features_Working_Principle": "A rock triaxial machine is an advanced laboratory instrument used to determine the mechanical properties of rock samples under controlled stress conditions. It is widely used in geotechnical engineering, rock mechanics, and petroleum reservoir studies to analyze rock strength, deformation behavior, and failure characteristics under different confining pressures. The triaxial test involves placing a cylindrical rock specimen (typically with a length-to-diameter ratio of 2:1) inside a pressure chamber. The specimen is subjected to three principal stresses:Confining Pressure: Applied uniformly around the sample using hydraulic fluid or gas. This simulates in-situ stress conditions at depth.Axial Stress: Applied vertically through a loading piston to induce failure.Radial Stress: In most cases, this equals the confining pressure. The machine applies confining pressure first, and then axial stress is gradually increased until the rock fails. The stress-strain response is recorded using sensors for axial displacement, radial deformation, and pore pressure (if applicable). The test provides key mechanical parameters, including:Uniaxial Compressive Strength (UCS): When the test is performed without confining pressure.Peak Strength and Failure Envelope: Determined by conducting tests at different confining pressures.Young’s Modulus & Poisson’s Ratio: Derived from stress-strain curves.Cohesion and Friction Angle: Obtained from the Mohr-Coulomb failure criterion.", "Body": "Maximum cell pressure: 70MPaMaximum operational temperature: 100°CMaximum Ultrasonic velocity measure: 1MHz Flow accuracy of Syringe pump: 0.0002ml/min", "Facility_Description": "The rock triaxial facility at the Department of Earth Sciences, IIT Bombay has undergone significant upgrades to enhance its research capabilities. High-pressure platens have been added, allowing for specimen testing at diameters of 38mm and 25.4mm. The upgraded facility now includes the capability to measure ultrasonic transmission velocities for both P-wave and S-wave, improving data collection on rock properties. A temperature control system has been incorporated, enabling triaxial testing at temperatures up to 100°C, which facilitates thermal-mechanical experiments. The addition of a syringe pump further enhances the setup, allowing for precise gas permeability measurements during testing. These enhancements provide a comprehensive approach to studying rock behavior under varied stress, temperature, and pressure conditions. The facility’s new features support a broader range of research, particularly in understanding rock deformation and permeability in complex environments. The integration of ultrasonic velocity measurements aids in non-destructive monitoring of sample integrity during tests.", "Instruction_for_Sample_Preparation": "Cylindrical core sample (50mm Diameter and 100 mm Height, 38mm Diameter and 76mm Height, 25.4mm Diameter and 50.8mm Height)", "Applications": "Reservoir EngineeringEnergy Resource ManagementEnvironmental GeosciencesCivil Engineering", "Chemical_allowed": "", "Gases_allowed": "CO2, N2", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "", "Publications": ""}, {"Sr_no": "132", "Facility": "Scanning Nearfield Optical Microscopy", "Make": "Nano Nics", "Model": "Multiview 4000", "Date_of_Installation": "1 July, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Microscopy, Optical Spectroscopy", "Available_Equipment_Mode_of_use": "AFM, C(conducting)-AFM, SNOM(Reflection, transmission, and collection), PFM(Oiezo Force Microscopy),EFM(Electrostatic Force Microscopy)", "Facility_In_Charge": "Prof. Dinesh Kabra  dkabra@phy.iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Suryanarayan nayak  surya.phy@iitb.ac.in  +91 8917438931", "Department": "Physics", "Features_Working_Principle": "Principle: Tuning fork Mechanism Characteristics: Dual Optical Microscope(Olympus) working in up-right and inverted mode with mechanical isolation; Confocal Microscopy facilities; Nano Fountain Pen for writing and chemical delivery and removal at the nanometer level; Imaging resolution for NSOM: 50 nm, AFM: 20 nm; Scanner resolution:", "Body": "Top and Bottom Microscope headsThe sample stage is in between the two towersThe stage and Towers containing Tips(tuning fork) can be movable in X, Y and Z directions both manually and software controlledPiezo Drivers will control the Towers through external bias(high voltage)The sample can be monitored through top and bottom microscopesSimultaneously  morphology, optical field distribution, and electrical can be captured with a single scan trough NWS software with which Tip will move on sample surface in semi contact mode Specifications/FeaturesProbe Station for Electrical MeasurementsMultiprobe capability is especially useful for electrical measurements since multiple probes can now be placed over the element to provide bias or probe its conductivity, resistance, etc just like in a probe station. Two-, three-, or four-point resistance measurements are possible. Multiple probes also enable flexible positioning and manipulation to provide bias, localized I-V measurements, and multichannel imaging.Integrate SPM Modes with TopographyWith a multiprobe system, resolution and tip quality no longer need to be compromised since each probe is now individualized for each measurement. In classic NSOM setups the NSOM probe would have the dual function of imaging topography and fluorescence where the topography image is compromised by the aperture (wider diameter) needed by the NSOM probe. But in a multiprobe setup, a standard SPM probe can be used the topography without affecting the NSOM fluorescence measurement.The left and center images are the topography and fluorescence images, respectively, of lumogen dye particles collected in a multiprobe setup with different probes for topography and NSOM. The image on the right is the topography image of the same sample but collected with the NSOM probe, revealing the clear loss of resolution and morphology. The width of each image is 8um.Nanoscale TransportOne probe can be the source of excitation while the second probe follows the transport process with high spatial resolution. Alternatively, optical pump/probe experiments can now be performed using one probe to optically pump while the other probe measures the optical output in a variety of configurations. An example of each type of measurement is shown below. 1. Thermal transport measurement within an SRAM device where heat is introduced at specific locations and detected at other locations. As contact is made in different regions of the SRAM with the thermal conductivity probe, the probe tip cools to different levels depending on the material's thermal conductivity. The resulting image is obtained by determining the current alterations that had to to be affected in order to keep the current flowing past the point resistance at a constant value. 2. With two cantilever, near-field optical probes with exposed tips, light is injected through one probe and is guided through the sample which is a fiber. With the second probe in place, this injected light can be collected and analyzed both spatially and temporally. In this image two NSOM probes are seen in AFM contact with the input and output of the fiber waveguide.Nanoscale Manipulation and MeasurementOne probe can be used for moving, cutting, or positioning a sample, while the other probe can be used to image the sample. For example, shown below is a chromosome that has been dissected with one probe (see image on left), while the other probes images the result of the nanomanipulation.Modular Design for Easy UpgradeThe unique, modular design of the MultiView 4000 allows for the upgrade from one probe to two, three or four probes.Unique 3D Flatscan Scanner Technology The design of the 3D Flatscan is a novel planar, folded-piezo flexure scan design that keeps the probes separated. The large vertical (axial) displacement of up to 100 microns allows for the use of multiple probes as well as the tracking of structures with very large topographical features. The minimal scanner height of 7mm allows for easy access with high powered microscope objectives from either above or below the scanning stages.Spatially Friendly Glass ProbesWhile typical probes do not permit close proximity of probe tips, Nanonics has developed spatially and optically friendly glass based probes that allow for a close approach of the probe tips to within nm, as well as independent scanning of each probe. Nanonics' glass based probes offer excellent imaging in AFM modes, unparalleled aspect ratios, and support deep trench imaging as well as side wall imaging. They also permit singular electrical imaging and thermal imaging with glass encased nanowires.Left: Nanonics' patented bent cantilevered glass probeCenter: Online dual probes in contact with AFM feedback (side view)Right: Online four probes in contact with AFM feedback (top view 500x magnifications)Ultra-sensitive Tuning Fork FeedbackEasy to use and ultimate force sensitivity with tuning fork feedback allowing soft approach of probes to one another for ultra-close positioning. For a further explanation of this feedback mechanism, see our Tuning Fork Tutorial.Tip & Sample Scanning OptionsThe MultiView 4000 provides both tip and sample scanning so that the user can select which mode of operation best suits their experimental needs. For example, a sample scanning stage enables easy and rapid alignment of the sample relative to the illumination source and ensures that the microscope optics are independent of the AFM scanner. On the other hand, the tip scanning stage means that the tip can be scanned while the illumination point is held constant.Free Optical Axis from Above the Probe The MultiView 4000 offers a completely free optical axis from above the probe, below the sample and 270 degrees around the probe. The Multiview 4000 boasts a 4.5mm working distance from above the probe for ultrahigh-resolution optical or electron/optical viewing probes on opaque samples", "Facility_Description": "SNOM (Scanning Nearfield Optical Microscopy) – Nano NicsNSOM (Near-field Scanning Optical Microscopy), sometimes referred to as SNOM, is the premier tool for imaging and manipulation of light on the nanoscale. It is the only super-resolution optical method that captures the near-field of light distribution, allows for all forms of optical imaging, correlates light distirbution with topography, and is effective in all environments.Nanonics offers instrumentation for unlimited NSOM, thereby enabling a broad set of applications for NSOM, both apertured and apertureless near-field imaging. In addition, Nanonics has pioneered multiprobe NSOM platforms that are effective for pump/probe optical transport phenomena on the nanoscale. Open new frontiers with this paradigm shift in super-resolution imaging in the 50-100nm range that allows investigation of both surface and near-surface phenomena.Modes of Operation: Aperture less, Reflection, Collection, Transmission, Fluorescence, Raman, Nano illumination SNOM.The invention of AFM introduced the ability to characterize samples with a wide variety of techniques at the nanoscale, now comes the next evolution of MultiProbe AFM. With the ability to employ a wide variety of SPM probes nanometers from each other, transport scales can be studied on the nanoscale with a flexibility and ease not available before. This state of the art instrument offers nanoscale transport measurements for optical, electrical, and thermal measurements. Or use a high resolution AFM probe with another dedicated SPM probe to get the highest AFM resolution in every SPM measurement. With full optical integration the MV 4000 is a real workstation for nanoscale characterization.DescriptionThe power of independently controlled multiprobe AFM with all SPM modes is exclusively and only available today in the Multiview 4000. As many as four probes operate simultaneously and independently, each with feedback and scanning capabilities. Measure sophisticated properties only possible with multiple probes such as electrical, thermal and optical properties of devices. The Multiview 4000 is a novel and only platform containing multiple probes/AFMs for advanced experiments such as: nanoscale transport, optical pump-probe, and read-write experiments. The Multiview 4000 continues the tradition of the Multiview series, providing total optical flexibility and customization possibilities. Now, AFM Raman and Tip Enhanced Raman Spectroscopy (TERS) can be integrated with multiprobe capability. In addition, free optical access from above allows easy visualization of all probes and facilitates nanomanipulation.", "Instruction_for_Sample_Preparation": "Sample should not be more than 3 cm, and height should not be more than 5 mmSample should not have contaminants, clean before commencement of the slotSample surface should not be pealed out while scanning", "Applications": "Application1. Failure analysis of microchips and chemically mechanically polished microchips Generate carriers locally using optical capabilities of NSOM without need for electrical connections.Light emission from working devices.Kelvin probe measurements with and without light injection.Integrate potential difference or photovoltage measurements with optical capabilities of NSOM tip.Use our optical fiber probe and significantly reduce electrical effects due to the metallic cantilevers in conventional AFM systems.Place Nanonics NSOM/AFM 100 on any conventional upright microscope and view tip positioning relative to the sample from directly above through microscope objective. Conventional AFM cantilevers obscure the tip, which sits under an opaque material, and thus cannot be used with a conventional upright microscope.Capacitance measurements of gate oxide leakage and dopant concentration.Direct correlation of all of the above. Direct registration of simultaneously obtained near-field optical images and AFM images that clearly show that the oxide layers have not been removed and that the NSOM and simultaneous electrical measurements are probing the structure beneath the overlying oxide.Fowler-Nordheim oxide thickness measurements exactly overlapped with oxide surface structure.Simultaneous NSOM resistivity measurements. For example, correlating resistivity in the titanium salicide layer with overlaid NSOM optical imaging or pn junction resistance with optical imaging through an oxide.Correlation of resistivity and optical reflectivity of surfaces.Correlation of capacitance, optical reflectivity, and AFM at the same resolution for investigating gate oxide leakage or ensuring the leakage is through an oxide layer and not just surface exposure.2. Polymer Imaging (NPLM-Near-field Polarized Light Microscopy) NPLM characterization of polymer microdomain structures; correlation with polymer chemistry.Simultaneous far-field polarized light confocal microscopy and NPLM additional data on polymer topography and elasticity. This category of simultaneous imaging can be done by no other AFM system today. All of these systems which use silicon cantilevers block the point at which the tip is interacting with the sample and therefore no optical imaging can be done at the tip. In addition, no lens can be brought above the tip for the far-field transmission polarized light microscopy because the feedback of silicon cantilevers requires the z control light beam mechanism to be brought directly above the cantilever in other AFM systems.An important aspect of polymer microdomain structure is the fact that it is related to polymer crosslinking, which is a very important parameter in polymer chemistry and physics. The Nanonics system is able to effectively image such structures.3. Telecommunication and Optoelectronic Devices Characterizing waveguides, semiconductor diode lasers, microlasers, semiconducting polymers, and solid-state materials.Measuring optical distribution of light and mode structure at different emission wavelengths of waveguides and microlasers. Correlating this information with electrical properties of the devices, both on a macro scale and on a micro scale, by using the NSOM tip for monitoring carrier distribution and injected charge.Measuring the thermal distribution in such devices.Electric optical switching devices.Polymer electro-luminescence – either collect or inject light and measure electrical properties of devices made of such materials.Porous silicon.Gallium Nitride lasers.Measuring light distribution in electro-optically active crystals as a function of injection of electrical charge.Optical fiber and optical waveguide switches characterization.4. Applications in Bacteriology Staining nucleic acids and proteins in bacteria and measuring distribution of specific proteins and DNA and RNA in bacteria.Bacterial imaging without staining using specific laser wavelengths, such as in the DNA absorption at 266nm.Correlating the previous two measurements with the bacterial life cycle.5. 3D Optical Microscopy/NSOM/AFM Combination Correlating a CCD digital optical image, a confocal image, or a non-linear optical image obtained through a microscope with NSOM and AFM data at specific points.Use this NSOM and AFM data as super-resolution constraints for mathematical deconvolution algorithms that rapidly de-convolve the entire 3D optical image at resolutions unachievable with lens-based far field microscopy.6. Biotechnology AFM based topographic structure and simultaneous NSOM chemical structure identification by optical staining. On-line correlation of all this data with far field optical images.Dissection of specific regions of chromosome correlated with the previous measurement and sequence identification of these regions by the application of PCR technology.Relationship of mechanics of specific regions using AFM capabilities with optical imaging (NSOM and far field) of stained DNA and the dissected chemical structure. Investigation of the nature of fragile sites.7. Laser Tweezer/AFM Combination Correlating laser tweezer forces with AFM detected forces in nano-regions.8. Gold or Silver Ball Immuno-Labeling Antibody Attachment to Specific Proteins Competitive use of NSOM instead of electron microscopy in pathology laboratories and in investigations of gold and silver labeled biological tissue and sectioned biological tissue, such as brain slices for monitoring neuronal interconnections. In addition, live tissue investigations with such staining are possible.9. Optical Ion Sensing Ion sensing around membrane channels with NSOM and force sensing of sub-nanometer protein and membrane movements.NSOM/Ion conductance/AFM.NSOM focal uncaging of neurotransmitters and other molecules for the investigation of synaptic function and plasticity.Ion conductance using a multi-channel AFM/optical fiber probe for simultaneous measurements of membrane ion conductivity, channel movement, and optical signals, such as fluorescence of fusing synaptic vesicles, local fluorescence near membrane, and intracellular ion sensing dyes.Full correlation of all of the above with far field optical confocal or non-linear optical fluorescence imaging and evanescent wave microscopy.10. Fountain Pen Force Sensing Applications Chemical writing with single or dual channel nanopipettes.Selective etching with gases or liquids.Flat panel display correction.Tribology with specific lubricants in the fountain nanosensor monolayer deposition.Crystal growth with mother liquor in one channel and ion sensing in the other channel using NSOM. To understand the underlying mechanisms that lead to crystal growth, it is crucial to know the ionic environment at and above a specific crystal plane as it grows. When this is coupled to the ability of chemical sensors (also manufactured by Nanonics) to measure surface forces, one obtains a multidimensional view of crystal growth that has never before been achievable. This should lead to new views of how crystals grow and how to coax the growth of crystals, from those associated with small molecular systems to biological macromolecules.Lipid deposition in specific membrane domains with lipid tip coated/force sensing cantilevered nanopipettes.Simultaneous capillary electrophoretic delivery of chemicals to cells and with AFM sensing.11. Photoresist Exposure in the UV, Deep UV (193nm) and Ultra Deep UV (157nm) For photoresist development and characterization in the microelectronics industry.12. Data Storage Applications Magneto-optic investigations.Etching structures for data storage investigation.Optical / AFM integration - optical alterations with AFM detection.13. NanoRaman, Nano IR, Nano-Two Photon, and Nano-Second Harmonic Spectroscopy Apertureless enhancement in nanoregions with unique glass cantilevers nanotipped with a silver particle of controlled size, from two to hundreds of nanometers.14. Nano-Aperture Based Infrared Application Local heating for micro-soldering.Collection of infrared light for monitoring light distribution in quantum cascade lasers (see also 2 above) and correlating this information with electrical properties of such lasers.Vibrational spectral imaging of single molecules and their films.15. Thermal Sensing Cantilevered Tips with Optical Sensing 16. Scanning Electro-Chemical Microscopy Using multi-channel cantilevered glass tips to perform simultaneous electrochemical and near-field optical imaging. Fully correlated with far-field optical microscopy.17. Ultra-Fast Laser Spectroscopy and Surface Modifications Femtosecond pulse delivery in nano-regions.Pump-probe spectroscopy. For example, carrier injection in semiconductors together with force sensing techniques.Femto-second lithography of metals and metallic structures without associated heating.18. Monitoring Optically Induced Dynamic Structural Alterations in Proteins, Membranes, and Chalcogenides With microsecond time resolution.19. Fluorescence NSOM/Confocal Imaging Single molecules, nanocrystals and thin films with and without imposed forces, electrical fields, etc.Cellular fluorescence imaging.", "Chemical_allowed": "Isopropanol and ethanol", "Gases_allowed": "Nitrogen, Argon, and Oxygen", "SOP": "", "Training and Other Policy Documents": "", "Other Related Details Regarding Instrument": "SNOM_Description.pdf\n  (739.6 KB)", "Publications": ""}, {"Sr_no": "133", "Facility": "Scanning Nearfield Optical Microscopy", "Make": "Nano Nics", "Model": "Multiview 4000", "Date_of_Installation": "1 July, 2024", "Facility_Management_Division": "Centre for Sophisticated Instruments and Facilities (CSIF)", "Category": "Optical Microscopy, Optical Spectroscopy", "Available_Equipment_Mode_of_use": "AFM, C(conducting)-AFM, SNOM(Reflection, transmission, and collection), PFM(Oiezo Force Microscopy),EFM(Electrostatic Force Microscopy)", "Facility_In_Charge": "Prof. Dinesh Kabra  dkabra@phy.iitb.ac.in", "Facility_Manager": "", "Facility_Operator": "Suryanarayan nayak  surya.phy@iitb.ac.in  +91 8917438931", "Department": "Physics", "Features_Working_Principle": "Principle: Tuning fork Mechanism Characteristics: Dual Optical Microscope(Olympus) working in up-right and inverted mode with mechanical isolation; Confocal Microscopy facilities; Na r loss of resolution and morphology. The width of each image is 8um.Nanoscale TransportOne probe can be the source of excitation while the second probe follows the transport process with high spatial resolution. Alternatively, optical pump/probe experiments can now be performed using one probe to optically pump while the other probe measures the optical output in a variety of configurations. An example of each type of measurement is shown below. 1. Thermal transport measurement within an SRAM device where heat is introduced at specific locations and detected at other locations. As contact is made in different regions of the SRAM with the thermal conductivity probe, the probe tip cools to different levels depending on the material's thermal conductivity. The resulting image is obtained by determining the current alterations that had to to be affected in order to keep the current flowing past the point resistance at a constant value. 2. With two cantilever, near-field optical probes with exposed tips, light is injected through one probe and is guided through the sample which is a fiber. With the second probe in place, this injected light can be collected and analyzed both spatially and temporally. In this image two NSOM probes are seen in AFM contact with the input and output of the fiber waveguide.Nanoscale Manipulation and MeasurementOne probe can be used for moving, cutting, or positioning a sample, while the other probe can be used to image the sample. For example, shown below is a chromosome that has been dissected with one probe (see image on left), while the other probes images the result of the nanomanipulation.Modular Design for Easy UpgradeThe unique, modular design of the MultiView 4000 allows for the upgrade from one probe to two, three or four probes.Unique 3D Flatscan Scanner Technology The design of the 3D Flatscan is a novel planar, folded-piezo flexure scan design that keeps the probes separated. The large vertical (axial) displacement of up to 100 microns allows for the use of multiple probes as well as the tracking of structures with very large topographical features. The minimal scanner height of 7mm allows for easy access with high powered microscope objectives from either above or below the scanning stages.Spatially Friendly Glass ProbesWhile typical probes do not permit close proximity of probe tips, Nanonics has developed spatially and optically friendly glass based probes that allow for a close approach of the probe tips to within nm, as well as independent scanning of each probe. Nanonics' glass based probes offer excellent imaging in AFM modes, unparalleled aspect ratios, and support deep trench imaging as well as side wall imaging. They also permit singular electrical imaging and thermal imaging with glass encased nanowires.Left: Nanonics' patented bent cantilevered glass probeCenter: Online dual probes in contact with AFM feedback (side view)Right: Online four probes in contact with AFM feedback (top view 500x magnifications)Ultra-sensitive Tuning Fork FeedbackEasy to use and ultimate force sensitivity with tuning fork feedback allowing soft approach of probes to one another for ultra-close positioning. For a further explanation of this feedback mechanism, see our Tuning Fork Tutorial.Tip & Sample Scanning OptionsThe MultiView 4000 provides both tip and sample scanning so that the user can select which mode of operation best suits their experimental needs. For example, a sample scanning stage enables easy and rapid alignment of the sample relative to the illumination source and ensures that the microscope optics are independent of the AFM scanner. On the other hand, the tip scanning stage means that the tip can be scanned while the illumination point is held constant.Free Optical Axis from Above the Probe The MultiView 4000 offers a completely free optical axis from above the probe, below the sample and 270 degrees around the probe. The Multiview 4000 boasts a 4.5mm working distance from above the probe for ultrahigh-resolution optical or electron/optical viewing probes on opaque samples", "Facility_Description": "SNOM (Scanning Nearfield Optical Microscopy) – Nano NicsNSOM (Near-field Scanning Optical Microscopy), sometimes referred to as SNOM, is the premier tool for imaging and manipulation of light on the nanoscale. It is the only super-resolution optical method that captures the near-field of light distribution, allows for all forms of optical imaging, correlates light distirbution with topography, and is effective in all environments.Nanonics offers instrumentation for unlimited NSOM, thereby enabling a broad set of applications for NSOM, both apertured and apertureless near-field imaging. In addition, Nanonics has pioneered multiprobe NSOM platforms that are effective for pump/probe optical transport phenomena on the nanoscale. Open new frontiers with this paradigm shift in super-resolution imaging in the 50-100nm range that allows investigation of both surface and near-surface phenomena.Modes of Operation: Aperture less, Reflection, Collection, Transmission, Fluorescence, Raman, Nano illumination SNOM.The invention of AFM introduced the ability to characterize samples with a wide variety of techniques at the nanoscale, now comes the next evolution of MultiProbe AFM. With the ability to employ a wide variety of SPM probes nanometers from each other, transport scales can be studied on the nanoscale with a flexibility and ease not available before. This state of the art instrument offers nanoscale transport measurements for optical, electrical, and thermal measurements. Or use a high resolution AFM probe with another dedicated SPM probe to get the highest AFM resolution in every SPM measurement. With full optical integration the MV 4000 is a real workstation for nanoscale characterization.DescriptionThe power of independently controlled multiprobe AFM with all SPM modes is exclusively and only available today in the Multiview 4000. As many as four probes o
